apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: ext-ceph
  namespace: grafana
spec:
  name: ext-ceph
  instanceSelector:
    matchLabels:
      grafana.example.com/instance: main
  folderUID: dg1tqkgkqcbnke # Ceph
  interval: 1m
  rules:
    # Curated checks of ceph_health_detail; a Ceph check name is only exported once it has been raised or is
    # in the mgr's built-in list. PG_DEGRADED is left out on purpose: recovery after a reboot is normal, and
    # PG_AVAILABILITY covers the dangerous case. Ceph's own severity moves to check_severity so the rule's
    # severity label stays ours.
    - uid: ceph-health-check
      title: Ceph health check raised
      condition: C
      for: 5m
      # A check that clears for a few minutes stays firing instead of resolving and re-firing.
      keepFiringFor: 30m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by (name, severity) (ceph_health_detail{name=~"OSD_DOWN|OSD_HOST_DOWN|OSD_NEARFULL|OSD_BACKFILLFULL|OSD_FULL|POOL_NEARFULL|POOL_BACKFILLFULL|POOL_FULL|PG_AVAILABILITY|PG_DAMAGED|OSD_SCRUB_ERRORS|OBJECT_UNFOUND|PG_RECOVERY_FULL|PG_BACKFILL_FULL|MON_DOWN|MON_CLOCK_SKEW|MON_DISK_LOW|MON_DISK_CRIT|FS_DEGRADED|MDS_ALL_DOWN|MDS_DAMAGE|FS_WITH_FAILED_MDS|DEVICE_HEALTH|DEVICE_HEALTH_TOOMANY|DEVICE_HEALTH_IN_USE|RECENT_CRASH|MGR_DOWN|CEPHADM_FAILED_DAEMON"} == 1), "severity", "check_severity")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: 'Ceph {{ $labels.name }} ({{ if eq $labels.check_severity "HEALTH_ERR" }}error{{ else }}warning{{ end }})'
        description: 'Ceph has raised health check {{ $labels.name }} for 5 minutes. `ceph health detail` names the affected daemons, OSDs or PGs. https://grafana.example.com/d/ceph-cluster/ceph-cluster'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    - uid: ceph-health-slow
      title: Ceph slow operations
      condition: C
      # These come and go under load; 15m keeps short spikes out.
      for: 15m
      keepFiringFor: 30m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by (name, severity) (ceph_health_detail{name=~"MDS_SLOW_REQUEST|MDS_SLOW_METADATA_IO|SLOW_OPS"} == 1), "severity", "check_severity")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: 'Ceph {{ $labels.name }} ({{ if eq $labels.check_severity "HEALTH_ERR" }}error{{ else }}warning{{ end }})'
        description: 'Ceph has raised health check {{ $labels.name }} for 15 minutes. `ceph health detail` names the affected daemons, OSDs or PGs. https://grafana.example.com/d/ceph-cluster/ceph-cluster'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # AUTH_INSECURE_* are known and accepted for now, so they are excluded here.
    - uid: ceph-health-error-other
      title: Ceph health error (other)
      condition: C
      for: 15m
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by (name, severity) (ceph_health_detail{severity="HEALTH_ERR", name!~"AUTH_INSECURE_.*|OSD_DOWN|OSD_HOST_DOWN|OSD_NEARFULL|OSD_BACKFILLFULL|OSD_FULL|POOL_NEARFULL|POOL_BACKFILLFULL|POOL_FULL|PG_AVAILABILITY|PG_DAMAGED|OSD_SCRUB_ERRORS|OBJECT_UNFOUND|PG_RECOVERY_FULL|PG_BACKFILL_FULL|MON_DOWN|MON_CLOCK_SKEW|MON_DISK_LOW|MON_DISK_CRIT|FS_DEGRADED|MDS_ALL_DOWN|MDS_DAMAGE|FS_WITH_FAILED_MDS|MDS_SLOW_REQUEST|MDS_SLOW_METADATA_IO|SLOW_OPS|DEVICE_HEALTH|DEVICE_HEALTH_TOOMANY|DEVICE_HEALTH_IN_USE|RECENT_CRASH|MGR_DOWN|CEPHADM_FAILED_DAEMON"} == 1), "severity", "check_severity")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: 'Ceph {{ $labels.name }} (error)'
        description: 'A Ceph health check of error severity that has no rule of its own has been raised for 15 minutes. `ceph health detail` names the cause. https://grafana.example.com/d/ceph-cluster/ceph-cluster'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # Every Ceph alert depends on the mgr series, so their silence is emailed too.
    - uid: ceph-metrics-stale
      title: Ceph metrics stale
      condition: C
      for: 2m
      keepFiringFor: 15m
      noDataState: Alerting
      # KeepLast, not Error: a datasource outage is reported once, by the pipeline rules (apps/grafana README).
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 86400, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              time() - max(tlast_over_time(ceph_health_status[1d]))
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [300]}
      labels:
        severity: critical
      annotations:
        summary: 'No Ceph health metrics'
        description: 'The newest ceph_health_status sample is {{ with $values.A }}{{ humanizeDuration .Value }} old{{ else }}missing{{ end }}: the mgr prometheus module, the Ceph collector or the OTel gateway is down, so the Ceph alerts are blind. `ceph mgr stat`; collector in kube-cluster/external/ceph.'
      notificationSettings:
        receiver: matrix-and-email
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 24h
    # The collector scrapes its own host, so a dead collector emits no up=0, its series just ends.
    # The `or` keeps every host seen in the last day at 0 for that case; a removed host fires for up to a day.
    - uid: ceph-exporter-down
      title: Ceph exporter or collector down
      condition: C
      for: 10m
      keepFiringFor: 15m
      noDataState: Alerting
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by ("service.instance.id") (up{"service.name"="ceph-exporter"}) or max by ("service.instance.id") (last_over_time(up{"service.name"="ceph-exporter"}[1d])) * 0, "service.instance.id", "host")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [1]}
      labels:
        severity: warning
      annotations:
        summary: '{{ with $labels.host }}{{ . }}{{ else }}<host>{{ end }}: ceph-exporter or its collector is down'
        description: 'No ceph-exporter scrape from {{ with $labels.host }}{{ . }}{{ else }}<host>{{ end }}: no OSD or MDS counters from that host. The exporter or the collector is down: `ceph orch ps {{ with $labels.host }}{{ . }}{{ else }}<host>{{ end }}`, `journalctl -u ceph-<fsid>@container.otelcol.{{ with $labels.host }}{{ . }}{{ else }}<host>{{ end }}`.'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # Growth of the fullest OSDs is what stops a cluster, not the average. Over 80% full keeps a new OSD that is
    # still backfilling quiet; silent from the nearfull ratio, where the health check OSD_NEARFULL (and OSD_FULL)
    # takes over. 24h trend, so a day of churn does not decide; silent until 12h of history (> 144 points), when a
    # short trend is noise.
    - uid: ceph-osd-time-to-full
      title: Ceph OSD fills within a week
      condition: C
      for: 1h
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 86400, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              ((scalar(max(ceph_osd_full_ratio)) - max by (ceph_daemon, hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes)) / deriv((max by (ceph_daemon, hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes))[24h:5m]) and deriv((max by (ceph_daemon, hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes))[24h:5m]) > 0 and max by (ceph_daemon, hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes) > 0.8 and max by (ceph_daemon, hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes) < scalar(max(ceph_osd_nearfull_ratio)) and on (ceph_daemon, hostname) count_over_time((max by (ceph_daemon, hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes))[24h:5m]) > 144)
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: within_range, params: [0, 604800]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.ceph_daemon }} on {{ $labels.hostname }} fills up in {{ with $values.A }}{{ humanizeDuration .Value }}{{ else }}an unknown time{{ end }}'
        description: 'Predicted from the 24h trend of the OSD, over 80% used. At the full ratio the PGs on it stop taking writes. Free space, add OSDs, or reweight (`ceph osd reweight-by-utilization`). https://grafana.example.com/d/ceph-osds/ceph-osds'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # max_avail is the space left to a pool given its fullest OSD and replication; pools on the same device
    # class share it, so several of them fire together. Pools under 1 GB are ignored. The trend needs 12h of
    # history, as for OSDs. Silent from 85% used, where ceph-pool-above-85/-92 take over.
    - uid: ceph-pool-time-to-full
      title: Ceph pool fills within a week
      condition: C
      for: 1h
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 86400, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              (((max by (pool_id) (ceph_pool_max_avail) / -deriv((max by (pool_id) (ceph_pool_max_avail))[24h:5m]) and deriv((max by (pool_id) (ceph_pool_max_avail))[24h:5m]) < 0 and on (pool_id) count_over_time((max by (pool_id) (ceph_pool_max_avail))[24h:5m]) > 144) or (max by (pool_id) (ceph_pool_max_avail) < 1073741824) * 0) and on (pool_id) max by (pool_id) (ceph_pool_stored) > 1073741824 and on (pool_id) max by (pool_id) (last_over_time(ceph_pool_percent_used[10m])) < 0.85) * on (pool_id) group_left (name) max by (pool_id, name) (ceph_pool_metadata)
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: within_range, params: [0, 604800]}
      labels:
        severity: warning
      annotations:
        summary: 'Pool {{ $labels.name }} {{ if and $values.A (eq $values.A.Value 0.0) }}is full{{ else }}fills up in {{ with $values.A }}{{ humanizeDuration .Value }}{{ else }}an unknown time{{ end }}{{ end }}'
        description: 'Predicted from the 24h trend of the pool''s max available space. A full pool is read-only to its clients. Free space or add OSDs of its device class. https://grafana.example.com/d/ceph-pool/ceph-pool?var-pool_name={{ $labels.name }}'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # percent_used is stored / (stored + max_avail), so it covers a whole CephFS once, by its data pool, where the
    # PVCs that mount it all report the filesystem. It also rises when max_avail drops (an OSD out, a full OSD).
    # last_over_time: the mgr series miss up to 5m of samples, which would reset `for`.
    - uid: ceph-pool-above-85
      title: Ceph pool above 85%
      condition: C
      for: 1h
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              max by (pool_id) (last_over_time(ceph_pool_percent_used[10m])) * on (pool_id) group_left (name) max by (pool_id, name) (last_over_time(ceph_pool_metadata[10m]))
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: within_range, params: [0.85, 0.92]}
      labels:
        severity: warning
      annotations:
        summary: 'Pool {{ $labels.name }} is {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}n/a{{ end }} used'
        description: 'Free space or add OSDs of its device class. https://grafana.example.com/d/ceph-pool/ceph-pool?var-pool_name={{ $labels.name }}'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    - uid: ceph-pool-above-92
      title: Ceph pool above 92%
      condition: C
      for: 1h
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              max by (pool_id) (last_over_time(ceph_pool_percent_used[10m])) * on (pool_id) group_left (name) max by (pool_id, name) (last_over_time(ceph_pool_metadata[10m]))
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0.92]}
      labels:
        severity: critical
      annotations:
        summary: 'Pool {{ $labels.name }} is {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}n/a{{ end }} used'
        description: 'Close to the full ratio, after which the pool is read-only to its clients. Free space or add OSDs of its device class now. https://grafana.example.com/d/ceph-pool/ceph-pool?var-pool_name={{ $labels.name }}'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 24h
    # PGs that are not active serve no I/O: total minus active, per pool. Peering after an OSD restart
    # clears within seconds, hence the 5m.
    - uid: ceph-pg-inactive
      title: Ceph placement groups inactive
      condition: C
      for: 5m
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              (max by (pool_id) (ceph_pg_total) - max by (pool_id) (ceph_pg_active)) * on (pool_id) group_left (name) max by (pool_id, name) (ceph_pool_metadata)
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: critical
      annotations:
        summary: '{{ with $values.A }}{{ printf "%.0f" .Value }}{{ else }}n/a{{ end }} PGs of pool {{ $labels.name }} are not active'
        description: 'Inactive PGs (peering, down, incomplete, stale) serve no I/O: the pool''s clients hang. `ceph pg dump_stuck inactive` and `ceph health detail`. https://grafana.example.com/d/ceph-pool/ceph-pool?var-pool_name={{ $labels.name }}'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 24h
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: ext-ceph-opencas
  namespace: grafana
spec:
  name: ext-ceph-opencas
  instanceSelector:
    matchLabels:
      grafana.example.com/instance: main
  folderUID: dg1tqkgkqcbnke # Ceph
  interval: 1m
  rules:
    # Metrics come from otelcol-opencas.sh (the Ansible repo); OTel names have dots, so `{__name__="opencas.cache_running"}`.
    # A cache-device write error clears the cache's `running` state for good: the cleaner stops, nothing recovers by itself.
    # label_move renames labels so that the templates can read them: host.name -> host, opencas.cache_id -> cache.
    - uid: opencas-cache-not-running
      title: Open-CAS cache not running
      condition: C
      for: 2m
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(min by ("host.name", "opencas.cache_id") ({__name__="opencas.cache_running"}), "host.name", "host", "opencas.cache_id", "cache")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [1]}
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.host }}: Open-CAS cache {{ $labels.cache }} is not running'
        description: 'casadm -L shows the cache as not running (a cache-device write error clears the state). Its cleaner has stopped, dirty data only grows and nothing recovers by itself. First: `dmesg` and `nvme smart-log` for the cache device, then the Open-CAS runbook, "Runbook: cache errors".'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 24h
    # Counters already above 0 when a series first appears (ceph-f, ceph-h core errors) may fire once at rollout.
    - uid: opencas-cache-errors
      title: Open-CAS cache errors
      condition: C
      for: 0s
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 900, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by ("host.name", "opencas.cache_id") (increase({__name__="opencas.cache.cache_read_errors"}[15m]) + increase({__name__="opencas.cache.cache_write_errors"}[15m])), "host.name", "host", "opencas.cache_id", "cache")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.host }}: {{ with $values.A }}{{ printf "%.0f" .Value }}{{ else }}n/a{{ end }} Open-CAS cache errors on cache {{ $labels.cache }}'
        description: 'The cache device failed reads or writes in the last 15m. A failed write stops the cleaner (see the "cache not running" alert). First: `dmesg` and `nvme smart-log` on the host, then the Open-CAS runbook, "Runbook: cache errors".'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 24h
    # The HDD behind a core failed I/O. Per core, so the device is in the alert.
    - uid: opencas-core-errors
      title: Open-CAS core (HDD) errors
      condition: C
      for: 0s
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 3600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by ("host.name", "opencas.cache_id", "opencas.core_id", "opencas.core_device") (increase({__name__="opencas.core.core_read_errors"}[1h]) + increase({__name__="opencas.core.core_write_errors"}[1h])), "host.name", "host", "opencas.cache_id", "cache", "opencas.core_id", "core", "opencas.core_device", "device")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.host }}: {{ with $values.A }}{{ printf "%.0f" .Value }}{{ else }}n/a{{ end }} I/O errors on core {{ $labels.core }} ({{ $labels.device }}) of cache {{ $labels.cache }}'
        description: 'The HDD behind this Open-CAS core failed reads or writes in the last hour. First: `smartctl -a` and `dmesg` for the disk and the OSD on /dev/cas{{ $labels.cache }}-{{ $labels.core }}; the Open-CAS runbook, "Runbook: cache errors".'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # Rules 1-3 are silent without data. Like ceph-exporter-down, this keeps every cache seen in the last day,
    # so a decommissioned cache fires for up to a day.
    - uid: opencas-metrics-absent
      title: Open-CAS metrics absent
      condition: C
      for: 10m
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 86400, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move((max by ("host.name", "opencas.cache_id") (last_over_time({__name__="opencas.cache_running"}[1d])) unless on ("host.name", "opencas.cache_id") max by ("host.name", "opencas.cache_id") ({__name__="opencas.cache_running"})) * 0 + 1, "host.name", "host", "opencas.cache_id", "cache")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.host }}: no Open-CAS metrics for cache {{ $labels.cache }}'
        description: 'A cache that reported in the last day has sent no opencas.cache_running for 10m, so the Open-CAS alerts are blind for it. Either the exporter is down (`systemctl status otelcol-opencas otelcol`) or the cache is gone: if `casadm -L` does not list it, the NVMe may be missing or the cache did not load at boot. Then never start its OSDs on the raw HDDs; follow the Open-CAS runbook, "Runbook: cache errors", "NVMe gone".'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # Io classes: `opencas-ioclass check` runs daily from Semaphore and writes /var/lib/opencas/ioclass-check.prom, which
    # otelcol-opencas.sh serves. Runbook: the Ansible repo README, "Io classes" (template "opencas ioclass").
    - uid: opencas-ioclass-core-class
      title: Open-CAS core in the wrong io class
      condition: C
      for: 15m
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 3600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(min by ("host.name", "opencas.cache_id", "opencas.core_id", "opencas.core_role", "opencas.expected_class", "opencas.live_class") ({__name__="opencas.ioclass_core_class_ok"}), "host.name", "host", "opencas.cache_id", "cache", "opencas.core_id", "core", "opencas.core_role", "role", "opencas.expected_class", "expected", "opencas.live_class", "live")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [1]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.host }}: core {{ $labels.core }} (role {{ $labels.role }}) on cache {{ $labels.cache }} is in class {{ $labels.live }}, expected {{ $labels.expected }}'
        description: 'The core sits in another io class than its role needs (a DB core in a write-through class puts its RocksDB into write-through). Check with the the Ansible repo template "opencas ioclass", then fix with -e opencas_ioclass_apply=true limited to the host.'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    - uid: opencas-ioclass-check-error
      title: Open-CAS io class check failed
      condition: C
      for: 0s
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 3600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by ("host.name", "opencas.cache_id") ({__name__="opencas.ioclass_check_error"}), "host.name", "host", "opencas.cache_id", "cache")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.host }}: io class check failed for cache {{ $labels.cache }}'
        description: 'opencas-ioclass check could not read or compare the live io classes of this cache (not running, casadm error). Run the the Ansible repo template "opencas ioclass" and read its output.'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    - uid: opencas-ioclass-differences
      title: Open-CAS io classes differ from the generated ones
      condition: C
      for: 1h
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 3600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by ("host.name", "opencas.cache_id") ({__name__="opencas.ioclass_check_diffs"} > 0) or max by ("host.name", "opencas.cache_id") ({__name__="opencas.ioclass_file_drift"} == 1), "host.name", "host", "opencas.cache_id", "cache")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.host }}: io classes of cache {{ $labels.cache }} differ from the generated ones'
        description: 'The live classes or /etc/opencas/ioclass-config-ceph-N.csv differ from what opencas-ioclass generates from the LV roles. Run the the Ansible repo template "opencas ioclass" for the details, apply with -e opencas_ioclass_apply=true limited to the host.'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
    # A host with caches but no timestamp gets 1e9, so a check or export that never ran fires too.
    - uid: opencas-ioclass-check-stale
      title: Open-CAS io class check not run
      condition: C
      for: 0s
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 3600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move((time() - max by ("host.name") ({__name__="opencas.ioclass_check_timestamp_seconds"})) or on ("host.name") max by ("host.name") ({__name__="opencas.cache_running"}) * 0 + 1e9, "host.name", "host")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [172800]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.host }}: no io class check result for 2 days'
        description: 'No opencas.ioclass_check_timestamp_seconds younger than 2 days, so the io class alerts are blind for this host. Either the daily Semaphore run of the the Ansible repo template "opencas ioclass" did not refresh /var/lib/opencas/ioclass-check.prom, or otelcol-opencas.sh does not serve it (re-run install-otelcol.yml).'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 1h
        repeat_interval: 24h
