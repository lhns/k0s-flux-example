# Cluster-wide. A real image reference never contains `$`, so a hit is an unsubstituted Flux
# ${VAR} (README, "Substitution caveats"). Denying at apply time fails the dry-run and keeps
# the old pods running. On UPDATE only a `$` ref the old object lacked is denied, so existing
# objects (old ReplicaSets mid-rollout) stay updatable. Fail-closed: a CEL error also denies.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-dollar-in-image-refs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [pods, pods/ephemeralcontainers]
    - apiGroups: [apps]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [deployments, statefulsets, daemonsets, replicasets]
    - apiGroups: [batch]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [jobs, cronjobs]
  variables:
  - name: podSpec
    expression: >-
      object.kind == 'Pod' ? object.spec :
      object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
      object.spec.template.spec
  - name: refs
    expression: >-
      (has(variables.podSpec.containers) ?
        variables.podSpec.containers.filter(c, has(c.image)).map(c, c.image) : []) +
      (has(variables.podSpec.initContainers) ?
        variables.podSpec.initContainers.filter(c, has(c.image)).map(c, c.image) : []) +
      (has(variables.podSpec.ephemeralContainers) ?
        variables.podSpec.ephemeralContainers.filter(c, has(c.image)).map(c, c.image) : []) +
      (has(variables.podSpec.volumes) ?
        variables.podSpec.volumes.filter(v, has(v.image) && has(v.image.reference))
          .map(v, v.image.reference) : [])
  - name: oldPodSpec
    expression: >-
      request.operation != 'UPDATE' ? null :
      oldObject.kind == 'Pod' ? oldObject.spec :
      oldObject.kind == 'CronJob' ? oldObject.spec.jobTemplate.spec.template.spec :
      oldObject.spec.template.spec
  - name: oldRefs
    expression: >-
      request.operation != 'UPDATE' ? [] :
      (has(variables.oldPodSpec.containers) ?
        variables.oldPodSpec.containers.filter(c, has(c.image)).map(c, c.image) : []) +
      (has(variables.oldPodSpec.initContainers) ?
        variables.oldPodSpec.initContainers.filter(c, has(c.image)).map(c, c.image) : []) +
      (has(variables.oldPodSpec.ephemeralContainers) ?
        variables.oldPodSpec.ephemeralContainers.filter(c, has(c.image)).map(c, c.image) : []) +
      (has(variables.oldPodSpec.volumes) ?
        variables.oldPodSpec.volumes.filter(v, has(v.image) && has(v.image.reference))
          .map(v, v.image.reference) : [])
  validations:
  - expression: "!variables.refs.exists(r, r.contains('$') && !(r in variables.oldRefs))"
    message: "image reference contains '$' — an unsubstituted Flux variable?"
    messageExpression: >-
      "image reference contains '$' — an unsubstituted Flux variable? " +
      variables.refs.filter(r, r.contains('$') && !(r in variables.oldRefs)).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-dollar-in-image-refs
spec:
  policyName: deny-dollar-in-image-refs
  validationActions: [Deny]
