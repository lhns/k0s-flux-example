---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-vnet
  namespace: kube-vnet-system
spec:
  interval: 1h0m0s
  url: oci://ghcr.io/lhns/charts/kube-vnet
  ref:
    # Bump to roll a new version.
    tag: "0.8.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vnet
  namespace: kube-vnet-system
spec:
  interval: 10m0s
  # releaseName/storageNamespace default to name/namespace (kube-vnet /
  # kube-vnet-system), matching the release k0s installed -> adopted in place.
  chartRef:
    kind: OCIRepository
    name: kube-vnet
  values:
    operator:
      # Manage every namespace. The operator always self-excludes its own namespace
      # (kube-vnet-system), so [] safely means "manage everything, including
      # kube-system". An empty list means "disable nothing".
      disabledNamespaces: []
      clusterBaseline:
        # pod = default-deny ingress everywhere (even same-namespace); ingress only
        # via an explicit vnet membership/binding + the auto-allows (LB/NodePort svc,
        # hostPort, apiserver-dialed webhooks). Cluster DNS stays up via the chart's
        # dnsCarveout NetworkPolicy, auto-rendered because kube-system is managed.
        ingressIsolationLevel: pod

    # Stamps vnet membership during pod admission, so a pod is a member from the instant it
    # exists instead of sitting under deny-all until the operator catches up. Its validating
    # half is failurePolicy: Fail: with no operator replica up, pods cannot be created or
    # updated anywhere except kube-system, kube-public, kube-node-lease and kube-vnet-system.
    webhook:
      enabled: true
      # A pod annotated kube-vnet/network-max-wait: "30s" gets an injected init container that
      # holds its app until the beacon on every node accepts it (on kube-router: its rules are
      # live), or the max runs out. Never blocks: a down beacon, DNS or operator only means no
      # wait or the full max. Adds a beacon DaemonSet on every node.
      networkWait:
        enabled: true

    # Two replicas on different nodes so one is always serving the webhook. Preferred rather
    # than required: a required spread stalls the surge pod of a rollout when a node is down.
    replicaCount: 2
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kube-vnet
                  app.kubernetes.io/component: controller
