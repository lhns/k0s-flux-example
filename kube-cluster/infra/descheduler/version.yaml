# Patch onto shared/infra/descheduler: this cluster's chart version. A whole HelmRelease shape so
# Renovate's flux manager reads it; an inline patch in kustomization.yaml it would not.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
spec:
  chart:
    spec:
      chart: descheduler
      version: "0.36.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
