---
apiVersion: v1
kind: Namespace
metadata:
  name: descheduler
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: descheduler
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
        cpu: 50m
