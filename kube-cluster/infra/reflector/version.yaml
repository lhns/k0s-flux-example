# Patch onto shared/infra/reflector: this cluster's chart version. A whole HelmRelease shape so
# Renovate's flux manager reads it; an inline patch in kustomization.yaml it would not.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  chart:
    spec:
      chart: reflector
      version: "10.0.65"
      sourceRef:
        kind: HelmRepository
        name: emberstack
