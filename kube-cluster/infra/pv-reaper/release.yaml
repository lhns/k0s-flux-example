---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-pv-reaper
  namespace: pv-reaper
spec:
  interval: 1h0m0s
  url: oci://ghcr.io/lhns/charts/kube-pv-reaper
  ref:
    # Pinned release; bump to roll a new version (cut an upstream vX.Y.Z first).
    tag: "0.1.5"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pv-reaper
  namespace: pv-reaper
spec:
  interval: 10m0s
  chartRef:
    kind: OCIRepository
    name: kube-pv-reaper
  values:
    # Manage both Ceph CSI drivers (cephfs + rbd). Empty would manage all CSI PVs.
    drivers:
      - cephfs.csi.ceph.com
      - rbd.csi.ceph.com
    # Clean resource names: `pv-reaper`, not the stuttering `pv-reaper-kube-pv-reaper`.
    fullnameOverride: pv-reaper
