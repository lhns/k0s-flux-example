---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ceph-csi
  namespace: ceph-csi-rbd
spec:
  interval: 1h0m0s
  url: https://ceph.github.io/csi-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-rbd
  namespace: ceph-csi-rbd
spec:
  interval: 10m0s
  chart:
    spec:
      chart: ceph-csi-rbd
      # Moves with the image below: Renovate reads both from its tags.
      # renovate: datasource=docker depName=ghcr.io/lhns/ceph-csi-x86-64-v2
      version: "3.18.1"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
  values:
    # k0s puts the kubelet root at /var/lib/k0s/kubelet (not the default
    # /var/lib/kubelet); the CSI hostPath mounts must match or the plugin
    # fails to register.
    kubeletDir: /var/lib/k0s/kubelet
    # Metrics-port convention: kube-router (hostNetwork) owns host :8080, so the
    # ceph-csi liveness sidecars live at 8090+ — cephfs 8090, rbd 8091. The
    # nodeplugin is hostNetwork (real host port); the provisioner is pod-network
    # but kept on the same port for consistency.
    nodeplugin:
      registrar:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      plugin:
        # Memory limits (ADR 0028). The chart reuses these for liveness-prometheus and, in the
        # provisioner, the plugin and plugin-controller containers too.
        resources:
          requests:
            memory: 192Mi
          limits:
            memory: 384Mi
        # Also the provisioner's image. x86-64-v2 build of upstream: see ../ceph-csi-cephfs/README.md.
        image:
          repository: ghcr.io/lhns/ceph-csi-x86-64-v2
          tag: v3.18.1@sha256:d706364a170eeea45d574f52d32fd4aa85cf225d77c318cf222b07166b5804f4
      httpMetrics:
        containerPort: 8091
        service:
          servicePort: 8091
    provisioner:
      provisioner:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 192Mi
      attacher:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      resizer:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 192Mi
      snapshotter:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      httpMetrics:
        containerPort: 8091
        service:
          servicePort: 8091
    # clusterID -> monitors (same Ceph cluster as cephfs). rbd images live in
    # the `kube` rados namespace of pool rbd.kube (radosNamespace is per-cluster
    # config here, so the StorageClass only needs `pool`).
    # clusterID identifies the Ceph *cluster* (monitor set), not a filesystem.
    csiConfig:
      - clusterID: ceph-cluster
        monitors:
          - 10.20.176.250:6789
          - 10.20.176.251:6789
          - 10.20.176.252:6789
        rbd:
          radosNamespace: kube
    # We provide our own StorageClass; the secret is SHARED with the cephfs
    # driver (csi-cephfs-secret in the ceph-csi-cephfs namespace) via the StorageClass's
    # namespace-qualified secret refs, so none is created here.
    secret:
      create: false
    storageClass:
      create: false
  # Same SlowGRPCRestart opt-out as the cephfs driver -- see the long comment in
  # ../ceph-csi-cephfs/release.yaml for the full reasoning. Short version: the
  # node plugin is one process per node for ALL rbd volumes, and ceph-csi 3.17.0
  # kills it outright when any gRPC call exceeds 10 minutes, which deregisters
  # the driver and takes every rbd mount on that node with it.
  postRenderers:
    - kustomize:
        patches:
          # containers[0] is csi-rbdplugin. Re-verify after a chart bump.
          - target:
              kind: DaemonSet
              name: ceph-csi-rbd-nodeplugin
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=SlowGRPCRestart=false
          # Also the provisioner, unlike cephfs: CreateSnapshot spends 10+ min in rbd_list_children
          # with many retained snapshots, and each restart aborts every in-flight snapshot.
          - target:
              kind: Deployment
              name: ceph-csi-rbd-provisioner
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=SlowGRPCRestart=false
