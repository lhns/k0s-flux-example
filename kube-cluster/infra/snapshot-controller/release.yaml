---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 1h0m0s
  url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
  ref:
    tag: "5.2.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 10m0s
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  # Installs the snapshot.storage.k8s.io CRDs + the cluster-wide snapshot-controller
  # (k0s ships neither). The v1beta1->v1 conversion webhook is unneeded on a fresh
  # v1-only install, so it's disabled to avoid the extra cert + pod.
  values:
    installCRDs: true
    webhook:
      enabled: false
