apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Needs the Traefik CRDs (Middleware/TLSOption/ServersTransport) to watch.
    flux-component-generator/dependsOn: infra-traefik
    flux-component-generator/bases: shared/infra/traefik-reflector
resources:
- ../../../shared/infra/traefik-reflector
patches:
- path: version.yaml
