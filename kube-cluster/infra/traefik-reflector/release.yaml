---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-traefik-reflector
  namespace: traefik-reflector
spec:
  interval: 1h0m0s
  url: oci://ghcr.io/lhns/charts/kube-traefik-reflector
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-reflector
  namespace: traefik-reflector
spec:
  interval: 10m0s
  chartRef:
    kind: OCIRepository
    name: kube-traefik-reflector
  values:
    fullnameOverride: traefik-reflector
