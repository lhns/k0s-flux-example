---
# jetstack's OCI chart doesn't extract cleanly via a Flux OCIRepository
# ("gzip: invalid header"), so pull it through a HelmRepository type: oci,
# which uses helm's native OCI puller.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  type: oci
  interval: 1h0m0s
  url: oci://quay.io/jetstack/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m0s
  # releaseName/storageNamespace default to name/namespace (cert-manager /
  # cert-manager), matching the release k0s installed -> adopted in place.
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # Values copied verbatim from k0sctl.yaml so adoption is a no-op upgrade; the
  # webhook block is the one deliberate divergence.
  values:
    crds:
      enabled: true
    # 2026-08-30: the single webhook replica was killed by its liveness probe, and
    # every Certificate/Issuer dry-run failed while it restarted -- infra-cert-manager
    # went NotReady and took 33 dependent Kustomizations with it.
    webhook:
      # A second replica keeps admission serving across a restart, whatever caused it.
      replicaCount: 2
      # The chart spreads nothing by default, so both could land on one node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/instance: cert-manager
      # Chart default is 1s x3, which a loaded node trips easily.
      livenessProbe:
        timeoutSeconds: 5
      # Chart default {} means BestEffort, throttled first under contention.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
