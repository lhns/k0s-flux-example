---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-ionos-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-ionos-staging-key
    solvers:
    - dns01:
        webhook:
          groupName: acme.fabmade.de
          solverName: ionos
          config:
            apiUrl: https://api.hosting.ionos.com/dns/v1
            publicKeySecretRef:
              key: IONOS_PUBLIC_PREFIX
              name: ionos-secret
            secretKeySecretRef:
              key: IONOS_SECRET
              name: ionos-secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-ionos-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-ionos-prod-key
    solvers:
    - dns01:
        webhook:
          groupName: acme.fabmade.de
          solverName: ionos
          config:
            apiUrl: https://api.hosting.ionos.com/dns/v1
            publicKeySecretRef:
              key: IONOS_PUBLIC_PREFIX
              name: ionos-secret
            secretKeySecretRef:
              key: IONOS_SECRET
              name: ionos-secret
