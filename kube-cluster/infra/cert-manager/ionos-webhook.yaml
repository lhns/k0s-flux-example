---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-webhook-ionos
  namespace: cert-manager
spec:
  interval: 1h0m0s
  url: https://fabmade.github.io/cert-manager-webhook-ionos
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ionos
  namespace: cert-manager
spec:
  interval: 10m0s
  chart:
    spec:
      chart: cert-manager-webhook-ionos
      version: "1.3.1"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ionos
  values:
    # The chart defaults to `latest` with no digest. This is the digest that was running;
    # upstream's `1.3.1` tag is a different build.
    image:
      repository: fabmade/cert-manager-webhook-ionos
      tag: latest@sha256:897392289849f026889d75d9c496b6c1fc1ae03fadd585469f136c0cb2fcf9bb
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 192Mi
