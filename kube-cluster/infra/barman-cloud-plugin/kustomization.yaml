apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Deploys into cnpg-system; needs the operator + cert-manager (gRPC TLS).
    flux-component-generator/dependsOn: infra-cloudnative-pg,infra-cert-manager
# Barman has no app label of its own; the generator gives it one via
# commonMetadata (= dir name, barman-cloud-plugin), so it shows as its own app.
resources:
- manifest.yaml
- vnet.yaml
patches:
- target:
    kind: Deployment
    name: barman-cloud
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: barman-cloud
    spec:
      template:
        spec:
          containers:
          - name: barman-cloud
            resources:
              limits:
                memory: 128Mi
