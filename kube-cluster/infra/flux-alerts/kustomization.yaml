apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # No workloads of its own: fold the Provider into the flux-system app. The Alert
    # itself is rendered by the generator (templates/alerts.yaml).
    flux-component-generator/appInstance: flux-system
resources:
- secret.yaml
- provider.yaml
- grafana.yaml
