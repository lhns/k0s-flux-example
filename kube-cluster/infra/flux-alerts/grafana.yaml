# Grafana Operator objects of this component (README.md, "Grafana objects"). Each opts out of Flux
# substitution: rule templates and dashboard JSON are full of ${...}.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: infra-flux-alerts
  namespace: grafana
spec:
  name: infra-flux-alerts
  instanceSelector:
    matchLabels:
      grafana.example.com/instance: main
  folderUID: ag1airdsjen7kc # Cluster
  interval: 1m
  rules:
    - uid: flux-never-reconciling
      title: Flux object has not reconciled in a day
      condition: C
      for: 1h
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 90000, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              sum by (kind, exported_namespace, name) (increase(gotk_reconcile_duration_seconds_count{"k8s.cluster.name"=~"|kube"}[25h])) == 0
              unless on (exported_namespace, name) max by (exported_namespace, name) (gotk_resource_info{suspended="true", "k8s.cluster.name"=~"|kube"})
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [1]}
      labels:
        severity: info
      annotations:
        summary: '{{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not reconciled in 25h'
        description: 'Normally every object reconciles at least hourly. Suspended objects are excluded.'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 24h
    - uid: flux-not-ready
      title: Flux object not Ready
      condition: C
      for: 15m
      keepFiringFor: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            # Unknown too: a failing health check cycles Unknown/False. `reason` stays out of `by`, it
            # flips between the two and would re-fire. DependencyNotReady: the object waited on alerts.
            expr: >-
              max by (customresource_kind, exported_namespace, name) (gotk_resource_info{ready=~"False|Unknown", suspended!="true", reason!="DependencyNotReady", "k8s.cluster.name"=~"|kube"})
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [0]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready'
        description: 'See the reason with `flux get` or `kubectl describe` on the object.'
      notificationSettings:
        receiver: matrix
        group_by: [grafana_folder, alertname]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 24h
