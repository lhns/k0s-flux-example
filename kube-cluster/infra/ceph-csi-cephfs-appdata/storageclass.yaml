---
# Dynamic CephFS provisioning on the HDD tier. Each PVC -> a subvolume under
# /volumes/kube/csi-vol-<uuid> on the `appdata` filesystem, whose default data
# pool is cephfs.appdata.data.
#
# `provisioner` is immutable: changing it means deleting the StorageClass first.
# The secret is the other driver's on purpose: one cephx identity (client.kube)
# serves both, and its caps already cover cephfs.appdata.{meta,data,data-fast}.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs-appdata
provisioner: cephfs-appdata.csi.ceph.com
parameters:
  clusterID: ceph-cluster
  fsName: appdata
  # `pool` intentionally omitted: new subvolumes use the filesystem's default
  # data pool. subvolumeGroup is NOT a StorageClass param -- it comes from
  # csiConfig (cephFS.subvolumeGroup: kube) in the HelmRelease values.
  csi.storage.k8s.io/provisioner-secret-name: csi-cephfs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi-cephfs
  csi.storage.k8s.io/controller-expand-secret-name: csi-cephfs-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph-csi-cephfs
  csi.storage.k8s.io/node-stage-secret-name: csi-cephfs-secret
  csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi-cephfs
reclaimPolicy: Retain
allowVolumeExpansion: true
