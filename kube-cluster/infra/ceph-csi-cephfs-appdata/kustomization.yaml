apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The StorageClass here references csi-cephfs-secret, which lives in the
    # ceph-csi-cephfs namespace and is owned by that kustomization. Read by the
    # root generator; inert to kustomize.
    dependsOn: infra-ceph-csi-cephfs
resources:
- namespace.yaml
- release.yaml
- storageclass.yaml
