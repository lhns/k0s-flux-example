---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ceph-csi
  namespace: ceph-csi-cephfs-appdata
spec:
  interval: 1h0m0s
  url: https://ceph.github.io/csi-charts
---
# Second CephFS driver for the `appdata` filesystem; why: README.md, ADR 0035.
# Deliberately identical to ../ceph-csi-cephfs: csiConfig (clusterID names the cluster,
# not a filesystem), the shared secret, and the default instanceID (journals cannot
# collide, the drivers use different metadata pools).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-cephfs-appdata
  namespace: ceph-csi-cephfs-appdata
spec:
  interval: 10m0s
  chart:
    spec:
      chart: ceph-csi-cephfs
      # Moves with the image below: Renovate reads both from its tags.
      # renovate: datasource=docker depName=ghcr.io/lhns/ceph-csi-x86-64-v2
      version: "3.18.1"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
  values:
    # k0s puts the kubelet root at /var/lib/k0s/kubelet (not the default
    # /var/lib/kubelet); the CSI hostPath mounts must match or the plugin
    # fails to register.
    kubeletDir: /var/lib/k0s/kubelet
    # THE point of this release. Everything keys off it: the socket path, the
    # registration path, the CSIDriver object, and the StorageClass provisioner.
    driverName: cephfs-appdata.csi.ceph.com
    # Deterministic resource names (ceph-csi-cephfs-appdata-nodeplugin, ...) so
    # the postRenderer target below cannot drift.
    fullnameOverride: ceph-csi-cephfs-appdata
    # Metrics-port convention: kube-router (hostNetwork) owns host :8080, so the
    # ceph-csi liveness sidecars live at 8090+ — cephfs 8090, rbd 8091, and this
    # third driver 8092. The nodeplugin is hostNetwork, so this is a real host
    # port and MUST NOT collide with the other two.
    nodeplugin:
      registrar:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      plugin:
        # Memory limits (ADR 0028). The chart reuses these for liveness-prometheus and, in the
        # provisioner, the plugin and plugin-controller containers too.
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        # Also the provisioner's image. x86-64-v2 build of upstream: see ../ceph-csi-cephfs/README.md.
        image:
          repository: ghcr.io/lhns/ceph-csi-x86-64-v2
          tag: v3.18.1@sha256:d706364a170eeea45d574f52d32fd4aa85cf225d77c318cf222b07166b5804f4
      httpMetrics:
        containerPort: 8092
        service:
          servicePort: 8092
    provisioner:
      provisioner:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 192Mi
      attacher:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      resizer:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      snapshotter:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      httpMetrics:
        containerPort: 8092
        service:
          servicePort: 8092
    csiConfig:
      - clusterID: ceph-cluster
        monitors:
          - 10.20.176.250:6789
          - 10.20.176.251:6789
          - 10.20.176.252:6789
        cephFS:
          subvolumeGroup: kube
          # see ../ceph-csi-cephfs/release.yaml
          kernelMountOptions: "mount_timeout=300"
    # Shared with the cephfs driver (csi-cephfs-secret in ceph-csi-cephfs),
    # referenced namespace-qualified from the StorageClass.
    secret:
      create: false
    # ../ceph-csi-cephfs-appdata/storageclass.yaml owns it.
    storageClass:
      create: false
  # Same SlowGRPCRestart opt-out as the other two drivers -- see the long
  # comment in ../ceph-csi-cephfs/release.yaml. It matters MOST here: this is
  # the driver deliberately pointed at the filesystem that hangs.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: ceph-csi-cephfs-appdata-nodeplugin
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=SlowGRPCRestart=false
