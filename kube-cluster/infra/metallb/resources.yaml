# Memory limits (ADR 0028), per cluster: the shared base stays unsized.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  values:
    controller:
      resources:
        requests:
          memory: 96Mi
        limits:
          memory: 256Mi
    speaker:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 192Mi
