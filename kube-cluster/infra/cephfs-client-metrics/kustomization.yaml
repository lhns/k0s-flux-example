apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- resources.yaml
# The exporter is a script on the Python image (README.md, "Decisions"). Hashed name: an edit
# rolls the DaemonSet.
configMapGenerator:
- name: cephfs-client-metrics
  namespace: cephfs-client-metrics
  files:
  - exporter/cephfs_client_metrics.py
