---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: velero
spec:
  interval: 1h0m0s
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 10m0s
  chart:
    spec:
      chart: velero
      version: "12.2.1"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  values:
    # S3 (object store) backend plugin. The CSI plugin is built into velero core
    # (>=1.14), so only the AWS plugin is needed as an initContainer.
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    credentials:
      useSecret: true
      existingSecret: velero-s3-creds
    configuration:
      # EnableCSI = snapshot volumes via CSI VolumeSnapshotClasses (the Ceph ones,
      # labeled velero.io/csi-volumesnapshot-class). No native VolumeSnapshotLocation.
      features: EnableCSI
      # API rate limit (default 20/30); GC of backups with many snapshots queues behind it.
      clientQPS: 50
      clientBurst: 100
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: kube-barman
          # Reuses the barman bucket under a velero/ prefix (no separate bucket was
          # created). Switch to a dedicated bucket by changing bucket + dropping prefix.
          prefix: velero
          default: true
          credential:
            name: velero-s3-creds
            key: cloud
          config:
            region: us-east-1 # ignored by RGW, but the AWS plugin needs a value
            s3ForcePathStyle: "true"
            s3Url: https://s3.example.com
    # No native VolumeSnapshotLocation (CSI doesn't use one) and no data-movement:
    # CSI snapshots stay in Ceph. node-agent (file-system backup) not needed.
    snapshotsEnabled: false
    deployNodeAgent: false
    schedules:
      # Each tier carves its slot out of the one below: hourly skips 03:00, daily skips the
      # 1st. So exactly one backup runs at any given time, and the longer-lived tier owns it.
      hourly:
        disabled: false
        schedule: "0 0-2,4-23 * * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: 72h0m0s
          snapshotVolumes: true
          # Default 10m equals ceph-csi's SlowGRPCRestart watchdog; rbd CreateSnapshot can exceed
          # both (rbd_list_children over retained snapshots).
          csiSnapshotTimeout: 30m
          # Skips the static rootPath volumes, which cannot be snapshotted and
          # otherwise make every run PartiallyFailed: volume-policy.yaml.
          resourcePolicy:
            kind: configmap
            name: velero-volume-policy
          excludedNamespaces:
            - postgres
            - opentelemetry-gateway
            - nats
      daily:
        disabled: false
        schedule: "0 3 2-31 * *"
        useOwnerReferencesInBackup: false
        template:
          # TTL only; no retainCount: https://github.com/vmware-tanzu/velero/issues/7804
          ttl: 720h0m0s
          snapshotVolumes: true
          csiSnapshotTimeout: 30m
          resourcePolicy:
            kind: configmap
            name: velero-volume-policy
          # postgres is fully managed by CNPG (its own snapshot + WAL backups), so
          # skip it here to avoid redundant/crash-consistent snapshots of its PVCs.
          excludedNamespaces:
            - postgres
            # Telemetry buffer: constant rewrites pinned ~20Gi per broker per day.
            - opentelemetry-gateway
            # JetStream: a crash-consistent snapshot of a raft member is not a restore point.
            - nats
      monthly:
        disabled: false
        schedule: "0 3 1 * *"
        useOwnerReferencesInBackup: false
        template:
          # 6 months
          ttl: 4320h0m0s
          snapshotVolumes: true
          csiSnapshotTimeout: 30m
          resourcePolicy:
            kind: configmap
            name: velero-volume-policy
          excludedNamespaces:
            - postgres
            - opentelemetry-gateway
            - nats
