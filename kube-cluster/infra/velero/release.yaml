---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: velero
spec:
  interval: 1h0m0s
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 10m0s
  chart:
    spec:
      chart: velero
      version: "12.1.0"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  values:
    # S3 (object store) backend plugin. The CSI plugin is built into velero core
    # (>=1.14), so only the AWS plugin is needed as an initContainer.
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.2
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    credentials:
      useSecret: true
      existingSecret: velero-s3-creds
    configuration:
      # EnableCSI = snapshot volumes via CSI VolumeSnapshotClasses (the Ceph ones,
      # labeled velero.io/csi-volumesnapshot-class). No native VolumeSnapshotLocation.
      features: EnableCSI
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: kube-barman
          # Reuses the barman bucket under a velero/ prefix (no separate bucket was
          # created). Switch to a dedicated bucket by changing bucket + dropping prefix.
          prefix: velero
          default: true
          credential:
            name: velero-s3-creds
            key: cloud
          config:
            region: us-east-1 # ignored by RGW, but the AWS plugin needs a value
            s3ForcePathStyle: "true"
            s3Url: https://s3.example.com
    # No native VolumeSnapshotLocation (CSI doesn't use one) and no data-movement:
    # CSI snapshots stay in Ceph. node-agent (file-system backup) not needed.
    snapshotsEnabled: false
    deployNodeAgent: false
    schedules:
      daily:
        disabled: false
        schedule: "0 3 * * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: 720h0m0s
          snapshotVolumes: true
          # postgres is fully managed by CNPG (its own snapshot + WAL backups), so
          # skip it here to avoid redundant/crash-consistent snapshots of its PVCs.
          excludedNamespaces:
            - postgres
