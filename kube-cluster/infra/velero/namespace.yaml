apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: velero
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
