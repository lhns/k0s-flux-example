# Barman Cloud Plugin object store — where WAL (and any object-store base backups)
# land. Ceph RGW at s3.example.com, bucket kube-barman; barman writes under
# <destinationPath>/<serverName>/ (serverName defaults to the cluster name → postgres).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-store
  namespace: postgres
spec:
  retentionPolicy: "30d"
  # RGW returns transient 502/504 under load; botocore's legacy default gives up
  # after 4 retries, which is what fails backups and the retention pass. standard
  # retries 5xx with capped exponential backoff -- not adaptive, whose rate
  # limiter would throttle the upload in response to gateway errors.
  #
  # Retention lists every object in the bucket; at 300s that was 288 full
  # listings a day against the bottleneck, for a 30 day policy.
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 3600
    env:
      - name: AWS_RETRY_MODE
        value: standard
      - name: AWS_MAX_ATTEMPTS
        value: "10"
  configuration:
    destinationPath: s3://kube-barman
    endpointURL: https://s3.example.com
    s3Credentials:
      accessKeyId:
        name: postgres-s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-s3-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
