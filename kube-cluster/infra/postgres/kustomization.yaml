apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Needs the CNPG operator, the Barman Cloud Plugin (ObjectStore CRD + WAL
    # archiver), and the ceph-rbd VolumeSnapshotClass for snapshot backups.
    flux-component-generator/dependsOn: infra-cloudnative-pg,infra-barman-cloud-plugin,infra-ceph-csi-rbd
# app.kubernetes.io/instance=postgres (= dir name) is applied by the root
# generator via the Flux Kustomization's commonMetadata — nothing to add here.
resources:
- s3-secret.yaml
- objectstore.yaml
- cluster.yaml
- monitoring-queries.yaml
- pooler.yaml
- scheduledbackup.yaml
- vnet.yaml
- grafana.yaml
# Dashboard JSON: stable names with the operator's label (its informer only sees labelled
# ConfigMaps, so a JSON change syncs at once instead of at the next resync), no substitution.
configMapGenerator:
- name: infra-postgres-dashboards
  namespace: grafana
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/managed-by: grafana-operator
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
  files:
  - dashboards/postgres.json
  - dashboards/postgres-database.json
