apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  # The only way to annotate instance pods (no pod template); the operator patches them in place,
  # no restart. Also lands on the PVCs, Services and Secrets, harmlessly.
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: /metrics
  # The default queries stay first: a later ConfigMap's key silently replaces an earlier one's.
  monitoring:
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: postgres-monitoring
        key: queries
  # 3 instances = 1 primary + 2 hot standbys. CNPG failover is operator/API driven
  # (no quorum), so 2 would be enough for automatic HA -- the third exists for the
  # SYNCHRONOUS setting below, not for failover.
  #
  # With `dataDurability: required`, writes PAUSE whenever fewer than `number`
  # standbys are available. At 2 instances that means every replica restart -- a
  # node drain, a CNPG minor upgrade, a Ceph hiccup -- stops writes for all ~27
  # databases. The third instance is what makes the guarantee affordable: one
  # standby can go away with no effect at all.
  instances: 3
  # Required: a drain of a node holding two instances would leave no synchronous standby.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  # Switchover keeps writes flowing while the primary updates; the default restarts it in place.
  primaryUpdateMethod: switchover
  storage:
    # Block storage (Ceph RBD, pool rbd.kube) — proper for a database (block I/O,
    # reattachable volumes) rather than the shared CephFS.
    storageClass: ceph-rbd
    # In-place expansion: ceph-rbd has allowVolumeExpansion=true, so CNPG grows each
    # PVC + the filesystem online (no recreate, no data loss). Growing only — shrinking
    # is not supported.
    size: 20Gi
  # Connection ceiling. Postgres forks a backend *process* per connection, so this is
  # deliberately a ceiling, not a target — most apps go through the pgbouncer Pooler
  # (pooler.yaml), which serves ~1000 clients on a few dozen real backends. 500 leaves
  # room for the pooler's backends + direct-connect apps + CNPG's own reserved conns.
  # Both params require a restart; CNPG detects that and does a rolling restart.
  postgresql:
    parameters:
      max_connections: "500"
      shared_buffers: "512MB"   # ~25% of the 2Gi limit below
      # Per-block I/O timing for pg_stat_database / pg_stat_io. Reload-only, unlike the two above.
      track_io_timing: "on"
      track_wal_io_timing: "on"
      # Any pg_stat_statements.* makes CNPG preload the library (restart) and create the extension
      # in every database. track_utility off: driver SET/DISCARD would crowd out real queries.
      pg_stat_statements.max: "5000"
      pg_stat_statements.track: top
      pg_stat_statements.track_utility: "off"
    # Synchronous replication: a commit is not acknowledged until a standby has the WAL.
    # RPO=0.
    #
    # Every ASYNC promotion silently discards commits the new primary had not received,
    # and this cluster promotes often. Sequences can also lag a client's recorded position
    # without any lost commit (WAL log-ahead on standbys): apps/matrix/README.md.
    #
    # number: 1, not 2 -- both give RPO=0, but 2 blocks writes whenever any single
    # standby is away, which a rolling update makes routine. method: any, so either
    # standby satisfies it.
    synchronous:
      method: any
      number: 1
      dataDurability: required
  # Guaranteed RAM behind the raised connection ceiling. No CPU limit (avoids CFS
  # throttling); the memory limit bounds the blast radius of a connection spike.
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      memory: "2Gi"
  # Backups (see objectstore.yaml + scheduledbackup.yaml): the Barman Cloud Plugin archives
  # WAL continuously AND takes the daily base backup, both to S3 (Ceph RGW).
  #
  # Nothing schedules a volume-snapshot backup any more, so this block is inert; it stays so
  # that an ad-hoc `method: volumeSnapshot` Backup still has a class to use.
  backup:
    volumeSnapshot:
      className: ceph-rbd-snapshotclass
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: postgres-store
      # The S3 prefix. Bump on every new incarnation: README.md "serverName".
      serverName: postgres
  bootstrap:
    initdb:
      database: app
      owner: app
      # No `secret` -> CNPG generates `postgres-app` (user app + random password)
      # in-cluster. Nothing plaintext in git; fetch it with `kubectl -n postgres
      # get secret postgres-app`. (Provide a SOPS secret here for declarative creds.)
