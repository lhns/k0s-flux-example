# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: postgres-s3-creds
    namespace: postgres
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: demo-app
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: demo-app
type: Opaque
stringData:
    ACCESS_KEY_ID: CHANGEME-ACCESS_KEY_ID
    ACCESS_SECRET_KEY: CHANGEME-ACCESS_SECRET_KEY
