apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # cert-manager: the embedded OpenTelemetry Operator's admission webhook needs a
    # serving cert. kube-vnet: vnet.yaml uses the kube-vnet.lhns.de CRDs (scrape
    # wiring), so its CRDs must exist first. Read by the root generator; inert to
    # kustomize. No `namespace:` transformer — release.yaml/vnet.yaml pin their own
    # namespaces (opentelemetry, plus the flux-system scrape-ingress binding).
    dependsOn: infra-cert-manager,infra-kube-vnet
resources:
- release.yaml
- vnet.yaml
