apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # cert-manager: the embedded OpenTelemetry Operator's admission webhook needs a
    # serving cert. kube-vnet: vnet.yaml uses the kube-vnet.lhns.de CRDs (scrape
    # wiring), so its CRDs must exist first. Read by the root generator; inert to
    # kustomize. No `namespace:` transformer — release.yaml/vnet.yaml pin their own
    # namespaces (opentelemetry, plus the flux-system scrape-ingress binding).
    flux-component-generator/dependsOn: infra-cert-manager,infra-kube-vnet
resources:
- release.yaml
- vnet.yaml
- grafana.yaml
# Dashboard JSON: stable names with the operator's label (its informer only sees labelled
# ConfigMaps, so a JSON change syncs at once instead of at the next resync), no substitution.
configMapGenerator:
- name: infra-opentelemetry-monitoring-dashboards
  namespace: grafana
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/managed-by: grafana-operator
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
  files:
  - dashboards/servers.json
  - dashboards/kubernetes-containers.json
