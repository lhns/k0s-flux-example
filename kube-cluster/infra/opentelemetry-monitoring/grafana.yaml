apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: infra-opentelemetry-monitoring-telemetry
  namespace: grafana
spec:
  name: infra-opentelemetry-monitoring-telemetry
  instanceSelector:
    matchLabels:
      grafana.example.com/instance: main
  folderUID: ag1airdsjen7kc # Cluster
  interval: 1m
  rules:
    # NoData = nothing at all in a day. Emailed as well: this is the pipeline the other alerts depend on.
    - uid: k8s-metrics-stalled
      title: No pod metrics from Kubernetes
      condition: C
      for: 5m
      noDataState: Alerting
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: {from: 86400, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              time() - max(tlast_over_time({__name__="k8s.pod.phase"}[1d]))
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [600]}
      labels:
        severity: critical
      annotations:
        summary: 'No Kubernetes cluster metrics'
        description: 'The newest k8s.pod.phase sample is {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} old: the k8s_cluster receiver, the OTel gateway or Kafka are stuck, so the pod and workload alerts are blind.'
      notificationSettings:
        receiver: matrix-and-email
    - uid: k8s-kubelet-metrics-stalled
      title: No kubelet metrics from Kubernetes
      condition: C
      for: 5m
      noDataState: Alerting
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: {from: 86400, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              time() - max(tlast_over_time({__name__="k8s.pod.cpu.time"}[1d]))
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: gt, params: [600]}
      labels:
        severity: critical
      annotations:
        summary: 'No kubeletstats metrics'
        description: 'The newest k8s.pod.cpu.time sample is {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} old: the kubeletstats receivers, the OTel gateway or Kafka are stuck, so the container alerts are blind.'
      notificationSettings:
        receiver: matrix-and-email
