apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: infra-opentelemetry-monitoring-capacity
  namespace: grafana
spec:
  name: infra-opentelemetry-monitoring-capacity
  instanceSelector:
    matchLabels:
      grafana.example.com/instance: main
  folderUID: ag1airdsjen7kc # Cluster
  interval: 5m
  rules:
    # Time-to-full from the 6h trend, over half full only; ≥97% full counts as 0 so a full static disk alerts.
    - uid: server-disk-fill-24h
      title: Server filesystem fills within a day
      condition: C
      for: 30m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 21600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move((max by ("host.name", mountpoint) ({__name__="system.filesystem.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) / -deriv(max by ("host.name", mountpoint) ({__name__="system.filesystem.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"})[6h:5m]) and deriv(max by ("host.name", mountpoint) ({__name__="system.filesystem.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"})[6h:5m]) < 0 and max by ("host.name", mountpoint) ({__name__="system.filesystem.utilization", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) > 0.5) or (max by ("host.name", mountpoint) ({__name__="system.filesystem.utilization", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) > 0.97) * 0, "host.name", "server")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: within_range, params: [14400, 86400]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.server }}:{{ $labels.mountpoint }} {{ if and $values.A (eq $values.A.Value 0.0) }}is at least 97% full{{ else }}fills up in {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }}{{ end }}'
        description: 'Predicted from the 6h trend. Find what grows (logs, images, databases) and prune or grow the disk. https://grafana.example.com/d/servers/servers?var-server={{ $labels.server }}'
      notificationSettings:
        receiver: matrix
    - uid: server-disk-fill-4h
      title: Server filesystem fills within 4 hours
      condition: C
      for: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 21600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move((max by ("host.name", mountpoint) ({__name__="system.filesystem.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) / -deriv(max by ("host.name", mountpoint) ({__name__="system.filesystem.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"})[6h:5m]) and deriv(max by ("host.name", mountpoint) ({__name__="system.filesystem.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"})[6h:5m]) < 0 and max by ("host.name", mountpoint) ({__name__="system.filesystem.utilization", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) > 0.5) or (max by ("host.name", mountpoint) ({__name__="system.filesystem.utilization", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) > 0.97) * 0, "host.name", "server")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [14400]}
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.server }}:{{ $labels.mountpoint }} {{ if and $values.A (eq $values.A.Value 0.0) }}is at least 97% full{{ else }}fills up in {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }}{{ end }}'
        description: 'Predicted from the 6h trend. Free space now. https://grafana.example.com/d/servers/servers?var-server={{ $labels.server }}'
      notificationSettings:
        receiver: matrix
    - uid: server-inodes-fill
      title: Server filesystem runs out of inodes
      condition: C
      for: 30m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 21600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move((max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) / -deriv(max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"})[6h:5m]) and deriv(max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"})[6h:5m]) < 0 and (max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="used", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) / (max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="used", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) + max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}))) > 0.5) or ((max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="used", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) / (max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="used", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}) + max by ("host.name", mountpoint) ({__name__="system.filesystem.inodes.usage", state="free", mountpoint!~"/var/lib/k0s/kubelet/.*|/var/lib/containers/.*|/run/.*"}))) > 0.97) * 0, "host.name", "server")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [86400]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.server }}:{{ $labels.mountpoint }} inodes: {{ if and $values.A (eq $values.A.Value 0.0) }}is at least 97% used{{ else }}fills up in {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }}{{ end }}'
        description: 'Millions of small files (caches, sessions, mail). Find and delete them; the filesystem reports full with bytes free. https://grafana.example.com/d/servers/servers?var-server={{ $labels.server }}'
      notificationSettings:
        receiver: matrix
    - uid: pvc-fill-24h
      title: PVC fills within a day
      condition: C
      for: 30m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 21600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move((max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"}) / -deriv(max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"})[6h:5m]) and deriv(max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"})[6h:5m]) < 0 and (1 - max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"}) / max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.capacity", k8s.volume.type="persistentVolumeClaim"})) > 0.5) or ((1 - max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"}) / max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.capacity", k8s.volume.type="persistentVolumeClaim"})) > 0.97) * 0, "k8s.namespace.name", "namespace", "k8s.persistentvolumeclaim.name", "pvc")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: within_range, params: [14400, 86400]}
      labels:
        severity: warning
      annotations:
        summary: 'PVC {{ $labels.namespace }}/{{ $labels.pvc }} {{ if and $values.A (eq $values.A.Value 0.0) }}is at least 97% full{{ else }}fills up in {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }}{{ end }}'
        description: 'Predicted from the 6h trend. Prune the data or grow the PVC; never delete the PV (AGENTS.md). https://grafana.example.com/d/k8s-containers/kubernetes-containers?var-namespace={{ $labels.namespace }}'
      notificationSettings:
        receiver: matrix
    - uid: pvc-fill-4h
      title: PVC fills within 4 hours
      condition: C
      for: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 21600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move((max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"}) / -deriv(max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"})[6h:5m]) and deriv(max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"})[6h:5m]) < 0 and (1 - max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"}) / max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.capacity", k8s.volume.type="persistentVolumeClaim"})) > 0.5) or ((1 - max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.available", k8s.volume.type="persistentVolumeClaim"}) / max by ("k8s.namespace.name", "k8s.persistentvolumeclaim.name") ({__name__="k8s.volume.capacity", k8s.volume.type="persistentVolumeClaim"})) > 0.97) * 0, "k8s.namespace.name", "namespace", "k8s.persistentvolumeclaim.name", "pvc")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [14400]}
      labels:
        severity: critical
      annotations:
        summary: 'PVC {{ $labels.namespace }}/{{ $labels.pvc }} {{ if and $values.A (eq $values.A.Value 0.0) }}is at least 97% full{{ else }}fills up in {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }}{{ end }}'
        description: 'Predicted from the 6h trend. Prune the data or grow the PVC now; never delete the PV (AGENTS.md). https://grafana.example.com/d/k8s-containers/kubernetes-containers?var-namespace={{ $labels.namespace }}'
      notificationSettings:
        receiver: matrix
