apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# app.kubernetes.io/instance=spegel (= dir name) is applied by the root
# generator via commonMetadata — nothing to add here.
resources:
- release.yaml
- vnet.yaml
- grafana.yaml
configMapGenerator:
- name: infra-spegel-dashboards
  namespace: grafana
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/managed-by: grafana-operator
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
  files:
  - dashboards/spegel.json
