---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: spegel
  namespace: spegel
spec:
  type: oci
  interval: 1h0m0s
  url: oci://ghcr.io/spegel-org/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: spegel
spec:
  interval: 10m0s
  chart:
    spec:
      chart: spegel
      version: "0.7.4"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: spegel
  values:
    spegel:
      # k0s runs its own containerd under /run/k0s + /var/lib/k0s (not the chart
      # defaults /run/containerd + /var/lib/containerd), so point Spegel at them.
      containerdSock: /run/k0s/containerd.sock
      containerdContentPath: /var/lib/k0s/containerd/io.containerd.content.v1.content
      # A directory of Spegel's own, which it CLEARS on every pod start. It is
      # deliberately NOT in containerd's config_path: sharing one directory with
      # hand-written config deleted the oci-composer drop-in twice, and a two-root
      # config_path did not work in practice (see registries.toml).
      #
      # So nothing currently reads what Spegel writes -- its peer-to-peer mirroring
      # is INACTIVE until that is resolved. Spegel keeps running and errors nothing.
      #
      # That is why it gets a root of its own. Sharing one with hand-written
      # config deleted the oci-composer drop-in twice; it is not a Spegel bug but
      # a documented ownership model, and the way to live with it is to give it
      # something it may own outright. Ordering matters too: Spegel's `_default`
      # matches every registry, so its root must come SECOND or it answers for
      # hand-written registries as well. See registries.toml.
      containerdRegistryConfigPath: /etc/k0s/registries/spegel
      # mirroredRegistries left unset -> recent Spegel auto-discovers registries.
