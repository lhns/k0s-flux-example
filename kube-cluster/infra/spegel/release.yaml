---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: spegel
  namespace: spegel
spec:
  type: oci
  interval: 1h0m0s
  url: oci://ghcr.io/spegel-org/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: spegel
spec:
  interval: 10m0s
  chart:
    spec:
      chart: spegel
      version: "0.8.0"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: spegel
  values:
    spegel:
      # k0s runs its own containerd under /run/k0s + /var/lib/k0s (not the chart
      # defaults /run/containerd + /var/lib/containerd), so point Spegel at them.
      containerdSock: /run/k0s/containerd.sock
      containerdContentPath: /var/lib/k0s/containerd/io.containerd.content.v1.content
      # Spegel's own root: it CLEARS this directory on every pod start, so hand-written
      # config (the oci-composer drop-in) lives in a root listed before it in containerd's
      # config_path, and that root must never hold a `_default`. See registries.toml.
      containerdRegistryConfigPath: /etc/k0s/registries/spegel
      # mirroredRegistries left unset -> recent Spegel auto-discovers registries.
