# The four OTLP topics. auto.create.topics.enable is false, so these MUST exist before
# the gateway's Kafka exporters can write.
#
# The policy is TIME-based (10 days) with a 2 GB local window and the rest tiered to S3;
# retention.bytes stays unbounded.
#
# metadata.name must be RFC1123 (no underscores), so the real Kafka name is carried in
# spec.topicName. The strimzi.io/cluster label is what makes the Topic Operator claim it.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otlp-metrics
  namespace: opentelemetry-gateway
  labels:
    strimzi.io/cluster: otel
spec:
  topicName: otlp_metrics
  partitions: 1
  replicas: 2
  config:
    remote.storage.enable: "true"
    retention.ms: "864000000"
    retention.bytes: "-1"
    local.retention.bytes: "2000000000"
    min.insync.replicas: "1"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otlp-meta-metrics
  namespace: opentelemetry-gateway
  labels:
    strimzi.io/cluster: otel
spec:
