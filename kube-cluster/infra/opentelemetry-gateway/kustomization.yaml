apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # strimzi: the Kafka/KafkaNodePool/KafkaTopic CRDs must exist before these CRs
    # apply. metallb: the gateway's VIP pool (10.20.2.14). ceph-csi-rbd: the brokers'
    # log-dir PVCs. kube-vnet: vnet.yaml uses its CRDs, and its admission policy must
    # be live before Kafka pods are created. Read by the root generator; inert to
    # kustomize.
    # No `namespace:` transformer — every object pins its own namespace, and
    # vnet.yaml deliberately ships a binding into the `strimzi` namespace.
    #
    # ceph-csi-cephfs is gone from this list: it was here only for the static PV that
    # carried the Aiven plugin jars, which is now an OCI image volume. oci-composer is
    # NOT a replacement dependency — the artifact is pulled by the kubelet, not by any
    # pod, so nothing here talks to it and Flux ordering has no bearing on it.
    dependsOn: infra-strimzi,infra-metallb,infra-ceph-csi-rbd,infra-kube-vnet
resources:
- resources.yaml
- tiered-storage-plugin.yaml
- secret.yaml
- kafka.yaml
- topics.yaml
- vnet.yaml
# Where Strimzi keeps an image volume's reference — the builtin fieldspecs do not cover it.
# See the file; without it the composed placeholder in kafka.yaml is never rewritten.
configurations:
- kustomizeconfig.yaml
# Content-hashed names: editing a collector config renames the ConfigMap and rolls the
# Deployment atomically. No Reloader needed for these.
configMapGenerator:
- name: opentelemetry-gateway-config
  namespace: opentelemetry-gateway
  files:
  - config.yaml=opentelemetry-gateway.yaml
- name: opentelemetry-gateway-kafkametrics-config
  namespace: opentelemetry-gateway
  files:
  - config.yaml=opentelemetry-gateway-kafkametrics.yaml
