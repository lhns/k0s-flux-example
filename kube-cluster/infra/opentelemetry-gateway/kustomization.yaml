apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # strimzi: the Kafka/KafkaNodePool/KafkaTopic CRDs must exist before these CRs
    # apply. metallb: the gateway's VIP pool (10.20.176.58). ceph-csi-rbd: the brokers'
    # log-dir PVCs. kube-vnet: vnet.yaml uses its CRDs, and its admission policy must
    # be live before Kafka pods are created. Read by the root generator; inert to
    # kustomize.
    # No `namespace:` transformer — every object pins its own namespace, and
    # vnet.yaml deliberately ships a binding into the `strimzi` namespace.
    #
    # oci-composer: artifacts/ is built there, and publishes the ref kafka.yaml substitutes.
    flux-component-generator/dependsOn: infra-strimzi,infra-metallb,infra-ceph-csi-rbd,infra-kube-vnet,infra-oci-composer
resources:
- resources.yaml
- secret.yaml
- kafka.yaml
- topics.yaml
- vnet.yaml
- grafana.yaml
# Content-hashed names: editing a collector config renames the ConfigMap and rolls the
# Deployment atomically. No Reloader needed for these.
configMapGenerator:
- name: opentelemetry-gateway-config
  namespace: opentelemetry-gateway
  files:
  - config.yaml=opentelemetry-gateway.yaml
- name: opentelemetry-gateway-kafkametrics-config
  namespace: opentelemetry-gateway
  files:
  - config.yaml=opentelemetry-gateway-kafkametrics.yaml
# The collector's own escape is $$, which Flux substitution would collapse to $.
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
