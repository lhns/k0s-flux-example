---
# Three KRaft nodes carrying both roles (broker + controller in one pool). RF=2 on every
# topic means a partition keeps a leader through a rolling restart, so producers never
# block — writes are the thing that must stay available here; reads can wait.
#
# The pool name `kafka` gives pod names otel-kafka-N matching the otel-kafka-* Services.
# Renaming it is not a rename: Strimzi derives PVC names from it, so a new name means
# new empty volumes.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka
  namespace: opentelemetry-gateway
  labels:
    strimzi.io/cluster: otel
spec:
  replicas: 3
  roles: [controller, broker]
  # Heap pinned: an unset -Xmx sizes to a quarter of the node's RAM. Reads come from the
  # page cache, so 2g is ample and the rest of the limit below is left to it.
  jvmOptions:
    -Xms: 2g
    -Xmx: 2g
  # Memory only, per apps/webtop/README.md. resources lives here and not in Kafka.spec.kafka:
  # with node pools the Kafka CRD has no resources field at all.
  resources:
    requests:
      memory: 3Gi
    limits:
      memory: 4Gi
  storage:
    # JBOD with a single volume even though there's only one disk: it is the only
    # storage type that can later gain a disk without recreating the cluster.
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        # Local tier only: topics keep a 2 GB hot window and tier the rest to S3.
        # Strimzi sizes the pool alike, so this is the largest broker's disk. Lowering it
        # wedges the whole Kafka CR NotReady, silently dropping every other change to it.
        # Headroom, not steady state -- a tiering failure cannot drain on its own.
        size: 65Gi
        class: ceph-rbd
        deleteClaim: false
        kraftMetadata: shared
  template:
    pod:
      # Required: a PDB cannot stop a drain evicting two co-located brokers.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: otel
                  strimzi.io/name: otel-kafka
      metadata:
        labels:
          # Brokers accept clients on :9092 and talk to each other (:9091 replication,
          # :9090 controller) -> both directions.
          kube-vnet/net.kafka: both
      volumes:
        # The Aiven plugin jars (artifacts/tiered-storage-plugin.yaml), by the digest-pinned ref
        # the composition exports; see infra/oci-composer/README.md.
        - name: tiered-storage-plugin
          image:
            reference: ${KAFKA_TIERED_STORAGE_REF}
            # Always would put oci-composer in the path of every broker start.
            pullPolicy: IfNotPresent
    kafkaContainer:
      volumeMounts:
        # Strimzi HARD-ENFORCES that additional mount paths start with /mnt — anything
        # else and the Kafka CR silently stays NotReady with no pods created at all.
        - name: tiered-storage-plugin
          mountPath: /mnt/tiered-storage
          readOnly: true
      env:
        # The Aiven S3 backend falls back to the AWS SDK default credential chain when
        # storage.aws.access.key.id / secret.access.key are unset, and that chain reads
        # these env vars. This keeps the credentials OUT of the Kafka CR, whose
        # remoteStorageManager.config is a plain string map that would land in git in
        # cleartext. (${strimzisecrets:...} is not an option: the Kafka pod Role is
        # resourceNames-scoped to cert secrets, so it would be RBAC-denied.)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: opentelemetry-gateway-s3
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: opentelemetry-gateway-s3
              key: AWS_SECRET_ACCESS_KEY
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: otel
  namespace: opentelemetry-gateway
spec:
  kafka:
    # The operator refuses to create ANY pod on a version it does not support
    # (Kafka NotReady/UnsupportedKafkaVersionException), so a typo is not a half-built cluster.
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      # Internal only. External senders reach the GATEWAY on 10.20.176.58; nothing
      # outside the cluster talks to Kafka, so there is no external listener and no
      # advertised-address juggling.
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # RF=2 everywhere. Tiered storage means this costs ~2x only the small local hot
      # window — remote segments are uploaded by the LEADER ONLY and are not
      # replicated (KIP-405), so the 10 days in S3 is stored exactly once.
      default.replication.factor: 2
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 2
      # min.isr 1 (not 2) so losing a broker degrades reads but NEVER blocks writes.
      min.insync.replicas: 1
      transaction.state.log.min.isr: 1
      # Parity with the Swarm broker: topics are declared as KafkaTopic CRs below,
      # never conjured into existence by a producer typo.
      auto.create.topics.enable: false
      # The remote-log metadata topic. Losing it makes S3 segments unreadable even
      # though the objects still exist, so it gets RF=2 like everything else.
      rlmm.config.remote.log.metadata.topic.replication.factor: 2
      rlmm.config.remote.log.metadata.topic.num.partitions: 50
    tieredStorage:
      type: custom
      remoteStorageManager:
        className: io.aiven.kafka.tieredstorage.RemoteStorageManager
        # Two entries, never one directory: both ship commons-codec, in different versions.
        # Version-free, so an upgrade touches only artifacts/tiered-storage-plugin.yaml.
        classPath: /mnt/tiered-storage/core/*:/mnt/tiered-storage/s3/*
        config:
          storage.backend.class: io.aiven.kafka.tieredstorage.storage.s3.S3Storage
          storage.s3.bucket.name: otel
          storage.s3.endpoint.url: https://s3.example.com
          # 'default' is what the Swarm broker sets against the Ceph RGW — not a real
          # AWS region, and not us-east-1.
          storage.s3.region: default
          storage.s3.path.style.access.enabled: "true"
          chunk.size: "4194304"
          # The Swarm cluster sets no prefix, so its objects sit at the bucket root.
          # Namespacing this cluster keeps the two separable while both run, and makes
          # the old objects trivially identifiable for cleanup after Swarm retires.
          key.prefix: kube/
  entityOperator:
    # Reconciles the KafkaTopic CRs in topics.yaml.
    topicOperator:
      resources:
        requests:
          memory: 768Mi
        limits:
          memory: 1536Mi
    # userOperator omitted: the internal listener has no TLS/SCRAM auth, so there are
    # no KafkaUsers to manage.
    template:
      pod:
        metadata:
          labels:
            kube-vnet/net.kafka: egress
