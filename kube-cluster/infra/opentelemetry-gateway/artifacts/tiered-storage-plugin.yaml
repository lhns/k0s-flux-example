# The Aiven tiered-storage plugin jars, mounted on the brokers (../kafka.yaml). Upgrading: ../README.md.
---
apiVersion: oci.lhns.de/v1alpha1
kind: ImageComposition
metadata:
  name: kafka-tiered-storage
  namespace: opentelemetry-gateway
spec:
  interval: 1h
  # No `base`: files mounted into the upstream Strimzi Kafka image.
  layers:
    # Separate directories: both archives ship commons-codec, in different versions.
    - name: core
      fetch:
        # renovate: datasource=github-releases depName=Aiven-Open/tiered-storage-for-apache-kafka
        url: https://github.com/Aiven-Open/tiered-storage-for-apache-kafka/releases/download/v1.2.0/core-1.2.0.tgz
        digest: sha256:14fb636d3a5c781ae9ae961012bf7b0881b09629859dbc784dc49356faeaa747
        unpack: tar.gz
        subpath: core-1.2.0
      to: /core
      # The Strimzi Kafka container's user.
      owner: {uid: 1001, gid: 0}
    - name: s3
      fetch:
        # renovate: datasource=github-releases depName=Aiven-Open/tiered-storage-for-apache-kafka
        url: https://github.com/Aiven-Open/tiered-storage-for-apache-kafka/releases/download/v1.2.0/s3-1.2.0.tgz
        digest: sha256:1fd89dea84988b857e546fcfa88504f5b4e45d7712e3eddeb506f11a394ef010
        unpack: tar.gz
        subpath: s3-1.2.0
      to: /s3
      owner: {uid: 1001, gid: 0}
  push:
    history: 10
    writeRefTo:
      namespace: gen-infra-opentelemetry-gateway
      keys:
        ref: KAFKA_TIERED_STORAGE_REF
