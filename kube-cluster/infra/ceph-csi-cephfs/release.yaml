---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ceph-csi
  namespace: ceph-csi-cephfs
spec:
  interval: 1h0m0s
  url: https://ceph.github.io/csi-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-cephfs
  namespace: ceph-csi-cephfs
spec:
  interval: 10m0s
  chart:
    spec:
      chart: ceph-csi-cephfs
      # Moves with the image below: Renovate reads both from its tags.
      # renovate: datasource=docker depName=ghcr.io/lhns/ceph-csi-x86-64-v2
      version: "3.18.1"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
  values:
    # k0s puts the kubelet root at /var/lib/k0s/kubelet (not the default
    # /var/lib/kubelet); the CSI hostPath mounts must match or the plugin
    # fails to register.
    kubeletDir: /var/lib/k0s/kubelet
    # Metrics-port convention: kube-router (hostNetwork) owns host :8080, so the
    # ceph-csi liveness sidecars live at 8090+ — cephfs 8090, rbd 8091. (Chart
    # default is 8081.) The nodeplugin is hostNetwork, so this is a real host port.
    nodeplugin:
      registrar:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      plugin:
        # Memory limits (ADR 0028). The chart reuses these for liveness-prometheus and, in the
        # provisioner, the plugin and plugin-controller containers too.
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        # Also the provisioner's image. x86-64-v2 build of upstream: see README.md.
        image:
          repository: ghcr.io/lhns/ceph-csi-x86-64-v2
          tag: v3.18.1@sha256:d706364a170eeea45d574f52d32fd4aa85cf225d77c318cf222b07166b5804f4
      httpMetrics:
        containerPort: 8090
        service:
          servicePort: 8090
    provisioner:
      provisioner:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 192Mi
      attacher:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      resizer:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      snapshotter:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
      httpMetrics:
        containerPort: 8090
        service:
          servicePort: 8090
    # Map clusterID -> Ceph monitors. clusterID is an arbitrary key that must
    # match the StorageClass; it identifies the Ceph *cluster* (monitor set), not
    # a filesystem — one cluster hosts both `fastdata` and `archive`.
    csiConfig:
      - clusterID: ceph-cluster
        monitors:
          - 10.20.176.250:6789
          - 10.20.176.251:6789
          - 10.20.176.252:6789
        cephFS:
          # subvolumes are created under /volumes/kube/ (must match the
          # subvolumegroup created on the Ceph cluster)
          subvolumeGroup: kube
          # 60s default is too short for a slow MDS; a timed-out umount hits
          # kernel BUG at fs/super.c:650 and panics the node.
          kernelMountOptions: "mount_timeout=300"
    # We provide our own SOPS-encrypted secret + StorageClass.
    secret:
      create: false
    storageClass:
      create: false
  # SlowGRPCRestart=false on the node plugin: the self-kill leaves the D-state umount
  # child behind and unmounts every volume on the node (ADR 0035; do not re-enable).
  # The provisioner is deliberately not patched; its restart is cheap.
  postRenderers:
    - kustomize:
        patches:
          # containers[0] is csi-cephfsplugin (then driver-registrar,
          # liveness-prometheus). Verify with `kubectl -n ceph-csi-cephfs get ds
          # ceph-csi-cephfs-nodeplugin -o jsonpath='{.spec.template.spec.containers[0].name}'`
          # after a chart bump.
          - target:
              kind: DaemonSet
              name: ceph-csi-cephfs-nodeplugin
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=SlowGRPCRestart=false
