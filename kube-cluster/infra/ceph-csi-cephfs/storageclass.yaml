---
# Dynamic CephFS provisioning. Each PVC -> a subvolume under
# /volumes/kube/csi-vol-<uuid> on the fastdata filesystem.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs
provisioner: cephfs.csi.ceph.com
parameters:
  clusterID: ceph-cluster
  fsName: fastdata
  # `pool` intentionally omitted: not needed — new subvolumes use the
  # filesystem's default data pool. (It would add an unnecessary
  # --pool_layout; harmless, just superfluous.)
  # subvolumeGroup is NOT a StorageClass param — it comes from csiConfig
  # (cephFS.subvolumeGroup: kube) in the HelmRelease values.
  csi.storage.k8s.io/provisioner-secret-name: csi-cephfs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi-cephfs
  csi.storage.k8s.io/controller-expand-secret-name: csi-cephfs-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph-csi-cephfs
  csi.storage.k8s.io/node-stage-secret-name: csi-cephfs-secret
  csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi-cephfs
reclaimPolicy: Retain
allowVolumeExpansion: true
# This driver serves `fastdata` only, except pre-existing appdata PVs:
# PV.spec.csi.driver is immutable. The `cephfs-appdata` class is in
# ../ceph-csi-cephfs-appdata (ADR 0035).
