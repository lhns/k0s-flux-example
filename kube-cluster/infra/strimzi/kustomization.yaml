apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # kube-vnet: the operator's own pod, and every Kafka pod it creates, must be
    # admissible under the ValidatingAdmissionPolicy (which needs the CRDs to exist
    # and denies pods carrying no labels). Read by the root generator; inert to
    # kustomize. No `namespace:` transformer — release.yaml pins its own namespace.
    dependsOn: infra-kube-vnet
resources:
- release.yaml
