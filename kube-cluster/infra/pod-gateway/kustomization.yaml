apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The webhook's serving cert is issued by a chart-owned self-signed Issuer,
    # so cert-manager's CRDs must exist. kube-vnet gates the VXLAN ingress.
    flux-component-generator/dependsOn: infra-cert-manager,infra-kube-vnet
resources:
- secret.yaml
- release.yaml
- vnet.yaml
