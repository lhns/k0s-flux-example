---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ha-surge
  namespace: ha-surge-system
spec:
  interval: 1h0m0s
  url: oci://ghcr.io/lhns/charts/ha-surge
  ref:
    # Pinned to the released chart version. Bump to roll a new release; use a
    # 0.0.0-dev.<short-sha> tag to trial an unreleased commit.
    tag: "0.1.0"
---
# ha-surge: make-before-break HA for opted-in single-replica Deployments during
# node drains. On an eviction it detaches the doomed pod from its ReplicaSet (the
# RS makes a real replacement) while the old pod keeps serving, then allows the
# eviction once the replacement is Ready. Never touches spec.replicas, so Flux
# doesn't fight it; never creates a pod, so no admission-policy interaction.
# The eviction webhook is apiserver-dialed, so kube-vnet auto-allows it (no
# vnet.yaml). Cert issued by cert-manager (dependsOn: infra-cert-manager). Enroll
# a namespace by labelling it `ha-surge.lhns.de/enabled=true` (covers every
# single-replica Deployment in it); override per-workload with the same key as an
# annotation. Set `defaultEnabled: true` in values to cover the whole cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha-surge
  namespace: ha-surge-system
spec:
  interval: 10m0s
  chartRef:
    kind: OCIRepository
    name: ha-surge
  values:
    webhook:
      certSource: cert-manager
    # How long an eviction is held waiting for the replacement to become Ready before failing open
    # and allowing it uncovered. The 120s default is too small HERE, measured rather than guessed:
    # a clean pod on this cluster has a 34s median container-create but a 419s p90 (image pull, on
    # Ceph), against an 11s median for app-start -> Ready. So a healthy pod is Ready in ~45s and the
    # default would be fine; it is the pull tail that blows through it.
    #
    # Hit rate from ha-surge's own logs on 2026-08-09: during the k0s upgrade, 19 holds resolved and
    # 19 timed out (0 covered). On a controlled single-node drain the same night - far healthier -
    # 35 detached, 7 covered, 23 timed out. 77% still failing open means most single-replica apps
    # were silently taking their full drain gap despite ha-surge being installed.
    #
    # Raising it is cheap: the gate is readiness, not the clock, so a 45s handoff still takes 45s.
    # The budget only costs time for workloads that are genuinely stuck, and a drain evicts in
    # parallel, so the cost is the slowest pod rather than the sum. k0sctl's options.drain.timeout
    # is kept ABOVE this (k0sctl.yaml) so a `k0sctl apply` cannot hit its own timeout and
    # force-delete a pod that ha-surge is still covering - that would be worse than no coverage.
    #
    # This is a workaround for slow image pulls. Fix Ceph and it can go back down; re-measure the
    # timeout/covered ratio on the next drain either way. See kube-cluster/TODO.md.
    maxSurgeSeconds: 600
    # Cover the whole cluster: every single-replica RollingUpdate Deployment gets
    # make-before-break on drain without any per-namespace/-workload label.
    # kube-system and ha-surge-system are always excluded; opt an individual
    # namespace or Deployment out with `ha-surge.lhns.de/enabled: "false"`. The
    # safety refusals (Recreate, RWO, already-HA, hash-selecting Service) still
    # skip anything unsafe, and the webhook stays fail-open.
    defaultEnabled: true
