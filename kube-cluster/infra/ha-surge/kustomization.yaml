apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # cert-manager issues the webhook serving cert (selfsigned Issuer +
    # Certificate + cainjector). Read by the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-cert-manager
resources:
- namespace.yaml
- release.yaml
