# Patch onto shared/infra/reloader: this cluster's chart version. A whole HelmRelease shape so
# Renovate's flux manager reads it; an inline patch in kustomization.yaml it would not.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  chart:
    spec:
      chart: reloader
      version: "2.2.18"
      sourceRef:
        kind: HelmRepository
        name: stakater
