---
# GitHub push webhook -> pokes flux-system and every generator source for instant sync.
# Without the generator sources, a component's files land in seconds but its generated
# Kustomization spec only on their own poll, up to 30 min later.
# notification-controller populates .status.webhookPath (/hook/<hmac>); that
# path + the webhook-token secret are configured on the GitHub repo webhook.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: webhook-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: "*"
      matchLabels:
        flux-component-generator/push-receiver: github
