---
# Public entry for the GitHub webhook. TLS is served by traefik's default
# TLSStore (wildcard *.kube.example.com), so no per-host cert here. Only the
# /hook path is exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  ingressClassName: traefik
  rules:
    - host: flux-webhook.kube.example.com
      http:
        paths:
          - path: /hook
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port:
                  number: 80
