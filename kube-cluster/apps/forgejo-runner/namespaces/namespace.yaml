---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  labels:
    # Nothing enforces PodSecurity in this cluster today, so these change no behaviour. They are
    # here to state the exception AT the namespace boundary: this is a namespace that legitimately
    # runs a privileged container, so when enforcement is turned on cluster-wide, every OTHER
    # namespace can be tightened without touching this one.
    #
    # Its OWN namespace rather than sharing forgejo's: this is the second privileged application
    # workload in the cluster, and a forge should not share a blast radius with the thing that
    # executes arbitrary code on its behalf.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: forgejo-runner
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
