apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # traefik only. Where apps/gitea-runner depends on infra-ceph-csi-rbd for the
    # PVC holding its .runner identity, v13 keeps identity in config.yaml — so
    # there is no volume, and nothing here needs storage, postgres or reflector.
    # The runner reaches Forgejo through Traefik's VIP. Read by the root
    # generator; inert to kustomize.
    dependsOn: infra-traefik
resources:
- resources.yaml
- secret.yaml
- networkpolicy.yaml
configMapGenerator:
# The daemon reads its config only at startup, so the generator's content hash
# is what makes an edit actually take effect.
- name: forgejo-runner-config
  namespace: forgejo-runner
  files:
  - config.yaml
