---
# Public on purpose: guests join rooms by shared link/QR code without an account.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flip7
  namespace: flip7
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`flip7.example.com`)
      services:
        - name: flip7
          port: 80
      middlewares:
        - name: anubis
  tls: {}
