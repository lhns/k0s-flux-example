apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The semaphore-data PVC needs infra-ceph-csi-rbd. No LB, no per-host cert
    # (semaphore.example.com is under the *.example.com wildcard). Read by the root
    # generator; inert to kustomize.
    dependsOn: infra-ceph-csi-rbd
resources:
- resources.yaml
- routing.yaml
- secret.yaml
