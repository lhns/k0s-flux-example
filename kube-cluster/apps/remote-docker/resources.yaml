apiVersion: v1
kind: Namespace
metadata:
  name: remote-docker
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: remote-docker
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
  labels:
    # The workspace pod runs dockerd, which sets up its own bridge and iptables rules and mounts
    # NFS in its own namespace. The chart has no unprivileged mode to fall back to.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
