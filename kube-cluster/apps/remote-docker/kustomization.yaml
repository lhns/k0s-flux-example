apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # ceph-rbd: the graph and state PVCs. traefik: routing.yaml's IngressRoute.
    # Read by the root generator; inert to kustomize.
    dependsOn: infra-ceph-csi-rbd,infra-kube-vnet,infra-traefik
resources:
  - resources.yaml
  - vnet.yaml
  - release.yaml
  - routing.yaml
