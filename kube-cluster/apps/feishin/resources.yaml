apiVersion: v1
kind: Namespace
metadata:
  name: feishin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feishin
  namespace: feishin
spec:
  replicas: 1
  # Swarm used update_config.order: start-first — surge the new pod before
  # dropping the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feishin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feishin
        app.kubernetes.io/instance: feishin
        # receive traffic from traefik under kube-vnet's ingress isolation
        kube-vnet/net.traefik.traefik: ingress
    spec:
      containers:
        - name: feishin
          image: ghcr.io/jeffvli/feishin:latest
          env:
            # Pin the server so users can only toggle username/password.
            - name: SERVER_LOCK
              value: "true"
            # The upstream Jellyfin this client talks to — NOT feishin's own host.
            - name: SERVER_NAME
              value: jellyfin-pg.example.com
            - name: SERVER_TYPE
              value: jellyfin
            - name: SERVER_URL
              value: https://jellyfin-pg.example.com
            - name: LEGACY_AUTHENTICATION
              value: "false"
            - name: ANALYTICS_DISABLED
              value: "true"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 9180
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: feishin
  namespace: feishin
spec:
  selector:
    app.kubernetes.io/name: feishin
  ports:
    - name: http
      port: 9180
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feishin
  namespace: feishin
  # No Authelia — the router.middlewares line was commented out in the Swarm stack.
spec:
  ingressClassName: traefik
  rules:
    - host: feishin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: feishin
                port:
                  number: 9180
