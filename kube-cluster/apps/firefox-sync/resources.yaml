apiVersion: v1
kind: Namespace
metadata:
  name: firefox-sync
---
# Self-hosted Firefox Sync server (syncstorage-rs, postgres backend). Stateless —
# all state is in the two CNPG databases (schema created by the server on startup).
# Token verification is against Mozilla FxA (external). Migrated from Docker Swarm,
# switching the backend from MariaDB to Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox-sync
  namespace: firefox-sync
  annotations:
    # roll the pod when a referenced Secret changes (rotation): env-var values are
    # never updated in a running pod, and mounted files still need a re-read.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Single writer during the one-time data load (scaled to 0 for pgloader, then
  # back to 1). No local volume, but keep it simple/serial.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: firefox-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firefox-sync
        app.kubernetes.io/instance: firefox-sync
        # receive from traefik; reach the CNPG primary. FxA (oauth.accounts.firefox.com)
        # is external egress (unrestricted under the ingress-only baseline).
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
    spec:
      containers:
        - name: firefox-sync
          image: ghcr.io/lhns/syncstorage-rs-docker:v2.0.0-postgres
          env:
            - name: TZ
              value: Europe/Berlin
            - name: RUST_LOG
              value: info
            - name: SYNC_HUMAN_LOGS
              value: "true"
            - name: SYNC_HOST
              value: 0.0.0.0
            - name: SYNC_PORT
              value: "8000"
            # Public URL clients use; also bootstraps the sync-1.5 node. Kept stable
            # (clients + the persisted node URL are configured with it).
            - name: SYNC_URL
              value: https://firefox-sync.example.com
            - name: SYNC_CAPACITY
              value: "10"
            - name: SYNC_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: firefox-sync-secrets
                  key: master-secret
            # DB password first, then $(VAR)-interpolated into the two connection URLs.
            # Two databases (mirrors the old MariaDB layout). sslmode=disable: this
            # image's libpq/OpenSSL fails the TLS handshake against CNPG's self-signed
            # cert, and CNPG's `host` pg_hba allows non-SSL; traffic stays in-cluster.
            - name: SYNC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefox-sync-db
                  key: password
            - name: SYNC_SYNCSTORAGE__DATABASE_URL
              value: postgres://syncserver:$(SYNC_DB_PASSWORD)@postgres-rw.postgres.svc.cluster.local:5432/syncstorage_rs?sslmode=disable
            - name: SYNC_TOKENSERVER__DATABASE_URL
              value: postgres://syncserver:$(SYNC_DB_PASSWORD)@postgres-rw.postgres.svc.cluster.local:5432/tokenserver_rs?sslmode=disable
            - name: SYNC_TOKENSERVER__ENABLED
              value: "true"
            - name: SYNC_TOKENSERVER__NODE_TYPE
              value: postgres
            - name: SYNC_TOKENSERVER__RUN_MIGRATIONS
              value: "true"
            - name: SYNC_TOKENSERVER__INIT_NODE_URL
              value: https://firefox-sync.example.com
            - name: SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: firefox-sync-secrets
                  key: metrics-hash-secret
            - name: SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN
              value: api.accounts.firefox.com
            - name: SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL
              value: https://oauth.accounts.firefox.com
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /__heartbeat__
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: firefox-sync
  namespace: firefox-sync
spec:
  selector:
    app.kubernetes.io/name: firefox-sync
  ports:
    - name: http
      port: 8000
      targetPort: http
