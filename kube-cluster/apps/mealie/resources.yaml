apiVersion: v1
kind: Namespace
metadata:
  name: mealie
---
# Mealie's /app/data (recipe images, backups, and the .secret JWT-signing key). The
# DB lives in CNPG, so this volume holds files only (no local SQLite) -> CephFS RWX,
# which lets the Deployment do start-first rolling updates.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: mealie
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  annotations:
    # roll the pod when a referenced Secret changes (rotation): env-var values are
    # never updated in a running pod, and mounted files still need a re-read.
    reloader.stakater.com/auto: "true"
spec:
  # DB in CNPG; /app/data (files only) on CephFS RWX -> start-first rolling updates
  # (new pod up before old down; both briefly share /data + the DB during rollover).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
        app.kubernetes.io/instance: mealie
        # receive from traefik; reach the CNPG primary. OIDC (auth.example.com) and
        # OpenAI (api.openai.com) are external egress (unrestricted under the
        # ingress-only baseline).
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.23.1
          env:
            - name: TZ
              value: Europe/Berlin
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # Canonical host drives OIDC callback + generated links.
            - name: BASE_URL
              value: https://mealie.example.com
            - name: ALLOW_SIGNUP
              value: "false"
            # SSO only — no built-in login form (OIDC via Authelia).
            - name: ALLOW_PASSWORD_LOGIN
              value: "false"
            # Database in the shared CNPG cluster (dedicated mealie role + db).
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              value: postgres-rw.postgres.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: mealie
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db
                  key: password
            # OIDC via Authelia (confidential client).
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: https://auth.example.com/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: mealie
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: oidc-client-secret
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: OIDC_ADMIN_GROUP
              value: mealie_admin
            - name: OIDC_USER_GROUP
              value: mealie
            # Recipe imports / AI features.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: openai-api-key
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1000Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
spec:
  selector:
    app.kubernetes.io/name: mealie
  ports:
    - name: http
      port: 9000
      targetPort: http
