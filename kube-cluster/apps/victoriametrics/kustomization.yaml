apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The DB mounts a CephFS static PV (infra-ceph-csi-cephfs); the vmui routes
    # through Traefik + the reflected Authelia middleware (infra-traefik). Read
    # by the root generator; inert to kustomize.
    dependsOn: infra-ceph-csi-cephfs,infra-traefik
resources:
- resources.yaml
- vnet.yaml
- routing.yaml
configMapGenerator:
- name: victoriametrics-exporter-config
  namespace: victoriametrics
  files:
  - config.yaml=victoriametrics-exporter.yaml
- name: victoriametrics-recovery-exporter-config
  namespace: victoriametrics
  files:
  - config.yaml=victoriametrics-recovery-exporter.yaml
