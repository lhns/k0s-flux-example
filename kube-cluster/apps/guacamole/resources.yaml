apiVersion: v1
kind: Namespace
metadata:
  name: guacamole
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: guacamole
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# guacd — the stateless Guacamole proxy daemon (RDP/VNC/SSH -> Guacamole protocol).
# No DB, no volumes. Only receives from the guacamole webapp (kube-vnet guacd channel).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guacd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guacd
        app.kubernetes.io/instance: guacamole
        # accept ingress from guacamole on the guacd channel (equivalent to a
        # VirtualNetworkBinding); guacamole has the matching egress label. Bare
        # net.<name> = same-namespace vnet (no ns prefix needed).
        kube-vnet/net.guacd: ingress
    spec:
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: guacd
              containerPort: 4822
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: guacamole
spec:
  selector:
    app.kubernetes.io/name: guacd
  ports:
    - name: guacd
      port: 4822
      targetPort: guacd
---
# guacamole — the web app. Postgres (CNPG) + OpenID SSO are configured entirely via
# env; the image bundles both extensions, so no GUACAMOLE_HOME volume / jar needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # Schema loaded + data migrated from MariaDB (one-time, see README), now live.
  # Stateless -> RollingUpdate.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guacamole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guacamole
        app.kubernetes.io/instance: guacamole
        # receive from traefik; reach the CNPG primary; reach guacd.
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.guacd: egress
    spec:
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0
          env:
            - name: TZ
              value: Europe/Berlin
            # guacd (in-namespace)
            - name: GUACD_HOSTNAME
              value: guacd
            - name: GUACD_PORT
              value: "4822"
            # Postgres in the shared CNPG cluster (dedicated guacamole role + db).
            # POSTGRESQL_USERNAME is the current generic-mapping name; POSTGRESQL_USER
            # is the legacy name — set both so it works regardless of image vintage.
            - name: POSTGRESQL_HOSTNAME
              value: postgres-rw.postgres.svc.cluster.local
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              value: guacamole
            - name: POSTGRESQL_USERNAME
              value: guacamole
            - name: POSTGRESQL_USER
              value: guacamole
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guacamole-db
                  key: password
            - name: POSTGRESQL_SSL_MODE
              value: require
            # Auto-create a DB account on first successful SSO login (OIDC provides
            # identity; JDBC stores connections/permissions keyed by the username).
            - name: POSTGRESQL_AUTO_CREATE_ACCOUNTS
              value: "true"
            # OpenID SSO via Authelia (ported from the Swarm guacamole.properties).
            # Public/PKCE client — no client secret. Extension bundled in the image.
            - name: OPENID_AUTHORIZATION_ENDPOINT
              value: https://auth.example.com/api/oidc/authorization?state=Cb3H6XutMY3rBB
            - name: OPENID_JWKS_ENDPOINT
              value: https://auth.example.com/jwks.json
            - name: OPENID_ISSUER
              value: https://auth.example.com
            - name: OPENID_CLIENT_ID
              value: guacamole
            - name: OPENID_REDIRECT_URI
              value: https://guacamole.example.com
            - name: OPENID_SCOPE
              value: openid profile groups email
            - name: OPENID_USERNAME_CLAIM_TYPE
              value: preferred_username
            - name: OPENID_GROUPS_CLAIM_TYPE
              value: groups
            # SSO takes precedence over the built-in DB login form.
            - name: EXTENSION_PRIORITY
              value: openid
            # Trust X-Forwarded-For so Tomcat reports the real client. Without it every request
            # looks like it came from a traefik pod, and the brute-force extension bans that
            # address -- five failed logins lock out everyone.
            #
            # Both hops must be listed or Tomcat stops walking at the first it does not know:
            # 172.18.0.0/16 (traefik pods) and 10.20.2.31/.32/.33 (the swarm edge traefik).
            #
            # THREE /32s, not 10.20.2.0/24 and not Tomcat's 10/8 default: LAN clients arrive from
            # 10.20.2.0/24 themselves, so anything broader treats a real client as a proxy and
            # falls back to the traefik pod -- the exact bug this fixes.
            - name: REMOTE_IP_VALVE_ENABLED
              value: "true"
            - name: REMOTE_IP_VALVE_INTERNAL_PROXIES
              value: '172\.18\.\d{1,3}\.\d{1,3}|10\.1\.2\.3[123]'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          # DB-aware liveness, which is why it is not an httpGet.
          #
          # Guacamole's JDBC pool can wedge with zero usable connections and never recover.
          # In that state GET /, /api/languages and /api/patches all still return 200, so the
          # readiness probe stays green -- it sat healthy for ~15 hours over a white screen.
          # Only POST /api/tokens hangs, and no httpGet probe can POST.
          #
          # Any HTTP response means alive, including 403 and 429 (the brute-force extension
          # will ban 127.0.0.1). Only a timeout (curl exit 28) restarts the pod. If Postgres
          # is genuinely down that restarts every ~3 minutes, which is noisy but the pool does
          # not self-heal.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >-
                  curl -s -o /dev/null -m 8 -X POST
                  -d token=liveness-probe
                  http://127.0.0.1:8080/guacamole/api/tokens
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: guacamole
spec:
  selector:
    app.kubernetes.io/name: guacamole
  ports:
    - name: http
      port: 8080
      targetPort: http
