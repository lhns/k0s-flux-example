apiVersion: v1
kind: Namespace
metadata:
  name: guacamole
---
# guacd — the stateless Guacamole proxy daemon (RDP/VNC/SSH -> Guacamole protocol).
# No DB, no volumes. Only receives from the guacamole webapp (kube-vnet guacd channel).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guacd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guacd
        app.kubernetes.io/instance: guacamole
        # accept ingress from guacamole on the guacd channel (equivalent to a
        # VirtualNetworkBinding); guacamole has the matching egress label. Bare
        # net.<name> = same-namespace vnet (no ns prefix needed).
        kube-vnet/net.guacd: ingress
    spec:
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: guacd
              containerPort: 4822
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: guacamole
spec:
  selector:
    app.kubernetes.io/name: guacd
  ports:
    - name: guacd
      port: 4822
      targetPort: guacd
---
# guacamole — the web app. Postgres (CNPG) + OpenID SSO are configured entirely via
# env; the image bundles both extensions, so no GUACAMOLE_HOME volume / jar needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
  annotations:
    # roll the pod when a referenced Secret changes (rotation): env-var values are
    # never updated in a running pod, and mounted files still need a re-read.
    reloader.stakater.com/auto: "true"
spec:
  # Schema loaded + data migrated from MariaDB (one-time, see README), now live.
  # Stateless -> RollingUpdate.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guacamole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guacamole
        app.kubernetes.io/instance: guacamole
        # receive from traefik; reach the CNPG primary; reach guacd.
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.guacd: egress
    spec:
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0
          env:
            - name: TZ
              value: Europe/Berlin
            # guacd (in-namespace)
            - name: GUACD_HOSTNAME
              value: guacd
            - name: GUACD_PORT
              value: "4822"
            # Postgres in the shared CNPG cluster (dedicated guacamole role + db).
            # POSTGRESQL_USERNAME is the current generic-mapping name; POSTGRESQL_USER
            # is the legacy name — set both so it works regardless of image vintage.
            - name: POSTGRESQL_HOSTNAME
              value: postgres-rw.postgres.svc.cluster.local
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              value: guacamole
            - name: POSTGRESQL_USERNAME
              value: guacamole
            - name: POSTGRESQL_USER
              value: guacamole
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guacamole-db
                  key: password
            - name: POSTGRESQL_SSL_MODE
              value: require
            # Auto-create a DB account on first successful SSO login (OIDC provides
            # identity; JDBC stores connections/permissions keyed by the username).
            - name: POSTGRESQL_AUTO_CREATE_ACCOUNTS
              value: "true"
            # OpenID SSO via Authelia (ported from the Swarm guacamole.properties).
            # Public/PKCE client — no client secret. Extension bundled in the image.
            - name: OPENID_AUTHORIZATION_ENDPOINT
              value: https://auth.example.com/api/oidc/authorization?state=Cb3H6XutMY3rBB
            - name: OPENID_JWKS_ENDPOINT
              value: https://auth.example.com/jwks.json
            - name: OPENID_ISSUER
              value: https://auth.example.com
            - name: OPENID_CLIENT_ID
              value: guacamole
            - name: OPENID_REDIRECT_URI
              value: https://guacamole.example.com
            - name: OPENID_SCOPE
              value: openid profile groups email
            - name: OPENID_USERNAME_CLAIM_TYPE
              value: preferred_username
            - name: OPENID_GROUPS_CLAIM_TYPE
              value: groups
            # SSO takes precedence over the built-in DB login form.
            - name: EXTENSION_PRIORITY
              value: openid
            # Trust X-Forwarded-For, so Tomcat reports the REAL client address.
            #
            # Without this, every request appears to come from whichever traefik POD
            # proxied it, and the bundled brute-force extension bans that address —
            # meaning five failed logins by anyone lock out EVERYONE, and a real
            # attacker is indistinguishable from a legitimate user. Observed: the ban
            # tracker blocking "172.18.1.155", a traefik pod.
            #
            # TWO hops sit in front of guacamole, and both have to be listed or Tomcat
            # stops walking at the first one it does not recognise:
            #   172.18.0.0/16      the traefik pods
            #   10.20.2.31/.32/.33  the docker swarm nodes running the edge traefik
            #
            # The swarm nodes are why an external user used to show up as 10.20.2.33 —
            # Tomcat walked past the pod, hit the swarm node, did not recognise it, and
            # reported that. The cluster traefik now preserves the edge's header
            # (infra/traefik: forwardedHeaders.trustedIPs), so the real client is present
            # in the chain and this list is what lets Tomcat reach it.
            #
            # THREE /32s, not 10.20.2.0/24, and not Tomcat's default (which covers 10/8):
            # LAN clients reach the VIP directly and arrive from 10.20.2.0/24 themselves, so
            # anything broader would classify a real client as a proxy, walk past it, and
            # fall back to the traefik pod — reintroducing the exact bug this fixes.
            - name: REMOTE_IP_VALVE_ENABLED
              value: "true"
            - name: REMOTE_IP_VALVE_INTERNAL_PROXIES
              value: '172\.18\.\d{1,3}\.\d{1,3}|10\.1\.2\.3[123]'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          # A DB-AWARE liveness check, and the reason it is not an httpGet.
          #
          # Guacamole's JDBC pool can wedge with zero usable connections — after a
          # Postgres blip it logged `ping query 'SELECT 1' failed` and never
          # recovered. In that state requests needing the database block FOREVER
          # while everything else keeps answering: GET /, /api/languages and
          # /api/patches all returned 200, so the readiness probe above stayed green
          # and Kubernetes saw a perfectly healthy pod for ~15 hours while the UI was
          # a white screen. Only POST /api/tokens hung.
          #
          # So the probe has to POST, which no httpGet probe can do. Semantics:
          # ANY HTTP response means the request path is alive — 403 (bad token) and
          # 429 (the brute-force extension banned 127.0.0.1, which it will, since
          # these are failed logins) both count as healthy. Only a TIMEOUT, i.e.
          # curl exit 28, means the pool is wedged, and that is what restarts the pod.
          #
          # Trade-off, stated plainly: if Postgres is genuinely down this restarts
          # roughly every 3 minutes until it returns. That is noisy but harmless, and
          # far better than silently serving a white screen for hours. The pool does
          # not self-heal, so a restart is the only remediation available.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >-
                  curl -s -o /dev/null -m 8 -X POST
                  -d token=liveness-probe
                  http://127.0.0.1:8080/guacamole/api/tokens
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: guacamole
spec:
  selector:
    app.kubernetes.io/name: guacamole
  ports:
    - name: http
      port: 8080
      targetPort: http
