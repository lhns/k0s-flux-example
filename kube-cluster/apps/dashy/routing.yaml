---
# dashy.kube.example.com and apps.example.com redirect to the canonical dashy.example.com. Served by the
# default *.example.com wildcard cert (tls: {}); redirectRegex 308s before the
# backend (or Authelia) is reached, so no auth/service middleware is needed here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashy-redirect
  namespace: dashy
spec:
  redirectRegex:
    regex: '^https?://[^/]+/(.*)'
    replacement: "https://dashy.example.com/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashy-redirect
  namespace: dashy
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`dashy.kube.example.com`) || Host(`apps.example.com`)
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: dashy-redirect
  tls: {}
