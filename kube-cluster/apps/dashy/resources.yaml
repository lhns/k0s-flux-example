apiVersion: v1
kind: Namespace
metadata:
  name: dashy
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: dashy
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashy
  namespace: dashy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashy
        app.kubernetes.io/instance: dashy
        # receive traffic from traefik under kube-vnet's ingress isolation
        kube-vnet/net.traefik.traefik: ingress
    spec:
      containers:
        - name: dashy
          # Pinned to a real release tag so Renovate tracks version bumps.
          image: lissy93/dashy:4.6.9
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # conf.yml is managed in git (ConfigMap), read-only. Only this file
            # is overlaid, so dashy's other bundled user-data stays intact.
            - name: config
              mountPath: /app/user-data/conf.yml
              subPath: conf.yml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18 # dashy may rebuild on start; be lenient
      volumes:
        - name: config
          configMap:
            name: dashy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: dashy
  namespace: dashy
spec:
  selector:
    app.kubernetes.io/name: dashy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashy
  namespace: dashy
  annotations:
    # SSO via the external Authelia (dashy also does its own OIDC per conf.yml).
    traefik.ingress.kubernetes.io/router.middlewares: dashy-authelia@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dashy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashy
                port:
                  number: 8080
