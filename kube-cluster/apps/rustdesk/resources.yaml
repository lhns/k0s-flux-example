apiVersion: v1
kind: Namespace
metadata:
  name: rustdesk
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: rustdesk
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# The server keypair (id_ed25519, .pub) and hbbs's db_v2.sqlite3. The keypair is the
# server's identity: a new PVC means a new key and every client must be reconfigured.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustdesk-data
  namespace: rustdesk
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk
  namespace: rustdesk
spec:
  # Single VIP with externalTrafficPolicy: Local and an RWO volume: both follow the pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustdesk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustdesk
        app.kubernetes.io/instance: rustdesk
        # For the websocket ports only; the raw ports arrive via rustdesk-lb, which
        # kube-vnet auto-allows.
        kube-vnet/net.traefik.traefik: ingress
    spec:
      enableServiceLinks: false
      containers:
        # The image is FROM scratch: no shell, so `kubectl exec` cannot read files.
        # Both daemons log the public key as `Key: ...`.
        - name: hbbs
          image: rustdesk/rustdesk-server:1.1.16
          # -r is what hbbs hands clients as the relay; -k _ refuses clients without the key.
          command: [hbbs, -r, "rustdesk.example.com:21117", -k, _]
          workingDir: /root
          ports:
            - {name: nat-test, containerPort: 21115, protocol: TCP}
            - {name: rendezvous-tcp, containerPort: 21116, protocol: TCP}
            - {name: rendezvous-udp, containerPort: 21116, protocol: UDP}
            - {name: ws-id, containerPort: 21118, protocol: TCP}
          volumeMounts:
            - {name: data, mountPath: /root}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 21116}
            periodSeconds: 10
            timeoutSeconds: 3
        - name: hbbr
          image: rustdesk/rustdesk-server:1.1.16
          # Without -k hbbr relays for anyone; hbbs enforces the key by default, hbbr not.
          command: [hbbr, -k, _]
          workingDir: /root
          ports:
            - {name: relay, containerPort: 21117, protocol: TCP}
            - {name: ws-relay, containerPort: 21119, protocol: TCP}
          volumeMounts:
            - {name: data, mountPath: /root}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 21117}
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustdesk-data
---
# Raw ports on a dedicated VIP: Traefik carries no UDP. externalTrafficPolicy: Local
# because hbbs hole-punches with the client's real address. 21118/21119 are deliberately
# absent: hbbs trusts X-Real-IP on them, so only Traefik may reach them.
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-lb
  namespace: rustdesk
  annotations:
    metallb.io/loadBalancerIPs: 10.20.2.82
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: rustdesk
  ports:
    - {name: nat-test, port: 21115, targetPort: 21115, protocol: TCP}
    - {name: rendezvous-tcp, port: 21116, targetPort: 21116, protocol: TCP}
    - {name: rendezvous-udp, port: 21116, targetPort: 21116, protocol: UDP}
    - {name: relay, port: 21117, targetPort: 21117, protocol: TCP}
---
# Traefik's websocket backends (routing.yaml).
apiVersion: v1
kind: Service
metadata:
  name: rustdesk
  namespace: rustdesk
spec:
  selector:
    app.kubernetes.io/name: rustdesk
  ports:
    - {name: ws-id, port: 21118, targetPort: 21118}
    - {name: ws-relay, port: 21119, targetPort: 21119}
