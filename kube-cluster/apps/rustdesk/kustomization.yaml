apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # MetalLB for the rustdesk-lb VIP (10.20.2.82); ceph-rbd for the key/DB PVC. Read by
    # the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-metallb,infra-ceph-csi-rbd
resources:
- resources.yaml
- routing.yaml
