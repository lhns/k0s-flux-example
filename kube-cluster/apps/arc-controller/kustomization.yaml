apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The scrape bindings need the kube-vnet CRDs.
    # Read by the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-kube-vnet
resources:
- vnet.yaml
- release.yaml
- grafana.yaml
# Dashboard JSON: stable names with the operator's label (its informer only sees labelled
# ConfigMaps, so a JSON change syncs at once instead of at the next resync), no substitution.
configMapGenerator:
- name: app-arc-controller-dashboards
  namespace: grafana
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/managed-by: grafana-operator
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
  files:
  - dashboards/github-runners.json
