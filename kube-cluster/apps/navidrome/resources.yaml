apiVersion: v1
kind: Namespace
metadata:
  name: navidrome
---
# Music library on the "archive" cephfs (same Ceph cluster => clusterID
# fastappdata, different fsName). Read-only — navidrome only ever reads it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music
spec:
  accessModes: [ReadOnlyMany]
  capacity:
    storage: 1Gi # ignored for static cephfs, but required by the API
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: navidrome-music
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: archive
      staticVolume: "true"
      rootPath: /media/music/library
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-music
  namespace: navidrome
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: navidrome-music
  resources:
    requests:
      storage: 1Gi
---
# Navidrome's own data (SQLite DB + artwork/cache). Block (ceph-rbd, RWO) because
# it's a single-writer SQLite database — file-share semantics would risk locking
# issues. Populated once from the old Swarm volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: navidrome
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  # Single writer on the SQLite DB (RWO block volume) — never run two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
        app.kubernetes.io/instance: navidrome
        # receive traffic from traefik under kube-vnet's ingress isolation
        kube-vnet/net.traefik.traefik: ingress
    spec:
      # Swarm ran as root (owner of the volumes); match it so the RBD data volume
      # and the read-only music share are both accessible.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          env:
            # Auth is handled entirely by the external Authelia (forwardAuth):
            # navidrome trusts the Remote-User header it injects.
            - name: ND_EXTAUTH_USERHEADER
              value: Remote-User
            # Traefik's source IP is dynamic, so all sources are trusted for the
            # header. Safe only because nothing else in-cluster can reach :4533
            # except traefik (kube-vnet ingress isolation).
            - name: ND_EXTAUTH_TRUSTEDSOURCES
              value: 0.0.0.0/0
            # Passwords are managed by Authelia, not navidrome.
            - name: ND_ENABLEUSEREDITING
              value: "false"
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 4533
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: navidrome
spec:
  selector:
    app.kubernetes.io/name: navidrome
  ports:
    - name: http
      port: 4533
      targetPort: http
# Routing (IngressRoutes + subsonic middlewares) is in routing.yaml — the subsonic
# router needs a query match that native Ingress can't express.
