---
# Miniflux's login role in the shared CNPG cluster (mealie/homebox/bitwarden
# precedent). Password from secret/miniflux-db (postgres ns). retain: never drop.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: miniflux
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: miniflux
  ensure: present
  login: true
  passwordSecret:
    name: miniflux-db
  databaseRoleReclaimPolicy: retain
---
# The miniflux database, owned by that role. A pg_dump of the old Swarm Postgres
# (10.20.2.10:5436) is restored into it once (same major, PG 18 -> PG 18).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: miniflux
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: miniflux
  owner: miniflux
  databaseReclaimPolicy: retain
