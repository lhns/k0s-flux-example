    ## Authorization Policies which can be utilized by clients. The 'policy_name' is an arbitrary value that you pick
    ## which is utilized as the value for the 'authorization_policy' on the client.
    authorization_policies:
      # spliit-cloud. This policy is the ONLY thing restricting who gets an lhns identity in
      # spliit: the app is no longer behind the forward-auth middleware, so `access_control` does
      # not see spliit.example.com at all. Anyone may reach the site; only these groups can complete
      # the SSO button. Everyone else needs an in-app invitation.
      spliit:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - 'group:admin'
              - 'group:spliit'
      mealie:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - 'group:admin'
              - 'group:mealie'
              - 'group:mealie_admin'
