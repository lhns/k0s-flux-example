# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: authelia-secrets
    namespace: authelia
type: Opaque
data:
    JWT_SECRET: CHANGEME-JWT_SECRET
    SESSION_SECRET: CHANGEME-SESSION_SECRET
    STORAGE_ENCRYPTION_KEY: CHANGEME-STORAGE_ENCRYPTION_KEY
    LDAP_PASSWORD: CHANGEME-LDAP_PASSWORD
    oidc-hmac: CHANGEME-oidc-hmac
    oidc-jwks-key: CHANGEME-oidc-jwks-key
    oidc-jwks-crt: CHANGEME-oidc-jwks-crt
