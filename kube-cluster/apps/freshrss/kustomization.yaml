apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # CNPG (db) + Reflector (db secret) + cephfs (the data PVC) + oci-composer (builds the
    # extensions in artifacts/). Read by the root generator; inert to kustomize. No
    # `namespace:` transformer here — database.yaml and db-role-secret.yaml live in the
    # postgres ns.
    flux-component-generator/dependsOn: infra-postgres,infra-reflector,infra-ceph-csi-cephfs,infra-oci-composer
resources:
- resources.yaml
- routing.yaml
- database.yaml
- db-role-secret.yaml
- secret.yaml
