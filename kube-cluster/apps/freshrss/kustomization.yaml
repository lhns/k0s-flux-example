apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # CNPG (db) + Reflector (db secret) + cephfs (the data PVC) + oci-composer (builds and
    # serves the extensions bundle). Read by the root generator; inert to kustomize. No
    # `namespace:` transformer here — database.yaml and db-role-secret.yaml live in the
    # postgres ns.
    dependsOn: infra-postgres,infra-reflector,infra-ceph-csi-cephfs,infra-oci-composer
resources:
- resources.yaml
- routing.yaml
- database.yaml
- db-role-secret.yaml
- secret.yaml
# One file per extension: its pinned Flux source and the ImageComposition that turns it into an
# artifact. Adding an extension is copying one of these; removing one is deleting it. The root
# generator finds the compositions BY KIND, so the filenames are free and the count is unbounded.
- extension-autottl.yaml
- extension-af-readability.yaml
- extension-image-proxy.yaml
- extension-llm-classification.yaml
