# xExtension-Af_Readability. Same shape as extension-autottl.yaml.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: freshrss-ext-af-readability
  namespace: freshrss
spec:
  interval: 12h
  url: https://github.com/Niehztog/freshrss-af-readability
  ref:
    # No tags upstream. `vendor/` is committed, so the checkout is complete as is.
    commit: 7e0dc8fd82d5f13863e5121cbe0f7b1f2d194fd9
---
apiVersion: oci.lhns.de/v1alpha1
kind: ImageComposition
metadata:
  name: freshrss-ext-af-readability
  namespace: freshrss
spec:
  interval: 1h
  layers:
    - name: af-readability
      sourceRef:
        kind: GitRepository
        name: freshrss-ext-af-readability
        revision: sha1:7e0dc8fd82d5f13863e5121cbe0f7b1f2d194fd9
      to: /
      owner: {uid: 33, gid: 33}
  push:
    history: 10
    writeRefTo:
      namespace: gen-app-freshrss
      keys:
        ref: FRESHRSS_EXT_AF_READABILITY_REF
