# xExtension-LlmClassification. Same shape as extension-image-proxy.yaml.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: freshrss-ext-llm-classification
  namespace: freshrss
spec:
  interval: 12h
  url: https://github.com/FreshRSS/Extensions
  ref:
    commit: c8120e96dea7ec0e74e74455758c601ca0500463
---
apiVersion: oci.lhns.de/v1alpha1
kind: ImageComposition
metadata:
  name: freshrss-ext-llm-classification
  namespace: freshrss
spec:
  interval: 1h
  layers:
    - name: llm-classification
      sourceRef:
        kind: GitRepository
        name: freshrss-ext-llm-classification
        revision: sha1:c8120e96dea7ec0e74e74455758c601ca0500463
        subpath: xExtension-LlmClassification
      to: /
      owner: {uid: 33, gid: 33}
  push:
    history: 10
    writeRefTo:
      namespace: gen-app-freshrss
      keys:
        ref: FRESHRSS_EXT_LLM_CLASSIFICATION_REF
