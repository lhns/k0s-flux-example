# Under pod-level kube-vnet isolation, intra-namespace ingress is denied by
# default, so the one internal edge (outline -> redis) gets a bare same-namespace
# VirtualNetwork. Same-ns membership is implicit (no own-ns self-entry). Postgres
# needs no per-app vnet — the infra `postgres` VirtualNetwork is allowedNamespaces.all;
# the pod's `kube-vnet/net.postgres.postgres: egress` label suffices. Traefik reaches
# outline via `net.traefik.traefik`.
---
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: outline-redis
  namespace: outline
spec:
  description: "outline -> Redis (:6379), intra-namespace."
