---
# Outline's login role in the shared CNPG cluster (miniflux/mealie precedent).
# Password from secret/outline-db (postgres ns). retain: never auto-drop.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: outline
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: outline
  ensure: present
  login: true
  passwordSecret:
    name: outline-db
  databaseRoleReclaimPolicy: retain
---
# The outline database, owned by that role. See README.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: outline
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: outline
  owner: outline
  databaseReclaimPolicy: retain
