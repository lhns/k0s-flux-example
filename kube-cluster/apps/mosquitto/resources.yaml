apiVersion: v1
kind: Namespace
metadata:
  name: mosquitto
---
# Persistence file /var/lib/mosquitto/mosquitto.db (retained messages +
# subscriptions), copied once from the old Swarm volume. Single broker -> RWO.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: mosquitto
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
  annotations:
    # roll the pod when a referenced Secret changes (rotation): env-var values are
    # never updated in a running pod, and mounted files still need a re-read.
    reloader.stakater.com/auto: "true"
spec:
  # mosquitto.db copied from the old Swarm volume (see README), now live. RWO data
  # volume -> Recreate (single broker).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/instance: mosquitto
        # Both listeners are reached FROM traefik: WS :9001 (IngressRoute) and raw
        # MQTT :1883 (IngressRouteTCP on traefik's mqtt entrypoint). One vnet label
        # covers both.
        kube-vnet/net.traefik.traefik: ingress
        # In-cluster MQTT clients (e.g. mqtt-monitoring) reach :1883 via the `mosquitto`
        # vnet (vnet.yaml); they carry net.mosquitto.mosquitto: egress.
        kube-vnet/net.mosquitto: ingress
        # LDAP auth now against the in-cluster lldap (join its vnet as egress).
        kube-vnet/net.lldap.lldap: egress
        # OTLP traces to the in-cluster gateway. Was the Swarm collector at
        # 10.20.2.10:4317, which was external egress and needed no label; a ClusterIP
        # does. Drop this and traces stop, silently.
        kube-vnet/net.opentelemetry-gateway.otel-gateway: egress
    spec:
      containers:
        - name: mosquitto
          image: ghcr.io/lhns/mosquitto-go-auth:3.5.0
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-gateway.opentelemetry-gateway.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: mosquitto
          ports:
            - name: mqtt
              containerPort: 1883
            - name: ws
              containerPort: 9001
          volumeMounts:
            - name: config
              mountPath: /etc/mosquitto
              readOnly: true
            - name: data
              mountPath: /var/lib/mosquitto
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
            # 3s, not the 1s default. A 1s budget makes this flap under node load, and a flap
            # here empties the Service's endpoints — which takes every MQTT client down with it.
            timeoutSeconds: 3
          # Liveness, added after a real outage: the broker stopped answering on 1883 while the
          # process stayed alive, so the container remained Running and READINESS alone just
          # marked it 0/1 forever. Nothing restarted it. Every MQTT client — zigbee2mqtt, Home
          # Assistant, the inverter, mqtt-monitoring — was down for ~13 minutes until a human
          # noticed and deleted the pod.
          #
          # Readiness answers "should traffic go here"; only liveness answers "is this worth
          # keeping". Without it a wedged broker is invisible to Kubernetes.
          #
          # Deliberately slacker than readiness: 30s period and 3 failures, so recovery takes
          # ~90s but a transient stall under load cannot cause a restart loop. mosquitto is
          # single-instance, so an unnecessary restart is itself an outage.
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # mosquitto.conf (with the LDAP bind password) — SOPS-encrypted.
        - name: config
          secret:
            secretName: mosquitto-config
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
---
# In-cluster access + the WS target Traefik routes to (:9001).
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: ws
      port: 9001
      targetPort: ws
