# Persistence file /var/lib/mosquitto/mosquitto.db (retained messages +
# subscriptions), copied once from the old Swarm volume. Single broker -> RWO.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: mosquitto
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # mosquitto.db copied from the old Swarm volume (see README), now live. RWO data
  # volume -> Recreate (single broker).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/instance: mosquitto
        # Both listeners are reached FROM traefik: WS :9001 (IngressRoute) and raw
        # MQTT :1883 (IngressRouteTCP on traefik's mqtt entrypoint). One vnet label
        # covers both.
        kube-vnet/net.traefik.traefik: ingress
        # In-cluster MQTT clients (e.g. mqtt-monitoring) reach :1883 via the `mosquitto`
        # vnet (vnet.yaml); they carry net.mosquitto.mosquitto: egress.
        kube-vnet/net.mosquitto: ingress
        # LDAP auth now against the in-cluster lldap (join its vnet as egress).
        kube-vnet/net.lldap.lldap: egress
        # OTLP traces to the in-cluster gateway. Was the Swarm collector at
        # 10.20.176.187:4317, which was external egress and needed no label; a ClusterIP
        # does. Drop this and traces stop, silently.
        kube-vnet/net.opentelemetry-gateway.otel-gateway: egress
    spec:
      containers:
        - name: mosquitto
          image: ghcr.io/lhns/mosquitto-go-auth:3.5.0
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-gateway.opentelemetry-gateway.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: mosquitto
          ports:
            - name: mqtt
              containerPort: 1883
            - name: ws
              containerPort: 9001
          volumeMounts:
            - name: config
              mountPath: /etc/mosquitto
              readOnly: true
            - name: data
              mountPath: /var/lib/mosquitto
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
            # 3s, not the 1s default. A 1s budget makes this flap under node load, and a flap
            # here empties the Service's endpoints — which takes every MQTT client down with it.
            timeoutSeconds: 3
          # Liveness, not just readiness: a broker that stops answering on 1883 while the
          # process lives would sit 0/1 forever with nothing restarting it.
          # Slacker than readiness (30s x 3) so a load stall cannot cause a restart loop;
          # mosquitto is single-instance, so an unnecessary restart is itself an outage.
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits: {memory: 128Mi}
      volumes:
        # mosquitto.conf (LDAP bind password substituted in; as-secret config).
        - name: config
          secret:
            secretName: mosquitto-config
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
---
# In-cluster access + the WS target Traefik routes to (:9001).
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: ws
      port: 9001
      targetPort: ws
