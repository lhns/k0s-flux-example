apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The RBD data PVC needs the ceph-rbd StorageClass. Read by the root generator;
    # inert to kustomize. (kube-vnet's external-allow policy for the LoadBalancer is
    # emitted automatically; the authelia/traefik reflection is eventually consistent.)
    dependsOn: infra-ceph-csi-rbd
resources:
- resources.yaml
- routing.yaml
- vnet.yaml
# mosquitto.conf as a real file. The generator patches this ConfigMap into a Secret
# (see templates/_secret-from-files.tpl), which is what keeps ${MOSQUITTO_LDAP_BIND_PASSWORD}
# visible to Flux's substitution: a secretGenerator would have base64'd it out of reach.
configMapGenerator:
- name: mosquitto-config
  namespace: mosquitto
  files:
  - mosquitto.conf
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
