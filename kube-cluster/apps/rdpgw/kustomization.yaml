apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Reloader rolls the pod when the key Secret changes. Read by the root generator; inert to
    # kustomize.
    flux-component-generator/dependsOn: infra-reloader
resources:
- resources.yaml
- routing.yaml
- networkpolicy.yaml
- secret.yaml
- secret-paa.yaml
