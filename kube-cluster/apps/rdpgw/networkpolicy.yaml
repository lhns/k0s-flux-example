# Egress containment, additive to kube-vnet (ADR 0031): DNS, the four allow-listed VMs,
# Authelia and lldap, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rdpgw-egress
  namespace: rdpgw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rdpgw
  policyTypes: [Egress]
  egress:
    # DNS by pod selector: a ClusterIP is DNAT'd before the policy sees it.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.19.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # RDP to the VMs. Keep in sync with the VM entries in hostAliases (resources.yaml).
    - to:
        - ipBlock:
            cidr: 10.20.150.99/32
        - ipBlock:
            cidr: 10.20.150.187/32
        - ipBlock:
            cidr: 10.20.150.135/32
        - ipBlock:
            cidr: 10.20.150.5/32
      ports:
        - protocol: TCP
          port: 3389

    # auth.example.com is pinned to Traefik's VIP by hostAliases; allow both ends of the DNAT.
    - to:
        - ipBlock:
            cidr: 10.20.176.210/32
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443

    # LDAP binds for Basic auth. By pod selector, like DNS: the ClusterIP is DNAT'd first.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lldap
          podSelector:
            matchLabels:
              app.kubernetes.io/name: lldap
      ports:
        - protocol: TCP
          port: 3890
