apiVersion: apps/v1
kind: Deployment
metadata:
  name: gears
  namespace: gears
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gears
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gears
        app.kubernetes.io/instance: gears
        kube-vnet/net.traefik.traefik: ingress
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: gears
          image: ghcr.io/lhns/compoundplanetarygearcalculator:1.0.5@sha256:ff6f04f21c782ba60ca257ecedb8d51b1d49b679938b605c550d06b37568b01d
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gears
  namespace: gears
spec:
  selector:
    app.kubernetes.io/name: gears
  ports:
    - name: http
      port: 80
      targetPort: http
