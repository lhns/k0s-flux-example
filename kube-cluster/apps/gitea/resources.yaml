apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
# ===========================================================================
# The repositories — 27G, MOUNTED IN PLACE from the existing CephFS `appdata`
# fs, not copied (sftpgo/syncthing/jellyfin pattern). Copying 27G onto a pool
# that is 91% full and mid-`backfill_toofull` is not an option, and the whole
# point of §5.2 in docs/migrating-swarm-to-kubernetes.md is that it never has
# to be.
#
# Note this is genuinely SHARED with the Swarm stack byte-for-byte: the two
# must never run at once. Swarm's gitea is already stopped (its Traefik router
# is gone — the host 404s), so this is a cold migration rather than a cutover.
# ===========================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitea-git
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: gitea-git
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /docker/gitea/git
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-git
  namespace: gitea
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: gitea-git
  resources:
    requests:
      storage: 1Gi
---
# /data/gitea — app.ini, avatars, attachments, indexers. 47M, so this one is
# COPIED into a fresh volume rather than mounted in place, which is a
# deliberate departure from the rule above.
#
# The reason is Gitea's entrypoint: it runs `environment-to-ini`, which
# REWRITES app.ini on disk at every start from the GITEA__* env below. Mounting
# the Swarm directory would therefore repoint the Swarm stack's own config at
# CNPG — quietly destroying the thing we keep as a fallback. At 47M, copying is
# free; at 27G (above) it would not have been.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  annotations:
    # roll the pod when a referenced Secret changes (rotation): env-var values are
    # never updated in a running pod, and mounted files still need a re-read.
    reloader.stakater.com/auto: "true"
spec:
  # Was 0 while the database was restored — Gitea runs an xorm schema sync on
  # first boot and would have created an empty schema that collided with the
  # dump (outline/nextcloud precedent). The restore has landed (112 tables, 175
  # repositories, login_source present), so it serves now.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: gitea
        # receive from traefik; reach the CNPG primary and the mail relay. Repo
        # mirroring and webhooks are external egress (unrestricted under the
        # ingress-only baseline).
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.msmtpd.msmtpd: egress
    spec:
      securityContext:
        # The root image boots s6 as root and THEN drops to `git` via
        # USER_UID/USER_GID below — so the pod is root and the server is 1000.
        # Not the -rootless image: every repo's git hooks embed the absolute
        # path /data/gitea/conf/app.ini, which rootless moves.
        #
        # No fsGroup — it would recursively chown the 27G repo tree on the
        # degraded HDD tier at every start (docs §5.2).
        runAsUser: 0
        runAsGroup: 0
      # Gitea's whole config surface is GITEA_*/USER_* env; service links would
      # inject GITEA_PORT=tcp://... and friends into the same namespace.
      enableServiceLinks: false
      containers:
        - name: gitea
          # Pinned, never `:latest` (which is what the Swarm compose effectively
          # ran). The source DB is at migration 331, so this is a small forward
          # upgrade — accepted deliberately, and irreversible: Gitea migrates the
          # schema on first boot. The Swarm database is never written to, so the
          # fallback survives regardless.
          image: gitea/gitea:1.27.2
          env:
            - name: TZ
              value: Europe/Berlin
            # Pin the server process to the on-disk owner of /data (verified
            # 1000:1000 by reading the volume through sftpgo).
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"

            # --- database: the shared CNPG cluster --------------------------
            # Only HOST/PASSWD really change; NAME/USER/TYPE are stated anyway so
            # the intent is readable and a drifted app.ini cannot surprise us.
            - name: GITEA__database__DB_TYPE
              value: postgres
            - name: GITEA__database__HOST
              value: postgres-rw.postgres.svc.cluster.local:5432
            - name: GITEA__database__NAME
              value: gitea
            - name: GITEA__database__USER
              value: gitea
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-db
                  key: password
            # CNPG's CA is self-signed and the traffic never leaves the cluster.
            - name: GITEA__database__SSL_MODE
              value: disable

            # --- mail: the shared in-cluster relay, plaintext, no auth -------
            # Replaces the per-stack mwader/postfix-relay. The old app.ini points
            # at the compose service name `smtp`, which resolves to nothing here.
            - name: GITEA__mailer__ENABLED
              value: "true"
            - name: GITEA__mailer__PROTOCOL
              value: smtp
            - name: GITEA__mailer__SMTP_ADDR
              value: msmtpd.msmtpd.svc.cluster.local
            - name: GITEA__mailer__SMTP_PORT
              value: "2500"
            - name: GITEA__mailer__USER
              value: ""
            - name: GITEA__mailer__PASSWD
              value: ""
            # A PLUS-ADDRESS ON THE RELAY'S GMAIL ACCOUNT, not gitea@example.com.
            # See apps/msmtpd/README.md — Gmail rewrites any From it does not
            # own, so a vanity domain would silently lose the attribution.
            #
            # Declared here rather than left to the migrated app.ini, which
            # carried `gitea@example.net`: a retired domain, and invisible in git
            # because nothing in this file mentioned FROM at all.
            - name: GITEA__mailer__FROM
              value: Gitea <admin+gitea@example.com>

            # --- SSH stays off ----------------------------------------------
            # Already `DISABLE_SSH = true` on Swarm, so nothing regresses and no
            # remotes break. Asserted here so it cannot drift back on, since
            # there is no Service, no VIP and no port for it to land on.
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            - name: GITEA__server__START_SSH_SERVER
              value: "false"

            # --- HTTP --------------------------------------------------------
            - name: GITEA__server__PROTOCOL
              value: http
            - name: GITEA__server__HTTP_ADDR
              value: 0.0.0.0
            - name: GITEA__server__HTTP_PORT
              value: "3000"

            # Logs to stdout rather than onto the near-full CephFS.
            - name: GITEA__log__MODE
              value: console
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data/gitea
            - name: git
              mountPath: /data/git
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            # ~10 minutes. s6 chowns /data on every start; over 27G of repos on
            # a HEALTH_ERR HDD tier that is slow, and the pod must not be pulled
            # out of the Service while it works.
            failureThreshold: 40
          # No liveness probe on purpose: a CephFS stall would restart the pod
          # mid-chown and never converge (docs §5.2).
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: git
          persistentVolumeClaim:
            claimName: gitea-git
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
