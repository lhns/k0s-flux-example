apiVersion: v1
kind: Namespace
metadata:
  name: bitwarden
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: bitwarden
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# Vaultwarden's /data (attachments, sends, icon cache, config.json, and rsa_key —
# the JWT signing key), copied once from the old Swarm volume
# fastappdata:/docker/bitwarden (excluding its nested db/ Postgres dir). CephFS RWX so
# the start-first rollout can briefly run old+new pods against the same data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitwarden-data
  namespace: bitwarden
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden
  namespace: bitwarden
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # DB restored + /data copied (see README), now live.
  replicas: 1
  # start-first (matches the Swarm order:start-first): the new pod comes up and passes
  # readiness before the old one is torn down — zero-downtime updates. RWX CephFS data
  # volume lets both mount /data during the brief overlap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bitwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitwarden
        app.kubernetes.io/instance: bitwarden
        # receive from traefik; reach the CNPG primary. OIDC (auth.example.com), the push
        # relay (push.bitwarden.com), and icon fetches are external egress
        # (unrestricted under the ingress-only baseline).
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
    spec:
      containers:
        - name: bitwarden
          image: ghcr.io/dani-garcia/vaultwarden:1.37.2
          env:
            - name: TZ
              value: Europe/Berlin
            # Canonical host — drives push/WebAuthn origin and generated links.
            - name: DOMAIN
              value: https://bitwarden.example.com
            # DB in the shared CNPG cluster (dedicated vaultwarden role + db). The
            # password (reflected CNPG role secret) is interpolated into DATABASE_URL
            # via $(VAR); sslmode=disable (in-cluster, CNPG CA is self-signed).
            - name: VW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db
                  key: password
            - name: DATABASE_URL
              value: postgresql://vaultwarden:$(VW_DB_PASSWORD)@postgres-rw.postgres.svc.cluster.local:5432/vaultwarden?sslmode=disable
            # Bitwarden push notifications (mobile) via the official relay.
            - name: PUSH_ENABLED
              value: "true"
            - name: PUSH_INSTALLATION_ID
              value: 4a62d3ab-652a-4ab9-a22f-b2d40000b2d6
            - name: PUSH_INSTALLATION_KEY
              valueFrom:
                secretKeyRef:
                  name: bitwarden-secrets
                  key: push-installation-key
            - name: PUSH_RELAY_BASE_URI
              value: https://push.bitwarden.com
            # OIDC SSO via Authelia (confidential client "vaultwarden", already
            # registered in the Authelia config). SSO_ONLY=false keeps the local login
            # form available alongside "Log in with SSO".
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false"
            - name: SSO_AUTHORITY
              value: https://auth.example.com
            - name: SSO_SCOPES
              value: profile email
            - name: SSO_PKCE
              value: "true"
            - name: SSO_CLIENT_ID
              value: vaultwarden
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bitwarden-secrets
                  key: sso-client-secret
            # ADMIN_TOKEN is only needed to bootstrap the /admin panel; normally left
            # unset — /admin is protected by the reflected Authelia middleware (see
            # routing.yaml). Uncomment + set (an argon2/plaintext token) if you ever
            # need the panel without SSO in front.
            #- name: ADMIN_TOKEN
            #  value: ""
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitwarden-data
---
apiVersion: v1
kind: Service
metadata:
  name: bitwarden
  namespace: bitwarden
spec:
  selector:
    app.kubernetes.io/name: bitwarden
  ports:
    - name: http
      port: 80
      targetPort: http
