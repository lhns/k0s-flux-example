apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Needs the CNPG cluster + Database/DatabaseRole CRDs (infra-postgres) and
    # Reflector (infra-reflector) to mirror the db secret into this namespace, and
    # cert-manager (infra-cert-manager) for the jellyfin-sqlite host certs.
    # Read by the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-postgres,infra-reflector,infra-cert-manager
resources:
- resources.yaml
- sqlite.yaml
- routing.yaml
- vnet.yaml
- database.yaml
- db-role-secret.yaml
- ssh-ffmpeg-key-secret.yaml
- grafana.yaml
- probe
- secret-jellyfin-probe.yaml
configMapGenerator:
- name: jellyfin-ffmpeg-wrapper
  namespace: jellyfin
  files:
  # One script, three names. The wrapper branches on $(basename $0), so ffprobe must be a real
  # entry rather than the symlink the old initContainer created — a ConfigMap volume cannot hold
  # symlinks, and mounting it read-only means nothing can create one at runtime either.
  - ffmpeg=ffmpeg-wrapper
  - ffprobe=ffmpeg-wrapper
  # Runs the ssh out of the image volume. Replaces the apt-get install that used to happen on
  # every pod start.
  - ssh=ssh-launcher
# Web-client config (was fastdata .../config/web/config.json). Small + static,
# so materialized as a ConfigMap (declarative in git) instead of copied.
- name: jellyfin-web-config
  namespace: jellyfin
  files:
  - config.json=jellyfin-web-config.json
# Dashboard JSON: stable name with the operator's label, no substitution (ADR 0060).
- name: app-jellyfin-dashboards
  namespace: grafana
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/managed-by: grafana-operator
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
  files:
  - dashboards/jellyfin-playback.json
