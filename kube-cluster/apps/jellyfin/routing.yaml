---
# Ports the Swarm "jellyfin-pg_redirect_home" middleware: bare /web -> /web/index.html.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-redirect-home
  namespace: jellyfin
spec:
  redirectRegex:
    regex: "^(https?://[^/]+)/web$"
    replacement: "${1}/web/index.html"
---
# Public — Jellyfin does its own login (no Authelia, matching Swarm). Canonical host
# is jellyfin-pg.example.com (the original Swarm domain). TLS via the default *.example.com
# wildcard (Traefik TLSStore), so tls: {} needs no secret.
# /metrics is unauthenticated: every route to a Jellyfin backend excludes it, case-insensitively,
# because Jellyfin's routing ignores case and Traefik's PathPrefix does not.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`jellyfin-pg.example.com`) && !PathRegexp(`(?i)^/metrics`)
      services:
        - name: jellyfin
          port: 8096
      middlewares:
        - name: jellyfin-redirect-home
  tls: {}
---
# jellyfin.kube.example.com redirects to the canonical jellyfin-pg.example.com (default
# *.kube.example.com wildcard cert; the middleware 308-redirects before the backend).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-kube-redirect
  namespace: jellyfin
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.*)"
    replacement: "https://jellyfin-pg.example.com/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-kube-redirect
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`jellyfin.kube.example.com`)
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: jellyfin-kube-redirect
  tls: {}
---
# jellyfin-sqlite (sqlite.yaml). Public with Jellyfin's own login and Authelia OIDC, as on Swarm.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-sqlite
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`jellyfin.example.com`) && !PathRegexp(`(?i)^/metrics`)
      services:
        - name: jellyfin-sqlite
          port: 8096
      middlewares:
        - name: jellyfin-redirect-home
  tls: {}
---
# Two labels deep, so not covered by the *.example.com wildcard. jellyfin.local.example.com is the LAN
# name and needs its DNS record on 10.20.176.210.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-sqlite-extra
  namespace: jellyfin
spec:
  secretName: jellyfin-sqlite-extra
  issuerRef:
    name: letsencrypt-ionos-prod
    kind: ClusterIssuer
  dnsNames:
    - jellyfin.local.example.com
    - jellyfin.mirror.example.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-sqlite-extra
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: (Host(`jellyfin.local.example.com`) || Host(`jellyfin.mirror.example.com`)) && !PathRegexp(`(?i)^/metrics`)
      services:
        - name: jellyfin-sqlite
          port: 8096
      middlewares:
        - name: jellyfin-redirect-home
  tls:
    secretName: jellyfin-sqlite-extra
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-example-net
  namespace: jellyfin
spec:
  secretName: jellyfin-example-net
  issuerRef:
    name: letsencrypt-ionos-prod
    kind: ClusterIssuer
  dnsNames:
    - jellyfin.example.net
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-example-net-redirect
  namespace: jellyfin
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.*)"
    replacement: "https://jellyfin.example.com/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-example-net
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`jellyfin.example.net`)
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: jellyfin-example-net-redirect
  tls:
    secretName: jellyfin-example-net
