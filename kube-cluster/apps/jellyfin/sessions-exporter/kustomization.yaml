apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- resources.yaml
# The exporter is a script on the Python image (README.md, "Sessions exporter"). Hashed name: an
# edit rolls the Deployment.
configMapGenerator:
- name: jellyfin-sessions-exporter
  namespace: jellyfin
  files:
  - jellyfin_sessions.py
