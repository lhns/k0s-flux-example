                  mountPath: /opt/jellyfin-probe
                  readOnly: true
                - name: password
                  mountPath: /etc/jellyfin-probe
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: jellyfin-probe
            - name: password
              secret:
                secretName: jellyfin-probe
