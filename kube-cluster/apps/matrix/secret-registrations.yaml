# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# Every appservice registration Synapse loads, in one place and under version
# control. Previously these were hand-placed files under /data/registration on the
# matrix-synapse-data CephFS volume -- invisible to this repo, and reproducible only
# by remembering to copy them.
#
# Mounted read-only at /registrations; the list that selects them is
# synapse-appservices.yaml, a later --config-path whose app_service_config_files
# REPLACES the one in homeserver.yaml (synapse deep-merges its config files
# last-value-wins per top-level key). That replacement is whole-key, not
# element-wise, which is exactly why all of them live here: a partial list would
# silently unregister the bridges it omits.
#
# homeserver.yaml still contains its original three-entry list. It is dead config
# and adding a bridge there now does nothing -- add it here and in
# synapse-appservices.yaml instead.
#
# The old files under /data/registration are deliberately left in place: dropping
# the --config-path is the rollback.
apiVersion: v1
kind: Secret
metadata:
    name: synapse-appservice-registrations
    namespace: matrix
type: Opaque
stringData:
    telegram.yaml: CHANGEME-telegram.yaml
    whatsapp.yaml: CHANGEME-whatsapp.yaml
    discord.yaml: CHANGEME-discord.yaml
    signal.yaml: CHANGEME-signal.yaml
    instagram.yaml: CHANGEME-instagram.yaml
