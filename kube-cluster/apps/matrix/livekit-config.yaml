# LiveKit SFU config (Element Call RTC backend). The key/secret are reused verbatim
# from the Swarm compose so existing Element Call sessions and the lk-jwt token signer
# stay consistent. Differs from the Swarm copy in one place: use_external_ip is true so
# ICE advertises the reachable public address behind the MetalLB VIP (10.20.2.19).
#
# `keys` is the only credential here; it and the two env keys in kustomization.yaml now
# come from the SAME pair of variables, so the SFU and everything that signs a token for
# it cannot drift apart.
port: 7880
bind_addresses:
    - "0.0.0.0"
rtc:
    tcp_port: 7881
    port_range_start: 50100
    port_range_end: 50120
    use_external_ip: true
room:
    auto_create: false
turn:
    enabled: false
keys:
    "${LIVEKIT_KEY}": "${LIVEKIT_SECRET}"
