# botocore's shared config file, mounted for synapse and pointed at by
# AWS_CONFIG_FILE.
#
# This exists for exactly one setting. s3.example.com serves path-style
# (https://s3.example.com/synapse/...), but boto3 defaults to virtual-host style
# (https://synapse.s3.example.com/...) whenever the bucket name is DNS-compatible,
# which would resolve nowhere.
#
# It cannot be set through the media provider's own config:
# synapse-s3-storage-provider builds its botocore Config() itself, passing only
# request_checksum_calculation and response_checksum_validation, and never
# s3.addressing_style. Anything the Config object leaves unset still falls
# through to this file, which is why it works.
#
# No credentials here -- those are in secret-media-s3.yaml. This file is
# deliberately plain so it stays reviewable.
[default]
s3 =
    addressing_style = path
