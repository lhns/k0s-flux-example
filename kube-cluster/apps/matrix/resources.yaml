# ===========================================================================
# mautrix-meta bridge, INSTAGRAM build. Appservice reached by Synapse at :29330.
# Fresh install like signal: CNPG from the start, so the PVC holds only
# config.yaml and the generated registration.
#
# The `ig-` tag prefix is load-bearing. mautrix/meta ships TWO bridges from one
# image -- the default tags are Facebook Messenger, the ig- tags are Instagram
# (upstream README: "this repo contains two bridges ... different docker tags").
# They are genuinely different images, not aliases: ig-v0.2608.0 is
# sha256:4b2704de... while v0.2608.0 is sha256:662f3d52.... Drop the prefix and
# you get Messenger pointed at an Instagram database. renovate.json carries a
# rule so an update can never strip it.
#
# Backfill: Instagram history is OFF by default (thread_backfill.batch_count: 0)
# and is set to -1 (unlimited) in config.yaml on the PVC. Unlike signal's
# pairing-time one-shot this is RE-RUNNABLE, so it can be tuned down and redone
# if Meta starts rate-limiting.
#
# Bridging a personal account is against Meta's ToS and accounts do get disabled
# for it -- see the README. Deliberate.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: instagram-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
