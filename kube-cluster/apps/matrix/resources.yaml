    metadata:
      labels:
        app.kubernetes.io/name: signal-bridge
        app.kubernetes.io/instance: matrix
        # Synapse pushes appservice transactions in; the bridge calls the client API
        # back out and talks to CNPG. Signal itself needs no rule: kube-vnet
        # isolates ingress only.
        kube-vnet/net.matrix-bridges: ingress
        kube-vnet/net.matrix-synapse: egress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: signal
          image: dock.mau.dev/mautrix/signal:v0.2608.0@sha256:4b08c9e556196d5cdd9d99704f64bd9c343ed16729f26bb4e7cf29fbe931835c
          ports:
            - name: appservice
              containerPort: 29328
          readinessProbe:
            tcpSocket:
              port: appservice
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
