# ===========================================================================
# mautrix-discord. Appservice reached by Synapse at :29334.
#
# FORKED IMAGE from the `fork` branch of github.com/lhns/mautrix-discord: backfill
# throttle+retry, and DM relay. See that README for the diffs.
#
# Initial backfill is ONE-SHOT per portal (upstream #89): a fetch that fails
# mid-crawl leaves the channel permanently truncated, recoverable only by deleting
# and recreating the room. Hence 6Gi, not the 1Gi the other bridges get --
# collectBackfillMessages holds a whole channel in RAM, times the portals crawling
# at once, and an OOM mid-crawl truncates them for good. A ceiling, not a reservation.
#
# The fork's `lhns_dm_relay` table is created outside the schema version, so the DB
# stays at upstream 24 and reverting to the unforked image is a pure image swap.
#
# NOT bridgev2 (mautrix-go v0.16.3): the database goes under `appservice.database`,
# not a top-level `database` block, and there is no `unknown_error_auto_reconnect`.
#
# Bridging a personal Discord account is against Discord's ToS. Deliberate.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discord-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bridge
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-bridge
        app.kubernetes.io/instance: matrix
        kube-vnet/net.matrix-bridges: ingress
        kube-vnet/net.matrix-synapse: egress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: discord
          image: ghcr.io/lhns/mautrix-discord:v0.7.7-lhns.4@sha256:b7e2066bd1c3036ea802a01c423b61cf64bcc3deacb7a51d97b7e1e467e894d0
          ports:
            - name: appservice
              containerPort: 29334
          readinessProbe:
            tcpSocket:
              port: appservice
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 6Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: discord-data
---
# Same load-bearing name rule as the other bridges: the registration says
# `url: http://discord-bridge:29334`, and that is what Synapse dials.
apiVersion: v1
kind: Service
metadata:
  name: discord-bridge
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: discord-bridge
  ports:
    - name: appservice
      port: 29334
      targetPort: appservice
