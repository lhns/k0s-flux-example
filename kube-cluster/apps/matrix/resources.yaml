apiVersion: v1
kind: Namespace
metadata:
  name: matrix
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: matrix
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# ===========================================================================
# Storage
#  - synapse /data (media_store, signing key, logging config, registration/*):
#    a dynamic CephFS PVC. It was a static rootPath mount of the Swarm-era
#    /docker/matrix/synapse until the media sweep shrank media_store enough to
#    copy; that directory still holds the pre-migration copy and is not
#    referenced by anything here.
#  - mas /config, whatsapp /data: small -> COPIED into fresh CephFS PVCs by the
#    migration pod (their DB URIs are sed-edited in the copy; Swarm originals
#    untouched).
#  - baibot: its matrix-sdk SQLite session/crypto store -> COPIED into a fresh
#    ceph-rbd PVC (block storage for SQLite; preserves the bot's device session).
# ===========================================================================
# Working directory for the media sweep: cache.db, the sqlite index the tool
# builds from synapse's media tables. Persisted between runs purely so a rerun
# does not rebuild it from scratch over 199k files.
#
# ceph-rbd, not cephfs: it is SQLite, and the rule in this repo is single-writer
# SQLite -> block storage (baibot, telegram's data.db). Network-filesystem
# locking is exactly where SQLite corruption comes from, as the telegram bridge
# demonstrated in Aug 2026. RWO also pairs with concurrencyPolicy: Forbid --
# a second concurrent run could not attach the volume from another node anyway.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-media-sweep
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
# synapse /data. Dynamic, so it carries a quota and can be snapshotted, neither of
# which the static rootPath mount it replaced could do.
#
# 32Gi against 4.7 GiB of real data (99.9% of it media_store), which is what is
# left once the media sweep has moved cold media to S3 and reclaimed the local
# copies. The size is deliberate: the static PV declares capacity 1Gi and holds
# far more because static CephFS volumes carry no quota, whereas a provisioned one
# DOES enforce it -- ask for too little and synapse hits a limit it has never had.
# The sweep is what keeps this bounded, so a sweep that silently stops eventually
# fills this.
#
# Same `cephfs` class, i.e. the same fsName (fastappdata) it already lives on, so
# performance is unchanged and the copy is intra-filesystem. RWX as before.
# homeserver.yaml needs no edit: media_store_path is /data/media_store and the
# mount point does not move.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-pymods
  namespace: matrix
spec:
  # RWX because synapse's rollout is not Recreate -- the new pod's initContainer
  # mounts this while the old pod still holds it.
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
  namespace: matrix
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 32Gi
---
# Fresh CephFS PVC — the migration pod copies the Swarm mas/ config in and
# sed-edits its database.uri. mas reads config only; no writes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mas-config
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
# Fresh CephFS PVC — the migration pod copies the Swarm bridges/whatsapp/ dir in
# and sed-edits config.yaml's database.uri. (Bridge state lives in Postgres.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
# Fresh ceph-rbd PVC — the migration pod copies the Swarm baibot/ dir in
# (config/config.yml + data/ with the SQLite crypto/session store).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baibot
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
# ===========================================================================
# Synapse — the homeserver. The image's /start.py is bypassed so we can pass a
# second --config-path (the DB override) that deep-merges over the in-place
# homeserver.yaml. Runs as uid 991 (owns /data on CephFS). Single-writer ->
# Recreate.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
        app.kubernetes.io/instance: matrix
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.matrix-redis: egress
        kube-vnet/net.matrix-mas: egress
        kube-vnet/net.matrix-synapse: ingress
        kube-vnet/net.matrix-bridges: egress
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 991
        runAsGroup: 991
      # TEMPORARY, pending an ImageComposition. The stock synapse image has no
      # boto3, so the s3 media storage provider cannot be imported without help.
      # pip runs against a PERSISTENT volume and skips when the module is already
      # there, so PyPI is only needed on a version change -- not on every restart.
      # An emptyDir here would make a PyPI outage during any node drain into a
      # homeserver outage.
      #
      # Same image as synapse itself, so the interpreter that resolves the
      # dependencies is the one that will import them (python 3.13, and
      # site-packages is /usr/local/lib/python3.13, not Debian dist-packages).
      initContainers:
        - name: install-s3-provider
          image: matrixdotorg/synapse:v1.161.0
          # Root only for this container, and only to write the freshly-provisioned
          # PVC (which comes up root-owned) before chowning it to synapse's 991.
          # Pod-level fsGroup would do it too, but fsGroup applies to EVERY volume
          # and would recursively chown the 32 GiB / 315k-inode media store.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # Marker includes the extras, so adding one forces a reinstall.
              want=1.6.1+cli
              if [ "$(cat /pymods/.version 2>/dev/null)" = "$want" ]; then
                echo "s3 storage provider $want already present, skipping"
                exit 0
              fi
              rm -rf /pymods/* /pymods/.version
              # --no-deps is load-bearing. pip --target ignores what is already in
              # site-packages, so a plain install tries to build psycopg2 from
              # source and dies: there is no compiler in this image. psycopg2,
              # Twisted and PyYAML are declared deps of the provider but are only
              # needed by the s3_media_upload CLI, and all three are already in the
              # image. boto3 is installed separately WITH its deps -- those are
              # pure-python wheels and resolve fine.
              pip install --no-cache-dir --target=/pymods --no-deps \
                "synapse-s3-storage-provider==1.6.1"
              pip install --no-cache-dir --target=/pymods boto3
              # humanize and tqdm are used only by the s3_media_upload CLI, which
              # the sweep CronJob runs from this same bundle. psycopg2 and PyYAML,
              # its other CLI deps, are already in the image.
              pip install --no-cache-dir --target=/pymods humanize tqdm
              python -c "import sys; sys.path.insert(0,'/pymods'); import s3_storage_provider, boto3; print('import check ok')"
              echo "$want" > /pymods/.version
              chown -R 991:991 /pymods
          volumeMounts:
            - name: pymods
              mountPath: /pymods
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      containers:
        - name: synapse
          image: matrixdotorg/synapse:v1.161.0
          command: ["python", "-m", "synapse.app.homeserver"]
          args:
            - "--config-path"
            - "/data/homeserver.yaml"
            - "--config-path"
            - "/secrets/database.yaml"
            # TURN/VoIP, pointing at the shared apps/coturn. Plaintext on purpose:
            # the secret itself is read from a file (turn_shared_secret_path), so
            # nothing sensitive lives in this config.
            - "--config-path"
            - "/config/synapse-turn.yaml"
            # The appservice registration list. Replaces homeserver.yaml's copy
            # wholesale (last-value-wins per top-level key), so it must always name
            # every bridge -- the files come from the registrations secret below.
            - "--config-path"
            - "/config-appservices/synapse-appservices.yaml"
            # Media storage provider -> s3.example.com. SOPS, because it carries the
            # S3 secret key. Additive: homeserver.yaml leaves
            # media_storage_providers commented out.
            - "--config-path"
            - "/media-s3/media-s3.yaml"
            # trusted_key_servers: [] -- fetch other servers' signing keys directly
            # instead of via the matrix.org notary, which rate-limits us (429).
            - "--config-path"
            - "/config-keyservers/synapse-keyservers.yaml"
          env:
            - name: TZ
              value: Europe/Berlin
            # Where the s3 media storage provider and its dependencies live. The
            # base image is stock upstream and has no boto3; see the initContainer.
            - name: PYTHONPATH
              value: /pymods
            # boto3 reads path-style addressing from here; the provider has no
            # config key for it. See synapse-aws-config.ini.
            - name: AWS_CONFIG_FILE
              value: /aws/config
          ports:
            - name: http
              containerPort: 8008
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: db-override
              mountPath: /secrets
              readOnly: true
            - name: turn-config
              mountPath: /config
              readOnly: true
            # Its own mount point rather than a subdirectory of an existing one:
            # mounting one volume inside another is needlessly fragile.
            - name: appservices-config
              mountPath: /config-appservices
              readOnly: true
            - name: keyservers-config
              mountPath: /config-keyservers
              readOnly: true
            - name: registrations
              mountPath: /registrations
              readOnly: true
            - name: pymods
              mountPath: /pymods
            - name: media-s3
              mountPath: /media-s3
              readOnly: true
            - name: aws-config
              mountPath: /aws
              readOnly: true
            # NOT nested under /secrets: that path is already the db-override
            # secret volume, and mounting inside another volume is needlessly
            # fragile.
            - name: turn-secret
              mountPath: /turn
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: synapse-data
        - name: db-override
          secret:
            secretName: synapse-db-override
        - name: turn-config
          configMap:
            name: synapse-turn
        - name: appservices-config
          configMap:
            name: synapse-appservices
        - name: keyservers-config
          configMap:
            name: synapse-keyservers
        - name: registrations
          secret:
            secretName: synapse-appservice-registrations
        - name: pymods
          persistentVolumeClaim:
            claimName: synapse-pymods
        - name: media-s3
          secret:
            secretName: synapse-media-s3
        - name: aws-config
          configMap:
            name: synapse-aws-config
        - name: turn-secret
          secret:
            # apps/coturn's shared secret, mirrored here by Reflector. Mounted as
            # a file rather than an env var because that is what
            # turn_shared_secret_path expects.
            secretName: coturn-shared-secret
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: synapse
  ports:
    - name: http
      port: 8008
      targetPort: http
---
# ===========================================================================
# synapse-redis — Synapse's replication pub/sub. Ephemeral (no persistence).
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-redis
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-redis
        app.kubernetes.io/instance: matrix
        kube-vnet/net.matrix-redis: ingress
    spec:
      containers:
        - name: redis
          image: valkey/valkey:9
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-redis
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: synapse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# ===========================================================================
# MAS (matrix-authentication-service). Config copied into mas-config (CephFS)
# with its DB URI repointed to the shared CNPG. Auto-runs migrations on start.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mas
        app.kubernetes.io/instance: matrix
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.matrix-mas: ingress
        kube-vnet/net.matrix-synapse: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: mas
          image: ghcr.io/element-hq/matrix-authentication-service:1.24.0
          args: ["-c", "/config/config.yaml"]
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: mas-config
---
apiVersion: v1
kind: Service
metadata:
  name: mas
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: mas
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ===========================================================================
# lk-jwt-service — signs LiveKit access tokens for Element Call, verifying the
# caller against the homeserver's federation OpenID endpoint.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt
  namespace: matrix
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lk-jwt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lk-jwt
        app.kubernetes.io/instance: matrix
        kube-vnet/net.traefik.traefik: ingress
    spec:
      enableServiceLinks: false
      containers:
        - name: lk-jwt
          image: ghcr.io/element-hq/lk-jwt-service:0.7.0
          env:
            - name: LIVEKIT_URL
              value: https://matrix-rtc.example.com/livekit/sfu
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: example.com
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_SECRET
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lk-jwt
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: lk-jwt
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ===========================================================================
# livekit-redis - shared state between the LiveKit SFU and livekit-sip, which
# coordinate through it. Ephemeral like synapse-redis: the only thing here that
# is not rebuilt from the SFU itself is the SIP trunk object, and ec-phone-shim
# reconciles that on every loop rather than it being hand-created state.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-redis
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-redis
        app.kubernetes.io/instance: matrix
        kube-vnet/net.matrix-livekit-redis: ingress
    spec:
      containers:
        - name: redis
          image: valkey/valkey:9
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-redis
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: livekit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# ===========================================================================
# livekit-sip - the SIP<->LiveKit bridge. Deliberately has NO LoadBalancer and no
# enumerated UDP ports, unlike livekit/coturn/cheogram-sip: it only ever ORIGINATES
# calls (CreateSIPParticipant), so no INVITE ever arrives from outside. An inbound
# dispatch rule would be pointless here anyway -- the server stamps such callers
# with identity "sip_<caller>", which can never match a Matrix RTC membership, so
# Element Call would filter them out of the UI.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sip
  namespace: matrix
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-sip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-sip
        app.kubernetes.io/instance: matrix
        kube-vnet/net.matrix-livekit: egress
        kube-vnet/net.matrix-livekit-redis: egress
        # Asterisk is the only SIP peer, in the cheogram-sip namespace: we INVITE it, and
        # its RTP comes back to us, so this edge is needed in both directions.
        kube-vnet/net.cheogram-sip.asterisk-sip: egress
        kube-vnet/net.livekit-sip-media: ingress
    spec:
      enableServiceLinks: false
      containers:
        - name: livekit-sip
          image: livekit/sip:v1.14.0
          env:
            # No SIP_CONFIG_FILE: the image's ENTRYPOINT is
            # ["livekit-sip", "--config=/sip/config.yaml"], and the flag always wins, so
            # the env var the README documents is dead here. Mount over that path instead.
            #
            # In-cluster signalling, not the public matrix-rtc.example.com hostname:
            # this hop never leaves the pod network.
            - name: LIVEKIT_WS_URL
              value: ws://livekit.matrix.svc.cluster.local:7880
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_SECRET
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /sip/config.yaml
              subPath: livekit-sip.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: livekit-sip-config
---
# ===========================================================================
# LiveKit SFU — Element Call media. Signaling (:7880) via Traefik; ICE/media on
# a dedicated MetalLB VIP (10.20.2.19): TCP 7881 + UDP 50100-50120.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: matrix
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
        app.kubernetes.io/instance: matrix
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.matrix-livekit: ingress
        kube-vnet/net.matrix-livekit-redis: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.7
          # livekit-sip coordinates with the server through a shared Redis. The flag
          # overrides redis.address in livekit.yaml -- updateFromCLI runs after the config
          # file is parsed -- so the SOPS-encrypted config is never decrypted to add it.
          # The server does NOT start while this address is unreachable.
          args:
            - "--config"
            - "/etc/livekit.yaml"
            - "--redis-host"
            - "livekit-redis.matrix.svc.cluster.local:6379"
            # use_external_ip in the SOPS config rewrites every ICE host candidate to the
            # public address, and the edge does not hairpin, so in-cluster peers (livekit-sip)
            # can never reach it. Appends the pod IP as a second candidate; browsers ignore it.
            - "--rtc.advertise_internal_ip=true"
          ports:
            - name: signal
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
          readinessProbe:
            tcpSocket:
              port: signal
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: livekit
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: signal
---
# Dedicated MetalLB VIP for LiveKit ICE/media (raw ports Traefik can't carry).
# externalTrafficPolicy: Local preserves client source IPs for WebRTC.
apiVersion: v1
kind: Service
metadata:
  name: livekit-lb
  namespace: matrix
  annotations:
    metallb.io/loadBalancerIPs: 10.20.2.19
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - {name: rtc-tcp, port: 7881, targetPort: 7881, protocol: TCP}
    - {name: u50100, port: 50100, targetPort: 50100, protocol: UDP}
    - {name: u50101, port: 50101, targetPort: 50101, protocol: UDP}
    - {name: u50102, port: 50102, targetPort: 50102, protocol: UDP}
    - {name: u50103, port: 50103, targetPort: 50103, protocol: UDP}
    - {name: u50104, port: 50104, targetPort: 50104, protocol: UDP}
    - {name: u50105, port: 50105, targetPort: 50105, protocol: UDP}
    - {name: u50106, port: 50106, targetPort: 50106, protocol: UDP}
    - {name: u50107, port: 50107, targetPort: 50107, protocol: UDP}
    - {name: u50108, port: 50108, targetPort: 50108, protocol: UDP}
    - {name: u50109, port: 50109, targetPort: 50109, protocol: UDP}
    - {name: u50110, port: 50110, targetPort: 50110, protocol: UDP}
    - {name: u50111, port: 50111, targetPort: 50111, protocol: UDP}
    - {name: u50112, port: 50112, targetPort: 50112, protocol: UDP}
    - {name: u50113, port: 50113, targetPort: 50113, protocol: UDP}
    - {name: u50114, port: 50114, targetPort: 50114, protocol: UDP}
    - {name: u50115, port: 50115, targetPort: 50115, protocol: UDP}
    - {name: u50116, port: 50116, targetPort: 50116, protocol: UDP}
    - {name: u50117, port: 50117, targetPort: 50117, protocol: UDP}
    - {name: u50118, port: 50118, targetPort: 50118, protocol: UDP}
    - {name: u50119, port: 50119, targetPort: 50119, protocol: UDP}
    - {name: u50120, port: 50120, targetPort: 50120, protocol: UDP}
