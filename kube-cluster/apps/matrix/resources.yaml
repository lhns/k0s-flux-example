# ===========================================================================
# Media sweep: uploads local media to S3 and (optionally) reclaims the disk.
#
# This one job covers three cases, because it does not care WHY a file is on
# disk without being in S3 -- it HEADs each object first and uploads only what
# is missing:
#   - the historical media store, which the storage provider never sees
#   - uploads whose async background PUT failed (the provider logs and forgets,
#     so this IS the retry path -- with store_synchronous: false it is required)
#   - nothing, for files already uploaded; those are just candidates for --delete
#
# SUSPENDED on creation. The first run reads ~200k files and pushes tens of GB
# out over the internet, so it is enabled deliberately, not by merging a commit.
#
# Shares /data with the synapse Deployment, which is why synapse-data is RWX: this
# reads media_store while synapse serves from it.
# ===========================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: synapse-media-sweep
  namespace: matrix
spec:
  schedule: "23 4 * * *"
  suspend: false
  # Forbid, not Allow: two runs would race on cache.db and on the same S3 keys.
  # A run that overshoots its window is skipped rather than doubled up.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries: a failed sweep is resumable by design (already-uploaded
      # objects are skipped on the next run), so thrashing gains nothing.
      backoffLimit: 0
      # Without this a hung run would block every future one, because Forbid has
      # no timeout of its own.
      activeDeadlineSeconds: 21600
      # A backstop for failures, not the retention policy: successfulJobsHistoryLimit
      # keeps the last three runs and evicts by count long before this fires. It exists
      # because failedJobsHistoryLimit only evicts when ANOTHER failure arrives, so once
      # the sweep stops failing its last failures would be kept forever. Well clear of
      # three nightly runs, so a skipped run cannot drop the history below three.
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: synapse-media-sweep
            app.kubernetes.io/instance: matrix
            # Reads synapse's media tables; S3 egress needs no rule, kube-vnet
            # isolates ingress only.
            kube-vnet/net.postgres.postgres: egress
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          # Root because it deletes files owned by 991 and writes cache.db to a
          # freshly-provisioned root-owned PVC. fsGroup would be the alternative
          # but applies to every volume -- including a recursive chown of the
          # 32 GiB media store.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: sweep
              image: matrixdotorg/synapse:v1.161.0
              workingDir: /work
              env:
                - name: PYTHONPATH
                  value: /pymods
                # Path-style, same reason as synapse itself.
                - name: AWS_CONFIG_FILE
                  value: /aws/config
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                # Files not ACCESSED within this window are uploaded. Not "created
                # before" -- media still being viewed stays on local NVMe, which is
                # the tiering we want.
                - name: SWEEP_AGE
                  value: "30d"
                # A file is removed only once it is confirmed in S3, so synapse keeps
                # serving it through the s3 storage provider in media-s3.yaml. Deleting
                # also marks the media known_deleted, which is what stops every later run
                # re-checking all of them against S3 -- the reason the job kept hitting
                # activeDeadlineSeconds.
                - name: SWEEP_DELETE
                  value: "--delete"
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  # Credentials come out of the same secret synapse uses, so there
                  # is exactly one copy of them. The CLI is a separate process and
                  # cannot see synapse's config, so it needs them in the env.
                  python - <<'PY' > /tmp/s3.env
                  import shlex, yaml
                  c = yaml.safe_load(open('/media-s3/media-s3.yaml'))['media_storage_providers'][0]['config']
                  for var, key in (('AWS_ACCESS_KEY_ID','access_key_id'),
                                   ('AWS_SECRET_ACCESS_KEY','secret_access_key'),
                                   ('BUCKET','bucket'), ('ENDPOINT','endpoint_url')):
                      print('export %s=%s' % (var, shlex.quote(str(c[key]))))
                  PY
                  . /tmp/s3.env
                  rm -f /tmp/s3.env

                  echo "== update: indexing media not accessed in $SWEEP_AGE =="
                  python /pymods/bin/s3_media_upload --no-progress update \
                    /data/media_store "$SWEEP_AGE" \
                    --homeserver-config-path /secrets/database.yaml

                  # $$ escapes Flux's envsubst, which runs over this whole component
                  # because substitution-secrets/ exists. Unescaped it would resolve to
                  # the empty string at apply time.
                  echo "== upload to $BUCKET (delete='$${SWEEP_DELETE}') =="
                  # --no-progress is a GLOBAL flag: it must precede the subcommand, or argparse
                  # rejects it and the upload never runs.
                  python /pymods/bin/s3_media_upload --no-progress upload \
                    /data/media_store "$BUCKET" \
                    --endpoint-url "$ENDPOINT" $SWEEP_DELETE
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: pymods
                  mountPath: /pymods
                  readOnly: true
                - name: media-s3
                  mountPath: /media-s3
                  readOnly: true
                - name: db-override
                  mountPath: /secrets
                  readOnly: true
                - name: aws-config
                  mountPath: /aws
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: synapse-data
            - name: pymods
              persistentVolumeClaim:
                claimName: synapse-pymods
            - name: media-s3
              secret:
                secretName: synapse-media-s3
            - name: db-override
              secret:
                secretName: synapse-db-override
            - name: aws-config
              configMap:
                name: synapse-aws-config
            - name: work
              persistentVolumeClaim:
                claimName: synapse-media-sweep
---
# ===========================================================================
# mautrix-whatsapp bridge. Appservice reached by Synapse at :29318. Config
# copied into whatsapp-data (CephFS) with its DB URI repointed; state in Postgres.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-bridge
  namespace: matrix
spec:
  # Set replicas here, never with `kubectl scale` -- Flux reconciles the
  # Deployment and puts the git value straight back, which it already did once
  # during the Aug 2026 telegram revival.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: whatsapp-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whatsapp-bridge
        app.kubernetes.io/instance: matrix
        kube-vnet/net.matrix-bridges: ingress
        kube-vnet/net.matrix-synapse: egress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: whatsapp
          # Fork build: lhns/mautrix-whatsapp branch lhns-build, upstream v0.2608.0 plus
          # dm_room_name_template and group_room_name_template.
          #
          # bridgev2 names a DM room after the ghost, and the ghost is shared by every
          # login, so a contact name in displayname_template leaks between accounts. The
          # option names the ROOM from the contact instead, which is safe because a DM
          # portal belongs to a single login.
          #
          # group_room_name_template renames group rooms from the WhatsApp subject. While
          # it is set, renaming a group from Matrix is refused: the Matrix name is
          # generated, so writing it back would store it as the group subject.
          #
          # Pinned to a commit, so Renovate does not track it: an upstream release needs
          # that branch rebased and a new tag written here.
          image: ghcr.io/lhns/mautrix-whatsapp:d11503d588416813c5a9005138ea6a5f5d54529f@sha256:fcb521b7c3e945a0180de164e8a591e8765865574f9e2cdfa8ad7927fb59cd4f
          ports:
            - name: appservice
              containerPort: 29318
          # No initial delay, so the Service endpoint appears as soon as the listener binds.
          # This does NOT fix the crash-on-restart: measured afterwards, the first
          # homeserver->appservice ping still fails with a 15s connect timeout and the next
          # succeeds in 8ms, so the cause is a connection that cannot be made yet rather than
          # the endpoint being late. mautrix-go exits after 6 consecutive failed pings, a
          # const in appservice/ping.go, which is why a bridge restart still costs a crash
          # cycle or two before it settles.
          readinessProbe:
            tcpSocket:
              port: appservice
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whatsapp-data
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-bridge
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: whatsapp-bridge
  ports:
    - name: appservice
      port: 29318
      targetPort: appservice
---
# ===========================================================================
# mautrix-telegram's ORIGINAL SQLite volume, retained. The bridge now runs on
# Postgres from telegram-bridge-data below, which explains why this is kept.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
# The telegram bridge's volume, on CephFS like the other three bridges.
#
# `telegram-data` above is the ORIGINAL ceph-rbd volume and is deliberately kept.
# Block storage was required only while the bridge ran on SQLite -- SQLite over a
# network filesystem is where locking corruption comes from -- and that stopped
# being true when it was ported to Postgres (database.type: postgres). With no
# SQLite open, CephFS is safe and the bridge matches signal/whatsapp.
#
# The old volume is RETAINED, not deleted: it still holds data.db and
# data.db.pre-ts.bak, the rollback for that port. Deleting its PV would hand the
# subvolume to pv-reaper (deleting a PV is what reclaims it -- deleting a PVC is
# not), so it is left bound and untouched until the rollback is no longer wanted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-bridge-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bridge
  namespace: matrix
spec:
  # Was 0 while the PVC was loaded and the config hardened -- a bridge started
  # against an empty /data would build a fresh database and create new portals,
  # the one outcome this exercise exists to avoid. Now 1: the legacy database
  # migrated cleanly, all 38 portals kept their original Matrix room IDs, and the
  # ghost count held at exactly 407.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-bridge
        app.kubernetes.io/instance: matrix
        # Synapse pushes appservice transactions in; the bridge calls the client API
        # back out. Telegram itself needs no rule: kube-vnet isolates ingress only.
        #
        # Postgres egress since the Aug 2026 port off SQLite. The SQLite file is still
        # on the PVC as the rollback -- switching back is an edit to the database block
        # in config.yaml (which lives on the volume, not in git) plus dropping this label.
        kube-vnet/net.matrix-bridges: ingress
        kube-vnet/net.matrix-synapse: egress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: telegram
          image: dock.mau.dev/mautrix/telegram:v0.2609.0@sha256:e6e7f109928cc9f447c8f081c816ff5f034cc1f157084a74d1bf08007c91807b
          ports:
            - name: appservice
              containerPort: 29317
          readinessProbe:
            tcpSocket:
              port: appservice
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: telegram-bridge-data
---
# The name is load-bearing: the registration says `url: http://telegram-bridge:29317`,
# which is what Synapse dials. It happens to be the old Swarm service name too, so
# the recovered registration works unedited -- rename this and Synapse silently
# cannot reach the bridge.
apiVersion: v1
kind: Service
metadata:
  name: telegram-bridge
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: telegram-bridge
  ports:
    - name: appservice
      port: 29317
      targetPort: appservice
