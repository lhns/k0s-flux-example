# ===========================================================================
# mautrix-telegram's ORIGINAL SQLite volume, retained. The bridge now runs on
# Postgres from telegram-bridge-data below, which explains why this is kept.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
# The telegram bridge's volume, on CephFS like the other three bridges.
#
# `telegram-data` above is the ORIGINAL ceph-rbd volume and is deliberately kept.
# Block storage was required only while the bridge ran on SQLite -- SQLite over a
# network filesystem is where locking corruption comes from -- and that stopped
# being true when it was ported to Postgres (database.type: postgres). With no
# SQLite open, CephFS is safe and the bridge matches signal/whatsapp.
#
# The old volume is RETAINED, not deleted: it still holds data.db and
# data.db.pre-ts.bak, the rollback for that port. Deleting its PV would hand the
# subvolume to pv-reaper (deleting a PV is what reclaims it -- deleting a PVC is
# not), so it is left bound and untouched until the rollback is no longer wanted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-bridge-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bridge
  namespace: matrix
spec:
  # Was 0 while the PVC was loaded and the config hardened -- a bridge started
  # against an empty /data would build a fresh database and create new portals,
  # the one outcome this exercise exists to avoid. Now 1: the legacy database
  # migrated cleanly, all 38 portals kept their original Matrix room IDs, and the
  # ghost count held at exactly 407.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-bridge
        app.kubernetes.io/instance: matrix
        # Synapse pushes appservice transactions in; the bridge calls the client API
        # back out. Telegram itself needs no rule: kube-vnet isolates ingress only.
        #
        # Postgres egress since the Aug 2026 port off SQLite. The SQLite file is still
        # on the PVC as the rollback -- switching back is an edit to the database block
        # in config.yaml (which lives on the volume, not in git) plus dropping this label.
        kube-vnet/net.matrix-bridges: ingress
        kube-vnet/net.matrix-synapse: egress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: telegram
          image: dock.mau.dev/mautrix/telegram:v0.2608.0@sha256:a4f94f8e47fb946f64f6145c08f797d28700a6bea6fa64b8111c8a454d966229
          ports:
            - name: appservice
              containerPort: 29317
          readinessProbe:
            tcpSocket:
              port: appservice
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: telegram-bridge-data
---
# The name is load-bearing: the registration says `url: http://telegram-bridge:29317`,
# which is what Synapse dials. It happens to be the old Swarm service name too, so
# the recovered registration works unedited -- rename this and Synapse silently
# cannot reach the bridge.
apiVersion: v1
kind: Service
metadata:
  name: telegram-bridge
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: telegram-bridge
  ports:
    - name: appservice
      port: 29317
      targetPort: appservice
---
# ===========================================================================
# mautrix-signal bridge. Appservice reached by Synapse at :29328. Unlike the
# other two this was a fresh install, so it went onto CNPG immediately and has
# no legacy SQLite behind it -- the PVC holds only config.yaml and the
# generated registration.
#
# Backfill on Signal is a one-shot: Signal keeps no server-side history, so the
# only history the bridge can ever import is what the phone transfers when the
# device is linked. backfill.enabled in config.yaml is what makes the bridge
# advertise that capability at pairing time, so it has to be true BEFORE the QR
# code is scanned. There is no later recovery -- see the README.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signal-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
