# ===========================================================================
# matrix-sip-bridge. Appservice reached by Synapse at :29337. Bridges phone
# numbers to Matrix: text as SIP MESSAGE in a portal room per number, and calls
# as media through livekit-sip, which is already the SIP<->LiveKit leg.
#
# Not a mautrix bridge in deployment shape either: it holds no PVC, because
# everything it keeps is in the sip-bridge database (database.yaml) and its
# config is a read-only Secret rather than a file the bridge rewrites in place.
#
# It is a SIP ENDPOINT, not a controller of one PBX: Asterisk dials it as the
# `[matrixbridge]` peer in apps/cheogram-sip/sip.conf, so call policy stays in
# the dialplan. The SIP listener is tcp -- a SIP MESSAGE that overflows a UDP
# datagram is dropped with no error at either end.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-sip-bridge
  namespace: matrix
  annotations:
    # The whole config, credentials included, is read once at startup from the
    # mounted Secret, so a rotation is otherwise never picked up.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # One appservice transaction stream and one SIP endpoint. Two pods would both
  # answer the same INVITE and double-post every inbound message.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-sip-bridge
  template:
    metadata:
      annotations:
        # Scraped by the otel `cluster` collector, which discovers pods by these
        # annotations only -- and only in namespaces wired up on both sides in
        # infra/opentelemetry-monitoring: `namespaces.names` in release.yaml AND an
        # otel-scrape ingress binding in vnet.yaml. Either one alone scrapes nothing.
        prometheus.io/scrape: "true"
        prometheus.io/port: "29337"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: matrix-sip-bridge
        app.kubernetes.io/instance: matrix
        kube-vnet/net.matrix-bridges: ingress
        kube-vnet/net.matrix-synapse: egress
        kube-vnet/net.postgres.postgres: egress
        # LiveKit's twirp API, to place and tear down the SIP participant for a call.
        kube-vnet/net.matrix-livekit: egress
        # Asterisk dials and texts us, so this end needs its own vnet (vnet.yaml).
        kube-vnet/net.matrix-sip-bridge-sip: ingress
        # ...and we send outbound MESSAGE and INVITE the other way. That vnet already
        # names `matrix`, so nothing changes there.
        kube-vnet/net.cheogram-sip.asterisk-sip: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: matrix-sip-bridge
          # A release publishes :<version> too, but pin the sha: :0.1 would move
          # under us on the next patch release.
          image: ghcr.io/lhns/matrix-sip-bridge:sha-19938f4
          # mxmain takes a config FILE. There are no SIP_BRIDGE_* environment
          # variables: mautrix reads env only when env_config_prefix is set, and
          # then under __-separated paths, which this config deliberately leaves off.
          #
          # -n is not optional with a Secret mount: without it the config upgrader
          # tries to write the migrated file back and dies on a read-only volume.
          args: ["-c", "/config/config.yaml", "-n"]
          ports:
            - name: appservice
              containerPort: 29337
            - name: sip
              containerPort: 5060
              protocol: TCP
          # The APPSERVICE socket, deliberately -- not /_health/ready, and not a SIP check.
          # Readiness cannot depend on anything the appservice ping is upstream of: that
          # ping returns through this Service, a Service routes only to Ready endpoints,
          # and the SIP listener binds only after the ping succeeds. Gating on it deadlocks.
          # A startupProbe is the same trap -- while it fails, readiness is disabled too.
          # The cost is real: the pod is Ready ~30s before SIP binds. Asterisk's qualify on
          # the [matrixbridge] peer is what covers that window.
          readinessProbe:
            tcpSocket:
              port: appservice
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            # Memory only. A CPU limit would throttle rather than protect (apps/webtop/README.md).
            limits: {memory: 512Mi}
          env:
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          secret:
            secretName: matrix-sip-bridge
---
# Load-bearing name, same rule as the other bridges: registrations/sip.yaml says
# `url: http://matrix-sip-bridge:29337`, and that is what Synapse dials. It is also
# sip.public_address and the [matrixbridge] peer's host= in apps/cheogram-sip, so
# renaming this breaks the SIP side silently as well.
apiVersion: v1
kind: Service
metadata:
  name: matrix-sip-bridge
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: matrix-sip-bridge
  ports:
    - name: appservice
      port: 29337
      targetPort: appservice
    # Asterisk reaches the bridge here, not on the pod address: sip.public_address
    # in the config names this Service, and chan_sip has it as a static host.
    - name: sip
      port: 5060
      targetPort: sip
      protocol: TCP
---
# ===========================================================================
# Element Web client (static, public config from ConfigMap).
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: element-web
        app.kubernetes.io/instance: matrix
        kube-vnet/net.traefik.traefik: ingress
    spec:
      enableServiceLinks: false
      containers:
        - name: element-web
          image: vectorim/element-web:v1.12.28
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: element-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: element-web
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: element-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ===========================================================================
# baibot — AI chat bot. Logs in as a normal user via the public homeserver.
# Config + SQLite session/crypto store copied into the ceph-rbd PVC.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baibot
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: baibot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baibot
        app.kubernetes.io/instance: matrix
        kube-vnet/net.matrix-synapse: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: baibot
          image: ghcr.io/etkecc/baibot:v1.26.0
          env:
            - name: TZ
              value: Europe/Berlin
            - name: BAIBOT_PERSISTENCE_DATA_DIR_PATH
              value: /data
          volumeMounts:
            - name: baibot
              mountPath: /app/config.yml
              subPath: config/config.yml
              readOnly: true
            - name: baibot
              mountPath: /data
              subPath: data
      volumes:
        - name: baibot
          persistentVolumeClaim:
            claimName: baibot
---
