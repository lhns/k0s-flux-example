        # isolates ingress only.
        kube-vnet/net.matrix-bridges: ingress
        kube-vnet/net.matrix-synapse: egress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: instagram
          image: dock.mau.dev/mautrix/meta:ig-v0.2608.0@sha256:4b2704de94809351884da2640b1b1421920980a60269aa871fa870a8d50e7eb0
          ports:
            - name: appservice
              containerPort: 29330
          readinessProbe:
            tcpSocket:
              port: appservice
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 1Gi}
