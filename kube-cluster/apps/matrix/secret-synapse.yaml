# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# Synapse's original homeserver.yaml stays untouched on the mounted-in-place
# CephFS /data. This is a second --config-path that Synapse deep-merges on top,
# overriding ONLY the `database` block to point at the shared CNPG (was
# db "postgres"/user "postgres"@synapse-db). Everything else (redis: synapse-redis,
# MAS: http://mas:8080, appservices in /data/registration) is already correct
# because the kube Service names match the Swarm service names.
apiVersion: v1
kind: Secret
metadata:
    name: synapse-db-override
    namespace: matrix
type: Opaque
stringData:
    database.yaml: CHANGEME-database.yaml
