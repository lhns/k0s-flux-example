# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# LiveKit SFU config + API key/secret (Element Call RTC backend). The key/secret
# are reused verbatim from the Swarm compose so existing Element Call sessions and
# the lk-jwt token signer stay consistent. livekit.yaml differs from the Swarm copy
# in one place: use_external_ip is flipped to true so ICE advertises the reachable
# public address behind the MetalLB VIP (10.20.2.19) — see README.
apiVersion: v1
kind: Secret
metadata:
    name: livekit
    namespace: matrix
type: Opaque
stringData:
    livekit.yaml: CHANGEME-livekit.yaml
    LIVEKIT_KEY: CHANGEME-LIVEKIT_KEY
    LIVEKIT_SECRET: CHANGEME-LIVEKIT_SECRET
