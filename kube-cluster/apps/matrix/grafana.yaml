# Grafana Operator objects of this component (README.md, "Grafana objects"). Each opts out of Flux
# substitution: rule templates and dashboard JSON are full of ${...}.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: app-matrix
  namespace: grafana
spec:
  name: app-matrix
  instanceSelector:
    matchLabels:
      grafana.example.com/instance: main
  folderUID: ag1airdsjen7kc # Cluster
  interval: 1m
  rules:
    - uid: sip-bridge-unregistered
      title: SIP bridge not registered
      condition: C
      for: 15m
      noDataState: OK
      execErrState: KeepLast
      data:
        - refId: A
          relativeTimeRange: {from: 600, to: 0}
          datasourceUid: bfz43q0alv6kgc # VictoriaMetrics (Prometheus)
          model:
            refId: A
            instant: true
            expr: >-
              label_move(max by ("k8s.namespace.name", "k8s.deployment.name") (sip_bridge_sip_registered) == 0, "k8s.namespace.name", "namespace", "k8s.deployment.name", "deployment")
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [1]}
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.deployment }}: SIP trunk not registered'
        description: 'Calls cannot be placed or received. Check the bridge log and the trunk.'
      notificationSettings:
        receiver: matrix
