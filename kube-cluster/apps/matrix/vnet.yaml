# Under pod-level kube-vnet isolation, intra-namespace ingress is denied by
# default, so each internal edge gets a private same-namespace VirtualNetwork.
# Bare net.<name> = same-ns; the server pod carries net.<name>: ingress and the
# client carries net.<name>: egress. Cross-ns Postgres uses the shared
# `postgres` vnet (allowedNamespaces.all: true) — no edit there, pods just opt
# in with net.postgres.postgres: egress.
---
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: matrix-redis
  namespace: matrix
spec:
  description: "synapse -> synapse-redis (:6379), intra-namespace."
---
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: matrix-mas
  namespace: matrix
spec:
  description: "synapse -> mas (:8080) OIDC/introspection, intra-namespace."
---
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  description: "mas -> synapse (:8008) admin API, intra-namespace."
---
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: matrix-bridges
  namespace: matrix
spec:
  description: "synapse -> bridge appservice ports (whatsapp :29318, telegram :29317,
    signal :29328, instagram :29330, discord :29334, sip :29337), intra-namespace."
---
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: matrix-livekit
  namespace: matrix
spec:
  description: "livekit-sip + ec-phone-shim -> livekit (:7880) twirp/signalling, intra-namespace."
---
# Separate from matrix-redis on purpose. Sharing synapse-redis would mean labelling livekit
# net.matrix-redis: egress, which hands livekit -- and livekit-sip, which holds the same
# credentials -- reach into Synapse's replication bus.
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: matrix-livekit-redis
  namespace: matrix
spec:
  description: "livekit + livekit-sip -> livekit-redis (:6379), intra-namespace."
---
# The other direction across the Asterisk edge: cheogram-sip dials and texts the bridge.
# asterisk-sip in apps/cheogram-sip covers matrix -> there and nothing the other way, and
# kube-vnet guards ingress, so this end needs its own vnet.
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: matrix-sip-bridge-sip
  namespace: matrix
spec:
  description: "cheogram-sip/Asterisk -> matrix-sip-bridge SIP :5060/tcp (INVITE, MESSAGE, OPTIONS)."
  allowedNamespaces:
    names: [cheogram-sip]
---
# Media is bidirectional and kube-vnet guards ingress, so the Asterisk edge needs a vnet
# at each end: this one, and asterisk-sip in apps/cheogram-sip.
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: livekit-sip-media
  namespace: matrix
spec:
  description: "cheogram-sip/Asterisk -> livekit-sip RTP 30000-30049 and SIP responses."
  allowedNamespaces:
    names: [cheogram-sip]
