apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # DB role/databases in the shared CNPG (infra-postgres); matrix-db is
    # reflected into this ns by Reflector (infra-reflector); the livekit-lb
    # LoadBalancer's 10.20.2.19 needs the livekit-vip MetalLB pool (infra-metallb);
    # Traefik carries all HTTP ingress (infra-traefik); synapse mounts a CephFS
    # static PV + mas/whatsapp use CephFS PVCs (infra-ceph-csi-cephfs); baibot's
    # SQLite store is on ceph-rbd (infra-ceph-csi-rbd). Read by the root
    # generator; inert to kustomize.
    # app-coturn: synapse's TURN credentials are derived from the shared secret
    # that apps/coturn owns and Reflector mirrors into this namespace.
    #
    # app-cheogram-sip is deliberately NOT listed, though matrix-sip-bridge is a SIP peer
    # of it: gating the whole homeserver on Asterisk is the wrong trade. Without it the
    # bridge simply has nothing to talk to until Asterisk comes up.
    #
    # infra-reloader: the as-secret generators carry disableNameSuffixHash, so a config
    # change does not roll its pod by itself -- reloader is what notices.
    dependsOn: infra-postgres,infra-reflector,infra-metallb,infra-traefik,infra-ceph-csi-cephfs,infra-ceph-csi-rbd,infra-reloader,app-coturn
# NOTE: no `namespace:` transformer — database.yaml + db-role-secret.yaml pin
# `namespace: postgres`; everything else is in `matrix`.
resources:
- resources.yaml
- routing.yaml
- database.yaml
- db-role-secret.yaml
- vnet.yaml
configMapGenerator:
- name: element-web-config
  namespace: matrix
  files:
  - config.json=element-web-config.json
- name: synapse-admin-config
  namespace: matrix
  files:
  - config.json=synapse-admin-config.json
# A third --config-path for synapse, adding only TURN/VoIP (apps/coturn). Not a
# Secret: the shared secret itself is read from a mounted file via
# turn_shared_secret_path, so this stays plaintext and reviewable.
- name: synapse-turn
  namespace: matrix
  files:
  - synapse-turn.yaml
# A fourth --config-path selecting the appservice registrations, which now live in
# git (secret-registrations.yaml) rather than as hand-placed files on the CephFS PV.
# Replaces homeserver.yaml's list wholesale -- see the file for why it must always be
# complete.
- name: synapse-appservices
  namespace: matrix
  files:
  - synapse-appservices.yaml
# A fifth --config-path: trusted_key_servers: [] so signing-key lookups go direct
# to each server instead of through the matrix.org notary, which 429s us.
- name: synapse-keyservers
  namespace: matrix
  files:
  - synapse-keyservers.yaml
# botocore's shared config, for one setting the media provider cannot express:
# path-style addressing. Not a Secret -- it holds no credentials.
- name: synapse-aws-config
  namespace: matrix
  files:
  - config=synapse-aws-config.ini
# Two --config-path overlays synapse deep-merges onto the homeserver.yaml that stays on
# the CephFS PV. Each carries one credential among plain settings, which is what the
# as-secret annotation is for; see the files for what they override and why.
- name: synapse-db-override
  namespace: matrix
  files:
  - database.yaml=synapse-database.yaml
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
- name: synapse-media-s3
  namespace: matrix
  files:
  - media-s3.yaml
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
# The livekit Secret: the SFU's config file plus the same credentials as env, for lk-jwt
# and livekit-sip. One generator so all three come from one pair of variables.
- name: livekit
  namespace: matrix
  files:
  - livekit.yaml=livekit-config.yaml
  literals:
  - LIVEKIT_KEY=${LIVEKIT_KEY}
  - LIVEKIT_SECRET=${LIVEKIT_SECRET}
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
# matrix-sip-bridge's config. A mautrix config is one file with no include mechanism, so
# the credentials sit among the settings; the as-secret annotation is what lets it be a
# real file with ${...} in it rather than an encrypted blob nothing can read or diff.
# Named for the Secret resources.yaml mounts.
- name: matrix-sip-bridge
  namespace: matrix
  files:
  - config.yaml=sip-bridge-config.yaml
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
# livekit-sip's config. Not a Secret: the credentials it needs are supplied as env from
# the existing livekit Secret, which override the file's api_key/api_secret/ws_url.
- name: livekit-sip-config
  namespace: matrix
  files:
  - livekit-sip.yaml=livekit-sip-config.yaml
# nginx serving the server-side well-known delegation (m.server -> matrix.example.com:443)
# for federation. Traefik replacePath's /.well-known/matrix/server to / so this
# single index.json answers. Client well-known comes from Synapse itself.
- name: well-known
  namespace: matrix
  files:
  - default.conf=well-known-default.conf
  - index.json=well-known-index.json
# The appservice registrations as real files. What matters on review is the namespaces
# regex, which decides the users and aliases a bridge claims. The generator patches this
# ConfigMap into a Secret (templates/_secret-from-files.tpl), which keeps the
# ${MATRIX_*_TOKEN} placeholders visible to Flux's substitution.
#
# The list Synapse actually loads is app_service_config_files in synapse-appservices.yaml,
# which is whole-key: a partial list there unregisters every bridge it omits.
- name: synapse-appservice-registrations
  namespace: matrix
  files:
  - telegram.yaml=registrations/telegram.yaml
  - whatsapp.yaml=registrations/whatsapp.yaml
  - discord.yaml=registrations/discord.yaml
  - signal.yaml=registrations/signal.yaml
  - instagram.yaml=registrations/instagram.yaml
  - sip.yaml=registrations/sip.yaml
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
