# mautrix-telegram. Site config for the mxmain binary, mounted read-only and started with
# -c -n, so nothing here is rewritten by the config upgrader: a key the binary adds in a
# new release is absent until it is added here (scripts/bridge-config-sync.py adds it).
#
# Credentials are substitution placeholders Flux fills from substitution-secrets/. The
# generator makes this a SECRET (as-secret annotation in kustomization.yaml); drop it and
# they are applied in the clear. A literal dollar-brace anywhere here, comments included,
# must be a variable; write any other dollar as two.
#
# as_token/hs_token are the same variables as registrations/telegram.yaml: rotate one side
# alone and Synapse answers 403 to every transaction.
#
# pickle_key, shared_secret, signing_key and server_key must never be the literal `generate`:
# under -n it would be regenerated on every start.
network:
  # Unquoted on purpose: it must be an integer; a quoted value is silently replaced by the default.
  api_id: ${MATRIX_TELEGRAM_API_ID}
  api_hash: "${MATRIX_TELEGRAM_API_HASH}"
  device_info:
    device_model: mautrix-telegram
    system_version: auto
    app_version: auto
    lang_code: en
    system_lang_code: en
  animated_sticker:
    target: gif
    convert_from_webm: false
    args:
      width: 256
      height: 256
      fps: 25
  member_list:
    max_initial_sync: 100
    sync_broadcast_channels: true
    skip_deleted: true
  ping:
    interval_seconds: 30
    timeout_seconds: 10
  proxy:
    type: disabled
    address: "127.0.0.1:1080"
    username: ""
    password: ""
  sync:
    update_limit: -1
    create_limit: 30
    login_sync_limit: 15
    direct_chats: false
  takeout:
    dialog_sync: false
    forward_backfill: true
    backward_backfill: false
  max_member_count: -1
  max_telegram_delete: 100
  contact_avatars: false
  contact_names: false
  always_custom_emoji_reaction: false
  saved_message_avatar: mxc://maunium.net/XhhfHoPejeneOngMyBbtyWDk
  always_tombstone_on_supergroup_migration: false
  image_as_file_pixels: 16777216
  disable_view_once: false
  video_url_preview_as_file: false
  bridge_communities: true
  extev_polls: false
  displayname_template: "{{ if .Deleted }}Deleted account {{ .UserID }}{{ else }}{{ .FullName }}{{ end }} (Telegram)"
bridge:
  command_prefix: '!tg'
  personal_filtering_spaces: true
  private_chat_portal_meta: true
  async_events: false
  split_portals: false
  # Keep false: true re-sends the bridge info state event to every room on each start.
  resend_bridge_info: false
  cleanup_unknown_rooms: false
  no_bridge_info_state_key: false
  bridge_status_notices: errors
  transient_state_debounce: 0s
  send_reconnect_wait: 1m
  unknown_error_auto_reconnect: 5m
  unknown_error_max_auto_reconnects: 10
  bridge_matrix_leave: false
  drop_matrix_profile_changes: false
  bridge_notices: false
  tag_only_on_create: true
  only_bridge_tags: [m.favourite, m.lowpriority]
  mute_only_on_create: true
  deduplicate_matrix_messages: false
  # 0 acks the source only after Matrix accepted the message; the default 64-slot buffer
  # makes later failures silent losses (README, "Decisions").
  portal_event_buffer: 0
  cross_room_replies: false
  revert_failed_state_changes: false
  kick_matrix_users: true
  enable_send_state_requests: false
  phone_numbers_in_profile: false
  view_limited_media: false
  cleanup_on_logout:
    enabled: false
    manual:
      private: nothing
      relayed: nothing
      shared_no_users: nothing
      shared_has_users: nothing
    bad_credentials:
      private: nothing
      relayed: nothing
      shared_no_users: nothing
      shared_has_users: nothing
  relay:
    enabled: false
    admin_only: true
    prefer_default: true
    allow_bridge: true
    default_relays: []
    user_distinguishers: ["\U0001F7E6", "\U0001F7E3", "\U0001F7E9", "\U00002B55\U0000FE0F", "\U0001F536", "\U00002B1B\U0000FE0F", "\U0001F535", "\U0001F7E2"]
    message_formats:
      m.text: "<b>{{ .Sender.DisambiguatedName }}</b>: {{ .Message }}"
      m.notice: "<b>{{ .Sender.DisambiguatedName }}</b>: {{ .Message }}"
      m.emote: "* <b>{{ .Sender.DisambiguatedName }}</b> {{ .Message }}"
      m.file: "<b>{{ .Sender.DisambiguatedName }}</b> sent a file{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.image: "<b>{{ .Sender.DisambiguatedName }}</b> sent an image{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.audio: "<b>{{ .Sender.DisambiguatedName }}</b> sent an audio file{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.video: "<b>{{ .Sender.DisambiguatedName }}</b> sent a video{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.location: "<b>{{ .Sender.DisambiguatedName }}</b> sent a location{{ if .Caption }}: {{ .Caption }}{{ end }}"
    displayname_format: "{{ .DisambiguatedName }}"
  portal_create_filter:
    mode: deny
    list: []
    always_deny_from_login: []
  permissions:
    example.com: user
    '@admin:example.com': admin
database:
  type: postgres
  uri: postgres://matrix:${MATRIX_DB_PASSWORD}@postgres-rw.postgres.svc.cluster.local:5432/telegram?sslmode=disable
  max_open_conns: 10
  max_idle_conns: 1
  max_conn_idle_time: null
  max_conn_lifetime: null
homeserver:
  address: http://synapse:8008
  domain: example.com
  software: standard
  status_endpoint:
  message_send_checkpoint_endpoint:
  async_media: false
  websocket: false
  ping_interval_seconds: 0
  retry_limit: 150
  max_connections: 0
appservice:
  address: http://telegram-bridge:29317
  public_address: https://matrix.example.com
  hostname: 0.0.0.0
  port: 29317
  id: telegram
  bot:
    username: telegrambot
    displayname: Telegram bridge bot
    avatar: mxc://maunium.net/tJCRmUyJDsgRNgqhOgoiHWbX
  ephemeral_events: false
  async_transactions: false
  as_token: "${MATRIX_TELEGRAM_AS_TOKEN}"
  hs_token: "${MATRIX_TELEGRAM_HS_TOKEN}"
  username_template: telegram_{{.}}
matrix:
  message_status_events: false
  delivery_receipts: false
  message_error_notices: true
  sync_direct_chat_list: true
  federate_rooms: true
  upload_file_threshold: 5242880
  ghost_extra_profile_info: false
  max_download_size: -1
analytics:
  token: null
  url: https://api.segment.io/v1/track
  user_id: null
provisioning:
  shared_secret: "${MATRIX_TELEGRAM_PROVISIONING_SECRET}"
  allow_matrix_auth: true
  debug_endpoints: false
  fail_on_webauthn: false
  request_id_header: Request-Id
  trust_incoming_request_id: false
public_media:
  enabled: false
  signing_key: "${MATRIX_TELEGRAM_PUBLIC_MEDIA_KEY}"
  expiry: 0
  hash_length: 32
  path_prefix: /_mautrix/publicmedia
  use_database: false
direct_media:
  serve_only: false
  enabled: false
  encrypted: false
  server_name: telegram-media.invalid
  well_known_response:
  media_id_prefix:
  allow_proxy: true
  server_key: "${MATRIX_TELEGRAM_DIRECT_MEDIA_KEY}"
backfill:
  enabled: true
  max_initial_messages: 5000
  max_catchup_messages: 5000
  unread_hours_threshold: 720
  threads:
    max_initial_messages: 50
  queue:
    enabled: false
    manual: false
    batch_size: 100
    batch_delay: 20
    max_batches: -1
    max_batches_override: {}
double_puppet:
  servers:
    anotherserver.example.org: https://matrix.anotherserver.example.org
  allow_discovery: false
  secrets:
    example.com: "as_token:${MATRIX_TELEGRAM_DOUBLEPUPPET_AS_TOKEN}"
encryption:
  allow: true
  default: false
  require: false
  appservice: true
  msc4190: true
  msc4392: false
  self_sign: false
  allow_key_sharing: false
  plaintext_mentions: false
  # Changing it makes the stored encryption sessions unreadable.
  pickle_key: "${MATRIX_TELEGRAM_PICKLE_KEY}"
  delete_keys:
    delete_outbound_on_ack: false
    dont_store_outbound: false
    ratchet_on_decrypt: false
    delete_fully_used_on_decrypt: false
    delete_prev_on_new_session: false
    delete_on_device_delete: false
    periodically_delete_expired: false
    delete_outdated_inbound: false
  verification_levels:
    receive: unverified
    send: unverified
    share: cross-signed-tofu
  rotation:
    enable_custom: false
    milliseconds: 604800000
    messages: 100
    disable_device_change_key_rotation: false
# Null on purpose: the MXCFG_ overrides are plain keys above.
env_config_prefix: null
logging:
  min_level: debug
  writers:
    - type: stdout
      format: pretty-colored
