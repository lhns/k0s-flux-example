# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
    name: telegram-bridge-values
    namespace: gen-app-matrix
stringData:
    MATRIX_TELEGRAM_PICKLE_KEY: CHANGEME-MATRIX_TELEGRAM_PICKLE_KEY
    MATRIX_TELEGRAM_PROVISIONING_SECRET: CHANGEME-MATRIX_TELEGRAM_PROVISIONING_SECRET
    MATRIX_TELEGRAM_PUBLIC_MEDIA_KEY: CHANGEME-MATRIX_TELEGRAM_PUBLIC_MEDIA_KEY
    MATRIX_TELEGRAM_DIRECT_MEDIA_KEY: CHANGEME-MATRIX_TELEGRAM_DIRECT_MEDIA_KEY
    MATRIX_TELEGRAM_API_ID: CHANGEME-MATRIX_TELEGRAM_API_ID
    MATRIX_TELEGRAM_API_HASH: CHANGEME-MATRIX_TELEGRAM_API_HASH
