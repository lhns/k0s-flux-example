    MATRIX_INSTAGRAM_AS_TOKEN: CHANGEME-MATRIX_INSTAGRAM_AS_TOKEN
    MATRIX_INSTAGRAM_HS_TOKEN: CHANGEME-MATRIX_INSTAGRAM_HS_TOKEN
    MATRIX_SIGNAL_AS_TOKEN: CHANGEME-MATRIX_SIGNAL_AS_TOKEN
    MATRIX_SIGNAL_HS_TOKEN: CHANGEME-MATRIX_SIGNAL_HS_TOKEN
    MATRIX_TELEGRAM_AS_TOKEN: CHANGEME-MATRIX_TELEGRAM_AS_TOKEN
    MATRIX_TELEGRAM_HS_TOKEN: CHANGEME-MATRIX_TELEGRAM_HS_TOKEN
    MATRIX_WHATSAPP_AS_TOKEN: CHANGEME-MATRIX_WHATSAPP_AS_TOKEN
    MATRIX_WHATSAPP_HS_TOKEN: CHANGEME-MATRIX_WHATSAPP_HS_TOKEN
    MATRIX_SIP_AS_TOKEN: CHANGEME-MATRIX_SIP_AS_TOKEN
