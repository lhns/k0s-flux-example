    MATRIX_WHATSAPP_PICKLE_KEY: CHANGEME-MATRIX_WHATSAPP_PICKLE_KEY
    MATRIX_WHATSAPP_PROVISIONING_SECRET: CHANGEME-MATRIX_WHATSAPP_PROVISIONING_SECRET
    MATRIX_WHATSAPP_PUBLIC_MEDIA_KEY: CHANGEME-MATRIX_WHATSAPP_PUBLIC_MEDIA_KEY
    MATRIX_WHATSAPP_DIRECT_MEDIA_KEY: CHANGEME-MATRIX_WHATSAPP_DIRECT_MEDIA_KEY
