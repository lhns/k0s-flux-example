# The s3 media storage provider and its CLI extras, baked onto the synapse image so
# /pymods can be mounted as an image volume instead of installed into a PVC at pod start.
# Runnable, not `scratch`: the media sweep CronJob runs this image as its CONTAINER image,
# because kustomize's ImageTagTransformer has no fieldspec under a CronJob's jobTemplate
# and would leave a bare image-volume reference unrewritten.
apiVersion: oci.lhns.de/v1alpha1
kind: ImageBuild
metadata:
  # namespace explicit: this app has no `namespace:` transformer, and the generator
  # builds the repo path from metadata.namespace.
  name: synapse-pymods
  namespace: matrix
spec:
  interval: 1h
  platforms: [linux/amd64]
  dockerfile:
    inline: |
      # Must be the exact tag the synapse container runs: the modules are resolved
      # against this interpreter. scripts/validate.sh enforces it.
      # renovate: datasource=docker
      FROM matrixdotorg/synapse:v1.161.0@sha256:6b95dd129e35e97e8032cb759e5db4a516a5f7ef6c98d34d716fea1ae239b62a
      # --no-deps is load-bearing: pip --target ignores site-packages, so a full resolve
      # builds psycopg2 from source and there is no compiler here. psycopg2, Twisted and
      # PyYAML are CLI-only deps of the provider and are already in the image.
      # renovate: datasource=pypi
      RUN pip install --no-cache-dir --target=/pymods --no-deps synapse-s3-storage-provider==1.6.1
      # renovate: datasource=pypi
      RUN pip install --no-cache-dir --target=/pymods boto3==1.43.72
      # humanize and tqdm are used only by the s3_media_upload CLI the sweep runs.
      # renovate: datasource=pypi
      RUN pip install --no-cache-dir --target=/pymods humanize==4.16.0
      # renovate: datasource=pypi
      RUN pip install --no-cache-dir --target=/pymods tqdm==4.70.0
      # chmod because synapse reads this as uid 991 off a read-only mount; pip's modes are
      # world-readable by umask, which is not something startup should rest on.
      RUN python -c "import sys; sys.path.insert(0,'/pymods'); import s3_storage_provider, boto3, humanize, tqdm" \
       && test -x /pymods/bin/s3_media_upload \
       && chmod -R a+rX /pymods
  push:
    # No repository and no tags: the root generator patches push.tags with the spec hash
    # it also writes into the consumer's reference. See templates/kustomizations.yaml.
    history: 10
