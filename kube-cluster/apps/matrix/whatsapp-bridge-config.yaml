# mautrix-whatsapp (lhns fork: dm_room_name_template, group_room_name_template). Site config for
# the mxmain binary, mounted read-only and started with -c -n, so nothing here is rewritten by
# the config upgrader: a key the binary adds in a new release is absent until it is added here
# (scripts/bridge-config-sync.py adds it).
#
# Credentials are substitution placeholders Flux fills from substitution-secrets/. The
# generator makes this a SECRET (as-secret annotation in kustomization.yaml); drop it and
# they are applied in the clear. A literal dollar-brace anywhere here, comments included,
# must be a variable; write any other dollar as two.
#
# as_token/hs_token are the same variables as registrations/whatsapp.yaml: rotate one side
# alone and Synapse answers 403 to every transaction.
#
# pickle_key, shared_secret, signing_key and server_key must never be the literal `generate`:
# under -n it would be regenerated on every start.
network:
  os_name: Mautrix-WhatsApp bridge
  browser_name: unknown
  proxy: null
  get_proxy_url: null
  proxy_only_login: false
  displayname_template: '{{or .BusinessName .PushName .Phone .RedactedPhone "Unknown user"}} (WA)'
  # Fork options: with them set, renaming a group from Matrix is refused (see the image comment in resources.yaml).
  dm_room_name_template: '{{or .FullName .BusinessName .PushName .Phone}} (WA)'
  group_room_name_template: '{{.Name}} (WA)'
  call_start_notices: true
  identity_change_notices: false
  send_presence_on_typing: false
  enable_status_broadcast: true
  disable_status_broadcast_send: true
  mute_status_broadcast: true
  pinned_tag: m.favourite
  archive_tag:
  status_broadcast_tag: m.lowpriority
  whatsapp_thumbnail: false
  url_previews: false
  extev_polls: false
  disable_view_once: false
  force_active_delivery_receipts: false
  direct_media_auto_request: true
  initial_auto_reconnect: true
  use_whatsapp_retry_store: false
  max_member_sync: -1
  lazy_avatars: false
  animated_sticker:
    target: webp
    args:
      width: 320
      height: 320
      fps: 25
  history_sync:
    max_initial_conversations: -1
    request_full_sync: true
    dispatch_wait: 1m
    full_sync_config:
      days_limit: null
      size_mb_limit: null
      storage_quota_mb: null
    media_requests:
      auto_request_media: true
      request_method: immediate
      request_local_time: 120
      max_async_handle: 2
    backwards_on_demand: false
bridge:
  command_prefix: "!wa"
  personal_filtering_spaces: true
  private_chat_portal_meta: true
  async_events: false
  split_portals: false
  # Keep false: true re-sends the bridge info state event to every room on each start.
  resend_bridge_info: false
  no_bridge_info_state_key: false
  bridge_status_notices: errors
  transient_state_debounce: 0s
  send_reconnect_wait: 1m
  unknown_error_auto_reconnect: 5m
  unknown_error_max_auto_reconnects: 10
  bridge_matrix_leave: false
  bridge_notices: false
  tag_only_on_create: true
  only_bridge_tags: [m.favourite, m.lowpriority]
  mute_only_on_create: true
  deduplicate_matrix_messages: false
  # 0 acks the source only after Matrix accepted the message; the default 64-slot buffer
  # makes later failures silent losses (README, "Decisions").
  portal_event_buffer: 0
  cross_room_replies: false
  revert_failed_state_changes: false
  kick_matrix_users: true
  enable_send_state_requests: false
  phone_numbers_in_profile: false
  view_limited_media: false
  cleanup_on_logout:
    enabled: false
    manual:
      private: nothing
      relayed: nothing
      shared_no_users: nothing
      shared_has_users: nothing
    bad_credentials:
      private: nothing
      relayed: nothing
      shared_no_users: nothing
      shared_has_users: nothing
  relay:
    enabled: true
    admin_only: false
    prefer_default: true
    allow_bridge: true
    default_relays: []
    user_distinguishers: ["\U0001F7E6", "\U0001F7E3", "\U0001F7E9", "\U00002B55\U0000FE0F", "\U0001F536", "\U00002B1B\U0000FE0F", "\U0001F535", "\U0001F7E2"]
    message_formats:
      m.text: "<b>{{ .Sender.DisambiguatedName }}</b>: {{ .Message }}"
      m.notice: "<b>{{ .Sender.DisambiguatedName }}</b>: {{ .Message }}"
      m.emote: "* <b>{{ .Sender.DisambiguatedName }}</b> {{ .Message }}"
      m.file: "<b>{{ .Sender.DisambiguatedName }}</b> sent a file{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.image: "<b>{{ .Sender.DisambiguatedName }}</b> sent an image{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.audio: "<b>{{ .Sender.DisambiguatedName }}</b> sent an audio file{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.video: "<b>{{ .Sender.DisambiguatedName }}</b> sent a video{{ if .Caption }}: {{ .Caption }}{{ end }}"
      m.location: "<b>{{ .Sender.DisambiguatedName }}</b> sent a location{{ if .Caption }}: {{ .Caption }}{{ end }}"
    displayname_format: "{{ .DisambiguatedName }}"
  portal_create_filter:
    mode: deny
    list: []
    always_deny_from_login: []
  permissions:
    "example.com": user
    "@admin:example.com": admin
database:
  type: postgres
  uri: postgres://matrix:${MATRIX_DB_PASSWORD}@postgres-rw.postgres.svc.cluster.local/whatsapp?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 2
  max_conn_idle_time: null
  max_conn_lifetime: null
homeserver:
  address: http://synapse:8008
  domain: example.com
  software: standard
  status_endpoint: null
  message_send_checkpoint_endpoint: null
  async_media: false
  websocket: false
  ping_interval_seconds: 0
  retry_limit: 150
appservice:
  address: http://whatsapp-bridge:29318
  public_address: https://matrix.example.com
  hostname: 0.0.0.0
  port: 29318
  id: whatsapp
  bot:
    username: whatsappbot
    displayname: WhatsApp bridge bot
    avatar: mxc://maunium.net/NeXNQarUbrlYBiPCpprYsRqr
  ephemeral_events: true
  async_transactions: false
  as_token: "${MATRIX_WHATSAPP_AS_TOKEN}"
  hs_token: "${MATRIX_WHATSAPP_HS_TOKEN}"
  username_template: whatsapp_{{.}}
matrix:
  message_status_events: false
  delivery_receipts: false
  message_error_notices: true
  sync_direct_chat_list: true
  federate_rooms: true
  upload_file_threshold: 5242880
  ghost_extra_profile_info: false
analytics:
  token: null
  url: https://api.segment.io/v1/track
  user_id: null
provisioning:
  shared_secret: "${MATRIX_WHATSAPP_PROVISIONING_SECRET}"
  allow_matrix_auth: true
  debug_endpoints: false
  enable_session_transfers: false
  fail_on_webauthn: false
  request_id_header: Request-Id
  trust_incoming_request_id: false
public_media:
  enabled: false
  signing_key: "${MATRIX_WHATSAPP_PUBLIC_MEDIA_KEY}"
  expiry: 0
  hash_length: 32
  path_prefix: /_mautrix/publicmedia
  use_database: false
direct_media:
  enabled: false
  server_name: whatsapp-media.invalid
  well_known_response:
  media_id_prefix:
  allow_proxy: true
  server_key: "${MATRIX_WHATSAPP_DIRECT_MEDIA_KEY}"
backfill:
  enabled: true
  max_initial_messages: 50
  max_catchup_messages: 500
  unread_hours_threshold: 720
  threads:
    max_initial_messages: 50
  queue:
    enabled: false
    manual: false
    batch_size: 100
    batch_delay: 20
    max_batches: -1
    max_batches_override: {}
double_puppet:
  servers: {}
  allow_discovery: false
  secrets:
    example.com: "as_token:${MATRIX_WHATSAPP_DOUBLEPUPPET_AS_TOKEN}"
encryption:
  allow: true
  default: false
  require: false
  appservice: false
  msc4190: true
  msc4392: false
  self_sign: false
  allow_key_sharing: false
  plaintext_mentions: false
  # Changing it makes the stored encryption sessions unreadable.
  pickle_key: "${MATRIX_WHATSAPP_PICKLE_KEY}"
  delete_keys:
    delete_outbound_on_ack: false
    dont_store_outbound: false
    ratchet_on_decrypt: false
    delete_fully_used_on_decrypt: false
    delete_prev_on_new_session: false
    delete_on_device_delete: false
    periodically_delete_expired: false
    delete_outdated_inbound: false
  verification_levels:
    receive: unverified
    send: unverified
    share: cross-signed-tofu
  rotation:
    enable_custom: false
    milliseconds: 604800000
    messages: 100
    disable_device_change_key_rotation: false
# Null on purpose: the MXCFG_ overrides are plain keys above.
env_config_prefix: null
logging:
  writers:
    - type: stdout
      format: pretty-colored
      min_level: debug
      time_format: Jan _2, 2006 15:04:05
  min_level: debug
