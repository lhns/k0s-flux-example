# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# Synapse media storage provider -> s3.example.com, bucket "synapse".
#
# A --config-path overlay rather than an edit to homeserver.yaml, the same
# mechanism secret-synapse.yaml uses for the database block. SOPS because it
# carries the S3 secret key; everything else here is plain config.
#
# The module itself is NOT in the stock synapse image -- an initContainer
# pip-installs it into /pymods and PYTHONPATH points there. See resources.yaml.
#
# store_local + store_remote: every upload is written to local disk AND to S3.
# Local copies are removed later by the s3_media_upload sweep, not by synapse.
#
# store_synchronous is FALSE deliberately. Synapse writes to the local media
# store -- 3x-replicated NVMe -- before the provider is called at all, so the
# file is already durable; blocking the client on a round trip to an external
# S3 would gate the fast leg on the slow one for a copy that is only secondary.
# The sweep is the retry path for uploads that fail in the background, and it
# deletes a local file only after a verified successful upload.
#
# Path-style addressing is NOT set here on purpose: the provider constructs its
# own botocore Config() and never passes s3.addressing_style, so it can only
# come from the shared AWS config file. See the synapse-aws-config ConfigMap
# and AWS_CONFIG_FILE in resources.yaml.
apiVersion: v1
kind: Secret
metadata:
    name: synapse-media-s3
    namespace: matrix
type: Opaque
stringData:
    media-s3.yaml: CHANGEME-media-s3.yaml
