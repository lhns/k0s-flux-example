apiVersion: v1
kind: Namespace
metadata:
  name: homebox
---
# Homebox's /data (uploaded attachments/images). The DB lives in CNPG, so this volume
# holds files only (the old bundled SQLite was dropped in the CephFS migration) ->
# CephFS RWX, which lets the Deployment do start-first rolling updates.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homebox-data
  namespace: homebox
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: homebox
  annotations:
    # roll the pod when a referenced Secret changes (rotation): env-var values are
    # never updated in a running pod, and mounted files still need a re-read.
    reloader.stakater.com/auto: "true"
spec:
  # DB in CNPG; /data (files only) on CephFS RWX -> start-first rolling updates
  # (new pod up before old down; both briefly share /data + the DB during rollover).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homebox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homebox
        app.kubernetes.io/instance: homebox
        # receive from traefik; reach the CNPG primary. OIDC calls to auth.example.com
        # are external egress (unrestricted under the ingress-only baseline).
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.postgres.postgres: egress
    spec:
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:0.26.2
          env:
            - name: TZ
              value: Europe/Berlin
            # Database in the shared CNPG cluster (dedicated homebox role + db).
            # SSL_MODE require = encrypt without cert-verify (CNPG CA is self-signed).
            - name: HBOX_DATABASE_DRIVER
              value: postgres
            - name: HBOX_DATABASE_HOST
              value: postgres-rw.postgres.svc.cluster.local
            - name: HBOX_DATABASE_PORT
              value: "5432"
            - name: HBOX_DATABASE_USERNAME
              value: homebox
            - name: HBOX_DATABASE_DATABASE
              value: homebox
            - name: HBOX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homebox-db
                  key: password
            - name: HBOX_DATABASE_SSL_MODE
              value: require
            # API-key pepper (hashes API keys) — SOPS secret, must stay stable.
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: homebox-secrets
                  key: pepper
            # Behind Traefik; canonical host drives the OIDC callback URL.
            - name: HBOX_OPTIONS_HOSTNAME
              value: homebox.example.com
            - name: HBOX_OPTIONS_TRUST_PROXY
              value: "true"
            - name: HBOX_OPTIONS_ALLOW_REGISTRATION
              value: "false"
            - name: HBOX_OPTIONS_ALLOW_ANALYTICS
              value: "false"
            # SSO only — no built-in login form (OIDC via Authelia).
            - name: HBOX_OPTIONS_ALLOW_LOCAL_LOGIN
              value: "false"
            - name: HBOX_OIDC_ENABLED
              value: "true"
            - name: HBOX_OIDC_ISSUER_URL
              value: https://auth.example.com
            - name: HBOX_OIDC_CLIENT_ID
              value: homebox
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homebox-secrets
                  key: oidc-client-secret
            - name: HBOX_OIDC_AUTO_REDIRECT
              value: "true"
            - name: HBOX_OIDC_NAME_CLAIM
              value: preferred_username
          ports:
            - name: http
              containerPort: 7745
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homebox-data
---
apiVersion: v1
kind: Service
metadata:
  name: homebox
  namespace: homebox
spec:
  selector:
    app.kubernetes.io/name: homebox
  ports:
    - name: http
      port: 7745
      targetPort: http
