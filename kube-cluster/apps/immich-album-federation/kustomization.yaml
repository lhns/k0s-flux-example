apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Needs the CNPG cluster + Database/DatabaseRole CRDs (infra-postgres) and
    # Reflector (infra-reflector) to mirror the db secret into this namespace.
    # Read by the root generator; inert to kustomize. No `namespace:` transformer
    # here — database.yaml/db-role-secret.yaml live in the postgres ns and every
    # resource sets its own namespace.
    dependsOn: infra-postgres,infra-reflector,infra-reloader
resources:
- resources.yaml
- database.yaml
- db-role-secret.yaml
# The peer list as a real file. Only the two apiKeys are credentials; the peer names,
# URLs and cleanupOrphans flags are plain config, so the generator patches this into a
# Secret rather than the whole list being an encrypted blob.
configMapGenerator:
- name: immich-album-federation-config
  namespace: immich-album-federation
  files:
  - config.yaml=federation-config.yaml
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
