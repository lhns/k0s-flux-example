# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: immich-album-federation-values
    namespace: flux-system
stringData:
    IMMICH_FED_APIKEY_LHNS: CHANGEME-IMMICH_FED_APIKEY_LHNS
    IMMICH_FED_APIKEY_MAX: CHANGEME-IMMICH_FED_APIKEY_MAX
type: Opaque
