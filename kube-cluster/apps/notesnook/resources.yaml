# ===========================================================================
# web client — self-hosted Notesnook web SPA. Community image (E2E keys are
# client-side; flagged in README). Server URLs set at runtime via the app's
# Settings -> Servers. Port verified at deploy (nginx-served SPA).
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesnook-web
  namespace: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-web
        app.kubernetes.io/instance: notesnook
        kube-vnet/net.traefik.traefik: ingress
    spec:
      enableServiceLinks: false
      containers:
        - name: notesnook-web
          # heyfworld/notesnook-web:latest — community build of upstream apps/web,
          # rebuilt 2026-07-24 from the current fork (github.com/heyfworld/notesnook).
          # Newer than dyw770:3.0.23, which read the OLD subscription.type field and
          # showed Basic; this tracks the new `plan` field so self-hosted Pro renders.
          # Only :latest is published, so we pin the digest for reproducibility.
          #
          # This build points the SPA at our servers via NN_* env vars: its
          # entrypoint runs envsubst over config.js.template -> config.js, which the
          # app reads at startup (window.__notesnook_hosts__). If these are unset the
          # app falls back to the hardcoded cloud URLs (api.notesnook.com) — which is
          # what made a test account land on the PUBLIC instance as Free. (The older
          # dyw770 image instead read /urls.json; this build ignores that file.)
          image: heyfworld/notesnook-web:latest@sha256:2bb3b0273e787829c632d3d33b82f995a5e4bc1a0efa0001d2e01d5e91ec76cd
          env:
            - {name: NN_API_HOST, value: "https://notes-sync.example.com"}
            - {name: NN_AUTH_HOST, value: "https://notes-auth.example.com"}
            - {name: NN_SSE_HOST, value: "https://notes-events.example.com"}
            - {name: NN_MONOGRAPH_HOST, value: "https://notes.example.com"}
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-web
  namespace: notesnook
spec:
  selector:
    app.kubernetes.io/name: notesnook-web
  ports:
    - {name: http, port: 80, targetPort: http}
