    DB_PASSWORD: CHANGEME-DB_PASSWORD
    MYSQL_ROOT_PASSWORD: CHANGEME-MYSQL_ROOT_PASSWORD
    AUTH_JWT_SECRET: CHANGEME-AUTH_JWT_SECRET
    AUTH_SERVER_ENCRYPTION_SERVER_KEY: CHANGEME-AUTH_SERVER_ENCRYPTION_SERVER_KEY
    VALET_TOKEN_SECRET: CHANGEME-VALET_TOKEN_SECRET
