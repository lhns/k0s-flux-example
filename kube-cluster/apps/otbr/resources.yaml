# macvlan, not an ordinary pod: a Thread border router advertises the mesh prefix into
# the LAN with Router Advertisements, which are link-local multicast and need a real L2
# presence. Same as ../matter-server (.8).
#
# The tuning plugin sets the IPv6 sysctls at CNI time -- the container cannot
# (/proc/sys is read-only) and securityContext.sysctls cannot either
# (net.ipv6.conf.all.forwarding is not on kubelet's safe list).
#   forwarding=1 makes it a router.
#   accept_ra=2, not 1: with forwarding on, Linux ignores RAs unless accept_ra is 2, and
#   without it this pod never learns the upstream prefix.
#
# NO gateway in the ipam block: it would install a default route via net1 and hijack
# egress away from eth0, breaking cluster DNS and API access.
#
# 10.20.37.150 is macvlan space by convention -- 10.20.176.x is MetalLB, and a macvlan pod in
# that range is invisible to MetalLB, which would hand the same address to a Service.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: otbr
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens18",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "addresses": [{"address": "10.20.37.150/16"}]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.all.forwarding": "1",
            "net.ipv6.conf.IFNAME.accept_ra": "2"
          }
        }
      ]
    }
---
# The Active Operational Dataset: the Thread network's identity. Lose this volume and
# every commissioned device is orphaned and must be re-commissioned by hand.
#
# cephfs, not ceph-rbd: a flat file rewritten via tmp+rename needs no block volume (ADR 0007).
#
# RWX, as matter-server does. Single-writer is enforced by strategy: Recreate below, which
# the fixed macvlan address and the single radio require anyway.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otbr-dataset
  namespace: otbr
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr
  namespace: otbr
spec:
  replicas: 1
  # Recreate for two independent reasons: the fixed macvlan address, and
  # the single radio — two border routers cannot share one RCP.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otbr
  template:
    metadata:
      annotations:
        # Attach the LAN interface as net1, in addition to the pod network on eth0.
        k8s.v1.cni.cncf.io/networks: lan
      labels:
        app.kubernetes.io/name: otbr
        app.kubernetes.io/instance: otbr
        # Home Assistant reaches the REST API on the ClusterIP over eth0, the policed
        # interface. Everything that makes this a border router — RAs, mesh forwarding,
        # mDNS — happens on net1, which kube-vnet does NOT see: NetworkPolicy is not
        # applied to secondary interfaces. See the README; for a router that is a larger
        # hole than it is for matter-server, and it is accepted deliberately.
        kube-vnet/net.otbr: ingress
    spec:
      enableServiceLinks: false
      # socat is mounted from the image that ships it and the launcher from a ConfigMap: the
      # OTBR image has no socat/netcat/curl and its glibc 2.27 is too old for a prebuilt one,
      # so the alpine musl loader runs it (see socat-launcher). It must run inside the OTBR
      # container: a pty belongs to the /dev/pts of the container that created it.
      containers:
        - name: otbr
          # Bare digest, not tag@digest: upstream publishes exactly one tag (`latest`), so a tag
          # tracks nothing. Every other pin in this repo is tag@digest.
          #
          # DO NOT BUMP WITHOUT A THREAD NETWORK TO TEST ON. This pin is half a contract with the
          # RCP firmware on the SLZB-MR5U, which lives outside the cluster -- nothing in CI can
          # tell whether a digest works, so Renovate is dashboard-gated for it.
          #
          # Two digests are known bad (58a44e6c, 42b358ed): otbr-agent aborts in
          # otPlatRadioSetMacKey() after the RCP reset. Treat the next as bad until proven
          # otherwise; the fix is usually a firmware update, not a newer image.
          #
          # The failure is SILENT: otbr-agent is not PID 1, so its abort leaves the pod Running
          # with only the :8081 readiness probe red. Watch for 0/1 after any bump.
          image: openthread/otbr@sha256:1affd00c9912808f1c4f30aa41499cc09f3e18e6316c85069e02a9dddf8c9e0b
          securityContext:
            capabilities:
              add:
                # NET_ADMIN: create the wpan0 TUN interface, add routes, run ip6tables for
                # the Thread firewall. NET_RAW: ICMPv6 (Router Advertisements, ND).
                # Not privileged — the container still cannot write /proc/sys, which is
                # why the sysctls come from the CNI tuning plugin above.
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TZ
              value: Europe/Berlin
            # No TCP radio scheme exists, so forkpty runs socat; nodelay (no Nagle) matters because
            # the link is already out of spec on latency. The pty is raw (cfmakeraw), so binary
            # spinel is not mangled.
            - name: RADIO_URL
              value: "spinel+hdlc+forkpty:///opt/socat-bin/socat.sh?forkpty-arg=-&forkpty-arg=tcp:10.20.62.170:7638,nodelay"
            # The infrastructure ("backbone") interface: where RAs are sent, where mDNS is
            # answered, where the mesh prefix is advertised. This MUST be net1. The image
            # defaults it to eth0, which would advertise Thread into the pod network and
            # be invisible to every real device on the LAN.
            - name: BACKBONE_INTERFACE
              value: net1
            - name: TUN_INTERFACE_NAME
              value: wpan0
            # The entrypoint passes $REST_HOST to --rest-listen-address (default 127.0.0.1).
            # The REST API is unauthenticated and serves the Thread network key: bind it to the
            # pod IP (eth0, the ClusterIP path), never 0.0.0.0, which includes net1 (ADR 0031).
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REST_HOST
              value: $(POD_IP)
            # ...while the web UI stays on loopback. It is an unauthenticated admin
            # interface that can erase the dataset, and this pod is on the LAN with no
            # NetworkPolicy in front of net1. Reach it with `kubectl port-forward` when
            # needed. Explicit rather than relying on the default, since REST_HOST above
            # would otherwise have silently taken this value.
            - name: HTTP_HOST
              value: 127.0.0.1
            # NAT64 lets Thread devices reach IPv4 hosts. Off: it is not needed for Matter
            # (the fabric is IPv6-only), it pulls in iptables NAT and DNS64, and the
            # entrypoint aborts the container outright if it fails to start. One fewer way
            # for a first deployment to fail. Flip to "1" if a Thread device ever needs
            # IPv4.
            - name: NAT64
              value: "0"
            # Off because the entrypoint aborts the container without ip6table_filter, which the
            # nodes lack and the image cannot load. Mesh-to-LAN traffic is therefore unfiltered
            # (net1 is outside NetworkPolicy anyway). Restore: load the module on the workers
            # via k0sctl.yaml, then drop this variable.
            - name: FIREWALL
              value: "0"
            # 6 = INFO. The default is 7 (DEBUG), which is a firehose of spinel frames.
            # Set it back to 7 when debugging the radio link — that is where HDLC parse
            # errors and RCP timeouts show up.
            - name: DEBUG_LEVEL
              value: "6"
          ports:
            - name: rest
              containerPort: 8081
          readinessProbe:
            timeoutSeconds: 5
            # tcpSocket, not httpGet /node/state: the REST API answers long before the
            # node has attached to (or formed) a mesh, and a probe that failed while
            # detached would restart the pod exactly when it is trying to re-attach.
            # Mesh health is a thing to look at, not to gate readiness on.
            tcpSocket:
              port: rest
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          # Generous for a ~30Mi process: an OOM-killed otbr-agent fails silently (pod stays Running).
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/thread
            - name: socat
              mountPath: /opt/socat
              readOnly: true
            # The launcher, executed in place. A ConfigMap volume is read-only but executable,
            # which is all this needs — the old initContainer wrote it and chmod-ed it because
            # it had an emptyDir to write into.
            - name: socat-launcher
              mountPath: /opt/socat-bin
              readOnly: true
            # OTBR creates wpan0, a TUN interface, which needs the host's tun device node.
            # This is the one piece of node access here; it is a single character device
            # and cannot be narrowed further.
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otbr-dataset
        # alpine/socat, mounted rather than copied out of.
        #
        # TAG **and** digest. Upstream publishes real version tags here (unlike openthread/otbr),
        # and with a bare digest a Renovate PR reads "update digest to e7b1771" — which is what a
        # rebuild of the same version looks like AND what 1.8.0.3 -> 1.8.1.3 looks like. On an
        # image with a history of breaking the border router (1.8.0.2, ot-br-posix#2719) that
        # difference has to be legible. The digest keeps the pin immutable.
        - name: socat
          image:
            # renovate: datasource=docker
            reference: alpine/socat:1.8.1.3@sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842
            pullPolicy: IfNotPresent
        - name: socat-launcher
          configMap:
            name: otbr-socat-launcher
            defaultMode: 0755
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
# The REST API, for Home Assistant's OpenThread Border Router integration:
# http://otbr.otbr:8081. Not exposed through Traefik and not given a MetalLB VIP — it is an
# internal control channel with no authentication of its own, and the pod is already on the
# LAN via net1 for the traffic that needs to be.
apiVersion: v1
kind: Service
metadata:
  name: otbr
  namespace: otbr
spec:
  selector:
    app.kubernetes.io/name: otbr
  ports:
    - name: rest
      port: 8081
      targetPort: rest
