apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # multus: the NetworkAttachmentDefinition CRD must exist and the DaemonSet must be
    # running before a pod requesting `lan` can be created — without it the pod stays
    # ContainerCreating. ceph-csi-cephfs: the /var/lib/thread PVC holding the operational
    # dataset. kube-vnet: vnet.yaml uses its CRDs. Read by the root generator; inert to
    # kustomize.
    flux-component-generator/dependsOn: infra-multus,infra-ceph-csi-cephfs,infra-kube-vnet
resources:
- resources.yaml
- vnet.yaml
configMapGenerator:
# The launcher RADIO_URL forkpty's into; keyed socat.sh because the URL names that filename.
- name: otbr-socat-launcher
  namespace: otbr
  files:
  - socat.sh=socat-launcher
