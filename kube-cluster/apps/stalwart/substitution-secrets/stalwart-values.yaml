# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: stalwart-values
    namespace: flux-system
stringData:
    UMLEITER_DEST_PASSWORD: CHANGEME-UMLEITER_DEST_PASSWORD
    UMLEITER_SOURCE_PASSWORD: CHANGEME-UMLEITER_SOURCE_PASSWORD
    STALWART_DB_PASSWORD: CHANGEME-STALWART_DB_PASSWORD
    STALWART_RECOVERY_ADMIN: CHANGEME-STALWART_RECOVERY_ADMIN
type: Opaque
