---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: remote-docker-workspace
  namespace: remote-docker-ci
spec:
  interval: 1h0m0s
  url: oci://ghcr.io/lhns/charts/remote-docker-workspace
  ref:
    tag: "0.14.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: remote-docker-ci
  namespace: remote-docker-ci
spec:
  interval: 10m0s
  # Two replicas, each waiting for its old pod's dockerd to stop: more than Helm's 5m default.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: remote-docker-workspace
  values:
    fullnameOverride: remote-docker-ci
    # Two independent workspaces, each with its own volumes, host key and ephemeral runs. The
    # Service pins a runner pod's IP to one replica (README.md); `hard` anti-affinity puts them
    # on different nodes, which 3 workers allow.
    replicas: 2
    # One account, so the workspace's own dockerd serves it rather than a nested one.
    perUserDind: false
    # overlay2 refuses Ceph-backed volumes; see apps/remote-docker/README.md.
    dockerdArgs: "--storage-driver=fuse-overlayfs"
    persistence:
      # Renovate's image cache. `size` only applies to a claim that does not exist yet.
      graph:
        size: 20Gi
        storageClass: ceph-rbd
      # Host keys and the uid map.
      state:
        size: 1Gi
        storageClass: ceph-rbd
    # Memory only, as in apps/remote-docker: job containers have no other ceiling.
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 6Gi
    # :9090, annotated by the chart; vnet.yaml admits the otel collector.
    metrics:
      enabled: true
    ingress:
      enabled: false
    commonLabels:
      # Joins vnet.yaml's network, which is what lets the k0s-flux scale set's pods reach :2280.
      kube-vnet/net.remote-docker-ci: ingress
    # Every runner pod of the k0s-flux scale set presents the one key below; the account is
    # ephemeral, so each client process still gets its own port and volumes (ADR 0050 of
    # remote-docker). Clients older than 0.9.0 are refused. The private half is in
    # apps/github-runner/secret-k0s-flux-ssh.yaml.
    ephemeral:
      accounts: [k0s-flux]
      # Per replica (12 in all): the k0s-flux scale set's maxRunners (4), its warm pod's slot and
      # runs still in their grace period, in case every runner lands on one replica.
      maxClients: 6
      grace: 2m
      # Throwaway CI: a finished run's containers and compose networks go with it.
      cleanupContainers: true
    # Runtime keys live in enrolled_keys.d on the `state` claim; authorizedKeys is the
    # declarative base. No external route, so no publicURL: add keys with `remote key add`.
    admins: [lhns]
    authorizedKeys:
      k0s-flux: |
        ssh-ed25519 AAAA<public-key> runner-k0s-flux-0
      # Admin account only; same keys as in apps/remote-docker.
      lhns: |
        ssh-ed25519 AAAA<public-key> remote-docker-vm
        ssh-ed25519 AAAA<public-key> remote-docker-localhost
        ssh-ed25519 AAAA<public-key> remote-docker-admin-laptop
