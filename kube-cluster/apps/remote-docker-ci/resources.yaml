apiVersion: v1
kind: Namespace
metadata:
  name: remote-docker-ci
  labels:
    # The workspace runs dockerd; the chart has no unprivileged mode.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: remote-docker-ci
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
