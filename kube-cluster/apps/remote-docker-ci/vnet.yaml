apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: remote-docker-ci
  namespace: remote-docker-ci
spec:
  description: "SSH-over-WebSocket tunnel :2280, for the k0s-flux scale set in github-runner."
  allowedNamespaces:
    names:
      - github-runner
---
# Scrape target for the otel `cluster` collector; remote-docker-ci must also be in
# infra/opentelemetry-monitoring/release.yaml `namespaces.names`.
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetworkBinding
metadata:
  name: remote-docker-ci-scrape-ingress
  namespace: remote-docker-ci
spec:
  virtualNetworkRef:
    name: otel-scrape
    namespace: opentelemetry
  direction: ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: remote-docker-ci
      app.kubernetes.io/component: workspace
