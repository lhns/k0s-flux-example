apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # ceph-rbd: the graph and state PVCs.
    # Read by the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-ceph-csi-rbd,infra-kube-vnet
resources:
  - resources.yaml
  - vnet.yaml
  - networkpolicy.yaml
  - release.yaml
