apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-alerts
  namespace: matrix-alerts
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-alerts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-alerts
        app.kubernetes.io/instance: matrix-alerts
        # receive from the grafana pod
        kube-vnet/net.matrix-alerts: ingress
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: matrix-alerts
          image: metio/matrix-alertmanager-receiver:2026.9.23@sha256:854b615e109ccbbd0fb7e7a65028d876115d36d522ed65cb564154495e35bc03
          args:
            - --config-path
            - /config/config.yaml
          envFrom:
            - secretRef:
                name: matrix-alerts
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /metrics
              port: http
          livenessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /metrics
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-alerts-config
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-alerts
  namespace: matrix-alerts
spec:
  selector:
    app.kubernetes.io/name: matrix-alerts
  ports:
    - name: http
      port: 8080
      targetPort: http
