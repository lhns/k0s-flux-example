# Shipped as a ConfigMap: comments here are config.
http:
  port: 8080
  alerts-path-prefix: /alerts
  metrics-enabled: true
matrix:
  homeserver-url: https://matrix.example.com
  user-id: "@grafana:example.com"
  access-token: ${MATRIX_ACCESS_TOKEN}
  room-mapping:
    grafana: "!examplegrafanaroomid:example.com"
templating:
  computed-values:
    - values:
        color: white
    - values:
        color: orange
      when-matching-labels:
        severity: warning
    - values:
        color: red
      when-matching-labels:
        severity: critical
    - values:
        color: limegreen
      when-matching-status: resolved
  # No .SilenceURL: it points at an Alertmanager, not Grafana.
  # The matrix.to link becomes an m.mentions entry, so only firing critical alerts notify
  # (ADR 0072); warning, info and resolved messages carry an empty m.mentions.
  # The receiver templates per alert; Grafana's webhook payload (apps/grafana) already folds a
  # group into one pseudo-alert per status: .Labels.count instances, one summary each in
  # the annotations i0000..., which the range below picks out. Without a count label the title
  # already says how many (rules that could not be evaluated); the list still follows.
  firing-template: '
    <p>
      {{ if and (eq .Alert.Status "firing") (eq .Alert.Labels.severity "critical") }}<a href="https://matrix.to/#/@admin:example.com">admin</a>{{ end }}
      <strong><font color="{{ .ComputedValues.color }}">{{ .Alert.Status | ToUpper }}</font></strong>
      {{ .Alert.Labels.alertname }}
      {{ if .Alert.Labels.severity }}[{{ .Alert.Labels.severity }}]{{ end }}
      {{ if eq .Alert.Labels.count "1" }}{{ if .Alert.Annotations.summary }}: {{ .Alert.Annotations.summary }}{{ end }}{{ else if .Alert.Labels.count }}&mdash; {{ .Alert.Labels.count }} instances{{ end }}
      {{ if .Alert.Annotations.description }}<br/>{{ .Alert.Annotations.description }}{{ end }}
    </p>
    {{ if ne .Alert.Labels.count "1" }}<ul>
      {{ range $k, $v := .Alert.Annotations }}{{ if and (ne $k "summary") (ne $k "description") }}<li>{{ $v }}</li>{{ end }}{{ end }}
    </ul>{{ end }}
    <p>
      {{ if .GeneratorURL }}<a href="{{ .GeneratorURL }}">Rule</a>{{ else }}<a href="https://grafana.example.com/alerting/list">Alerts</a>{{ end }}
    </p>'
