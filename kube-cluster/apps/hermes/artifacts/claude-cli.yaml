# The Claude Code CLI, mounted into hermes as an image volume instead of npm-installed into the PVC
# at pod start. The npm package is a thin wrapper around a native glibc binary; Node is only the
# installer here, so the hermes image's Node major does not matter.
apiVersion: oci.lhns.de/v1alpha1
kind: ImageBuild
metadata:
  name: claude-cli
  namespace: hermes
spec:
  interval: 1h
  platforms: [linux/amd64]
  dockerfile:
    inline: |
      # glibc base: the native binary has a musl variant, but the hermes image is Debian.
      # renovate: datasource=docker
      FROM node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d AS build
      # renovate: datasource=npm
      RUN npm install -g --prefix=/claude @anthropic-ai/claude-code@2.1.307
      # chmod because hermes reads this as uid 10000 off a read-only mount.
      RUN /claude/bin/claude --version && chmod -R a+rX /claude

      FROM scratch
      COPY --from=build /claude /claude
  push:
    history: 10
    writeRefTo:
      namespace: gen-app-hermes
      keys:
        ref: CLAUDE_CLI_REF
