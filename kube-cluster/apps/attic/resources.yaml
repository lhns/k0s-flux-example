---
# atticd in monolithic mode: API, migrations and GC in one process, so exactly one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: attic
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
        app.kubernetes.io/instance: attic
        kube-vnet/net.attic: ingress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atticd
          # Upstream publishes branch and commit tags only, no releases.
          image: ghcr.io/zhaofengli/attic:latest@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          args: ["-f", "/config/server.toml", "--mode", "monolithic"]
          env:
            # Hex password (README, "Enabling"): it is spliced into a URL unescaped.
            - name: ATTIC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: attic-db, key: password}}
            - name: ATTIC_SERVER_DATABASE_URL
              value: postgresql://attic:$(ATTIC_DB_PASSWORD)@postgres-rw.postgres.svc.cluster.local:5432/attic
            # Signs every token; replacing it invalidates all of them.
            - name: ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
              valueFrom: {secretKeyRef: {name: attic-token, key: ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: attic-s3-access-key, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: attic-s3-secret-key, key: AWS_SECRET_ACCESS_KEY}}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          # TCP, not HTTP: allowed-hosts rejects the kubelet's Host header (the pod IP).
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: attic-config
        - name: tmp
          emptyDir: {}
---
# Port 80 so nix sends `Host: attic.attic.svc.cluster.local` without a port (allowed-hosts).
apiVersion: v1
kind: Service
metadata:
  name: attic
  namespace: attic
spec:
  selector:
    app.kubernetes.io/name: attic
  ports:
    - {name: http, port: 80, targetPort: http}
