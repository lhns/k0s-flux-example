apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # CNPG (db) + Reflector (db secret into the attic ns). Read by the root generator; inert to
    # kustomize. No `namespace:` transformer: database.yaml and the db secret live in postgres.
    flux-component-generator/dependsOn: infra-postgres,infra-reflector
    # Until the secrets exist: README, "Enabling".
    flux-component-generator/suspend: "true"
resources:
- resources.yaml
- vnet.yaml
- database.yaml
# The secrets go here when they exist (README, "Enabling"); listing them before breaks the build.
configMapGenerator:
- name: attic-config
  namespace: attic
  files:
  - server.toml
