; The master config. Without it Asterisk starts on its compile-time defaults and says so on
; every boot; the paths below are those defaults, written down so a rebuild cannot move one
; underneath the manifests -- astrundir in particular, which is where `asterisk -rx` looks.
[directories](!)
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin
