; Overrides the image's copy to drop vp8. The trunk is audio only, so video would never
; negotiate, and it would double the RTP port arithmetic if it ever did.
[default](!)
disallow=all
allow=ulaw
context=incoming-motif

[jingle-endpoint](default)
context=jingle
transport=ice-udp
; The trunk offers alaw; ulaw/alaw transcoding is built in. g722 is kept because an
; XMPP client may offer it and it costs nothing.
allow=g722
connection=asterisk
accountcode=jingle
