apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Read by the root generator; inert to kustomize.
    #
    # MetalLB for the cheogram-sip-lb VIP (10.20.2.81); reflector because prosody in the
    # snikket ns reads the same two component secrets; reloader for the annotation on the
    # Deployment; app-snikket because the gateway is useless without the prosody components
    # it connects to; app-matrix-substitution-secrets because it owns livekit-sip-trunk,
    # which reflector mirrors here and render-config exits non-zero without.
    dependsOn: infra-metallb,infra-reflector,infra-reloader,app-snikket,app-matrix-substitution-secrets
resources:
- resources.yaml
- routing-release.yaml
- secret-components.yaml
- secret-registrations.yaml
- vnet.yaml
configMapGenerator:
- name: cheogram-sip-env
  namespace: cheogram-sip
  envs:
  - cheogram-sip.env
# The WHOLE of /etc/asterisk except pjsip.conf, which the routing chart generates: the image
# ships none, and render-config copies these into an emptyDir alongside the credentials they
# #include. A file Asterisk wants and does not find here is a module silently running on its
# compiled-in defaults.
- name: cheogram-sip-config
  namespace: cheogram-sip
  files:
  - asterisk.conf
  - modules.conf
  - pjproject.conf
  - xmpp.conf
  - rtp.conf
  - motif.conf
  - extensions.lua
  - logger.conf
  - confbridge.conf
