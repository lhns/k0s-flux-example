apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Read by the root generator; inert to kustomize.
    #
    # MetalLB for the cheogram-sip-lb VIP; reflector mirrors snikket's component secrets here;
    # reloader for the Deployment annotation; app-matrix-substitution-secrets owns
    # livekit-sip-trunk, which render-config exits non-zero without; app-snikket owns the
    # component secrets and runs the prosody the binary dials first thing.
    flux-component-generator/dependsOn: infra-metallb,infra-reflector,infra-reloader,app-matrix-substitution-secrets,app-snikket
resources:
- resources.yaml
- routing-release.yaml
- secret-registrations.yaml
- vnet.yaml
configMapGenerator:
- name: cheogram-sip-env
  namespace: cheogram-sip
  envs:
  - cheogram-sip.env
# /etc/asterisk except the chart's pjsip.conf and rtp.conf: the image ships none, and
# render-config copies every file here (cp /config/*). A missing modules.conf stops Asterisk;
# any other missing file leaves its module on compiled-in defaults.
- name: cheogram-sip-config
  namespace: cheogram-sip
  files:
  - modules.conf
  - pjproject.conf
  - xmpp.conf
  - motif.conf
  - extensions.lua
  - logger.conf
  - confbridge.conf
