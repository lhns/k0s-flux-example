; chan_sip [general] only. The peer block for the trunk is APPENDED at runtime by the
; image's entrypoint (type=peer, nat=yes, insecure=invite, host/realm/secret/username/
; fromuser/fromdomain), so do not write one here.
;
; This file MUST NOT mention the trunk hostname preceded by an at-sign, not even in a
; comment. The entrypoint guards its whole setup block with
;     if ! grep "@$SIP_HOST" /etc/asterisk/sip.conf
; as an idempotency check, so any occurrence makes it skip the register line, the peer
; and the dialplan edit, silently. This very comment caused that once: the grep matched
; the warning text. Hence the circumlocution.

[general]
; KEEP THIS LINE. The entrypoint inserts the real register line after it
; (sed "/^;register => 1234/a register => ..."). Delete it and registration is never
; configured, with nothing in any log.
;register => 1234

; extensions.lua defines only public, jingle and xmpp. The Debian default
; context=default does not exist there, so without this every inbound call dies in a
; context that is not present. This one line is what makes inbound work.
context=public

; Behind double NAT, Asterisk must advertise the address the far end can reach rather
; than its pod IP, or the SDP carries an RFC1918 address and audio goes nowhere.
externip=203.0.113.10
localnet=10.20.0.0/16
localnet=172.18.0.0/16
localnet=172.19.0.0/16

; chan_sip spelling of rtp_symmetric + force_rport: send media back to where it
; actually came from, which is what survives the inner masquerade rewriting our
; source port.
nat=force_rport,comedia

; TCP, for the [matrixbridge] peer below and nothing else. chan_sip refuses a peer
; with transport=tcp unless this is on, so without it that peer is silently dead --
; and SIP MESSAGE has to be TCP, because a multi-part text that overflows a UDP
; datagram is dropped with no error anywhere. The trunks stay on UDP.
tcpenable=yes
tcpbindaddr=0.0.0.0:5060

; Out-of-call SIP MESSAGE is refused before it reaches any dialplan unless this is
; set globally AND on the peer. [general] is a global default that neither trunk
; overrides, so EVERY inbound SMS lands in messages-in, not just the bridge's messages.
; That context dispatches on the sender; pointing a trunk somewhere else would break it.
accept_outofcall_message=yes
outofcall_message_context=messages-in

; The trunk is the only peer. Anonymous calls are rejected, and alwaysauthreject stops
; the 401-vs-404 difference from telling a scanner which extensions exist.
allowguest=no
alwaysauthreject=yes

; Keep the registration pinhole open. Inbound INVITEs arrive down it, so if this lapses
; inbound calls stop while outbound keeps working.
qualify=yes
qualifyfreq=60
registertimeout=20
registerattempts=0
defaultexpiry=120

; Every trunk registration except the entrypoint's own, one register line per entry in the
; routing chart's `registrations` table, rendered here by the render-config initContainer.
; Generated rather than written out: a register line names its host after an at-sign, and any
; such occurrence in THIS file makes the entrypoint skip its whole setup. Each entry carries
; its own contact, so an inbound call's extension says which number rang.
;
; res_pjsip_outbound_registration has `line=yes` plus `endpoint=`, which matches an inbound call
; to its registration directly. That is the migration target; the contact trick is the chan_sip
; workaround for its absence, not something to preserve.
#include registrations.conf

; A peer per registration, from the same table and the same initContainer, named after the
; ENTRY rather than its host: chan_sip pins fromuser on the peer, so a peer named after the
; host can present only one of the DIDs registered there. routing.lua's `peer` field names the
; section the dialplan dials, which is what lets a line present its primary.
;
; The cost, accepted deliberately: several peers now share one address, so which of them
; chan_sip attributes an unauthenticated inbound INVITE to is no longer predictable. Inbound
; identity does not depend on it -- extensions.lua resolves the dialled contact, and maps a
; peer name back to its host -- but every peer here must keep context=public, or an inbound
; call attributed to one would land in a context that does not ring anybody.
;
; Included here rather than at EOF so [general] above is closed by the first section inside
; it, and so nothing displaces the last section of this file; see the note there.
#include peers.conf

; livekit-sip, in-cluster. It is only ever the CALLER: it INVITEs us to join a caller
; already parked in a ConfBridge, and we never Dial it, so host=dynamic with no
; registration is right.
;
; The section name is load-bearing exactly as [matrixbridge] below is, for the reason
; given there: with no host= and no registration, chan_sip has only the From user part
; to match an INVITE on, and the secret is checked only once that match has succeeded.
; So the caller number on the LiveKit outbound trunk must be the literal "livekit"; a
; phone number there is a 403 before the credentials are ever looked at.
;
; No nat= or externip override: the pod CIDR is already in localnet, so SDP carries our
; pod address, which is exactly what the far end can reach.
[livekit]
type=friend
host=dynamic
defaultuser=livekit
#include lk-secret.conf
context=livekit
disallow=all
allow=alaw
allow=ulaw
dtmfmode=rfc2833
directmedia=no
qualify=no

; matrix-sip-bridge, in the matrix namespace. A STATIC peer, which is what the bridge's
; "SIP server contract" asks for: it never REGISTERs, so host= has to name something
; stable, and that is the Service rather than the pod address.
;
; The peer name is load-bearing twice over. It must equal sip.username in the bridge's
; config, because the bridge only digest-authenticates REGISTER -- its INVITEs and
; MESSAGEs arrive unauthenticated from a pod address that is not host= above, so
; chan_sip has nothing to match them on but the From user part. The dialplan names it
; in Dial() on the inbound path.
;
; context is where the bridge's own INVITEs land, and extensions.lua dials the requested
; number out a trunk there. It must not be `public`, which would read such an INVITE as
; an inbound trunk call.
[matrixbridge]
type=friend
host=matrix-sip-bridge.matrix.svc.cluster.local
port=5060
transport=tcp
defaultuser=matrixbridge
insecure=invite,port
context=matrixbridge
accept_outofcall_message=yes
outofcall_message_context=messages-in
disallow=all
allow=alaw
allow=ulaw
dtmfmode=rfc2833
directmedia=no
; The bridge answers OPTIONS only once its SIP listener binds, but it is Ready -- and so in
; the Service -- about 30s earlier (apps/matrix/resources.yaml). Qualify is what keeps an
; INVITE away from it in that window, so probe faster than the [general] 60s default.
qualify=yes
qualifyfreq=15

; The eventpbx trunk, defined by hand because the entrypoint only ever writes one peer and
; that slot now belongs to the PSTN trunk. Deliberately NOT the default for bare numbers: it
; answers outbound PSTN with a recorded refusal rather than an error, so it carries only its
; own short extensions.
;
; MUST stay the last section in this file: the entrypoint appends its own peer at EOF, and a
; new section header would otherwise land inside this one.
[voip.example.org]
type=peer
host=voip.example.org
defaultuser=5552
fromuser=5552
fromdomain=voip.example.org
; Written by the same registrations table: this filename is that entry's peer_secret_file,
; and the two must match or the peer registers with no secret and fails auth silently. The
; initContainer asserts the #include exists for every file it writes.
#include ev-secret.conf
insecure=invite
nat=force_rport,comedia
qualify=yes
context=public
disallow=all
allow=alaw
allow=ulaw
dtmfmode=rfc2833
directmedia=no
