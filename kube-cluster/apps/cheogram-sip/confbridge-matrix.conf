; APPENDED to the image's own /etc/asterisk/confbridge.conf by the render-config
; initContainer, rather than replacing it: [general], [default_bridge] and
; [default_user] stay exactly as the distribution ships them.
;
; The pairing below is load-bearing, not cosmetic. The Matrix bridge has no channel to
; hang up -- its control leg is gone seconds into every call -- so it ends a call by
; removing livekit-sip's participant from the LiveKit room. Making livekit-sip the
; MARKED user and the caller end_marked is what turns that into the caller being hung
; up; without it a Matrix user hanging up leaves the caller alone in a conference.
;
; It covers that ONE direction. end_marked fires only when the last MARKED user leaves,
; so the caller hanging up ends nothing, and marking both legs would not change that.
; extensions.lua ends the conference explicitly from the h extension instead; see
; matrix_kick_command there before touching either profile.
;
; wait_marked=no on the caller because the order is always Dial-then-ConfBridge: the
; caller enters first and livekit-sip dials in afterwards.
;
; The option is `marked`, not `marked_user`. app_confbridge refuses to load the WHOLE
; file on one unknown key, which takes ConfBridge() out of the dialplan entirely and
; breaks the pre-existing livekit path with it.
[matrix_marked]
type=user
marked=yes
quiet=yes
announce_join_leave=no
announce_user_count=no
announce_only_user=no

[matrix_caller]
type=user
end_marked=yes
wait_marked=no
quiet=yes
announce_join_leave=no
announce_user_count=no
announce_only_user=no
