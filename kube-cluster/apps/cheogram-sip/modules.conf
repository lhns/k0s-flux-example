; Asterisk refuses to start without this file ("Module initialization failed").
[modules]
autoload=yes

; pbx_config: extensions.lua is the only dialplan, and there is no `default` context.
; The wizard: pjsip objects are written out in full.
noload => pbx_config.so
noload => res_pjsip_config_wizard.so

; Each logs ERRORs at boot for a config file we do not ship, or (ARI) for what depends on it.
; ARI is also an HTTP API: one less listener. Re-derive after an Asterisk or menuselect bump
; by booting without the list and keeping what logs an ERROR.
noload => app_agent_pool.so
noload => app_alarmreceiver.so
noload => app_amd.so
noload => app_festival.so
noload => app_followme.so
noload => app_queue.so
noload => app_stasis_broadcast.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_manager.so
noload => cel_sqlite3_custom.so
noload => chan_iax2.so
noload => chan_unistim.so
noload => chan_websocket.so
noload => pbx_ael.so
noload => pbx_dundi.so
noload => res_aeap.so
noload => res_ari.so
noload => res_calendar.so
noload => res_hep.so
