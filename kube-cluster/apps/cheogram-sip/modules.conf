; ASTERISK REFUSES TO START WITHOUT THIS FILE: loader.c reports "'modules.conf' invalid or
; missing" and exits with "Module initialization failed".
;
; autoload plus a noload list, because which modules exist is decided by the image's
; menuselect -- res_pjsip alone would be thirty names here.
[modules]
autoload=yes

; Unused here, and each logs an ERROR at boot for a config file we deliberately do not ship --
; a wall of noise with a real failure somewhere in it. ARI is also an HTTP API, so not loading
; it is one less listener.
noload => res_ari.so
noload => res_aeap.so
noload => res_speech_aeap.so
noload => chan_websocket.so
noload => res_websocket_client.so
; The objects it would build are all hand-written in pjsip.conf.
noload => res_pjsip_config_wizard.so

; Everything below had already declined to load, so this list is noise reduction only. The set
; follows the image's build: re-derive it from the log after a menuselect change rather than
; guessing. README.md has the rule for extending it.
noload => app_agent_pool.so
noload => app_alarmreceiver.so
noload => app_amd.so
noload => app_festival.so
noload => app_followme.so
noload => app_queue.so
noload => app_stasis_broadcast.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_manager.so
noload => cel_sqlite3_custom.so
noload => chan_iax2.so
noload => chan_unistim.so
noload => pbx_ael.so
noload => pbx_config.so
noload => pbx_dundi.so
noload => res_calendar.so
noload => res_hep.so
noload => res_parking.so
noload => res_phoneprov.so
noload => res_pjsip_notify.so
noload => res_pjsip_publish_asterisk.so
noload => res_prometheus.so
noload => res_stasis_broadcast.so
noload => res_stun_monitor.so
