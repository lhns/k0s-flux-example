; ConfBridge() names these two profiles by default; undefined, every conference fails.
[default_bridge]
type=bridge

[default_user]
type=user

; The pairing is load-bearing. The Matrix bridge ends a call by removing livekit-sip's
; participant from the LiveKit room; livekit-sip as the MARKED user and the caller as
; end_marked turns that into the caller being hung up. That is one direction only, so
; extensions.lua ends the conference from the h extension for the other (see
; matrix_kick_conference).
;
; The option is `marked`, not `marked_user`: app_confbridge refuses the WHOLE file on one
; unknown key. announce_only_user defaults to yes, hence the explicit no.
[matrix_marked]
type=user
marked=yes
quiet=yes
announce_only_user=no

[matrix_caller]
type=user
end_marked=yes
quiet=yes
announce_only_user=no
