; WHOLE, not an overlay: the image ships no /etc/asterisk at all, so the two profiles
; ConfBridge() names by default have to be defined here or every conference fails.
[general]

[default_bridge]
type=bridge

[default_user]
type=user

; The pairing below is load-bearing. The Matrix bridge has no channel to hang up, so it ends
; a call by removing livekit-sip's participant from the LiveKit room; livekit-sip as the
; MARKED user and the caller as end_marked is what turns that into the caller being hung up.
; It covers that ONE direction only -- end_marked fires when the last marked user leaves --
; so extensions.lua ends the conference from the h extension for the other; see
; matrix_kick_conference before touching either profile.
;
; wait_marked=no on the caller because the order is always Dial-then-ConfBridge: the
; caller enters first and livekit-sip dials in afterwards.
;
; The option is `marked`, not `marked_user`. app_confbridge refuses to load the WHOLE
; file on one unknown key, which takes ConfBridge() out of the dialplan entirely.
[matrix_marked]
type=user
marked=yes
quiet=yes
announce_join_leave=no
announce_user_count=no
announce_only_user=no

[matrix_caller]
type=user
end_marked=yes
wait_marked=no
quiet=yes
announce_join_leave=no
announce_user_count=no
announce_only_user=no
