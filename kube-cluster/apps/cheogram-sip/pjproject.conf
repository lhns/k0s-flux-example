; res_pjproject is not optional -- res_pjsip needs it -- and it reads this through sorcery, so
; without the file every boot logs a sorcery ERROR that looks like a pjsip object failing to
; load. The mapping below is res_pjproject's own default.
[log_mappings]
type=log_mappings
asterisk_error=0,1
asterisk_warning=2
asterisk_notice=
asterisk_verbose=3,4,5
asterisk_debug=6
