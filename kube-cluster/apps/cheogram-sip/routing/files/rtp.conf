[general]
rtpstart={{ .Values.rtp.start }}
rtpend={{ .Values.rtp.end }}
; Required for the Jingle side: ice-udp is motif's transport.
icesupport=yes

[ice_host_candidates]
; render-config substitutes the pod IP. A static mapping is the only candidate reachable
; from outside: the pod IP is useless there, and a STUN srflx one would advertise the NAT's
; random mapped port instead of a forwarded one.
__POD_IP__ => {{ .Values.external_address }}
