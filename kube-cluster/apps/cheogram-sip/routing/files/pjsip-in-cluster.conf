; The two in-cluster peers, appended to the generated trunks. Not generated: neither
; registers and they share no shape (one has an auth and no AOR, the other an AOR and no auth).

; livekit-sip: only ever the CALLER (it INVITEs us to join a caller parked in a ConfBridge),
; so no AOR.
;
; The endpoint NAME is load-bearing: identify_by=username matches the From user part, and the
; auth is only reached after that. The caller number on the LiveKit outbound trunk must be the
; literal "livekit", or the INVITE gets a 403 before credentials are looked at.
[livekit]
type=auth
auth_type=userpass
username=livekit
#include livekit-password.conf

[livekit]
type=endpoint
transport=transport-udp
; INBOUND auth, not outbound_auth: we challenge its INVITE, we never authenticate to it.
auth=livekit
identify_by=username
context=livekit
disallow=all
allow=alaw,ulaw
dtmf_mode=rfc4733
direct_media=no
force_rport=yes
rtp_symmetric=yes

; matrix-sip-bridge: STATIC, because it never REGISTERs.
;
; The endpoint name must equal sip.username in the bridge's config. The bridge authenticates
; only REGISTER, so its INVITEs and MESSAGEs arrive unauthenticated from a pod address that is
; not the AOR contact: identify_by=username on the From user part is all there is to match on.
; The dialplan dials it by that name. No auth, deliberately; kube-vnet (vnet.yaml) keeps
; anything else from claiming the name.
[matrixbridge]
type=aor
; ;transport=tcp in the URI: pjsip takes the transport from the contact, and a multi-part
; MESSAGE over UDP overflows the datagram and is dropped silently.
contact=sip:{{ .Values.bridge_host }}:5060;transport=tcp
; The bridge answers OPTIONS about 30s after it is Ready (apps/matrix/resources.yaml);
; qualify keeps INVITEs away in that window, so probe faster than the trunks' 60s.
qualify_frequency=15

[matrixbridge]
type=endpoint
transport=transport-tcp
aors=matrixbridge
identify_by=username
; Where the bridge's INVITEs land: extensions.lua dials the requested number out a trunk
; there. Not `public`, which would read it as an inbound trunk call.
context=matrixbridge
message_context=messages-in
disallow=all
allow=alaw,ulaw
dtmf_mode=rfc4733
direct_media=no
force_rport=yes
rtp_symmetric=yes
