; ---------------------------------------------------------------------------------------
; The two in-cluster peers, appended verbatim to the generated trunks. NOT generated: neither
; registers, neither is in the routing table, and the two share no shape with a trunk or with
; each other -- one has an auth and no AOR, the other an AOR and no auth. Values for them
; would be a schema with two instances and no invariant to hold.
; ---------------------------------------------------------------------------------------

; livekit-sip, in the matrix namespace. It is only ever the CALLER: it INVITEs us to join a
; caller already parked in a ConfBridge, and nothing dials it, so it needs no AOR.
;
; The endpoint NAME is load-bearing: identify_by=username matches the From user part against
; it, and the auth below is only reached once that match has succeeded. So the caller number
; on the LiveKit outbound trunk must be the literal "livekit" -- a phone number there is a
; 403 before the credentials are ever looked at.
[livekit]
type=auth
auth_type=userpass
username=livekit
#include lk-secret.conf

[livekit]
type=endpoint
transport=transport-udp
; INBOUND auth, not outbound_auth: we challenge its INVITE, we never authenticate to it.
auth=livekit
identify_by=username
context=livekit
disallow=all
allow=alaw,ulaw
dtmf_mode=rfc4733
direct_media=no
force_rport=yes
rtp_symmetric=yes

; matrix-sip-bridge, in the matrix namespace. STATIC, which is what the bridge's "SIP server
; contract" asks for: it never REGISTERs, so its address has to be the Service.
;
; The endpoint name is load-bearing twice over. It must equal sip.username in the bridge's
; config -- the bridge digest-authenticates only REGISTER, so its INVITEs and MESSAGEs arrive
; unauthenticated from a pod address that is not the AOR contact, and identify_by=username on
; the From user part is all there is to match them on. The dialplan dials it by that name.
;
; No auth, deliberately: there is nothing to challenge. kube-vnet is what keeps anything else
; in the cluster from claiming the name -- see vnet.yaml.
[matrixbridge]
type=aor
; ;transport=tcp in the URI, not just the endpoint's transport: pjsip takes the transport
; from the contact, and over UDP a multi-part MESSAGE overflows the datagram and is dropped
; with no error anywhere.
contact=sip:matrix-sip-bridge.matrix.svc.cluster.local:5060;transport=tcp
; The bridge answers OPTIONS only once its SIP listener binds, but it is Ready -- and so in
; the Service -- about 30s earlier (apps/matrix/resources.yaml). Qualify is what keeps an
; INVITE away from it in that window, so probe faster than the 60s the trunks use.
qualify_frequency=15

[matrixbridge]
type=endpoint
transport=transport-tcp
aors=matrixbridge
identify_by=username
; Where the bridge's own INVITEs land: extensions.lua dials the requested number out a trunk
; there. NOT `public`, which would read such an INVITE as an inbound trunk call.
context=matrixbridge
message_context=messages-in
disallow=all
allow=alaw,ulaw
dtmf_mode=rfc4733
direct_media=no
force_rport=yes
rtp_symmetric=yes
