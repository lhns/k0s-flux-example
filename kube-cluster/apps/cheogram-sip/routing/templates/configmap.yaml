{{/*
Lua string literal. Backslash FIRST, or the backslashes this pass introduces are quoted
again by the next one. CR/LF are escaped too: Lua 5.1 accepts no raw newline inside a
quoted string, so one in a value would be a syntax error in the dialplan's routing file
rather than a bad route.
*/}}
{{- define "cheogram-sip-routing.q" -}}
"{{ . | toString | replace "\\" "\\\\" | replace "\"" "\\\"" | replace "\r" "\\r" | replace "\n" "\\n" }}"
{{- end -}}

{{- define "cheogram-sip-routing.lua" -}}
-- GENERATED from the cheogram-sip-routing chart's values. Do not edit; edit values.yaml.
-- to_pattern is anchored here, once, so the dialplan cannot forget to.
return {
  registrations = {
{{- range $name, $r := .Values.registrations }}
  {{- /* `peer`: the config section an outbound call on this entry LEAVES BY, and what an
  inbound one is attributed by. Always the ENTRY NAME, never the host: three registrations
  share sip.example.net and the presented number is pinned per section, so a section named after
  the host could present only one of them. It is what CHANNEL(endpoint) hands the dialplan. */}}
    [{{ include "cheogram-sip-routing.q" $name }}] = { user = {{ include "cheogram-sip-routing.q" $r.user }}, host = {{ include "cheogram-sip-routing.q" $r.host }}, peer = {{ include "cheogram-sip-routing.q" $name }}, contact_user = {{ include "cheogram-sip-routing.q" $r.contact_user }}, did = {{ include "cheogram-sip-routing.q" $r.did }}, line = {{ include "cheogram-sip-routing.q" $r.line }}{{ if $r.entrypoint }}, entrypoint = true{{ end }}{{ if $r.disabled }}, disabled = true{{ end }} },
{{- end }}
  },
  lines = {
{{- range $name, $l := .Values.lines }}
    [{{ include "cheogram-sip-routing.q" $name }}] = {
      callers = { {{ range $i, $c := $l.callers }}{{ if $i }}, {{ end }}{{ include "cheogram-sip-routing.q" $c }}{{ end }} },
      primary = {{ include "cheogram-sip-routing.q" $l.primary }},
      inbound_route = {
  {{- range $s := $l.inbound_route }}
    {{- if $s.record }}
        { record = true },
    {{- else }}
        { timeout = {{ $s.timeout | default 30 }}, ring = { {{ range $i, $a := $s.ring }}{{ if $i }}, {{ end }}{{ include "cheogram-sip-routing.q" $a }}{{ end }} } },
    {{- end }}
  {{- end }}
      },
    },
{{- end }}
  },
  outbound = {
{{- range $r := .Values.outbound }}
    { to_pattern = {{ include "cheogram-sip-routing.q" (printf "^(%s)$" $r.to_pattern) }}{{ if $r.line }}, line = {{ include "cheogram-sip-routing.q" $r.line }}{{ end }}{{ if $r.registration }}, registration = {{ include "cheogram-sip-routing.q" $r.registration }}{{ end }}{{ if $r.from_glob }}, from_glob = { {{ range $i, $g := $r.from_glob }}{{ if $i }}, {{ end }}{{ include "cheogram-sip-routing.q" $g }}{{ end }} }{{ end }}{{ if $r.emergency }}, emergency = true{{ end }} },
{{- end }}
  },
}
{{- end -}}

{{/*
The registration table, for /bin/sh rather than for Lua: one TAB-separated line per entry,
name, user, host, contact_user, peer_secret_file. The name doubles as the Secret key holding
that entry's password, which is why no key is named here -- see values.yaml. printf rather
than a literal tab so the separator is visible in this file.

peer_secret_file is LAST because it is the only optional field: TAB is IFS whitespace, so
`read` collapses a run of them and an empty field anywhere else would shift every later one
into the wrong variable.

A disabled entry has no row, so its Secret key is never read and may be absent.
*/}}
{{- define "cheogram-sip-routing.registrations" -}}
{{- $lines := list -}}
{{- range $name, $r := .Values.registrations -}}
{{- if not $r.disabled -}}
{{- $lines = append $lines (printf "%s\t%s\t%s\t%s\t%s" $name $r.user $r.host $r.contact_user ($r.peer_secret_file | default "")) -}}
{{- end -}}
{{- end -}}
{{ join "\n" $lines }}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Referenced by name from the Deployment's `routing` volume, so it is fixed rather than
  # release-derived: renaming it here silently leaves the pod mounting a ConfigMap that no
  # longer exists, and the pod then never starts.
  name: cheogram-sip-routing
  namespace: {{ .Release.Namespace }}
  annotations:
    # pbx_lua re-reads routing.lua per call, so a table edit needs no restart -- and a
    # restart would drop live calls. Registrations live in their own ConfigMap, unignored,
    # so the Deployment's `reloader.stakater.com/auto` still rolls the pod for those.
    reloader.stakater.com/ignore: "true"
data:
  routing.lua: |
    {{- include "cheogram-sip-routing.lua" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  # NOT cheogram-sip-registrations: that is the Secret holding these entries' passwords.
  name: cheogram-sip-registration-table
  namespace: {{ .Release.Namespace }}
data:
  registrations.tsv: |
    {{- include "cheogram-sip-routing.registrations" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  # DELIBERATELY NOT in cheogram-sip-routing: that one is reloader-ignored, and Asterisk reads
  # pjsip.conf once at start. A trunk change there would never reach a running pod.
  name: cheogram-sip-pjsip
  namespace: {{ .Release.Namespace }}
data:
  pjsip.conf: |
    {{- include "cheogram-sip-routing.pjsip" . | nindent 4 }}
---
{{- /* The bridge's network.line_members: per line, the literal matrix: ring targets plus
`members`. tests/check-routing.py recomputes it from the values and compares. A line whose
primary registration is disabled is off, so it gets nobody. */}}
{{- $lm := dict }}
{{- range $name, $l := .Values.lines }}
  {{- if not (index $.Values.registrations $l.primary).disabled }}
    {{- $set := list }}
    {{- range $s := $l.inbound_route }}
      {{- range $a := $s.ring }}
        {{- if regexMatch "^matrix:@[^:@*]+:[^:@*]+$" $a }}{{ $set = append $set (trimPrefix "matrix:" $a) }}{{ end }}
      {{- end }}
    {{- end }}
    {{- range $m := $l.members }}{{ $set = append $set (trimPrefix "matrix:" $m) }}{{ end }}
    {{- if $set }}{{ $_ := set $lm $name ($set | uniq | sortAlpha) }}{{ end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  # Read, optionally, by the matrix-sip-bridge pod in apps/matrix.
  name: sip-line-members
  namespace: {{ .Release.Namespace }}
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: matrix
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: matrix
data:
  line-members.yaml: |
    {{- toYaml (dict "network" (dict "line_members" $lm)) | nindent 4 }}
