# NO PASSWORD HERE, EVER. These values render into a plaintext ConfigMap in git.

# res_pjsip transports. Every registration rides trunk_transport; 5060 on both protocols is
# what apps/matrix and the cheogram-sip-internal Service point at.
transports:
  - name: transport-udp
    protocol: udp
    bind: 0.0.0.0:5060
  # matrixbridge only: a SIP MESSAGE over UDP fragments and is dropped silently.
  - name: transport-tcp
    protocol: tcp
    bind: 0.0.0.0:5060

trunk_transport: transport-udp

# Per transport: externip and localnet. Without them the SDP carries the pod address.
# external_address is also the ice_host_candidates mapping in rtp.conf.
external_address: 203.0.113.10
local_nets:
  - 10.20.0.0/16
  - 172.18.0.0/16
  - 172.19.0.0/16

# cheogram-sip-lb forwards exactly these UDP ports (resources.yaml); tests/check-routing.py
# holds the two together.
rtp:
  start: 10000
  end: 10049

# The Matrix bridge's Service. Its [matrixbridge] AOR contact and the dialplan's SMS
# Request-URI both come from here.
bridge_host: matrix-sip-bridge.matrix.svc.cluster.local

# One REGISTER per entry. The entry name is the Secret key under /sip-secrets holding the
# password, the pjsip object name and the peer the dialplan dials and attributes by. Three DIDs share
# sip.example.net and an endpoint pins one From user, so each needs an object set of its own.
registrations:
  # SIP_USER at SIP_HOST (cheogram-sip.env), which the component appends to a bare number.
  # `entrypoint` marks a host's default registration: the inbound fallback and the one
  # endpoint that gets a type=identify. A host with one registration needs no flag.
  home:
    user: "02012345678"
    host: sip.example.net
    did: "+492012345678"
    line: home
    entrypoint: true

  office-1:
    user: "02012345671"
    host: sip.example.net
    did: "+492012345671"
    line: office

  office-2:
    user: "02012345672"
    host: sip.example.net
    did: "+492012345672"
    line: office

  eventpbx:
    user: "5552"
    host: voip.example.org
    did: "5552"
    line: eventpbx
    # Its REGISTER is refused. Also switches the eventpbx line off: short extensions are
    # refused rather than dialled via another trunk.
    disabled: true

# `callers` is the outbound gate: it refuses rather than falling through, and absent or
# empty means nobody. Field meanings: values.schema.json; the model: README.
lines:
  home:
    callers: ['xmpp:*@xmpp.example.com', 'matrix:@*:example.com']
    primary: home
    inbound_route:
      - ring: ["matrix:@user:example.com"]
        timeout: 45
      - record: true

  office:
    callers: ['xmpp:*@xmpp.example.com', 'matrix:@*:example.com']
    primary: office-1
    inbound_route:
      - ring: ["xmpp:admin@xmpp.example.com", "matrix:@admin:example.com"]
        timeout: 45
      - record: true

  eventpbx:
    callers: ['xmpp:*@xmpp.example.com', 'matrix:@*:example.com']
    primary: eventpbx
    inbound_route:
      - ring: ["xmpp:admin@xmpp.example.com", "matrix:@admin:example.com"]
        timeout: 45

# FIRST MATCH WINS. to_pattern is a LUA PATTERN, not a regex, anchored by the renderer.
outbound:
  # Pins the registration, so no line and no callers list gates it: 110/112 stay reachable
  # from an account permitted nothing else.
  - {to_pattern: '11[02]', registration: home, emergency: true}

  # Short internal extensions, one to five digits.
  - {to_pattern: '%d%d?%d?%d?%d?', line: eventpbx}

  # A per-person default: this caller presents the office DID.
  - {to_pattern: '.*', from_glob: ['xmpp:office@xmpp.example.com'], line: office}

  - {to_pattern: '.*', line: home}
