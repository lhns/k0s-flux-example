---
# The routing table is a Helm chart (routing/) so that Helm checks it against
# values.schema.json before rendering: the table IS the chart's values, which is the only
# arrangement that gets that check for free. A .Files.Get of the same YAML would render
# unvalidated.
#
# The chart comes from its own ExternalArtifact, like the generator charts (ADR 0047): its
# revision is a hash of routing/, so the release upgrades only when the table changes, not on
# every commit to the repo. Helm wants the chart under a top-level directory, hence routing/.
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: cheogram-sip-routing
  namespace: cheogram-sip
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
      namespace: flux-system
  artifacts:
    - name: cheogram-sip-routing
      originRevision: "@repo"
      copy:
        - from: "@repo/kube-cluster/apps/cheogram-sip/routing"
          to: "@artifact/"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cheogram-sip-routing
  namespace: cheogram-sip
spec:
  interval: 10m0s
  chartRef:
    kind: ExternalArtifact
    name: cheogram-sip-routing
    namespace: cheogram-sip
