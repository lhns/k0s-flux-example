---
# The routing table is a Helm chart (routing/): the table is the chart's values, so Helm
# checks it against values.schema.json before anything renders.
#
# Its own ExternalArtifact, like the generator charts (ADR 0047): the revision is a hash of
# routing/, so the release upgrades only when the table changes.
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: cheogram-sip-routing
  namespace: cheogram-sip
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
      namespace: flux-system
  artifacts:
    - name: cheogram-sip-routing
      originRevision: "@repo"
      copy:
        - from: "@repo/kube-cluster/apps/cheogram-sip/routing"
          to: "@artifact/"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cheogram-sip-routing
  namespace: cheogram-sip
spec:
  interval: 10m0s
  chartRef:
    kind: ExternalArtifact
    name: cheogram-sip-routing
    namespace: cheogram-sip
