# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# One key per entry in the routing chart's `registrations` table, named EXACTLY after that
# entry. That name is the whole wiring: render-config reads the key named after each entry and
# starts no pod if it is missing, so renaming one side without the other stops the pod. Adding
# a number -- or a whole new provider -- is an entry in routing/values.yaml plus a key here.
# The provider lives in the key name, never in the Secret name.
#
# Mounted whole at /sip-secrets and read by the render-config initContainer, except
# pstn-02012345678, which the main container also reads as SIP_PASSWORD: that entry is
# `entrypoint: true`, so the image builds its register line rather than the table.
apiVersion: v1
kind: Secret
metadata:
    name: cheogram-sip-registrations
    namespace: cheogram-sip
type: Opaque
stringData:
    pstn-02012345678: CHANGEME-pstn-02012345678
    pstn-02012345671: CHANGEME-pstn-02012345671
    pstn-02012345672: CHANGEME-pstn-02012345672
    eventpbx-5552: CHANGEME-eventpbx-5552
