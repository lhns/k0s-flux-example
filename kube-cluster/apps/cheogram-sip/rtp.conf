[general]
; MUST MATCH cheogram-sip-lb's enumerated UDP ports EXACTLY. Kubernetes Services have
; no port ranges, so every port is its own Service entry (the coturn/LiveKit
; precedent). Widen one without the other and calls fail with nothing obvious in any
; log. 50 ports is 4 per bridged call (RTP + RTCP on the SIP leg and the Jingle leg).
rtpstart=10000
rtpend=10049

; Required for the Jingle side: ice-udp is motif's transport.
icesupport=yes

[ice_host_candidates]
; __POD_IP__ is substituted by the render-config initContainer from status.podIP.
; A static mapping is the only candidate that is actually reachable: the pod IP is
; useless to an external client, and a STUN-derived srflx candidate would advertise the
; NAT's random mapped port rather than one of the forwarded 10000-10049.
__POD_IP__ => 203.0.113.10
