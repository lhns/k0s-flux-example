; Asterisk's own XEP-0114 component connection (res_xmpp), the Jingle half of this pod.
; [asterisk] is the section motif.conf's connection= names; rename it and Jingle stops.
[general]
autoregister=yes

[asterisk]
type=component
usetls=no
sendtodialplan=yes
context=xmpp
; serverhost, port, username and secret, printf'd by the render-config initContainer out of
; cheogram-sip-env and the component Secret. Not sed'd in: one of the four is a password.
#include xmpp-component.conf
