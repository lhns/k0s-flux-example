---
# XMPP to SIP gateway: an XEP-0114 component on one side, Asterisk on the other, so a
# Conversations-family client can place and take phone calls over Jingle.
#
# Not a container in the snikket pod: snikket is Recreate-on-RWO, so every iteration here
# would cold-restart the household chat server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cheogram-sip
  namespace: cheogram-sip
  annotations:
    # render-config reads the Secrets once at startup; a rotated one needs a roll.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # One VIP with externalTrafficPolicy: Local follows the pod, and Asterisk holds live calls
  # in memory; two pods would split registration and media.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cheogram-sip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cheogram-sip
        app.kubernetes.io/instance: cheogram-sip
        # Prosody's external-component port; also needs cheogram-sip in
        # apps/snikket/vnet.yaml.
        kube-vnet/net.snikket.snikket-component: egress
        # livekit-sip INVITEs us from the matrix namespace and our RTP goes back pod to pod.
        kube-vnet/net.asterisk-sip: ingress
        kube-vnet/net.matrix.livekit-sip-media: egress
        # We dial and text matrix-sip-bridge's SIP port (its own vnet; asterisk-sip only
        # covers matrix -> here). Trunk RTP arrives via cheogram-sip-lb, which kube-vnet
        # auto-allows.
        kube-vnet/net.matrix.matrix-sip-bridge-sip: egress
    spec:
      # sip.example.net resolves nowhere (a SIP domain; the carrier hands out a proxy address).
      # The alias lets the peer carry the domain in the Request-URI, which carriers expect.
      # /etc/hosts shadows real DNS: remove it if the carrier ever publishes the name.
      hostAliases:
        - {ip: 10.21.0.11, hostnames: [sip.example.net]}
      # The image reads SIP_*/COMPONENT_* from the environment; injected <SVC>_PORT vars
      # would collide.
      enableServiceLinks: false
      # The image runs as uid 999 and Secret volumes are root-owned. Cheap here: every mount
      # is a ConfigMap or an emptyDir.
      securityContext:
        fsGroup: 999
      initContainers:
        # /etc/asterisk must be writable: the credentials are rendered into it next to the
        # config that #includes them. The image ships no /etc/asterisk of its own.
        - name: render-config
          # Same image as the asterisk container, so what renders the config parses it.
          image: ghcr.io/lhns/asterisk:22.11.0-cheogram-dtls@sha256:bd4b480d869fb1aabe3d6fa544d5c98a01c17fbe5d8695181a45ced0693d4586
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /config/* /pjsip/* /render/
              sed -i "s|__POD_IP__|$POD_IP|" /render/rtp.conf
              # Credentials are printf'd into #include files, never sed'd: sed's replacement
              # is not literal, so a backslash or & would corrupt the value.
              [ -n "$ASTERISK_COMPONENT_SECRET" ] || { echo "ASTERISK_COMPONENT_SECRET is empty"; exit 1; }
              printf 'serverhost=%s\nport=%s\nusername=%s\nsecret=%s\n' \
                "$CONNECT_IP" "$CONNECT_PORT" "$ASTERISK_COMPONENT_DOMAIN" "$ASTERISK_COMPONENT_SECRET" \
                > /render/xmpp-component.conf
              [ -n "$LIVEKIT_SIP_PASSWORD" ] || { echo "LIVEKIT_SIP_PASSWORD is empty"; exit 1; }
              printf 'password=%s\n' "$LIVEKIT_SIP_PASSWORD" > /render/livekit-password.conf
              # Every other #include in pjsip.conf is <Secret key>-secret.conf. A key that
              # is missing or empty fails the pod rather than a trunk's auth.
              for f in $(sed -n 's/^#include \(.*-secret\.conf\)$/\1/p' /render/pjsip.conf); do
                key="${f%-secret.conf}"
                pw="$(cat "/sip-secrets/$key")" || { echo "cannot read Secret key $key"; exit 1; }
                [ -n "$pw" ] || { echo "Secret key $key is empty"; exit 1; }
                printf 'password=%s\n' "$pw" > "/render/$f"
              done
          envFrom:
            # CONNECT_* and ASTERISK_COMPONENT_DOMAIN, so nothing rendered can drift from
            # what the dialplan and the components read.
            - configMapRef: {name: cheogram-sip-env}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            # Credentials are mounted here and in no runtime container, so an env dump
            # cannot carry the trunk password. The trunk password is defined once, in
            # flux-system: the bridge substitutes the same value into livekit-sip's trunk.
            - name: LIVEKIT_SIP_PASSWORD
              valueFrom:
                secretKeyRef: {name: livekit-sip-trunk, key: LIVEKIT_SIP_TRUNK_PASSWORD}
            - name: ASTERISK_COMPONENT_SECRET
              valueFrom:
                secretKeyRef: {name: sip-components, key: ASTERISK_COMPONENT_SECRET}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: pjsip, mountPath: /pjsip, readOnly: true}
            - {name: sip-secrets, mountPath: /sip-secrets, readOnly: true}
            - {name: asterisk-etc, mountPath: /render}
      containers:
        # Two containers, two images, one pod. They share no filesystem and talk only over
        # XMPP, through prosody. Split because they fail differently: the binary exits when
        # the component connection drops, while Asterisk holds live calls and reconnects.
        #
        # The asterisk image's entrypoint.sh is used by neither: it would start both
        # processes and put a second `sip.xmpp.example.com` on the wire.
        - name: asterisk
          # Our fork: released Asterisk cannot do DTLS-SRTP over Jingle. See README.md.
          image: ghcr.io/lhns/asterisk:22.11.0-cheogram-dtls@sha256:bd4b480d869fb1aabe3d6fa544d5c98a01c17fbe5d8695181a45ced0693d4586
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Asterisk logs to logger.conf's file, never stdout. -n0: a restart does not
              # replay the file.
              tail -n0 -F /var/log/asterisk/messages 2>/dev/null &
              # -f keeps it in the foreground, so liveness is Asterisk's; exec, so SIGTERM
              # reaches it.
              exec /usr/sbin/asterisk -f
          envFrom:
            - configMapRef: {name: cheogram-sip-env}
          env:
            # The live ConfigMap mount: pbx_lua re-runs extensions.lua per call, so a routing
            # edit applies to the next call (a malformed one fails closed).
            - name: SIP_ROUTING_FILE
              value: /routing/routing.lua
          volumeMounts:
            - {name: asterisk-etc, mountPath: /etc/asterisk}
            # No subPath: kubelet does not update those in place.
            - {name: routing, mountPath: /routing, readOnly: true}
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
        # The XEP-0114 component XMPP clients dial. Seven positional args in the image
        # entrypoint's order; SIP_HOST last makes it a PSTN gateway. The fifth, REDIS_URL,
        # is empty (optional, unused): the binary logs "No valid Redis specified".
        - name: cheogram-sip
          image: singpolyma/cheogram-sip@sha256:594cdb7bd570633b507b0ff60c1493257a15179c501d0bdf4a06b9720158059b
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec /bin/cheogram-sip "$COMPONENT_DOMAIN" "$CONNECT_IP" "$CONNECT_PORT" \
                "$COMPONENT_SECRET" "" "$ASTERISK_COMPONENT_DOMAIN" "$SIP_HOST"
          # Named one by one rather than envFrom: the rest of cheogram-sip-env is dialplan
          # configuration.
          env:
            - name: COMPONENT_DOMAIN
              valueFrom:
                configMapKeyRef: {name: cheogram-sip-env, key: COMPONENT_DOMAIN}
            - name: ASTERISK_COMPONENT_DOMAIN
              valueFrom:
                configMapKeyRef: {name: cheogram-sip-env, key: ASTERISK_COMPONENT_DOMAIN}
            - name: CONNECT_IP
              valueFrom:
                configMapKeyRef: {name: cheogram-sip-env, key: CONNECT_IP}
            - name: CONNECT_PORT
              valueFrom:
                configMapKeyRef: {name: cheogram-sip-env, key: CONNECT_PORT}
            - name: SIP_HOST
              valueFrom:
                configMapKeyRef: {name: cheogram-sip-env, key: SIP_HOST}
            # Prosody reads the same value as ENV_SIP_COMPONENT_SECRET; the Secret is
            # mirrored to its namespace.
            - name: COMPONENT_SECRET
              valueFrom:
                secretKeyRef: {name: sip-components, key: SIP_COMPONENT_SECRET}
          # No volumes: it reaches Asterisk over XMPP. About 17Mi at peak; an OOMKill takes
          # the user-facing component down, hence the headroom.
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: cheogram-sip-config
        # Written by the cheogram-sip-routing HelmRelease, so the names are fixed. Not
        # `optional`: a pod without the routing table refuses every outbound call, which is
        # harder to see than a pod that never starts.
        - name: routing
          configMap:
            name: cheogram-sip-routing
        # Not reloader-ignored, unlike `routing`: Asterisk reads pjsip.conf and rtp.conf
        # once at start.
        - name: pjsip
          configMap:
            name: cheogram-sip-pjsip
        # The registration passwords, one file per Secret key, projected whole so a new
        # number needs no edit here. Read only by render-config.
        - name: sip-secrets
          secret:
            secretName: cheogram-sip-registrations
            # Group-readable (the fsGroup above), not 0400.
            defaultMode: 0440
        # Memory-backed: the passwords must never land on node disk.
        - name: asterisk-etc
          emptyDir:
            medium: Memory
---
# SIP signalling for in-cluster callers only; deliberately not on cheogram-sip-lb. Media to
# livekit-sip is pod to pod and needs no Service.
#
# Two protocols on 5060, not a duplicate: livekit-sip speaks UDP, matrix-sip-bridge TCP (a
# SIP MESSAGE over UDP fragments and is dropped). Each needs its own transport in pjsip.conf.
apiVersion: v1
kind: Service
metadata:
  name: cheogram-sip-internal
  namespace: cheogram-sip
spec:
  selector:
    app.kubernetes.io/name: cheogram-sip
  ports:
    - {name: sip-udp, port: 5060, targetPort: 5060, protocol: UDP}
    - {name: sip-tcp, port: 5060, targetPort: 5060, protocol: TCP}
---
# Raw RTP on a dedicated MetalLB VIP (Traefik cannot carry UDP). externalTrafficPolicy: Local
# is required: a SNAT'd source would make rtp_symmetric latch onto a node, one-way audio.
#
# No 5060 here: the trunks use registration auth, so inbound INVITEs return down the
# outbound pinhole, and a public 5060 would only meet scanners.
#
# Services have no port ranges, hence the list (the coturn and LiveKit precedent). It must
# equal rtp.start..rtp.end in routing/values.yaml, which tests/check-routing.py checks. The
# list stays here rather than in the routing chart: moving the Service between owners would
# prune and recreate it, which flaps the VIP.
apiVersion: v1
kind: Service
metadata:
  name: cheogram-sip-lb
  namespace: cheogram-sip
  annotations:
    metallb.io/loadBalancerIPs: 10.20.176.150
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: cheogram-sip
  ports:
    - {name: r10000, port: 10000, targetPort: 10000, protocol: UDP}
    - {name: r10001, port: 10001, targetPort: 10001, protocol: UDP}
    - {name: r10002, port: 10002, targetPort: 10002, protocol: UDP}
    - {name: r10003, port: 10003, targetPort: 10003, protocol: UDP}
    - {name: r10004, port: 10004, targetPort: 10004, protocol: UDP}
    - {name: r10005, port: 10005, targetPort: 10005, protocol: UDP}
