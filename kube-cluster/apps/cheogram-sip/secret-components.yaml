# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# XEP-0114 component secrets, shared between prosody (apps/snikket/sip.cfg.lua, which reads
# them as ENV_SIP_COMPONENT_SECRET / ENV_ASTERISK_COMPONENT_SECRET) and the gateway. Mirrored
# rather than duplicated so a rotation is one edit instead of two that can drift.
#
# Alone in this file because of that mirroring: a bad re-encrypt here takes prosody's
# components down with it, so nothing else shares its blast radius.
apiVersion: v1
kind: Secret
metadata:
    name: cheogram-sip-components
    namespace: cheogram-sip
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: snikket
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: snikket
type: Opaque
stringData:
    SIP_COMPONENT_SECRET: CHANGEME-SIP_COMPONENT_SECRET
    ASTERISK_COMPONENT_SECRET: CHANGEME-ASTERISK_COMPONENT_SECRET
