apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # CNPG (db) + Reflector (db secret into the jetkvm ns) + oci-composer (both images are
    # built in-cluster; nothing upstream publishes them). Read by the root generator; inert
    # to kustomize. No `namespace:` transformer here -- database.yaml and db-role-secret.yaml
    # live in the postgres ns.
    dependsOn: infra-postgres,infra-reflector,infra-oci-composer
resources:
- resources.yaml
- routing.yaml
- images.yaml
- database.yaml
- db-role-secret.yaml
- secret.yaml
