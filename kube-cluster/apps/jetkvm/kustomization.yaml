apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # CNPG (db) + Reflector (db secret into the jetkvm ns) + app-coturn (its shared secret is
    # reflected here for TURN credentials). Read by the root generator; inert
    # to kustomize. No `namespace:` transformer here -- database.yaml and db-role-secret.yaml
    # live in the postgres ns.
    flux-component-generator/dependsOn: infra-postgres,infra-reflector,app-coturn
resources:
- resources.yaml
- routing.yaml
- database.yaml
- db-role-secret.yaml
- secret.yaml
- secret-google.yaml
