apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: immich
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# ===========================================================================
# Media library + external libraries — MOUNTED in place from the existing
# CephFS filesystems (appdata/fastappdata/userdata on the same ceph-cluster),
# NOT copied. Static CephFS PVs (jellyfin/navidrome pattern): storageClassName
# "", csi cephfs.csi.ceph.com, staticVolume, per-fs fsName + rootPath, bound by
# volumeName. capacity 1Gi is a dummy (ignored for static cephfs).
# ===========================================================================
# immich's own library (uploads, thumbnails, encoded video) — RW.
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: immich-upload
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: immich-upload
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /docker/immich/upload
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-upload
  namespace: immich
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: immich-upload
  resources:
    requests:
      storage: 1Gi
---
# External library on the userdata fs — read-only (immich only reads externals).
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: immich-userdata
spec:
  accessModes: [ReadOnlyMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: immich-userdata
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: userdata
      staticVolume: "true"
      rootPath: /
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-userdata
  namespace: immich
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: immich-userdata
  resources:
    requests:
      storage: 1Gi
---
# sftpgo uploads as an external library — read-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: immich-sftpgo
spec:
  accessModes: [ReadOnlyMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: immich-sftpgo
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /docker/sftpgo/data/data
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-sftpgo
  namespace: immich
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: immich-sftpgo
  resources:
    requests:
      storage: 1Gi
---
# ===========================================================================
# immich's dedicated Postgres — the ONE standalone DB in the repo. The shared
# CNPG (plain PG18) can't host immich's vectorchord/pgvecto.rs extensions, so
# immich runs its own PG16+vector image on a ceph-rbd volume. The DB was
# copied in via pg_dump/restore (see README). PGDATA is a subdir so a fresh
# RBD ext4 volume's lost+found doesn't block initdb. The volume is named
# immich-db-16 from the PG14->16 dump/restore migration (the old PG14 immich-db
# PVC has been dropped).
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-16
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-postgres
        app.kubernetes.io/instance: immich
        # immich-server (same ns) reaches this via the immich-postgres vnet.
        kube-vnet/net.immich-postgres: ingress
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U immich -d immich"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: db
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: immich-db-16
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# immich's redis/valkey (job queue + cache). Ephemeral — no persistence needed
# (matches the Swarm compose, which gave it no volume).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-redis
        app.kubernetes.io/instance: immich
        kube-vnet/net.immich-redis: ingress
    spec:
      containers:
        - name: redis
          image: valkey/valkey:9
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# immich-server (API + microservices in one, immich v3). Machine-learning is NOT
# in-cluster — it stays on the Swarm host and is reached via IMMICH_MACHINE_LEARNING_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # DB restored + Swarm immich stopped (library + DB freed), now live (PG16).
  replicas: 1
  # Single-writer (upload dir + DB) -> Recreate, never two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
        app.kubernetes.io/instance: immich
        # frontend :2283 from traefik; reach the in-ns postgres + redis. The Swarm
        # ML (10.20.2.10:3003) and OIDC (auth.example.com) are external egress.
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.immich-postgres: egress
        kube-vnet/net.immich-redis: egress
    spec:
      # k8s service-links inject IMMICH_PORT=tcp://<clusterIP>:2283 (from the `immich`
      # Service), which immich v3 misreads as its listen port -> NaN -> crash. Disable
      # the injection so only our env reaches immich (same fix as authelia).
      enableServiceLinks: false
      # Runs as root; the huge upload library is root-owned on CephFS. NO fsGroup
      # (it would trigger a multi-minute recursive chown of the library every start).
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.1.0
          # Memory only, per apps/webtop/README.md -- a CPU limit would throttle, not protect.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          env:
            - name: TZ
              value: Europe/Berlin
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-redis
            # Machine-learning kept on the Swarm host (direct HTTP).
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://10.20.2.10:3003
            - name: IMMICH_ALLOW_SETUP
              value: "false"
          ports:
            - name: http
              containerPort: 2283
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: upload
              mountPath: /usr/src/app/upload
            - name: userdata
              mountPath: /mnt/userdata
              readOnly: true
            - name: sftpgo
              mountPath: /sftpgo
              readOnly: true
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: immich-upload
        - name: userdata
          persistentVolumeClaim:
            claimName: immich-userdata
            readOnly: true
        - name: sftpgo
          persistentVolumeClaim:
            claimName: immich-sftpgo
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
