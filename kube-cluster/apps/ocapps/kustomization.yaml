apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # ceph-rbd (data PVC) + traefik (routes) + oci-composer (builds the image in artifacts/).
    # Read by the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-ceph-csi-rbd,infra-traefik,infra-oci-composer
resources:
- ocapps.yaml
- routing.yaml
- networkpolicy.yaml
