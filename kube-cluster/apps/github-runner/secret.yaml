# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: github-runner
    namespace: github-runner
type: Opaque
stringData:
    ACCESS_TOKEN_EXAMPLE_REPO: CHANGEME-ACCESS_TOKEN_EXAMPLE_REPO
    example-repo-id_ed25519: CHANGEME-example-repo-id_ed25519
