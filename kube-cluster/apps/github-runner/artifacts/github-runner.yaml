# The runner image with the remote-docker client inside it; a sidecar would not work, see
# README.md.
apiVersion: oci.lhns.de/v1alpha1
kind: ImageBuild
metadata:
  name: github-runner
  namespace: oci-composer
spec:
  interval: 1h
  platforms: [linux/amd64]
  # Fetched here rather than by a RUN curl, whose bytes the input hash would not cover.
  context:
    fetch:
      # renovate: datasource=github-releases depName=lhns/remote-docker
      url: https://github.com/lhns/remote-docker/releases/download/v0.8.1/remote-docker_0.8.1_linux_amd64.tar.gz
      digest: sha256:dd8e4dd558c1a0e9db7b8b010281812471bcf9d79d3c1d9f66781862d3850827
      unpack: tar.gz
  dockerfile:
    inline: |
      # renovate: datasource=docker
      FROM myoung34/github-runner:2.337.0-ubuntu-noble@sha256:1b947d2475cc6f4c3edf0e91dd879b091857e41a311be917016243479bb34101

      # NOTHING IS INSTALLED HERE ON PURPOSE. This base is the runner AGENT on a plain
      # Ubuntu -- not GitHub's ubuntu-latest, which is a VM image (actions/runner-images)
      # carrying tens of GB of toolchain. Adding a package here would half-match it: the
      # workflow then passes on this runner and fails on a hosted one, or the reverse, and
      # the difference lives in this cluster rather than in the repo. A job that needs a
      # toolchain names it with `container:`, which resolves the same in both places.

      # The tarball's root; see spec.context.fetch above.
      COPY remote-docker /usr/local/bin/remote-docker

      # Wraps the image's own entrypoint rather than replacing it: the session must be up before
      # the runner makes its first Docker call, and /entrypoint.sh still does the registration.
      COPY <<'EOF' /usr/local/bin/with-remote-docker
      #!/bin/sh
      set -eu
      : "${REMOTE_DOCKER_STATE_DIR:=/run/rd/state}"
      export REMOTE_DOCKER_STATE_DIR
      mkdir -p "$REMOTE_DOCKER_STATE_DIR"

      # The key arrives read-only from a Secret; the client wants it 0600 in its own state dir.
      if [ -f /secrets/id_ed25519 ]; then
        install -m 0600 /secrets/id_ed25519 "$REMOTE_DOCKER_STATE_DIR/id_ed25519"
      fi

      # Idempotent: the state dir is an emptyDir, so this is normally a fresh create, but a
      # restart that kept state must not fail here.
      remote-docker remote create "$REMOTE_DOCKER_WORKSPACE" \
        --host "$REMOTE_DOCKER_HOST" --user "$REMOTE_DOCKER_USER" --no-context || true
      remote-docker remote start

      exec /entrypoint.sh "$@"
      EOF
      RUN chmod 0755 /usr/local/bin/with-remote-docker

      ENTRYPOINT ["/usr/local/bin/with-remote-docker"]
      # CMD MUST be repeated. Setting ENTRYPOINT resets the base image's CMD to empty, so
      # without this /entrypoint.sh runs with no arguments: it registers the runner, finds
      # nothing to exec, exits 0, and its EXIT trap deregisters again -- a clean-looking
      # restart loop that never listens for a job.
      CMD ["./bin/Runner.Listener", "run", "--startuptype", "service"]
  push:
    history: 10
    writeRefTo:
      namespace: flux-system
      keys:
        ref: GITHUB_RUNNER_REF
