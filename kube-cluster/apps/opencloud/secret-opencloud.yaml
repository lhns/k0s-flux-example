# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: opencloud
    namespace: opencloud
    annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
type: Opaque
stringData:
    COLLABORATION_WOPI_SECRET: CHANGEME-COLLABORATION_WOPI_SECRET
    IDM_ADMIN_PASSWORD: CHANGEME-IDM_ADMIN_PASSWORD
    IDM_IDPSVC_PASSWORD: CHANGEME-IDM_IDPSVC_PASSWORD
    IDM_REVASVC_PASSWORD: CHANGEME-IDM_REVASVC_PASSWORD
    IDM_SVC_PASSWORD: CHANGEME-IDM_SVC_PASSWORD
    OC_JWT_SECRET: CHANGEME-OC_JWT_SECRET
    OC_MACHINE_AUTH_API_KEY: CHANGEME-OC_MACHINE_AUTH_API_KEY
    OC_SERVICE_ACCOUNT_SECRET: CHANGEME-OC_SERVICE_ACCOUNT_SECRET
    OC_SYSTEM_USER_API_KEY: CHANGEME-OC_SYSTEM_USER_API_KEY
    OC_TRANSFER_SECRET: CHANGEME-OC_TRANSFER_SECRET
    OC_URL_SIGNING_SECRET: CHANGEME-OC_URL_SIGNING_SECRET
