apiVersion: v1
kind: Service
metadata:
  name: drawio
  namespace: opencloud
spec:
  selector:
    app.kubernetes.io/name: drawio
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawio
  namespace: opencloud
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: drawio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drawio
        app.kubernetes.io/instance: opencloud
        kube-vnet/net.traefik.traefik: ingress
    spec:
      enableServiceLinks: false
      # No runAsUser: the entrypoint writes its config into the image as `tomcat`, and skips every
      # DRAWIO_* setting if it cannot.
      containers:
        - name: drawio
          image: jgraph/drawio:32.7.4@sha256:921c8c2e76778765e37632086c45de50176ff5f17c5b123ff6c1f8dbf96b4da5
          ports:
            - {name: http, containerPort: 8080}
          env:
            # The default is http://localhost:8080.
            - {name: DRAWIO_BASE_URL, value: "https://drawio.example.com"}
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            timeoutSeconds: 5
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            timeoutSeconds: 5
            httpGet: {path: /, port: http}
            periodSeconds: 10
