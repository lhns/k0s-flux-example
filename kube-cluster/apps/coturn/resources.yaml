---
apiVersion: v1
kind: Namespace
metadata:
  name: coturn
---
# Shared STUN/TURN. Two consumers today: snikket (Jingle A/V for XMPP) and
# synapse (Matrix 1:1 VoIP via turn_uris). Both use coturn's REST-API credential
# scheme against one shared secret, which is why a single instance can serve them.
#
# Snikket ships its own coturn; it is disabled there (SNIKKET_TWEAK_TURNSERVER=0)
# in favour of this one, so there is exactly one UDP relay range to punch through
# the router instead of one per app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: coturn
  annotations:
    # roll the pod when the shared secret rotates: the rendered config is built
    # once at startup, so a changed Secret is otherwise never picked up.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Single VIP, and externalTrafficPolicy: Local means the address follows the
  # pod — two pods would split the relay state and strand allocations.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
        app.kubernetes.io/instance: coturn
        # No kube-vnet join label on purpose. coturn has no in-cluster edges at
        # all: every port arrives via the coturn-lb LoadBalancer (kube-vnet
        # auto-allows that, ext.svc) and relaying is external egress.
    spec:
      enableServiceLinks: false
      initContainers:
        # Render the final config = git-managed turnserver.conf + the one secret
        # line. coturn has no env-var substitution and no include directive, so
        # the file has to be assembled somewhere; doing it here keeps the secret
        # out of both git and the process table (`--static-auth-secret` on argv
        # would be readable via ps to anyone on the node).
        - name: render-config
          image: busybox:1.38.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              {
                cat /config/turnserver.conf
                echo "static-auth-secret=$TURN_SHARED_SECRET"
              } > /rendered/turnserver.conf
              chmod 0400 /rendered/turnserver.conf
          env:
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: coturn-shared-secret
                  key: secret
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: rendered, mountPath: /rendered}
      containers:
        - name: coturn
          image: coturn/coturn:4.17.2-r0
          args: ["-c", "/etc/coturn/turnserver.conf"]
          ports:
            - {name: turn-tcp, containerPort: 3478, protocol: TCP}
            - {name: turn-udp, containerPort: 3478, protocol: UDP}
            - {name: turns-tcp, containerPort: 5349, protocol: TCP}
            - {name: turns-udp, containerPort: 5349, protocol: UDP}
          volumeMounts:
            - {name: rendered, mountPath: /etc/coturn, readOnly: true}
            # NOT nested under /etc/coturn: that is a readOnly emptyDir holding
            # only turnserver.conf, so the runtime cannot create a `certs`
            # mountpoint inside it and the container fails to start at all
            # (OCI "make mountpoint ... read-only file system").
            - {name: certs, mountPath: /etc/coturn-certs, readOnly: true}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          readinessProbe:
            # 3s rather than the 1s default: under node load a 1s TCP probe flaps
            # and empties the Service endpoints, which drops the VIP (mosquitto
            # learned this the hard way).
            tcpSocket: {port: 3478}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # No liveness probe: coturn holds live relay allocations in memory, and
          # a restart drops every call in progress. A readiness failure already
          # takes it out of the VIP.
      volumes:
        - name: config
          configMap:
            name: coturn-config
        - name: rendered
          emptyDir: {}
        - name: certs
          secret:
            # *.example.com, mirrored from the traefik ns by reflector (see
            # infra/traefik/tls.yaml). turn.example.com is a single label, so the
            # wildcard covers it.
            secretName: lhns-de
---
# Raw STUN/TURN on a dedicated MetalLB VIP. Traefik cannot carry UDP (see
# infra/metallb/pool.yaml), so this cannot ride the shared traefik VIP.
# externalTrafficPolicy: Local preserves client source IPs — STUN exists to tell
# a client its own reflexive address, so a SNAT'd source IP makes it report the
# wrong one and ICE fails.
apiVersion: v1
kind: Service
metadata:
  name: coturn-lb
  namespace: coturn
  annotations:
    metallb.io/loadBalancerIPs: 10.20.2.80
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: coturn
  ports:
    - {name: turn-tcp, port: 3478, targetPort: 3478, protocol: TCP}
    - {name: turn-udp, port: 3478, targetPort: 3478, protocol: UDP}
    - {name: turns-tcp, port: 5349, targetPort: 5349, protocol: TCP}
    - {name: turns-udp, port: 5349, targetPort: 5349, protocol: UDP}
    # Relay range 49152-49201, enumerated because Services have no port ranges
    # (the LiveKit precedent). MUST stay in sync with min-port/max-port in
    # turnserver.conf.
    - {name: r49152, port: 49152, targetPort: 49152, protocol: UDP}
    - {name: r49153, port: 49153, targetPort: 49153, protocol: UDP}
    - {name: r49154, port: 49154, targetPort: 49154, protocol: UDP}
