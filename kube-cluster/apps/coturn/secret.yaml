# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: coturn-shared-secret
    namespace: coturn
    annotations:
        # One secret, three readers. coturn renders it into turnserver.conf; snikket
        # passes it as SNIKKET_TWEAK_TURNSERVER_SECRET; synapse as turn_shared_secret.
        # Mirroring rather than duplicating keeps rotation a single edit.
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: snikket,matrix
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: snikket,matrix
stringData:
    secret: CHANGEME-secret
