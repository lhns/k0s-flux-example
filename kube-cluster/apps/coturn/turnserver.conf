# coturn — shared STUN/TURN for snikket (XMPP/Jingle) and matrix (synapse VoIP).
#
# `static-auth-secret` is NOT here: it is appended at startup by the render
# initContainer from the SOPS secret (see resources.yaml). Keeping the rest in
# git means the port ranges below stay reviewable and diffable — which matters,
# because they must agree exactly with the ports enumerated on coturn-lb.

listening-port=3478
tls-listening-port=5349

# THE RELAY RANGE MUST MATCH coturn-lb's enumerated UDP ports EXACTLY.
# Kubernetes Services have no port ranges, so every relay port is its own Service
# entry (the LiveKit precedent, apps/matrix/resources.yaml). Widening this without
# widening the Service hands out ports that nothing forwards, and calls fail with
# no error anywhere obvious.
min-port=49152
max-port=49201

realm=example.com

# The REST-API credential scheme (RFC 7635-style ephemeral users): a client is
# handed username=<expiry>:<user> and password=HMAC(secret, username). Both
# snikket (SNIKKET_TWEAK_TURNSERVER_SECRET) and synapse (turn_shared_secret)
# speak exactly this, which is what lets one coturn serve both.
use-auth-secret

# Behind NAT coturn must advertise the address clients actually reach, not its
# pod IP — otherwise every relay candidate it offers is unroutable and calls
# silently fall back to direct-only (i.e. fail for anyone symmetric-NATted).
external-ip=203.0.113.10

# TLS for turns:5349, from the *.example.com wildcard reflected out of the traefik ns.
# Its own mount point, NOT under /etc/coturn: that path is a readOnly emptyDir
# and a nested mount there cannot be created (the container fails to start).
cert=/etc/coturn-certs/tls.crt
pkey=/etc/coturn-certs/tls.key
no-tlsv1
no-tlsv1_1

# A TURN relay is an open proxy unless told otherwise: without these, anyone who
# can authenticate could relay traffic INTO the cluster's private ranges and the
# LAN. Deny RFC1918 + link-local + multicast, then re-allow nothing.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
no-multicast-peers

# No admin CLI/telnet listener, no stdout noise beyond warnings.
no-cli
simple-log
fingerprint
