extensions:
  health_check:
    # bind all interfaces (default is localhost) so the k8s readiness probe reaches it
    endpoint: 0.0.0.0:13133

receivers:
  prometheus/feedback:
    config:
      scrape_configs:
      # Collect own metrics
        - job_name: 'victoriatraces-exporter'
          scrape_interval: 10s
          static_configs:
            - targets: ['127.0.0.1:8888']

  kafka/traces:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    traces:
      topics:
        - otlp_spans
    group_id: victoriatraces-exporter
    initial_offset: earliest
    message_marking:
      after: true
      # Kafka is the retry mechanism (ADR 0030): a failed write is rewound and retried, so a
      # store restart loses nothing. A permanent error (a record the store rejects) is
      # still skipped, or it would block the partition.
      on_error: false
      on_permanent_error: true
    error_backoff:
      enabled: true
      initial_interval: 5s
      max_interval: 1m
      max_elapsed_time: 5m

exporters:
  otlp/feedback:
    endpoint: opentelemetry-gateway.opentelemetry-gateway.svc.cluster.local:4317
    tls:
      insecure: true

  otlphttp/victoriatraces:
    traces_endpoint: http://victoriatraces:10428/insert/opentelemetry/v1/traces
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

service:
  extensions: [health_check]
  pipelines:
    metrics/feedback:
      receivers: [prometheus/feedback]
      processors: []
      exporters: [otlp/feedback]
    traces:
      receivers: [kafka/traces]
      processors: []
      exporters: [otlphttp/victoriatraces]
