extensions:
  health_check:
    # bind all interfaces (default is localhost) so the k8s readiness probe reaches it
    endpoint: 0.0.0.0:13133

receivers:
  prometheus/feedback:
    config:
      scrape_configs:
      # Collect own metrics
        - job_name: 'victoriatraces-exporter'
          scrape_interval: 10s
          static_configs:
            - targets: ['127.0.0.1:8888']
        # The store's own /metrics; service.name = job_name, as for the VM components.
        - job_name: 'victoriatraces'
          scrape_interval: 10s
          static_configs:
            - targets: ['victoriatraces:10428']
        # Cardinality via json_exporter's probe pattern; see README, "Cardinality metrics".
        - job_name: 'victoriatraces-cardinality'
          scrape_interval: 5m
          scrape_timeout: 60s
          metrics_path: /probe
          params:
            module: [cardinality]
            target: ['http://victoriatraces:10428/select/logsql/stats_query?query=-trace_id_idx_stream%3A%2A%20_time%3A1d%20%7C%20math%20floor%28now%28%29%2F86400000000000%29%2A86400000000000%20as%20mid%2C%20_time%20as%20t%20%7C%20math%20t-mid%20as%20d%20%7C%20filter%20d%3A%3E%3D0%20%7C%20stats%20by%20%28%22resource_attr%3Aservice.name%22%29%20count_uniq%28_stream%29%20as%20streams']
          static_configs:
            - targets: ['victoriatraces-cardinality-exporter:7979']
        # Hourly; the 62d windows = -retentionPeriod=2 (resources.yaml), keep in sync. See README.
        - job_name: 'victoriatraces-cardinality-retention'
          scrape_interval: 1h
          scrape_timeout: 5m
          metrics_path: /probe
          params:
            module: [retention]
            target: ['http://victoriatraces:10428/select/logsql/stats_query?query=-trace_id_idx_stream%3A%2A%20_time%3A62d%20%7C%20stats%20by%20%28%22resource_attr%3Aservice.name%22%29%20count_uniq%28_stream_id%29%20as%20n']
          static_configs:
            - targets: ['victoriatraces-cardinality-exporter:7979']
        - job_name: 'victoriatraces-cardinality-retention-total'
          scrape_interval: 1h
          scrape_timeout: 5m
          metrics_path: /probe
          params:
            module: [retention_total]
            target: ['http://victoriatraces:10428/select/logsql/stats_query?query=-trace_id_idx_stream%3A%2A%20_time%3A62d%20%7C%20stats%20count_uniq%28_stream_id%29%20as%20n']
          static_configs:
            - targets: ['victoriatraces-cardinality-exporter:7979']
        - job_name: 'victoriatraces-cardinality-new-1h'
          scrape_interval: 1h
          scrape_timeout: 5m
          metrics_path: /probe
          params:
            module: [new_1h]
            target: ['http://victoriatraces:10428/select/logsql/stats_query?query=-trace_id_idx_stream%3A%2A%20_time%3A1h%20-_stream_id%3Ain%28-trace_id_idx_stream%3A%2A%20_time%3A%5Bnow-62d%2C%20now-1h%29%20%7C%20fields%20_stream_id%29%20%7C%20stats%20by%20%28%22resource_attr%3Aservice.name%22%29%20count_uniq%28_stream_id%29%20as%20n']
          static_configs:
            - targets: ['victoriatraces-cardinality-exporter:7979']
        - job_name: 'victoriatraces-cardinality-new-1h-total'
          scrape_interval: 1h
          scrape_timeout: 5m
          metrics_path: /probe
          params:
            module: [new_1h_total]
            target: ['http://victoriatraces:10428/select/logsql/stats_query?query=-trace_id_idx_stream%3A%2A%20_time%3A1h%20-_stream_id%3Ain%28-trace_id_idx_stream%3A%2A%20_time%3A%5Bnow-62d%2C%20now-1h%29%20%7C%20fields%20_stream_id%29%20%7C%20stats%20count_uniq%28_stream_id%29%20as%20n']
          static_configs:
            - targets: ['victoriatraces-cardinality-exporter:7979']

  kafka/traces:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    traces:
      topics:
        - otlp_spans
    group_id: victoriatraces-exporter
    initial_offset: earliest
    message_marking:
      after: true
      # Kafka is the retry mechanism (ADR 0030): a failed write is rewound and retried, so a
      # store restart loses nothing. A permanent error (a record the store rejects) is
      # still skipped, or it would block the partition.
      on_error: false
      on_permanent_error: true
    error_backoff:
      enabled: true
      initial_interval: 5s
      max_interval: 1m
      max_elapsed_time: 5m

exporters:
  otlp/feedback:
    endpoint: opentelemetry-gateway.opentelemetry-gateway.svc.cluster.local:4317
    tls:
      insecure: true

  otlphttp/victoriatraces:
    traces_endpoint: http://victoriatraces:10428/insert/opentelemetry/v1/traces
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

service:
  extensions: [health_check]
  pipelines:
    metrics/feedback:
      receivers: [prometheus/feedback]
      processors: []
      exporters: [otlp/feedback]
    traces:
      receivers: [kafka/traces]
      processors: []
      exporters: [otlphttp/victoriatraces]
