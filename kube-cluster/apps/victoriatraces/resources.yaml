apiVersion: v1
kind: Namespace
metadata:
  name: victoriatraces
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: victoriatraces
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# ===========================================================================
# VictoriaTraces data dir — 72G on the appdata CephFS, MOUNTED in place
# (jellyfin/syncthing static-PV pattern), NOT copied. capacity 1Gi is a dummy
# (ignored for static cephfs); bound by volumeName.
# ===========================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: victoriatraces-data
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: victoriatraces-data
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /docker/observability/victoriatraces
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriatraces-data
  namespace: victoriatraces
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: victoriatraces-data
  resources:
    requests:
      storage: 1Gi
---
# ===========================================================================
# VictoriaTraces DB (traces store + HTTP API/UI on :10428). The data dir is
# root-owned on CephFS, so run as root (matches Swarm; NO fsGroup — avoids a
# recursive chown of the 72G tree). Single-writer -> Recreate.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriatraces
  namespace: victoriatraces
spec:
  replicas: 1 # live (Swarm VT stack stopped; data + Kafka group freed)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriatraces
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriatraces
        app.kubernetes.io/instance: victoriatraces
        # HTTP UI from Traefik; the exporter writes to :10428 over the in-ns vnet.
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.victoriatraces: ingress
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: victoriatraces
          image: victoriametrics/victoria-traces:v0.11.0
          # Memory only, per apps/webtop/README.md -- a CPU limit would throttle, not protect.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          args:
            - -retentionPeriod=2
            - -storageDataPath=/victoria-traces-data
          ports:
            - name: http
              containerPort: 10428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /victoria-traces-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoriatraces-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoriatraces
  namespace: victoriatraces
spec:
  selector:
    app.kubernetes.io/name: victoriatraces
  ports:
    - name: http
      port: 10428
      targetPort: http
---
# ===========================================================================
# OTel collector — reads OTLP spans from the in-cluster Kafka (otlp_spans topic) and
# writes them into VictoriaTraces. Stateless; config from a ConfigMap. Single
# Kafka consumer (group victoriatraces-exporter) -> replicas 1, Recreate.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriatraces-exporter
  namespace: victoriatraces
spec:
  replicas: 1 # live (Swarm VT stack stopped; data + Kafka group freed)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriatraces-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriatraces-exporter
        app.kubernetes.io/instance: victoriatraces
        # writes to victoriatraces:10428 (in-ns). Nothing external any more: both the
        # Kafka it consumes and the collector it reports itself to are in-cluster now.
        kube-vnet/net.victoriatraces: egress
        # consumes the in-cluster Kafka (otel-kafka-bootstrap.opentelemetry-gateway).
        kube-vnet/net.opentelemetry-gateway.kafka: egress
        # sends its OWN self-monitoring metrics (otlp/feedback) to the gateway's
        # ClusterIP. Needed because that is an in-cluster Service: it used to be the
        # Swarm collector at 10.20.2.10:4317, which was external egress and needed no
        # label. Drop this label and the feedback pipeline silently stops.
        kube-vnet/net.opentelemetry-gateway.otel-gateway: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.160.0
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: victoriatraces-exporter-config
