# ===========================================================================
# VictoriaTraces data dir — 72G on the appdata CephFS, MOUNTED in place
# (jellyfin/syncthing static-PV pattern), NOT copied. capacity 1Gi is a dummy
# (ignored for static cephfs); bound by volumeName.
# ===========================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: victoriatraces-data
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: victoriatraces-data
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /docker/observability/victoriatraces
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriatraces-data
  namespace: victoriatraces
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: victoriatraces-data
  resources:
    requests:
      storage: 1Gi
---
# ===========================================================================
# VictoriaTraces DB (traces store + HTTP API/UI on :10428). The data dir is
# root-owned on CephFS, so run as root (matches Swarm; NO fsGroup — avoids a
# recursive chown of the 72G tree). Single-writer -> Recreate.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriatraces
  namespace: victoriatraces
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriatraces
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriatraces
        app.kubernetes.io/instance: victoriatraces
        # HTTP UI from Traefik; the exporter writes to :10428 over the in-ns vnet.
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.victoriatraces: ingress
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: victoriatraces
          image: victoriametrics/victoria-traces:v0.13.0@sha256:3018df8f99429d7d3029167ab9f70848bf0a778c31c49dff16c86c7e34759fbd
          # Memory only, per ADR 0028 -- a CPU limit would throttle, not protect.
          # VictoriaTraces sizes its caches from the LIMIT (-memory.allowedPercent, 60% by
          # default), so the limit is the working budget, not a ceiling it rarely touches.
          # At 2Gi it OOMKilled roughly every 36 hours, and twice in 90 minutes while
          # merging a backlog. An OOM restarts the container in place and never unmounts
          # the CephFS volume, which is why it never took a node down; changing this block
          # recreates the POD and does unmount, so apply it only while Ceph is healthy.
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 4Gi
          args:
            - -retentionPeriod=2
            - -storageDataPath=/victoria-traces-data
          ports:
            - name: http
              containerPort: 10428
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /victoria-traces-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoriatraces-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoriatraces
  namespace: victoriatraces
spec:
  selector:
    app.kubernetes.io/name: victoriatraces
  ports:
    - name: http
      port: 10428
      targetPort: http
---
# ===========================================================================
# OTel collector — reads OTLP spans from the in-cluster Kafka (otlp_spans topic) and
# writes them into VictoriaTraces. Stateless; config from a ConfigMap. Single
# Kafka consumer (group victoriatraces-exporter) -> replicas 1.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriatraces-exporter
  namespace: victoriatraces
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriatraces-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriatraces-exporter
        app.kubernetes.io/instance: victoriatraces
        # writes to victoriatraces:10428 (in-ns). Nothing external any more: both the
        # Kafka it consumes and the collector it reports itself to are in-cluster now.
        kube-vnet/net.victoriatraces: egress
        # consumes the in-cluster Kafka (otel-kafka-bootstrap.opentelemetry-gateway).
        kube-vnet/net.opentelemetry-gateway.kafka: egress
        # sends its OWN self-monitoring metrics (otlp/feedback) to the gateway ClusterIP.
        # Drop this label and the feedback pipeline silently stops.
        kube-vnet/net.opentelemetry-gateway.otel-gateway: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: victoriatraces-exporter-config
---
# ===========================================================================
# json_exporter: turns the store's cardinality API into metrics (see README,
# "Cardinality metrics"). Probed by the victoriatraces-exporter collector.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriatraces-cardinality-exporter
  namespace: victoriatraces
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriatraces-cardinality-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriatraces-cardinality-exporter
        app.kubernetes.io/instance: victoriatraces
        # Both directions on one channel: queries victoriatraces (it carries kube-vnet/net.victoriatraces: ingress)
        # and is probed by the collector (egress on the same net).
        kube-vnet/net.victoriatraces: both
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: json-exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
          args:
            - --config.file=/config/config.yml
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 7979
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: victoriatraces-cardinality-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: victoriatraces-cardinality-exporter
  namespace: victoriatraces
spec:
  selector:
    app.kubernetes.io/name: victoriatraces-cardinality-exporter
  ports:
    - {name: http, port: 7979, targetPort: http}
