# Grafana Operator objects of this component (README.md, "Grafana objects"). Opts out of Flux
# substitution: dashboard JSON is full of ${...}.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: app-webtop-desktops
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      grafana.example.com/instance: main
  folderUID: ag1airdsjen7kc # Cluster
  configMapRef:
    name: app-webtop-dashboards
    key: webtop-desktops.json
