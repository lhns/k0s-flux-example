apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # RBD PVC for the home directory; the SeccompProfile CRD; oci-composer builds artifacts/. Read by the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-ceph-csi-rbd,infra-security-profiles-operator,infra-oci-composer
resources:
- runtimeclass.yaml
- release.yaml
- routing-desktop.yaml
- grafana.yaml
# Dashboard JSON: stable names with the operator's label (its informer only sees labelled
# ConfigMaps, so a JSON change syncs at once instead of at the next resync), no substitution.
configMapGenerator:
- name: app-webtop-dashboards
  namespace: grafana
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/managed-by: grafana-operator
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
  files:
  - dashboards/webtop-desktops.json
