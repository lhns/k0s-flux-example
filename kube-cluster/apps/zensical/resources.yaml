apiVersion: v1
kind: Namespace
metadata:
  name: zensical
---
# The blog SOURCE (docs/ markdown + overrides/ theme), copied once from the old Swarm
# volume fastappdata:/docker/zensical. Mounted read-only; zensical builds from it into
# an ephemeral emptyDir. Small + read-mostly -> CephFS RWX (both pods can mount it RO
# during a start-first rollover). The regenerable site/ + .cache/ are NOT persisted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zensical-source
  namespace: zensical
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zensical
  namespace: zensical
spec:
  # Source PVC populated (see README), now live.
  replicas: 1
  # Stateless working dir (emptyDir per pod) -> start-first rolling updates, matching
  # the Swarm order:start-first. No shared writable state, so overlap is fully safe.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zensical
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zensical
        app.kubernetes.io/instance: zensical
        kube-vnet/net.traefik.traefik: ingress
    spec:
      containers:
        - name: zensical
          # Runs as root, so it can write the ephemeral emptyDir /docs (site/, .cache/).
          image: zensical/zensical:0.0.55
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            # Ephemeral working dir — zensical builds site/ + .cache/ here (regenerated
            # on every start; never persisted).
            - name: work
              mountPath: /docs
            # Read-only source + config layered on top of the emptyDir.
            - name: source
              mountPath: /docs/docs
              subPath: docs
              readOnly: true
            - name: source
              mountPath: /docs/overrides
              subPath: overrides
              readOnly: true
            - name: config
              mountPath: /docs/zensical.toml
              subPath: zensical.toml
              readOnly: true
      volumes:
        - name: work
          emptyDir: {}
        - name: source
          persistentVolumeClaim:
            claimName: zensical-source
            readOnly: true
        - name: config
          configMap:
            name: zensical-config
---
apiVersion: v1
kind: Service
metadata:
  name: zensical
  namespace: zensical
spec:
  selector:
    app.kubernetes.io/name: zensical
  ports:
    - name: http
      port: 8000
      targetPort: http
