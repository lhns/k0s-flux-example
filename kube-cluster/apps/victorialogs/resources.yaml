# ===========================================================================
# VictoriaLogs data dir — 36G on the appdata CephFS, MOUNTED in place
# (jellyfin/syncthing static-PV pattern), NOT copied. capacity 1Gi is a dummy
# (ignored for static cephfs); bound by volumeName.
# ===========================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: victorialogs-data
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: victorialogs-data
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /docker/observability/victorialogs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victorialogs-data
  namespace: victorialogs
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: victorialogs-data
  resources:
    requests:
      storage: 1Gi
---
# ===========================================================================
# VictoriaLogs DB (logs store + HTTP API/UI on :9428). The data dir is
# root-owned on CephFS, so run as root (matches Swarm; NO fsGroup — avoids a
# recursive chown of the 36G tree). Single-writer -> Recreate.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  namespace: victorialogs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
        app.kubernetes.io/instance: victorialogs
        # HTTP UI from Traefik; the exporter writes to :9428 over the in-ns vnet.
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.victorialogs: ingress
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
          # Memory only, per ADR 0028 -- a CPU limit would throttle, not protect.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          args:
            - -retentionPeriod=2
            - -defaultMsgValue=
            - -storageDataPath=/victoria-logs-data
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victorialogs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: victorialogs
spec:
  selector:
    app.kubernetes.io/name: victorialogs
  ports:
    - name: http
      port: 9428
      targetPort: http
---
# ===========================================================================
# OTel collector — reads OTLP logs from the in-cluster Kafka (otlp_logs topic) and
# writes them into VictoriaLogs. Stateless; config from a ConfigMap. Single
# Kafka consumer (group victorialogs-exporter) -> replicas 1.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs-exporter
  namespace: victorialogs
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs-exporter
        app.kubernetes.io/instance: victorialogs
        # writes to victorialogs:9428 (in-ns). Nothing external any more: both the
        # Kafka it consumes and the collector it reports itself to are in-cluster now.
        kube-vnet/net.victorialogs: egress
        # consumes the in-cluster Kafka (otel-kafka-bootstrap.opentelemetry-gateway).
        kube-vnet/net.opentelemetry-gateway.kafka: egress
        # sends its OWN self-monitoring metrics (otlp/feedback) to the gateway ClusterIP.
        # Drop this label and the feedback pipeline silently stops.
        kube-vnet/net.opentelemetry-gateway.otel-gateway: egress
    spec:
      enableServiceLinks: false
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: victorialogs-exporter-config
---
# ===========================================================================
# json_exporter: turns the store's cardinality API into metrics (see README,
# "Cardinality metrics"). Probed by the victorialogs-exporter collector.
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs-cardinality-exporter
  namespace: victorialogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs-cardinality-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs-cardinality-exporter
        app.kubernetes.io/instance: victorialogs
        # Both directions on one channel: queries victorialogs (it carries kube-vnet/net.victorialogs: ingress)
        # and is probed by the collector (egress on the same net).
        kube-vnet/net.victorialogs: both
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: json-exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
          args:
            - --config.file=/config/config.yml
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 7979
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: victorialogs-cardinality-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs-cardinality-exporter
  namespace: victorialogs
spec:
  selector:
    app.kubernetes.io/name: victorialogs-cardinality-exporter
  ports:
    - {name: http, port: 7979, targetPort: http}
