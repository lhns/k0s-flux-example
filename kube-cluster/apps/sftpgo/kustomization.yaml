apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Static CephFS PVs (the served filesystems) need infra-ceph-csi-cephfs; the
    # sftpgo-config PVC needs infra-ceph-csi-rbd; the sftpgo-lb LoadBalancer's
    # 10.20.2.17 needs the sftpgo-vip MetalLB pool (infra-metallb). Read by the
    # root generator; inert to kustomize.
    dependsOn: infra-ceph-csi-cephfs,infra-ceph-csi-rbd,infra-metallb
resources:
- resources.yaml
- routing.yaml
- secret.yaml
