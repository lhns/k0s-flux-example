---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftpgo-archive
  namespace: sftpgo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: sftpgo-archive
  resources:
