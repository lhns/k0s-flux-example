apiVersion: v1
kind: Namespace
metadata:
  name: sftpgo
---
# ===========================================================================
# sftpgo's config + SQLite data-provider db (sftpgo.db) + the SFTP host keys.
# Only ~360K, but SQLite wants block storage for proper locking -> its own
# ceph-rbd PVC. Copied in once during the Swarm migration; the live db lives here.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftpgo-config
  namespace: sftpgo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
# ===========================================================================
# The filesystems sftpgo serves — MOUNTED in place from the existing CephFS
# filesystems (appdata/fastappdata/userdata/archive on the same ceph-cluster),
# NOT copied (the appdata data dir alone is ~249G). Static CephFS PVs
# (jellyfin/immich pattern): storageClassName "", csi cephfs.csi.ceph.com,
# staticVolume, per-fs fsName + rootPath, bound by volumeName. capacity 1Gi is
# a dummy. All RW — sftpgo is the file server and writes uploads everywhere.
# One PVC per fs, mounted at several pod paths (some via subPath).
# ===========================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sftpgo-appdata
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: sftpgo-appdata
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftpgo-appdata
  namespace: sftpgo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: sftpgo-appdata
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sftpgo-fastappdata
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: sftpgo-fastappdata
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: fastappdata
      staticVolume: "true"
      rootPath: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftpgo-fastappdata
  namespace: sftpgo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: sftpgo-fastappdata
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sftpgo-userdata
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: sftpgo-userdata
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: userdata
