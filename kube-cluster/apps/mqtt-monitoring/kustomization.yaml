apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Needs mosquitto (the broker + the `mosquitto` vnet that lets this pod reach
    # :1883). Read by the root generator; inert to kustomize.
    dependsOn: app-mosquitto
resources:
- resources.yaml
# The exporter config as a real .json file. The generator patches this ConfigMap into
# a Secret (templates/_secret-from-files.tpl), which keeps ${MQTT_MONITORING_PASSWORD}
# visible to Flux's substitution. The key stays CONFIG, which is the env var the
# deployment reads.
configMapGenerator:
- name: mqtt-monitoring-config
  namespace: mqtt-monitoring
  files:
  - CONFIG=config.json
  options:
    disableNameSuffixHash: true
    annotations:
      generators.example.com/as-secret: "true"
