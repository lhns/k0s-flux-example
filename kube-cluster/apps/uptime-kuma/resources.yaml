# Uptime Kuma keeps ALL state in /app/data — its embedded SQLite DB (kuma.db),
# config, and uploads. Copied once from the old Swarm volume
# fastdata:/docker/uptime-kuma into a dedicated Ceph RBD volume. Single-writer
# (SQLite) -> RWO + a one-replica StatefulSet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10Gi
---
# StatefulSet, not Deployment: a replacement starts only once the old pod is confirmed gone,
# so SQLite never gets two writers (README, "Decisions").
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  replicas: 1
  serviceName: uptime-kuma
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/instance: uptime-kuma
        # receive from traefik. No egress label: monitor probes reach their
        # targets over unrestricted external egress (ingress-only baseline).
        kube-vnet/net.traefik.traefik: ingress
    spec:
      # Disable IPv6 in the pod netns so the resolver never hands out AAAA
      # records (the cluster is IPv4-only; the leftover link-local IPv6 otherwise
      # makes uptime-kuma's DNS cache flap monitors of dual-stack hosts "down").
      # These are "unsafe" sysctls, allowlisted on workers via k0sctl.yaml's
      # workerProfiles. Swarm behaved this way (Docker disabled container IPv6).
      securityContext:
        sysctls:
          - name: net.ipv6.conf.all.disable_ipv6
            value: "1"
          - name: net.ipv6.conf.default.disable_ipv6
            value: "1"
      containers:
        # v2's schema upgrade is one-way: a rollback to v1 needs the DB restored
        # from backup, not just the tag reverted.
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.6
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          env:
            - name: TZ
              value: Europe/Berlin
            - name: UMASK
              value: "0022"
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
      # The existing PVC by name. A volumeClaimTemplate would provision a new, empty volume.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  selector:
    app.kubernetes.io/name: uptime-kuma
  ports:
    - name: http
      port: 3001
      targetPort: http
