apiVersion: v1
kind: Namespace
metadata:
  name: uptime-kuma
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: uptime-kuma
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# Uptime Kuma keeps ALL state in /app/data — its embedded SQLite DB (kuma.db),
# config, and uploads. Copied once from the old Swarm volume
# fastappdata:/docker/uptime-kuma into a dedicated Ceph RBD volume. Single-writer
# (SQLite) -> RWO + Recreate on the Deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  # SQLite /app/data copied from the old Swarm volume (see README), now live. RWO
  # data volume -> Recreate (never two writers).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/instance: uptime-kuma
        # receive from traefik. No egress label: monitor probes reach their
        # targets over unrestricted external egress (ingress-only baseline).
        kube-vnet/net.traefik.traefik: ingress
    spec:
      # Disable IPv6 in the pod netns so the resolver never hands out AAAA
      # records (the cluster is IPv4-only; the leftover link-local IPv6 otherwise
      # makes uptime-kuma's DNS cache flap monitors of dual-stack hosts "down").
      # These are "unsafe" sysctls, allowlisted on workers via k0sctl.yaml's
      # workerProfiles. Swarm behaved this way (Docker disabled container IPv6).
      securityContext:
        sysctls:
          - name: net.ipv6.conf.all.disable_ipv6
            value: "1"
          - name: net.ipv6.conf.default.disable_ipv6
            value: "1"
      containers:
        # Pinned to the last v1 release: the migrated DB is a v1 schema
        # (databasePatchedFiles / database_version), so stay on v1 rather than
        # trigger v2's one-way schema upgrade. Uptime Kuma migrates v1->v1 forward.
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.3
          env:
            - name: TZ
              value: Europe/Berlin
            - name: UMASK
              value: "0022"
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  selector:
    app.kubernetes.io/name: uptime-kuma
  ports:
    - name: http
      port: 3001
      targetPort: http
