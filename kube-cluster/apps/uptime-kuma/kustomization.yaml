apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The RBD data PVC needs the ceph-rbd StorageClass. The authelia middleware is
    # reflected in by traefik-reflector (eventually consistent, no hard dep).
    # Read by the root generator; inert to kustomize.
    dependsOn: infra-ceph-csi-rbd
resources:
- resources.yaml
- routing.yaml
