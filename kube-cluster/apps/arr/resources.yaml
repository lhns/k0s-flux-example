    metadata:
      labels:
        app.kubernetes.io/name: decluttarr
        app.kubernetes.io/instance: arr
        kube-vnet/net.arr-api: both
        kube-vnet/net.pod-gateway.gateway: both
    spec:
      containers:
        - name: decluttarr
          # renovate: datasource=docker
          image: ghcr.io/manimatter/decluttarr:v2.1.0
          securityContext:
            capabilities:
              drop: [NET_ADMIN, NET_RAW]
          env:
