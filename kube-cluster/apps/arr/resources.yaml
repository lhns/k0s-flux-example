---
# hotio's plugins build -- the live instance. Its SQLite file is 401 KB and
# dated Dec 2024 only because this instance does not use SQLite: config.xml
# points at Postgres lidarr-main, which holds 2,987 artists / 104,849 albums /
# 300,565 track files and was being written the morning of the migration.
#
# The blampe/hearring-aid tree is the abandoned experiment (42 MB SQLite, last
# written Nov 2025) and is not deployed. Dropped with it: the RandomNinjaAtk
# arr-scripts hook, which was already dormant -- its init file is dot-prefixed
# so the runner skips it, /config/scripts was never created, and the
# custom-services.d mount is commented out in the compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: arr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
        app.kubernetes.io/instance: arr
        kube-vnet/net.arr-api: both
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.pod-gateway.gateway: both
    spec:
      containers:
        - name: lidarr
          # Digest-pinned: pr-plugins is a rolling tag with no versioned releases.
          # renovate: datasource=docker
          image: ghcr.io/hotio/lidarr:pr-plugins@sha256:ae0b3b14769fdfeb73fe5d9e61ebcda04edf202244bcbd6323d2fe1381154f57
          securityContext:
            capabilities:
              drop: [NET_ADMIN, NET_RAW]
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
            # See SONARR__LOG__LEVEL above.
            - name: LIDARR__LOG__LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8686
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bulk
              mountPath: /config/MediaCover
              subPath: lidarr/data/MediaCover
            - name: bulk
              mountPath: /config/extended
              subPath: lidarr/data/extended
            - name: media
              mountPath: /media
            - name: link-paths
              mountPath: /custom-cont-init.d
            # hotio's s6 path is service-lidarr, not svc-lidarr like linuxserver.
            - name: s6-run
              mountPath: /etc/s6-overlay/s6-rc.d/service-lidarr/run
              subPath: run
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: bulk
          persistentVolumeClaim:
            claimName: arr-config
        - name: s6-run
          configMap:
            name: arr-s6-run
            defaultMode: 0755
            items:
              - key: lidarr
                path: run
        - name: media
          persistentVolumeClaim:
            claimName: arr-media
        - name: link-paths
          configMap:
            name: arr-link-paths
            defaultMode: 0755
            items:
              - key: lidarr
                path: link-paths
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: lidarr
  ports:
    - name: http
      port: 8686
      targetPort: http
