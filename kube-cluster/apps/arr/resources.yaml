---
# Inbound P2P (50300) is NOT exposed: behind the gateway the default route is
# the tunnel, so a connection arriving on eth0 would reply via vxlan0, and
# NordVPN offers no port forwarding anyway. Downloads work; we are not
# directly connectable. The UI is reachable through Traefik as normal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: arr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slskd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slskd
        app.kubernetes.io/instance: arr
        kube-vnet/net.arr-api: both
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.pod-gateway.gateway: both
    spec:
      containers:
        - name: slskd
          # renovate: datasource=docker
          image: slskd/slskd:0.26.0
          securityContext:
            capabilities:
              drop: [NET_ADMIN, NET_RAW]
          env:
            - name: SLSKD_REMOTE_CONFIGURATION
              value: "true"
            - name: SLSKD_UMASK
              value: "000"
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 5030
          volumeMounts:
            - name: fast
              mountPath: /app
            - name: config
              mountPath: /app/share
              subPath: slskd/share
            - name: media
              mountPath: /media
            - name: incomplete
              mountPath: /incomplete-downloads-slskd
              subPath: incomplete-downloads-slskd
      volumes:
        - name: fast
          persistentVolumeClaim:
            claimName: slskd-app
        - name: config
          persistentVolumeClaim:
            claimName: arr-config
        - name: media
          persistentVolumeClaim:
            claimName: arr-media
        - name: incomplete
          persistentVolumeClaim:
            claimName: arr-incomplete
---
apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: slskd
  ports:
    - name: http
      port: 5030
      targetPort: http
---
# Not routed for its own sake -- it only talks to jellyfin in-cluster over eth0 --
# but it lives here rather than getting a namespace of its own, and being in this
# namespace means the webhook routes it. Harmless, and one less namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopulse
  namespace: arr
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: autopulse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autopulse
        app.kubernetes.io/instance: arr
        kube-vnet/net.jellyfin.jellyfin-api: egress
        kube-vnet/net.arr-api: both
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.pod-gateway.gateway: both
    spec:
      containers:
        - name: autopulse
          # renovate: datasource=docker
          image: ghcr.io/dan-online/autopulse:v2.0.0
          securityContext:
            capabilities:
              drop: [NET_ADMIN, NET_RAW]
          env:
            - name: TZ
              value: Europe/Berlin
          # Secret keys are named as the env vars autopulse expects, so the whole
          # Secret goes in as-is and config.yaml stays free of credentials.
          envFrom:
            - secretRef:
                name: autopulse-secrets
          ports:
            - name: http
              containerPort: 2875
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: autopulse-config
---
apiVersion: v1
kind: Service
metadata:
  name: autopulse
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: autopulse
  ports:
    - name: http
      port: 2875
      targetPort: http
---
# No Service and no ingress: it only calls the *arr APIs and exposes nothing.
