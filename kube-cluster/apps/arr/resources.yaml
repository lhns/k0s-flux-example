#
# Everything in this namespace is routed through the VPN: the webhook selects the
# namespace by label and gatewayDefault is true, so there are no per-pod opt-ins
# to forget. Workloads that must NOT be tunnelled live in apps/seerr instead.
#
# These mount the SAME CephFS config directories the Swarm stack used. They ran
# at replicas 0 until the Swarm stack was stopped, because two writers on one
# *arr database corrupts it. Rollback is scale to 0 and start Swarm again --
# but note the configs now point at CNPG, so a rollback needs the config.xml
# .pre-k8s backups restored alongside.
#
# No fsGroup and no pod-level securityContext: the s6-overlay entrypoint starts
# as root, chowns /config and drops to abc. An fsGroup fights it and forces a
# recursive chown of /media on every start.
---
apiVersion: v1
kind: Namespace
metadata:
  name: arr
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: arr
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
  labels:
    # Selects this namespace for the pod-gateway mutating webhook, and is what
    # makes every pod here routed by default. Must match a namespace listed in
    # the reflection annotations on infra/pod-gateway's ConfigMap, or the
    # injected init container has no settings.sh to read.
    routed-gateway: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: arr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd
        app.kubernetes.io/instance: arr
        kube-vnet/net.arr-api: both
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.pod-gateway.gateway: both
    spec:
      containers:
        - name: sabnzbd
          # renovate: datasource=docker
          image: lscr.io/linuxserver/sabnzbd:5.1.2-ls270
          # Memory only, per apps/webtop/README.md -- a CPU limit would throttle, not protect.
          # Article cache and par2 repair grow to whatever is free; it sat at 4.1Gi BestEffort.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            capabilities:
              drop: [NET_ADMIN, NET_RAW]
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /downloads
              subPath: downloads
            - name: incomplete
              mountPath: /incomplete-downloads
              subPath: incomplete-downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: media
          persistentVolumeClaim:
            claimName: arr-media
        - name: incomplete
          persistentVolumeClaim:
            claimName: arr-incomplete
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: sabnzbd
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: arr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
        app.kubernetes.io/instance: arr
        kube-vnet/net.arr-api: both
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.pod-gateway.gateway: both
    spec:
      containers:
        - name: sonarr
          # renovate: datasource=docker
          image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls322
          securityContext:
            capabilities:
              drop: [NET_ADMIN, NET_RAW]
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
            # debug is the default and writes *.debug.*.txt (101 M sonarr/radarr, 1.2 G
            # lidarr). File logging cannot be turned off: NzbDroneLogger registers the
            # targets unconditionally. stdout is unaffected.
            - name: SONARR__LOG__LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: link-paths
              mountPath: /custom-cont-init.d
            # Stock linuxserver run script plus -exitimmediately, carried over
            # from Swarm. Coupled to this image tag's s6 layout: if a bump moves
            # svc-sonarr, startup breaks -- drop this mount if that happens.
            - name: s6-run
              mountPath: /etc/s6-overlay/s6-rc.d/svc-sonarr/run
              subPath: run
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: s6-run
          configMap:
            name: arr-s6-run
            defaultMode: 0755
            items:
              - key: sonarr
                path: run
        - name: media
          persistentVolumeClaim:
            claimName: arr-media
        - name: link-paths
          configMap:
            name: arr-link-paths
            defaultMode: 0755
            items:
              - key: sonarr
                path: link-paths
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: sonarr
  ports:
    - name: http
      port: 8989
      targetPort: http
---
