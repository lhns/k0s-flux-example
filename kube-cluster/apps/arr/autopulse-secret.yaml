# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
apiVersion: v1
kind: Secret
metadata:
    name: autopulse-secrets
    namespace: arr
stringData:
    AUTOPULSE__APP__DATABASE_URL: CHANGEME-AUTOPULSE__APP__DATABASE_URL
    AUTOPULSE__AUTH__PASSWORD: CHANGEME-AUTOPULSE__AUTH__PASSWORD
    AUTOPULSE__TARGETS__MY_JELLYFIN_MUSIC__TOKEN: CHANGEME-AUTOPULSE__TARGETS__MY_JELLYFIN_MUSIC__TOKEN
    AUTOPULSE__TARGETS__MY_JELLYFIN_PG__TOKEN: CHANGEME-AUTOPULSE__TARGETS__MY_JELLYFIN_PG__TOKEN
    AUTOPULSE__TARGETS__MY_JELLYFIN__TOKEN: CHANGEME-AUTOPULSE__TARGETS__MY_JELLYFIN__TOKEN
type: Opaque
