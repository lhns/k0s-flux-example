# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# autopulse's config carries its DB password, the auth password and per-target
# jellyfin tokens, so it is a Secret rather than a generated ConfigMap.
apiVersion: v1
kind: Secret
metadata:
    name: autopulse-config
    namespace: arr
type: Opaque
stringData:
    config.yaml: CHANGEME-config.yaml
