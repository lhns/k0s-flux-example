# Traefik reaches these pods on eth0, which stays in the pod network -- the
# gateway only rewrites the DEFAULT route, and the pod/service CIDRs are in
# NOT_ROUTED_TO_GATEWAY_CIDRS. So ingress is unaffected by the tunnel.
#
# All six are behind authelia; none of them should ever be exposed unauthenticated.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sabnzbd
  namespace: arr
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`sabnzbd.example.com`)
      services:
        - name: sabnzbd
          port: 8080
      middlewares:
        - name: authelia
  tls: {}
---
apiVersion: traefik.io/v1alpha1
