# Roles and databases for the *arr stack in the shared CNPG cluster, migrated
# from the Swarm Postgres. One login role per app; the *arr apps each want a
# -main and a -log database, both owned by that app's role.
#
# retain on both: never drop these, they hold the libraries.
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: sonarr
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: sonarr
  ensure: present
  login: true
  passwordSecret:
    name: sonarr-db
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr-main
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: sonarr-main
  owner: sonarr
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr-log
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: sonarr-log
  owner: sonarr
  databaseReclaimPolicy: retain
---
