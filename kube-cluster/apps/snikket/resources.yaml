---
# Prosody's data + uploads. Block, not cephfs: a single writer with its own on-disk format.
# SNIKKET_UPLOAD_STORAGE_GB is set well below this so uploads cannot fill it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snikket-data
  namespace: snikket
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 20Gi
---
# One Pod because upstream's containers share localhost; two of its four are absent (README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snikket
  namespace: snikket
  annotations:
    # Env is never updated in a running pod; roll on secret rotation.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Single RWO volume and a stateful XMPP server: never two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: snikket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snikket
        app.kubernetes.io/instance: snikket
        kube-vnet/net.traefik.traefik: ingress
        # lldap :3890. Needs this label AND `snikket` in apps/lldap/vnet.yaml.
        kube-vnet/net.lldap.lldap: egress
        # apps/cheogram-sip reaches the component port (5347). Needs this label AND vnet.yaml.
        kube-vnet/net.snikket-component: ingress
    spec:
      # The images read SNIKKET_* from the environment; injected <SVC>_PORT vars
      # would collide with prosody's own expectations.
      enableServiceLinks: false
      containers:
        # ---- prosody + the Snikket modules: c2s, s2s, proxy65, internal HTTP ----
        - name: server
          image: snikket/snikket-server:stable.20260611@sha256:311c076e06ec0fdb182900577a936cdc8d15da50bcc6ccd6707b743a13a162f3
          envFrom:
            - configMapRef: {name: snikket-env}
          env:
            - name: SNIKKET_TWEAK_TURNSERVER_SECRET
              valueFrom:
                secretKeyRef:
                  # mirrored from the coturn ns by reflector (apps/coturn/secret.yaml)
                  name: coturn-shared-secret
                  key: secret
            # Read by ldap.cfg.lua as ENV_LDAP_BIND_PASSWORD: prosody resolves
            # ENV_<NAME> via os.getenv (configmanager.lua:216), so the bind
            # password stays in the Secret and never lands in a config file.
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: snikket-ldap
                  key: LDAP_BIND_PASSWORD
            # Read by sip.cfg.lua as ENV_SIP_COMPONENT_SECRET / ENV_ASTERISK_COMPONENT_SECRET.
            # Owned here (secret-sip-components.yaml) and mirrored to cheogram-sip by
            # reflector, so the gateway and prosody cannot drift apart on a rotation.
            - name: SIP_COMPONENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sip-components
                  key: SIP_COMPONENT_SECRET
            - name: ASTERISK_COMPONENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sip-components
                  key: ASTERISK_COMPONENT_SECRET
          ports:
            - {name: c2s, containerPort: 5222, protocol: TCP}
            - {name: s2s, containerPort: 5269, protocol: TCP}
            - {name: proxy65, containerPort: 5000, protocol: TCP}
            # External components. Reachable only from apps/cheogram-sip via kube-vnet;
            # deliberately absent from every IngressRoute and VIP.
            - {name: component, containerPort: 5347, protocol: TCP}
          volumeMounts:
            - {name: data, mountPath: /snikket}
            - {name: certs, mountPath: /snikket/letsencrypt/live/xmpp.example.com, readOnly: true}
            - {name: extra-config, mountPath: /etc/snikket-extra, readOnly: true}
            # Prosody loads custom_plugins/mod_auth_lldap/mod_auth_lldap.lua. Not under /etc/prosody:
            # the entrypoint chowns it, and image volumes take no file subPath.
            - name: ldap-module
              mountPath: /var/lib/prosody/custom_plugins/mod_auth_lldap
              readOnly: true
            # lualdap (artifacts/lualdap.yaml), at a path already in prosody's package.cpath.
            # Mounted at the `lib` level so lua/5.4/lualdap.so's relative symlink resolves.
            - name: lualdap
              mountPath: /var/lib/prosody/custom_plugins/lib
              readOnly: true
          readinessProbe:
            # c2s accepting connections is the meaningful signal; the HTTP side is
            # the proxy's business. 3s rather than the 1s default so a loaded node
            # doesn't flap the endpoint out of the Service.
            tcpSocket: {port: 5222}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 20
          # No liveness probe: first boot generates certs/state and a restart
          # part-way through leaves prosody's store half-written.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
        # ---- TLS/HTTP front for the portal, file sharing and BOSH/websocket ----
        - name: web-proxy
          image: snikket/snikket-web-proxy:stable.20260611@sha256:e2c22746c19489d2723c6ccebb15f2f14e4e35431cabbc7318d9ee33a48566e1
          envFrom:
            - configMapRef: {name: snikket-env}
          ports:
            - {name: http, containerPort: 80, protocol: TCP}
            - {name: https, containerPort: 443, protocol: TCP}
          volumeMounts:
            - {name: data, mountPath: /snikket}
            - {name: certs, mountPath: /snikket/letsencrypt/live/xmpp.example.com, readOnly: true}
            # Upstream shares an acme-challenge dir between proxy and the certs
            # container. There is no certs container here, but the proxy still
            # expects the path to exist.
            - {name: acme-challenges, mountPath: /var/www/html/.well-known/acme-challenge}
          readinessProbe:
            tcpSocket: {port: 443}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
        # ---- the invite/admin web UI, reached only through web-proxy ----
        - name: web-portal
          image: snikket/snikket-web-portal:stable.20260611@sha256:d67ff498c44bcabc6eee0379d030870004cc37ccf445aa5450d891d4ce02e136
          envFrom:
            - configMapRef: {name: snikket-env}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: snikket-data
        - name: acme-challenges
          emptyDir: {}
        - name: extra-config
          configMap:
            name: snikket-extra-config
        # Built by artifacts/ldap-module.yaml.
        - name: ldap-module
          image:
            reference: ${SNIKKET_LDAP_MODULE_REF}
            pullPolicy: IfNotPresent
        - name: lualdap
          image:
            reference: ${SNIKKET_LUALDAP_REF}
            pullPolicy: IfNotPresent
        - name: certs
          secret:
            secretName: snikket-tls
            # cert-manager writes tls.crt/tls.key; Snikket reads certbot's layout.
            # Renaming here means no init container and no copy — the files simply
            # appear where prosody and the proxy already look.
            items:
              - {key: tls.crt, path: fullchain.pem}
              - {key: tls.key, path: privkey.pem}
---
# Everything traefik routes to. No LoadBalancer: with TURN split out into
# apps/coturn, Snikket's remaining raw ports are all TCP, and traefik carries TCP
# fine (IngressRouteTCP, see routing.yaml). That saves a second VIP.
apiVersion: v1
kind: Service
metadata:
  name: snikket
  namespace: snikket
spec:
  selector:
    app.kubernetes.io/name: snikket
  ports:
    - {name: https, port: 443, targetPort: https, protocol: TCP}
    - {name: http, port: 80, targetPort: http, protocol: TCP}
    - {name: c2s, port: 5222, targetPort: c2s, protocol: TCP}
    - {name: s2s, port: 5269, targetPort: s2s, protocol: TCP}
    - {name: proxy65, port: 5000, targetPort: proxy65, protocol: TCP}
    - {name: component, port: 5347, targetPort: component, protocol: TCP}
