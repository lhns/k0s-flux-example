# EXAMPLE — placeholder values. In the source repo this file is SOPS-encrypted
# (age, `encrypted_regex: ^(data|stringData)$`). Replace each CHANGEME-* and
# encrypt with `sops -e -i` before applying.
# XEP-0114 component secrets, owned here because the snikket pod (prosody) needs them to start; the
# gateway in cheogram-sip reads the reflector mirror (SIP_COMPONENT_SECRET for the user-facing
# component, ASTERISK_COMPONENT_SECRET for Asterisk). Alone in this file: a bad re-encrypt takes
# prosody's components down with it.
apiVersion: v1
kind: Secret
metadata:
    name: sip-components
    namespace: snikket
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: cheogram-sip
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: cheogram-sip
type: Opaque
stringData:
    SIP_COMPONENT_SECRET: CHANGEME-SIP_COMPONENT_SECRET
    ASTERISK_COMPONENT_SECRET: CHANGEME-ASTERISK_COMPONENT_SECRET
