---
# Break-glass login for when Authelia is down (README, "Break-glass login"). No pod uses this
# account; tokens are minted on demand with `kubectl create token`, never stored.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-breakglass
  namespace: headlamp
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-breakglass
subjects:
  - kind: ServiceAccount
    name: headlamp-breakglass
    namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
