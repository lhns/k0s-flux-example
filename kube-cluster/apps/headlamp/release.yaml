---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 1h0m0s
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 10m0s
  chart:
    spec:
      chart: headlamp
      version: "0.46.0"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    # The chart binds its ServiceAccount to cluster-admin by default. Unused: every call is made
    # with the user's own token, OIDC or break-glass (README, "Decisions").
    clusterRoleBinding:
      create: false
    config:
      # Log in as yourself via Authelia instead of pasting a service-account token.
      # The API server side of this lives in k0s-files/authentication-config.yaml;
      # without it the login succeeds and every kube call is then rejected.
      oidc:
        # Issuer, client id, scopes and PKCE all live IN the secret, not here: with
        # externalSecret on, the chart emits only `envFrom: secretRef` and drops the
        # whole OIDC env block, so anything set here would be silently ignored.
        externalSecret:
          enabled: true
          name: headlamp-oidc
        # The chart otherwise creates its own empty Secret/oidc -- one already exists
        # in the namespace from the default, and leaving this on gives you two.
        secret:
          create: false
      # Enables the Helm plugin in the UI — browse charts, install/upgrade/rollback
      enableHelm: true
      watchPlugins: true
      # Load our own plugin from a *separate* dir (the image volume below).
      extraArgs:
        - "-user-plugins-dir=/headlamp/user-plugins"
        # The chart wires only client-id, client-secret and issuer-url as flags, so every
        # other OIDC setting has to be passed here -- an OIDC_* env var alone is read by
        # nothing. Without this the scope defaults to profile,email: no `groups` claim, so
        # RBAC bound to oidc:admin never matches.
        #
        # NO offline_access, deliberately. Headlamp retries a failed refresh on every API
        # request with no backoff and never falls back to re-login, so once the refresh
        # token expires an open tab hammers Authelia's token endpoint until its rate limit
        # locks out every OIDC client, this one included. It also forces a consent screen
        # that implicit consent does not suppress. The cost is re-login when the access
        # token expires, which is what the tab did anyway -- just cleanly.
        - "-oidc-scopes=openid,profile,email,groups"
    pluginsManager:
      enabled: true
      # Chart default is node:lts-alpine. No Renovate manager matches `baseImage`; bump by hand.
      baseImage: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
      configContent: |
        plugins:
          - name: helm-plugin
            source: https://artifacthub.io/packages/headlamp/helm-plugin/helm-plugin
            version: 0.1.0
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.6.0
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
        installOptions:
          parallel: true
          maxConcurrent: 2
      resources:
        requests: {memory: 192Mi}
        limits: {memory: 512Mi}
    # Our own plugin (headlamp-app-view), mounted as an image volume into the *user*-plugins
    # dir, NOT /headlamp/plugins: the pluginsManager prunes that dir to its own config.
    # `subPath: plugins` because the plugin sits at /plugins/headlamp-app-view in the image.
    # See README.
    volumes:
      - name: app-view-plugin
        image:
          # renovate: datasource=docker
          reference: ghcr.io/lhns/headlamp-app-view:0.3.0
          # IfNotPresent: Always would put ghcr.io in the path of every pod start.
          pullPolicy: IfNotPresent
    volumeMounts:
      - name: app-view-plugin
        mountPath: /headlamp/user-plugins
        subPath: plugins
        readOnly: true
    resources:
      limits: {memory: 192Mi}
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - host: headlamp.kube.example.com
          paths:
            - path: /
              type: Prefix
    podLabels:
      kube-vnet/net.traefik.traefik: ingress
