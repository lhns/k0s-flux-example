apiVersion: v1
kind: Namespace
metadata:
  name: duckdb
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: duckdb
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duckdb-workspace
  namespace: duckdb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb
  namespace: duckdb
spec:
  replicas: 1
  strategy:
    type: Recreate # single writer on a RWO volume
  selector:
    matchLabels:
      app.kubernetes.io/name: duckdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duckdb
        app.kubernetes.io/instance: duckdb
        # receive traffic from traefik under kube-vnet's ingress isolation
        kube-vnet/net.traefik.traefik: ingress
    spec:
      containers:
        # The DuckDB UI server. The image is distroless (no shell), so we run the
        # duckdb binary directly instead of the Swarm `sh -c "socat & duckdb"`.
        # tty+stdin keep the interactive CLI alive so the UI server keeps serving;
        # HOME=/workspace makes `INSTALL ui` cache the extension on the volume.
        - name: duckdb
          image: duckdb/duckdb:1.5.5
          command:
            - duckdb
            - -cmd
            - "SET enable_logging = true; SET logging_level = 'debug'; INSTALL ui; LOAD ui; CALL start_ui_server();"
            - database.db
          workingDir: /workspace
          tty: true
          stdin: true
          env:
            - name: TZ
              value: Europe/Berlin
            - name: HOME
              value: /workspace
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        # The UI binds to [::1]:4213 (IPv6 localhost only), so forward a
        # pod-reachable port to it — same trick as the Swarm socat, but as a
        # sidecar sharing the pod's network namespace.
        - name: socat
          image: alpine/socat:1.8.1.3
          args:
            - TCP-LISTEN:4214,fork,reuseaddr
            - "TCP:[::1]:4213"
          ports:
            - name: http
              containerPort: 4214
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: duckdb-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: duckdb
  namespace: duckdb
spec:
  selector:
    app.kubernetes.io/name: duckdb
  ports:
    - name: http
      port: 4214
      targetPort: http
---
# Spoof Host/Origin/Referer so the DuckDB UI (which expects localhost:4213)
# accepts requests proxied from duckdb.example.com. Ported from the Swarm
# `duckdb-headers` middleware. Same namespace as the app -> no cross-namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: duckdb-headers
  namespace: duckdb
spec:
  headers:
    customRequestHeaders:
      Host: "localhost:4213"
      Origin: "http://localhost:4213"
      Referer: "http://localhost:4213/"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckdb
  namespace: duckdb
  annotations:
    # Authelia SSO first, then the Host/Origin/Referer rewrite (order matters:
    # Authelia sees the real host; duckdb-headers rewrites it for the backend).
    traefik.ingress.kubernetes.io/router.middlewares: duckdb-authelia@kubernetescrd,duckdb-duckdb-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: duckdb.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duckdb
                port:
                  number: 4214
