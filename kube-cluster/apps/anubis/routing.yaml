---
# forwardAuth middleware, reflected into every namespace (traefik-reflector). A route opts in
# with `middlewares: [{name: anubis}]`; see README.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: anubis
  namespace: anubis
  annotations:
    traefik-reflector/namespaces: "*"
spec:
  forwardAuth:
    address: http://anubis.anubis.svc.cluster.local:8080/.within.website/x/cmd/anubis/api/check
    trustForwardHeader: true
---
# The challenge page. No middleware here, or the challenge would challenge itself.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: anubis
  namespace: anubis
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`anubis.example.com`)
      services:
        - name: anubis
          port: 8080
  tls: {}
