---
# Not HA and not persistent on purpose: it holds only challenges in flight, so losing it costs
# the solves in progress at that moment. A client that has passed carries a signed cookie.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: anubis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: anubis
        kube-vnet/net.valkey: ingress
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - {name: valkey, containerPort: 6379}
          readinessProbe:
            exec: {command: ["valkey-cli", "-p", "6379", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            timeoutSeconds: 5
            tcpSocket: {port: valkey}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: anubis
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
