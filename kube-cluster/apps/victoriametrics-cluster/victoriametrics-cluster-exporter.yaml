# OTel collector config (reproduced from the Swarm original; endpoints repointed):
#   - kafka brokers          otel_kafka-s3:9092            -> 10.20.176.187:9092
#   - otlp/feedback endpoint  otel_opentelemetry-collector:4317 -> the in-cluster gateway
#   - scrape targets vminsert-1/vmselect-1/vmstorage-1 -> the in-cluster Service names
#   - otlphttp/victoriametrics http://vminsert:8480/... (in-cluster Service, unchanged)
extensions:
  health_check:
    # bind all interfaces (default is localhost) so the k8s readiness probe reaches it
    endpoint: 0.0.0.0:13133

receivers:
  prometheus/feedback:
    config:
      scrape_configs:
      # Collect own metrics
        - job_name: 'victoriametrics-cluster-exporter'
          scrape_interval: 15s
          static_configs:
            - targets: ['127.0.0.1:8888']
        - job_name: 'vminsert'
          scrape_interval: 15s
          static_configs:
            - targets:
              - 'vminsert:8480'
        - job_name: 'vmselect'
          scrape_interval: 15s
          static_configs:
            - targets:
              - 'vmselect:8481'
        - job_name: 'vmstorage'
          scrape_interval: 15s
          static_configs:
            - targets:
              - 'vmstorage:8482'
        - job_name: 'vminsert-longterm'
          scrape_interval: 15s
          static_configs:
            - targets:
              - 'vminsert-longterm:8480'
        - job_name: 'vmstorage-longterm'
          scrape_interval: 15s
          static_configs:
            - targets:
              - 'vmstorage-longterm:8482'
        # Cardinality via json_exporter's probe pattern; see README, "Cardinality metrics".
        - job_name: 'victoriametrics-cardinality'
          scrape_interval: 5m
          scrape_timeout: 60s
          metrics_path: /probe
          params:
            module: [cardinality]
            target: ['http://vmselect:8481/select/0/prometheus/api/v1/status/tsdb?topN=50&focusLabel=service.name']
          static_configs:
            - targets: ['victoriametrics-cluster-cardinality-exporter:7979']
        # Takes 30-45 s against vmselect's 1m -search.maxQueryDuration, which also caps a per-request timeout=.
        - job_name: 'victoriametrics-cardinality-retention'
          scrape_interval: 1h
          scrape_timeout: 2m
          metrics_path: /probe
          params:
            module: [retention]
            target: ['http://vmselect:8481/select/0/prometheus/api/v1/series/count']
          static_configs:
            - targets: ['victoriametrics-cluster-cardinality-exporter:7979']

  kafka/metrics:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    metrics:
      topics:
        - otlp_metrics
    group_id: victoriametrics-cluster-exporter
    initial_offset: earliest
    # No effect on one partition; for when the topic has more. Needs autocommit (the default).
    max_partition_fetch_size: 1048576  # 1 MiB, the default
    max_fetch_size: 16777216           # 16 MiB
    partition_processing:
      independent: true
      max_prefetch:
        batches: 2
        bytes: 67108864                # 64 MiB
    message_marking:
      after: true
      on_error: false
    # Without this the receiver PAUSES the partition on any export error and only
    # resumes on a rebalance (consumer_franz.go: default -> PauseFetchPartitions), which
    # is what wedges this pipeline until a restart. Enabled, it retries with backoff and
    # then rewinds the fetch cursor so the record is re-polled -> Kafka stays the retry
    # mechanism and the offset still commits only after a successful write.
    error_backoff:
      enabled: true
      initial_interval: 5s
      max_interval: 1m
      max_elapsed_time: 5m

  kafka/meta_metrics:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    metrics:
      topics:
        - otlp_meta_metrics
    group_id: victoriametrics-cluster-exporter
    initial_offset: earliest
    message_marking:
      after: true
      on_error: false
    # Without this the receiver PAUSES the partition on any export error and only
    # resumes on a rebalance (consumer_franz.go: default -> PauseFetchPartitions), which
    # is what wedges this pipeline until a restart. Enabled, it retries with backoff and
    # then rewinds the fetch cursor so the record is re-polled -> Kafka stays the retry
    # mechanism and the offset still commits only after a successful write.
    error_backoff:
      enabled: true
      initial_interval: 5s
      max_interval: 1m
      max_elapsed_time: 5m

  kafka/metrics_latest:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    metrics:
      topics:
        - otlp_metrics
    group_id: victoriametrics-cluster-exporter-latest
    initial_offset: latest
    # No effect on one partition; for when the topic has more. Needs autocommit (the default).
    max_partition_fetch_size: 1048576  # 1 MiB, the default
    max_fetch_size: 16777216           # 16 MiB
    partition_processing:
      independent: true
      max_prefetch:
        batches: 2
        bytes: 67108864                # 64 MiB
    message_marking:
      after: true
      on_error: true
    # on_error: true means this receiver can never hit the pause path, so backoff here
    # is not about wedging - it turns transient failures into successful writes instead
    # of drops. Kept deliberately short: this pipeline's job is to stay CURRENT, so it
    # must give up quickly and drop rather than fall behind on a slow backend.
    error_backoff:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s

  kafka/meta_metrics_latest:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    metrics:
      topics:
        - otlp_meta_metrics
    group_id: victoriametrics-cluster-exporter-latest
    initial_offset: latest
    message_marking:
      after: true
      on_error: true
    # on_error: true means this receiver can never hit the pause path, so backoff here
    # is not about wedging - it turns transient failures into successful writes instead
    # of drops. Kept deliberately short: this pipeline's job is to stay CURRENT, so it
    # must give up quickly and drop rather than fall behind on a slow backend.
    error_backoff:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s

  # Long-term tier feed. A new group_id starts at `earliest`, replaying the topic's full
  # retention: renaming it re-feeds ~10 days (harmless, dedup absorbs it, but slow).
  kafka/metrics_longterm:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    metrics:
      topics:
        - otlp_metrics
    group_id: victoriametrics-cluster-exporter-longterm
    initial_offset: earliest
    # No effect on one partition; for when the topic has more. Needs autocommit (the default).
    max_partition_fetch_size: 1048576  # 1 MiB, the default
    max_fetch_size: 16777216           # 16 MiB
    partition_processing:
      independent: true
      max_prefetch:
        batches: 2
        bytes: 67108864                # 64 MiB
    message_marking:
      after: true
      on_error: false
    # same as kafka/metrics
    error_backoff:
      enabled: true
      initial_interval: 5s
      max_interval: 1m
      max_elapsed_time: 5m

  kafka/meta_metrics_longterm:
    protocol_version: 2.1.0
    brokers:
      - otel-kafka-bootstrap.opentelemetry-gateway.svc.cluster.local:9092
    metrics:
      topics:
        - otlp_meta_metrics
    group_id: victoriametrics-cluster-exporter-longterm
    initial_offset: earliest
    message_marking:
      after: true
      on_error: false
    # same as kafka/metrics
    error_backoff:
      enabled: true
      initial_interval: 5s
      max_interval: 1m
      max_elapsed_time: 5m

exporters:
  otlp/feedback:
    endpoint: opentelemetry-gateway.opentelemetry-gateway.svc.cluster.local:4317
    tls:
      insecure: true

  otlphttp/victoriametrics:
    metrics_endpoint: http://vminsert:8480/insert/0/opentelemetry/v1/metrics
    compression: zstd  # default gzip costs more CPU
    http2_read_idle_timeout: 10s
    http2_ping_timeout: 5s
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

  otlphttp/victoriametrics_longterm:
    metrics_endpoint: http://vminsert-longterm:8480/insert/0/opentelemetry/v1/metrics
    compression: zstd  # default gzip costs more CPU
    http2_read_idle_timeout: 10s
    http2_ping_timeout: 5s
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

processors:
  transform/truncate_attributes:
    metric_statements:
      - context: datapoint
        statements:
          - truncate_all(attributes, 4096)
  interval/limit:
    interval: 10s
  interval/downsample:
    interval: 60s

service:
  extensions: [health_check]
  #telemetry:
  #  logs:
  #    level: debug
  pipelines:
    metrics/feedback:
      receivers: [prometheus/feedback]
      processors: []
      exporters: [otlp/feedback]
    metrics:
      receivers: [kafka/meta_metrics, kafka/metrics]
      processors: [transform/truncate_attributes]
      exporters: [otlphttp/victoriametrics]
    metrics/latest:
      receivers: [kafka/meta_metrics_latest, kafka/metrics_latest]
      processors: [transform/truncate_attributes, interval/downsample]
      exporters: [otlphttp/victoriametrics]
    # Long-term tier (README, "Long-term tier").
    # No metrics/latest counterpart: lag is harmless here and dedup thins to 1m anyway.
    metrics/longterm: {receivers: [kafka/meta_metrics_longterm, kafka/metrics_longterm], processors: [transform/truncate_attributes], exporters: [otlphttp/victoriametrics_longterm]}
