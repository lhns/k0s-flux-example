apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # vmstorage mounts a CephFS static PV (infra-ceph-csi-cephfs); the vmui routes
    # through Traefik + the reflected Authelia middleware (infra-traefik). Read by
    # the root generator; inert to kustomize.
    dependsOn: infra-ceph-csi-cephfs,infra-traefik
resources:
- resources.yaml
- vnet.yaml
- routing.yaml
configMapGenerator:
- name: victoriametrics-cluster-exporter-config
  namespace: victoriametrics-cluster
  files:
  - config.yaml=victoriametrics-cluster-exporter.yaml
