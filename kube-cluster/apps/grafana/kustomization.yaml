apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Needs the CNPG cluster + Database/DatabaseRole CRDs (infra-postgres) and
    # Reflector (infra-reflector) to mirror the db secret into this namespace, and the
    # Grafana CRDs (infra-grafana-operator).
    # Read by the root generator; inert to kustomize.
    flux-component-generator/dependsOn: infra-postgres,infra-reflector,infra-grafana-operator
resources:
- resources.yaml
- grafana.yaml
- grafana-config-secret.yaml
- db-role-secret.yaml
- database.yaml
- rbac.yaml
configurations:
- kustomizeconfig.yaml
configMapGenerator:
# Contact points from the repo; rules are operator CRs, the notification policy stays in the UI.
# Comments in these files are shipped config.
- name: grafana-alerting
  namespace: grafana
  files:
  - alerting-contactpoints.yaml
