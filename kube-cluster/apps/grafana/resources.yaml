apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: grafana
spec:
  accessModes:
    - ReadWriteOnce
  # /var/lib/grafana is plugins + png/csv, not the DB (that's Postgres), so CephFS
  # (file) rather than block. Fresh; copy the old data in later if wanted.
  storageClassName: cephfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: grafana
  # No Authelia — Grafana does its own auth (the Swarm middleware was commented out).
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
---
# grafana.example.com is Grafana's canonical URL (GF_SERVER_ROOT_URL), so OAuth
# only works there. grafana.kube.example.com therefore just redirects to it — serving the
# app on both would break the OAuth flow (state cookie set on one host, callback
# on the other). The default cert covers *.example.com, so tls: {} gives a valid cert
# for the redirect. (Route needs a service even though the middleware redirects
# before the backend is hit.)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-kube-redirect
  namespace: grafana
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.*)"
    replacement: "https://grafana.example.com/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-kube-redirect
  namespace: grafana
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`grafana.kube.example.com`)
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: grafana-kube-redirect
  tls: {}
