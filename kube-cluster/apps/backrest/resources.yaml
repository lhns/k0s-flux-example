---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backrest
  namespace: backrest
spec:
  # Live. (Shipped as 0 for the cutover; the Swarm backrest was stopped and
  # /data + /config copied into the state PVC — see README.)
  replicas: 1
  # Single-writer SQLite oplog -> Recreate, never two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backrest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backrest
        app.kubernetes.io/instance: backrest
        # :9898 arrives from traefik. The remote restic repo
        # (restic-demo.offsite.example.net) + rclone remotes are external egress
        # (unrestricted). No in-cluster dep.
        kube-vnet/net.traefik.traefik: ingress
    spec:
      # a `backrest` Service injects BACKREST_PORT=tcp://... , which backrest reads
      # as its bind address -> crash. Disable the injection; BACKREST_PORT is set
      # explicitly below.
      enableServiceLinks: false
      # Runs as root so it can read/write the (root-owned) mounted filesystems it
      # backs up. NO fsGroup (would trigger a recursive chown of huge libraries).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: backrest
          image: ghcr.io/garethgeorge/backrest:v1.14.1
          env:
            - name: TZ
              value: Europe/Berlin
            - name: BACKREST_DATA
              value: /data
            - name: BACKREST_CONFIG
              value: /config/config.json
            - name: XDG_CACHE_HOME
              value: /cache
            - name: TMPDIR
              value: /tmp
            # Bind all interfaces (image default is 0.0.0.0:9898; set explicitly so
            # nothing injected overrides it).
            - name: BACKREST_PORT
              value: 0.0.0.0:9898
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: state
              mountPath: /data
              subPath: data
            - name: state
              mountPath: /config
              subPath: config
            - name: state
              mountPath: /root/.config/rclone
              subPath: rclone
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            - name: repos
              mountPath: /repos
            - name: appdata
              mountPath: /mnt/appdata
            - name: fastappdata
              mountPath: /mnt/fastappdata
            - name: userdata
              mountPath: /mnt/userdata
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: backrest-state
        - name: cache
          persistentVolumeClaim:
            claimName: backrest-cache
        - name: tmp
          emptyDir: {}
        - name: repos
          persistentVolumeClaim:
            claimName: backrest-repos
        - name: appdata
          persistentVolumeClaim:
            claimName: backrest-appdata
        - name: fastappdata
          persistentVolumeClaim:
            claimName: backrest-fastappdata
        - name: userdata
          persistentVolumeClaim:
            claimName: backrest-userdata
---
apiVersion: v1
kind: Service
metadata:
  name: backrest
  namespace: backrest
spec:
  selector:
    app.kubernetes.io/name: backrest
  ports:
    - name: http
      port: 9898
      targetPort: http
