apiVersion: v1
kind: Namespace
metadata:
  name: backrest
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: backrest
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# ===========================================================================
# backrest's own state + secrets. /data = SQLite oplog (oplog.sqlite + WAL,
# kvdb.sqlite) + jwt-secret; /config = config.json (holds the restic repo
# password + backrest's own login) which backrest REWRITES from the UI, so it
# must live on a writable volume (not a k8s Secret); /rclone = rclone remotes
# (empty). SQLite is mmap/WAL + single-writer -> ceph-rbd (block) + Recreate.
# One PVC, three subPaths. Copied once from the Swarm volume (see README).
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backrest-state
  namespace: backrest
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
# ===========================================================================
# restic's pack/index cache. Persisted across restarts (avoids a re-download
# storm) but EXCLUDED from Velero's daily 30-day CSI snapshots (it's fully
# regenerable). /tmp stays an emptyDir (transient scratch).
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backrest-cache
  namespace: backrest
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs
  resources:
    requests:
      storage: 20Gi
---
# ===========================================================================
# The filesystems backrest reads to back up — MOUNTED in place from the
# existing CephFS filesystems (appdata/fastappdata/userdata on ceph-cluster),
# NOT copied. Static CephFS PVs (sftpgo/immich pattern). RW (restore can target
# them). backrest-repos is the (currently empty) local restic repo dir.
# ===========================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: backrest-appdata
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: ceph-csi-cephfs
    volumeHandle: backrest-appdata
    volumeAttributes:
      clusterID: ceph-cluster
      fsName: appdata
      staticVolume: "true"
      rootPath: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backrest-appdata
  namespace: backrest
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
