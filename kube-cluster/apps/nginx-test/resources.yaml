# A scratch single-replica workload for exercising kube-ha-surge's
# make-before-break behaviour on node drains. The container sleeps 30s before
# nginx starts, so a break-before-make gap (eviction with no cover) is a glaring
# ~30s outage — and a surge-covered drain is visibly seamless by comparison.
# Covered by ha-surge cluster-wide (defaultEnabled: true in infra/ha-surge) — no label
# needed here. To run the control (lossy) case, opt this one Deployment out with the
# annotation ha-surge.lhns.de/enabled: "false".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: nginx-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
        kube-vnet/net.traefik.traefik: ingress
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.8-alpine@sha256:e2d97c2b8c016f12c2f1a27d095685063b2f281c4edf2babfde6001cf4fb77a8
          command: ["/bin/sh", "-c", "sleep 30 && exec nginx -g 'daemon off;'"]
          ports:
            - {containerPort: 80}
          readinessProbe:
            timeoutSeconds: 5
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: nginx-test
spec:
  selector:
    app: nginx-test
  ports:
    - {port: 80, targetPort: 80}
