---
# Under pod-level kube-vnet isolation, cross-namespace ingress is denied by default, so the LDAP
# clients' namespaces join this vnet. Members opt in with the egress label
# kube-vnet/net.lldap.lldap; lldap itself carries kube-vnet/net.lldap: ingress.
apiVersion: kube-vnet.lhns.de/v1alpha1
kind: VirtualNetwork
metadata:
  name: lldap
  namespace: lldap
spec:
  description: "LDAP clients (Authelia, mosquitto, jellyfin, stalwart, snikket, rdpgw) -> lldap :3890."
  allowedNamespaces:
    names:
      - authelia
      - mosquitto
      - jellyfin
      - stalwart
      - snikket
      - rdpgw
