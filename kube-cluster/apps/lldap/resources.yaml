apiVersion: v1
kind: Namespace
metadata:
  name: lldap
---
# defaultRequest only: a `default` limit would OOMKill every unsized workload.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: lldap
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
        cpu: 25m
---
# LLDAP directory server (LDAP + web UI). Config is entirely env-driven (the old
# lldap_config.toml was placeholders overridden by env). Directory data lives in
# the shared CNPG cluster (migrated from the old Swarm Postgres). KEY_SEED +
# JWT_SECRET are preserved (SOPS) so existing data stays decryptable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # DB restored from the old Swarm Postgres (see README), now live. Single replica,
  # but RollingUpdate (maxUnavailable 0, maxSurge 1) so ha-surge (defaultEnabled
  # cluster-wide) gives it make-before-break on node drains — LDAP binds stay answered
  # while the replacement comes up. Directory data is in the shared CNPG `lldap` DB and
  # /data is emptyDir, so the brief 2-pod overlap during a drain shares no local state;
  # the only (accepted, rare) risk is concurrent writes to the DB during that window.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap
        app.kubernetes.io/instance: lldap
        # reach the CNPG primary; receive the web UI from traefik; accept LDAP
        # (:3890) from members of the lldap vnet (authelia, mosquitto).
        kube-vnet/net.postgres.postgres: egress
        kube-vnet/net.traefik.traefik: ingress
        kube-vnet/net.lldap: ingress
    spec:
      containers:
        - name: lldap
          image: lldap/lldap:2026-07-19
          env:
            - name: TZ
              value: Europe/Berlin
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: LLDAP_LDAP_BASE_DN
              value: dc=example,dc=com
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: jwt-secret
            - name: LLDAP_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: key-seed
            # DB password first, then $(VAR)-interpolated into the URL. sslmode=disable
            # (in-cluster; the Rust/sqlx TLS trips on CNPG's self-signed cert).
            - name: LLDAP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap-db
                  key: password
            - name: LLDAP_DATABASE_URL
              value: postgres://lldap:$(LLDAP_DB_PASSWORD)@postgres-rw.postgres.svc.cluster.local:5432/lldap?sslmode=disable
          ports:
            - name: ldap
              containerPort: 3890
            - name: http
              containerPort: 17170
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: lldap
spec:
  selector:
    app.kubernetes.io/name: lldap
  ports:
    - name: ldap
      port: 3890
      targetPort: ldap
    - name: http
      port: 17170
      targetPort: http
