apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Needs the CNPG cluster + Database CRDs (infra-postgres) and Reflector
    # (infra-reflector) for the db secret. Read by the root generator.
    dependsOn: infra-postgres,infra-reflector
resources:
- resources.yaml
- routing.yaml
- vnet.yaml
- database.yaml
- db-role-secret.yaml
- secret.yaml
