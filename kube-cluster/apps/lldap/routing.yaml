---
# Raw-TCP exposure of lldap :3890 on traefik's `ldap` entrypoint (10.20.2.15:3890),
# HostSNI(`*`) plain-TCP passthrough. Lets EXTERNAL clients (e.g. Swarm services still
# on 10.20.2.10) bind against the in-cluster directory. In-cluster apps use the ClusterIP
# service via the lldap vnet instead.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: lldap-tcp
  namespace: lldap
spec:
  entryPoints: [ldap]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: lldap
          port: 3890
---
# lldap web UI, gated by Authelia forwardAuth (the reflected `authelia` middleware).
# TLS via the default *.example.com wildcard.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lldap
  namespace: lldap
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`lldap.example.com`)
      services:
        - name: lldap
          port: 17170
      middlewares:
        - name: authelia
  tls: {}
