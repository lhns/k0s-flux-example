---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/instance: litellm
        kube-vnet/net.litellm: ingress
        kube-vnet/net.postgres.postgres: egress
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        # The non_root image's own user (nobody).
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          # The -non_root variant bundles the Prisma engines for the database. Never pip install.
          image: ghcr.io/berriai/litellm-non_root:v1.106.2@sha256:07fabea33dfc2b127e865c03112dfc76936334b29028ec05cdd355af2385dc04
          args: ["--config", "/config/config.yaml", "--port", "4000"]
          env:
            - name: LITELLM_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: litellm-db, key: password}}
            - name: DATABASE_URL
              value: postgresql://litellm:$(LITELLM_DB_PASSWORD)@postgres-rw.postgres.svc.cluster.local:5432/litellm
            # No usage telemetry, and no model-price map fetched from the internet at start.
            - {name: LITELLM_TELEMETRY_DISABLED, value: "true"}
            - {name: LITELLM_LOCAL_MODEL_COST_MAP, value: "True"}
            - {name: LITELLM_MODE, value: PRODUCTION}
          envFrom:
            # LITELLM_MASTER_KEY, LITELLM_SALT_KEY.
            - secretRef:
                name: litellm-master
          ports:
            - {name: http, containerPort: 4000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
          # Migrations run on first start and are slow.
          startupProbe:
            timeoutSeconds: 5
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 10
            failureThreshold: 60
          # Readiness reports 503 while Postgres is down; liveness must not, or a failover restarts it.
          readinessProbe:
            timeoutSeconds: 5
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            timeoutSeconds: 5
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - {name: http, port: 4000, targetPort: http}
