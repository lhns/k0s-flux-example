apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    flux-component-generator/dependsOn: infra-postgres,infra-reflector
resources:
- resources.yaml
- database.yaml
- db-role-secret.yaml
- secret.yaml
- vnet.yaml
# Provider keys: add secret-<provider>.yaml here (README, "Add a provider").
configMapGenerator:
- name: litellm-config
  namespace: litellm
  files:
  - config.yaml
