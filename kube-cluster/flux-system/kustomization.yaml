apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- generators-artifact.yaml
- generators.yaml
patches:
# Without the gate, postBuild substitutes an undefined ${VAR} as an empty string and applies
# it; with it, the reconcile fails instead. scripts/check-substitution.py checks the same offline.
# CancelHealthCheckOnNewRevision: a reconcile stuck in its health wait yields to a new revision,
# spec or reconcile request instead of blocking until the timeout.
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=StrictPostBuildSubstitutions=true,CancelHealthCheckOnNewRevision=true
# A push can wake many Kustomizations at once, each requeueing on its dependsOn; concurrency
# and CPU limits are sized from measured peaks.
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=32
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --requeue-dependency=5s
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits
      value: {cpu: "8", memory: 2Gi}
# Per push, source-watcher repacks every component's artifacts and source-controller fetches
# the repo; helm-controller re-renders any generator whose chart artifact changed.
- target:
    kind: Deployment
    name: source-watcher
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=24
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits
      value: {cpu: "4", memory: 1Gi}
- target:
    kind: Deployment
    name: source-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=10
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits
      value: {cpu: "4", memory: 1Gi}
- target:
    kind: Deployment
    name: helm-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=8
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits
      value: {cpu: "4", memory: 1Gi}
