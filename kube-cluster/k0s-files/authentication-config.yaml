# Structured config, NOT the legacy --oidc-* flags: kube-apiserver exits immediately if
# both are given. A malformed file hard-exits it too; an unreachable Authelia does not.
#
# Both prefixes are load-bearing: unprefixed, a username defaults to "<issuer>#<name>",
# and an Authelia group named system:masters would be a cluster takeover.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
  - issuer:
      # Must match Authelia's discovery `issuer` byte for byte, trailing slash included.
      url: https://auth.example.com
      audiences:
        - headlamp
    claimMappings:
      username:
        claim: preferred_username
        prefix: 'oidc:'
      groups:
        claim: groups
        prefix: 'oidc:'
