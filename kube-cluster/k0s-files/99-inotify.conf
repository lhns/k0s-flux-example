# Raised inotify limits for k8s worker nodes, distributed by k0sctl
# (spec.hosts[].files -> /etc/sysctl.d/99-inotify.conf, applied via the
# `sysctl --system` apply-hook).
#
# Debian's default fs.inotify.max_user_instances (128) is far too low for a
# k8s node: once many watch-heavy containers (jellyfin, mkdocs/zensical,
# controllers, ceph-csi, ...) land on one node — e.g. after a `kubectl drain`
# concentrates pods onto fewer nodes — creating a new inotify instance fails
# with EMFILE ("too many open files") and those pods crash-loop. File-descriptor
# limits are already generous (containerd nofile ~1M, fs.file-max unbounded), so
# only the inotify limits need raising.
fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=1048576
