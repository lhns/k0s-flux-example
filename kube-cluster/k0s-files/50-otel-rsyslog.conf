# Forward node syslog to the local OpenTelemetry DaemonSet collector, distributed
# by k0sctl (spec.hosts[].files -> /etc/rsyslog.d/50-otel.conf, picked up via the
# `systemctl reload-or-restart rsyslog` apply-hook).
#
# Parity with the Docker-host setup (ansible-lhns/otel/otelcol.conf): rsyslog
# forwards *.info to the collector's syslog receiver. The collector runs as a
# DaemonSet with a hostPort on 14514/udp, so 127.0.0.1:14514 reaches the pod on
# THIS node. UDP (`@`) is fire-and-forget: if the collector is down the datagrams
# are simply dropped (best-effort, no rsyslog backpressure). rfc5424 framing
# (RSYSLOG_SyslogProtocol23Format) matches the collector's `protocol: rfc5424`.
*.info;mail.none;authpriv.none  @127.0.0.1:14514;RSYSLOG_SyslogProtocol23Format
