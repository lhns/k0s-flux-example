apiVersion: v1
kind: ServiceAccount
metadata:
  name: k0s-upgrade
  namespace: k0s-upgrade
---
# The Plan is cluster-scoped; ControlNodes/Nodes are read to discover upgrade targets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k0s-upgrade
rules:
  - apiGroups: ["autopilot.k0sproject.io"]
    resources: ["plans"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["autopilot.k0sproject.io"]
    resources: ["controlnodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k0s-upgrade
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k0s-upgrade
subjects:
  - kind: ServiceAccount
    name: k0s-upgrade
    namespace: k0s-upgrade
