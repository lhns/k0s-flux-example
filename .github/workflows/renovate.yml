# DISABLED IN THE TEMPLATE.
#
# The `schedule:` trigger has been removed so this cannot run on its own. It is kept
# here as a working example of self-hosted Renovate; to enable it, add back:
#
#   schedule:
#     - cron: "0 */3 * * *"
#
# and set a fine-grained PAT as the repo secret RENOVATE_TOKEN (contents +
# pull-requests write) so Renovate's PRs trigger CI. Without it the action falls back
# to GITHUB_TOKEN, which works but whose PRs do NOT trigger other workflows.
name: Renovate
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
permissions:
  contents: write
  pull-requests: write
  issues: write # dependency dashboard
  checks: read # automerge: read branch check runs
  statuses: read # automerge: read commit statuses
concurrency:
  group: renovate
jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@v46.1.18
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
