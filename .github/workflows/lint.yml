name: Lint
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted
# Renovate's fine-grained PAT can't read the Checks API (no `Checks` permission
# available on this account), so it can't see this workflow's check-run and treats
# Renovate branches as perpetually "pending" -> patch PRs never automerge. Renovate
# CAN read commit statuses, so we mirror the result to a `lint` commit status on the
# PR head (a non-`renovate/` context) -> the branch reads green and automerge proceeds.
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    # The ARC scale set k0s-flux in the cluster (kube-cluster/apps/github-runner); its name alone,
    # no self-hosted. No automatic fallback: if it is down, dispatch with runner: github-hosted,
    # which spends Actions minutes.
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || 'k0s-flux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # kubeconform's schemas, check-fetch-digests.py's verified pairs and the apt .debs. A
      # cached schema is never refetched: a Flux upgrade (gotk-components.yaml) starts a fresh
      # cache; bump the prefix (here and at the save) for any other CRD that gains a field.
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/kubeconform
            .cache/fetch-digests
            .cache/debs
          key: lint-cache-v1-${{ hashFiles('*/flux-system/gotk-components.yaml') }}-${{ github.run_id }}
          restore-keys: lint-cache-v1-${{ hashFiles('*/flux-system/gotk-components.yaml') }}-
      - name: Install tools
        id: tools
        run: |
          set -euo pipefail
          echo "cache=${{ hashFiles('.cache/kubeconform/*', '.cache/fetch-digests', '.cache/debs/*') }}" >> "$GITHUB_OUTPUT"
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
          fetch() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$1"; }
          # <url> <tar member> <version command...>: download unless the command on PATH already
          # reports the url's version. The k0s-flux runner image ships kustomize and helm at
          # these pins (apps/github-runner); ubuntu-latest does not.
          get() {
            local url="$1" member="$2" v have; shift 2
            v="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' <<<"$url" | head -1)"
            have="$("$@" 2>/dev/null || true)"
            if grep -q "^$v\b" <<<"$have"; then echo "$1 $v: preinstalled"; return; fi
            echo "$1 $v: downloading"
            fetch "$url" | tar -xz -C "$bin" --strip-components="$(tr -cd / <<<"$member" | wc -c)" "$member"
          }
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
          url=https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz
          get "$url" kustomize kustomize version
          # renovate: datasource=github-releases depName=yannh/kubeconform
          url=https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          get "$url" kubeconform kubeconform -v
          # Pinned, not tracked by Renovate: the golden file is rendered helm output, so a
          # version whose sprig formats differently reads as a behaviour change.
          get https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz linux-amd64/helm helm version --short

          # apt only for what is missing; both runners ship yamllint, curl and python3.
          # python3-yaml: the check scripts parse YAML; yamllint's PyYAML is not necessarily the
          # system interpreter's.
          pkgs="$(python3 -c 'import yaml' 2>/dev/null || echo python3-yaml)"
          # Per-component test tools, read from the components' tests/tools manifests rather than
          # a list kept here, so adding a component test cannot leave CI silently missing its
          # tool. Format is `executable [apt-package]`; the package defaults to the executable
          # name, and `-` means it is installed above -- apt has no package for it.
          while read -r exe pkg; do
            command -v "$exe" >/dev/null || pkgs="$pkgs ${pkg:-$exe}"
          done < <( (cat */*/*/tests/tools 2>/dev/null || true) | sed 's/#.*//' | awk 'NF && $2 != "-"')
          pkgs="$(tr ' ' '\n' <<<"$pkgs" | sort -u | xargs)"
          echo "apt packages: ${pkgs:-none}"
          # The .debs are cached with the list they were fetched for: `apt-get update` alone takes
          # ~10s here. Without an index apt installs only from those files and what is installed,
          # so a changed list or runner image fails here and falls through to the network.
          debs="$PWD/.cache/debs"
          if [ -z "$pkgs" ]; then
            :
          elif [ "$(cat "$debs/packages" 2>/dev/null)" = "$pkgs" ] &&
              sudo apt-get install -y -qq --no-install-recommends "$debs"/*.deb; then
            echo "installed from the cached .debs"
          else
            sudo apt-get update -qq
            sudo rm -rf "$debs"; mkdir -p "$debs/partial"
            sudo apt-get install -y -qq --no-install-recommends --download-only -o Dir::Cache::Archives="$debs" $pkgs
            # apt leaves a root-only lock there, which the cache save cannot read.
            sudo rm -rf "$debs/lock" "$debs/partial"; sudo chown -R "$(id -u):$(id -g)" "$debs"
            sudo apt-get install -y -qq --no-install-recommends "$debs"/*.deb
            echo "$pkgs" > "$debs/packages"
          fi
      - name: Validate
        id: validate
        # ALLOW_SKIP=0: a missing tool must fail CI, never print a skip and go green.
        env:
          ALLOW_SKIP: "0"
        run: bash scripts/validate.sh
      # Only when this run added to it: an unchanged upload still costs seconds.
      - name: Save cache
        if: always() && hashFiles('.cache/kubeconform/*', '.cache/fetch-digests', '.cache/debs/*') != steps.tools.outputs.cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/kubeconform
            .cache/fetch-digests
            .cache/debs
          key: lint-cache-v1-${{ hashFiles('*/flux-system/gotk-components.yaml') }}-${{ github.run_id }}
      # Mirror the validate result to a commit status Renovate can read (see top-of-file
      # note). Posted to the PR head SHA so it lands on the branch tip Renovate checks.
      - name: Report lint status for Renovate
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context="lint" \
            -f description="scripts/validate.sh" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
