name: Lint
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted
# Renovate's fine-grained PAT can't read the Checks API (no `Checks` permission
# available on this account), so it can't see this workflow's check-run and treats
# Renovate branches as perpetually "pending" -> patch PRs never automerge. Renovate
# CAN read commit statuses, so we mirror the result to a `lint` commit status on the
# PR head (a non-`renovate/` context) -> the branch reads green and automerge proceeds.
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    # The ARC scale set k0s-flux in the cluster (kube-cluster/apps/github-runner); its name alone,
    # no self-hosted. No automatic fallback: if it is down, dispatch with runner: github-hosted,
    # which spends Actions minutes.
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || 'k0s-flux' }}
    steps:
      - uses: actions/checkout@v7
      # A cached schema is never refetched: bump the prefix (here and at the save) when an
      # upstream CRD gains a field this repo starts using.
      - name: Restore schema cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/kubeconform
          key: kubeconform-schemas-v2-${{ github.run_id }}
          restore-keys: kubeconform-schemas-v2-
      - name: Restore fetch-digest cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/fetch-digests
          key: fetch-digests-${{ github.run_id }}
          restore-keys: fetch-digests-
      # Keyed on this file, so a version bump below fetches once and is cached again.
      - name: Restore tool cache
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}
      - name: Install tools
        run: |
          set -euo pipefail
          # ubuntu-latest and the k0s-flux runner base both ship yamllint.
          sudo apt-get update -qq
          # python3-yaml: scripts/check-substitution.py parses kustomize output; yamllint's
          # PyYAML is not necessarily the system interpreter's.
          sudo apt-get install -y -qq python3-yaml
          t=.cache/ci-tools; mkdir -p "$t"
          fetch() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$1"; }
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
          url=https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz
          [ -x "$t/kustomize" ] || fetch "$url" | tar -xz -C "$t" kustomize
          # renovate: datasource=github-releases depName=yannh/kubeconform
          url=https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          [ -x "$t/kubeconform" ] || fetch "$url" | tar -xz -C "$t" kubeconform
          # Pinned, not tracked by Renovate: the golden file is rendered helm output, so a
          # version whose sprig formats differently reads as a behaviour change.
          [ -x "$t/helm" ] || fetch "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz" | tar -xz -C "$t" --strip-components=1 linux-amd64/helm
          sudo install -m 0755 "$t/kustomize" "$t/kubeconform" "$t/helm" /usr/local/bin/
      - name: Save tool cache
        if: steps.tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}
      - name: Install per-component test tools
        # Read from the components' tests/tools manifests rather than a list kept here, so
        # adding a component test cannot leave CI silently missing its tool. Format is
        # `executable [apt-package]`; the package defaults to the executable name, and `-`
        # means the step above already installed it -- apt has no package for it.
        run: |
          set -euo pipefail
          pkgs=$( (cat */*/*/tests/tools 2>/dev/null || true) | sed 's/#.*//' | awk 'NF && $2 != "-" { print ($2 == "" ? $1 : $2) }' | sort -u)
          echo "packages: $pkgs"
          if [ -n "$pkgs" ]; then sudo apt-get install -y -qq $pkgs; fi
      - name: Validate
        id: validate
        # ALLOW_SKIP=0: a missing tool must fail CI, never print a skip and go green.
        env:
          ALLOW_SKIP: "0"
        run: bash scripts/validate.sh
      - name: Save schema cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/kubeconform
          key: kubeconform-schemas-v2-${{ github.run_id }}
      - name: Save fetch-digest cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/fetch-digests
          key: fetch-digests-${{ github.run_id }}
      # Mirror the validate result to a commit status Renovate can read (see top-of-file
      # note). Posted to the PR head SHA so it lands on the branch tip Renovate checks.
      - name: Report lint status for Renovate
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context="lint" \
            -f description="kubeconform + yamllint" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
