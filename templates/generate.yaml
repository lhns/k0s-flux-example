{{- /*
  Root release only: a GitRepository + HelmRelease per component, each running THIS SAME
  CHART against an artifact filtered to that component.

  Helm embeds the whole chart in its release Secret's data.release, and the apiserver caps
  any Secret at 1 MiB. Filtering per component bounds that by one component's files instead
  of the repo. See docs/generator-chart-size.md.

  The generated releases do not carry `generate` -- that is what stops the recursion. They
  take the root's `groups` verbatim and no component name: the ignore below is the parameter.

  Each GitRepository is a copy of generate.sourceFile, the root's own GitRepository: its
  labels and spec, with ignore and interval replaced. URL, ref, credentials, submodules and
  includes are therefore set once, there. The root's ignore must admit that file.
*/ -}}
{{- with .Values.generate }}
{{- $path := .sourceFile | required "generate.sourceFile is required: the path of the GitRepository this chart is rendered from" }}
{{- $src := $.Files.Get $path | fromYaml }}
{{- if ne (dig "kind" "" $src) "GitRepository" }}
{{- fail (printf "generate.sourceFile %s is not a single GitRepository, or is excluded by its own ignore" $path) }}
{{- end }}
{{- $labels := dig "metadata" "labels" dict $src }}
{{- $baseSpec := omit $src.spec "ignore" "interval" }}
{{- $interval := .interval | default "30m" }}
{{- range $group := $.Values.groups }}
{{- range $kustPath, $_ := $.Files.Glob (printf "%s/*/kustomization.yaml" $group.base) }}
{{- $dir := dir $kustPath }}
{{- $component := base $dir }}
{{- $genName := printf "gen-%s-%s" $group.prefix $component }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: {{ $genName }}
  namespace: flux-system
  {{- with $labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $baseSpec | nindent 2 }}
  interval: {{ $interval }}
  {{- /* Exclude everything, then re-include by path. sourceignore does not prune excluded
      directories, so the gitignore idiom for re-including them re-admits everything. Only
      *.yaml is ever globbed, never *.yml. */}}
  ignore: |
    *
    !/Chart.yaml
    !/templates/**
    !/{{ $dir }}/kustomization.yaml
    !/{{ $dir }}/substitution-secrets/*.yaml
    !/{{ $dir }}/artifacts/*.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $genName }}
  namespace: flux-system
spec:
  interval: {{ $interval }}
  {{- /* Each stored revision is a full copy of the chart in its own Secret. */}}
  maxHistory: 3
  {{- /* This emits a Kustomization; whether that reconciles is its own Ready condition.
      Waiting would fail the release on a slow component and retry only on backoff. */}}
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: "."
      {{- /* The chart version never moves, so without this a new file never re-renders. */}}
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: {{ $genName }}
        namespace: flux-system
  values:
    groups:
      - base: {{ $group.base }}
        prefix: {{ $group.prefix }}
        {{- with $group.interval }}
        interval: {{ . }}
        {{- end }}
        {{- if hasKey $group "wait" }}
        wait: {{ $group.wait }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
