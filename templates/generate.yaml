{{- /*
  Root release only: an ArtifactGenerator + HelmRelease per component, each running THIS SAME
  CHART against an artifact filtered to that component.

  Helm embeds the whole chart in its release Secret's data.release, and the apiserver caps
  any Secret at 1 MiB. Filtering per component bounds that by one component's files instead
  of the repo. See docs/generator-chart-size.md.

  The generated releases do not carry `generate` -- that is what stops the recursion. They
  take the root's `groups` verbatim and no component name: the artifact is the parameter.

  pruneDisabled is resolved here: "*" expands, and each release gets only its own name, so a
  change upgrades just that component.

  flux-component-generator/bases on a component's kustomization.yaml lists shared/ directories
  its kustomization reaches through ../. Each is copied into the component's artifact at its repo
  path, so the relative reference resolves there too. Only shared/: a component never reads
  another component's or another cluster's files.
*/ -}}
{{- if hasKey .Values "generate" }}
{{- $gen := .Values.generate | default dict }}
{{- $interval := $gen.interval | default "30m" }}
{{- $all := list }}
{{- range $group := $.Values.groups }}
{{- range $kustPath, $_ := $.Files.Glob (printf "%s/*/kustomization.yaml" $group.base) }}
{{- $all = append $all (ternary (printf "%s-%s" $group.prefix (base (dir $kustPath))) (base (dir $kustPath)) (not (empty $group.prefix))) }}
{{- end }}
{{- end }}
{{- $seen := list }}
{{- range $n := $all }}
{{- if regexMatch "-(namespaces|artifacts|substitution-secrets)$" $n }}
{{- fail (printf "%s: a component name must not end in -namespaces, -artifacts or -substitution-secrets (generators.controlNamespace)" $n) }}
{{- end }}
{{- if has $n $seen }}
{{- fail (printf "%s: two components generate this name; give their groups different prefixes" $n) }}
{{- end }}
{{- $seen = append $seen $n }}
{{- end }}
{{- range $n := $gen.pruneDisabled | default list }}
{{- if and (ne $n "*") (not (has $n $all)) }}
{{- fail (printf "generate.pruneDisabled: %s is not a generated Kustomization" $n) }}
{{- end }}
{{- end }}
{{- $pruneOff := ternary $all ($gen.pruneDisabled | default list) (has "*" ($gen.pruneDisabled | default list)) }}
{{- range $group := $.Values.groups }}
{{- range $kustPath, $_ := $.Files.Glob (printf "%s/*/kustomization.yaml" $group.base) }}
{{- $dir := dir $kustPath }}
{{- $component := base $dir }}
{{- $genName := printf "gen-%s-%s" $group.prefix $component }}
{{- $fluxName := ternary (printf "%s-%s" $group.prefix $component) $component (not (empty $group.prefix)) }}
{{- $bases := list }}
{{- with dig "metadata" "annotations" "flux-component-generator/bases" "" ($.Files.Get $kustPath | fromYaml) }}
{{- range splitList "," . }}
{{- $b := trimSuffix "/" (trim .) }}
{{- /* No segment may start with a dot, so no ../ either. */}}
{{- if not (regexMatch "^shared(/[A-Za-z0-9_][A-Za-z0-9._-]*)+$" $b) }}
{{- fail (printf "%s: flux-component-generator/bases: %q is not a directory under shared/" $dir $b) }}
{{- end }}
{{- $bases = append $bases $b }}
{{- end }}
{{- end }}
{{- /* Each reserved directory that kustomizations.yaml gives its own Kustomization. */}}
{{- $reserved := list }}
{{- range $sub := list "namespaces" "artifacts" "substitution-secrets" }}
{{- if $.Files.Glob (printf "%s/%s/*.yaml" $dir $sub) }}{{- $reserved = append $reserved $sub }}{{- end }}
{{- end }}
{{- /* One per component: a failing copy stops every artifact of its generator.
    Copy semantics (source-watcher internal/builder): a path without glob characters must
    exist, a glob must match, and a directory copy keeps its own name under `to`. An exclude
    without "/" also matches that name at any depth, so these are full repo paths. */}}
---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: {{ $genName }}
  namespace: flux-system
  {{- if $gen.keepGenerated }}
  {{- /* Helm leaves it behind even if this release is uninstalled or reinstalled. */}}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
      namespace: flux-system
  artifacts:
    {{- /* The chart, under a top-level directory: Helm strips the first path component of
        an archive and refuses Chart.yaml at its root. */}}
    - name: {{ $genName }}
      originRevision: "@repo"
      copy:
        - from: "@repo/Chart.yaml"
          to: "@artifact/generators/"
        - from: "@repo/templates"
          to: "@artifact/generators/"
        - from: "@repo/{{ $dir }}/kustomization.yaml"
          to: "@artifact/generators/{{ $dir }}/"
        {{- range $reserved }}
        - from: "@repo/{{ $dir }}/{{ . }}/*.yaml"
          to: "@artifact/generators/"
        {{- end }}
    {{- /* One per Kustomization, named like it, at the repo path its spec.path names. */}}
    - name: {{ $fluxName }}
      originRevision: "@repo"
      copy:
        - from: "@repo/{{ $dir }}"
          to: "@artifact/{{ dir $dir }}/"
          {{- with $reserved }}
          exclude:
            {{- range . }}
            - {{ $dir }}/{{ . }}
            {{- end }}
          {{- end }}
        {{- range $bases }}
        - from: "@repo/{{ . }}"
          to: "@artifact/{{ dir . }}/"
        {{- end }}
    {{- range $reserved }}
    - name: {{ $fluxName }}-{{ . }}
      originRevision: "@repo"
      copy:
        - from: "@repo/{{ $dir }}/{{ . }}"
          to: "@artifact/{{ $dir }}/"
    {{- end }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $genName }}
  namespace: flux-system
  {{- if $gen.keepGenerated }}
  {{- /* Helm leaves it behind even if this release is uninstalled or reinstalled. */}}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  interval: {{ $interval }}
  {{- /* Each stored revision is a full copy of the chart in its own Secret. */}}
  maxHistory: 3
  {{- /* This emits a Kustomization; whether that reconciles is its own Ready condition.
      Waiting would fail the release on a slow component and retry only on backoff. */}}
  install:
    disableWait: true
  upgrade:
    disableWait: true
    {{- /* The default, Reinstall, uninstalls on a chart name change, deleting every
        Kustomization this emits. */}}
    chartNameChangeStrategy: InPlaceUpdate
  chartRef:
    kind: ExternalArtifact
    name: {{ $genName }}
    namespace: flux-system
  values:
    groups:
      - base: {{ $group.base }}
        prefix: {{ $group.prefix }}
        {{- with $group.interval }}
        interval: {{ . }}
        {{- end }}
        {{- if hasKey $group "wait" }}
        wait: {{ $group.wait }}
        {{- end }}
    {{- if has $fluxName $pruneOff }}
    pruneDisabled:
      - {{ $fluxName }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
