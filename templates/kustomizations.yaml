{{- /*
One Flux Kustomization per component directory, so each component is its own failure
domain. Helpers: _substitution.tpl, _crd-upgrade.tpl, _secret-from-files.tpl.

Discovery
- A component is any <group.base>/<name>/kustomization.yaml. Adding one needs no change here.
- The emitted name is <group.prefix>-<name>.
- group.wait defaults to true. The hasKey guard matters, because `default true` would
  coerce an explicit false back to true.

Annotations on the component's own kustomization.yaml. Kustomize ignores `metadata`
entirely and it never reaches the built resources, which is what makes it usable as
generator input.
- dependsOn    Comma-separated Flux Kustomization names.
- appInstance  The app.kubernetes.io/instance value, defaulting to the directory name.
               Override it when a chart labels its workloads differently, so that the
               component's vnets and CRs land in the same Headlamp app group. It is
               applied through commonMetadata, which runs after the build and only
               touches top-level metadata, so it is authoritative and causes no rollouts.
- crdPolicy    Skip, Create or CreateReplace (the default). See _crd-upgrade.tpl.
- suspend      "true" suspends the component's Kustomization only; its gen- HelmRelease stays
               live, since it is what delivers and lifts the suspend. See AGENTS.md.

substitution-secrets/ subdirectory, for injecting secret values into plaintext config
- Creating the directory is the entire opt-in. It gets its own Kustomization, the
  component gets a dependsOn on it, and the substituteFrom entries are derived from the
  manifests inside it. See _substitution.tpl.
- It is a separate path because a Kustomization that both creates and consumes a value
  substitutes from the copy that existed before it applied. Listing the file in the
  component's own resources gives you a literal ${VAR} on the first apply and leaves
  every rotation one reconcile behind.
- Put no kustomization.yaml in there. kustomize-controller synthesizes one, so adding a
  value is a matter of dropping in a file.

  BEFORE creating one, check what else in the component looks like a variable:

      kustomize build kube-cluster/apps/<app> | grep -E '\$\{|\$\$'

  Substitution is not scoped to the file you meant. Flux runs envsubst over the whole
  component build, fails the reconcile on anything it cannot resolve and applies $$ as $,
  so every hit has to become a substitution source, be escaped as $${VAR}, or sit in an
  object annotated kustomize.toolkit.fluxcd.io/substitute: disabled. Shell scripts and
  regex replacements are the usual casualties. Bare $var is left alone.

  A substituted config cannot come from a secretGenerator, which base64-encodes into
  data: and buries the ${VAR} where envsubst cannot see it. Use a configMapGenerator
  marked generators.example.com/as-secret and it is patched into a Secret with the content
  still plaintext: see _secret-from-files.tpl.

  Where an app can read the credential itself, from a file or an env var, prefer that.
  The config then holds no secret at all and needs none of this; apps/arr/autopulse
  reads its own AUTOPULSE__* env vars.

artifacts/ subdirectory, for oci-composer ImageComposition and ImageBuild objects
- Each object sets push.writeRefTo, so oci-composer writes its digest-pinned ref into a
  ConfigMap in flux-system. The component substitutes from those (_substitution.tpl) and
  names the image ${KEY}. That turns substitution on for the whole component: run the
  check above first.
- It gets its own Kustomization, which the component depends on: the ConfigMap exists
  only once the object is applied and published, so one Kustomization holding both
  deadlocks a fresh cluster. wait: true makes Ready mean published; a failing build holds
  the component back.
- Namespace oci-composer, since the component's own does not exist yet. The Kustomization
  inherits the component's dependsOn, which must name infra-oci-composer.
- Put no kustomization.yaml in there, as for substitution-secrets/.
*/ -}}
{{- /* The root release sets .Values.generate and emits per-component generators instead
    (generate.yaml); the generated releases do not, so they land here. Both rendering would
    mean two releases owning the same objects, and uninstalling either prunes the
    component. */}}
{{- if not .Values.generate }}
{{- range $group := .Values.groups }}
{{- range $kustPath, $_ := $.Files.Glob (printf "%s/*/kustomization.yaml" $group.base) }}
{{- $dir := dir $kustPath }}
{{- $component := base $dir }}
{{- $fluxName := $component }}
{{- if $group.prefix }}{{- $fluxName = printf "%s-%s" $group.prefix $component }}{{- end }}
{{- $kust := $.Files.Get $kustPath | fromYaml }}
{{- $instance := dig "metadata" "annotations" "appInstance" $component $kust }}
{{- $crdPolicy := dig "metadata" "annotations" "crdPolicy" "CreateReplace" $kust }}
{{- $interval := $group.interval | default "10m0s" }}
{{- $substFrom := concat
      (include "generators.substituteFrom" (dict "root" $ "dir" $dir) | fromYamlArray)
      (include "generators.refExports" (dict "root" $ "dir" $dir) | fromYamlArray) }}
{{- $dependsOn := list }}
{{- with dig "metadata" "annotations" "dependsOn" "" $kust }}
{{- range splitList "," . }}{{- $dependsOn = append $dependsOn (trim .) }}{{- end }}
{{- end }}
{{- $artifactsName := printf "%s-artifacts" $fluxName }}
{{- with $.Files.Glob (printf "%s/artifacts/*.yaml" $dir) }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ $artifactsName }}
  namespace: flux-system
spec:
  interval: {{ $interval }}
  path: ./{{ $dir }}/artifacts
  prune: true
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/instance: {{ $instance | quote }}
  {{- with $dependsOn }}
  dependsOn:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
{{- $dependsOn = append $dependsOn $artifactsName }}
{{- end }}
{{- $secretsName := printf "%s-substitution-secrets" $fluxName }}
{{- $hasSecrets := $.Files.Glob (printf "%s/substitution-secrets/*.yaml" $dir) }}
{{- if and $hasSecrets (not (has $secretsName $dependsOn)) }}
{{- $dependsOn = append $dependsOn $secretsName }}
{{- end }}
{{- with $hasSecrets }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ $secretsName }}
  namespace: flux-system
spec:
  interval: {{ $interval }}
  path: ./{{ $dir }}/substitution-secrets
  prune: true
  {{- /* The component waits on this, so Ready has to mean the Secrets are applied. */}}
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/instance: {{ $instance | quote }}
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
{{- end }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ $fluxName }}
  namespace: flux-system
spec:
  interval: {{ $interval }}
  {{- if eq (dig "metadata" "annotations" "suspend" "" $kust | toString) "true" }}
  suspend: true
  {{- end }}
  path: ./{{ $dir }}
  prune: true
  wait: {{ if hasKey $group "wait" }}{{ $group.wait }}{{ else }}true{{ end }}
  commonMetadata:
    labels:
      app.kubernetes.io/instance: {{ $instance | quote }}
  patches:
    {{- include "generators.crdPatch" $crdPolicy | nindent 4 }}
    {{- include "generators.secretFromFiles" . | nindent 4 }}
  {{- with $dependsOn }}
  dependsOn:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $substFrom }}
  postBuild:
    substituteFrom:
      {{- range . }}
      - kind: {{ .kind }}
        name: {{ .name }}
        optional: false
      {{- end }}
  {{- end }}
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
{{- end }}
{{- end }}
{{- end }}
