{{- /*
One Flux Kustomization per component directory, so each component is its own failure
domain. Helpers: _substitution.tpl, _crd-upgrade.tpl, _secret-from-files.tpl.

Discovery
- A component is any <group.base>/<name>/kustomization.yaml. Adding one needs no change here.
- The emitted name is <group.prefix>-<name>.
- group.wait defaults to true. The hasKey guard matters, because `default true` would
  coerce an explicit false back to true.

Annotations on the component's own kustomization.yaml, each prefixed
flux-component-generator/. Kustomize ignores `metadata`
entirely and it never reaches the built resources, which is what makes it usable as
generator input.
- dependsOn    Comma-separated Flux Kustomization names.
- appInstance  The app.kubernetes.io/instance value, defaulting to the directory name.
               Override it when a chart labels its workloads differently, so that the
               component's vnets and CRs land in the same Headlamp app group. It is
               applied through commonMetadata, which runs after the build and only
               touches top-level metadata, so it is authoritative and causes no rollouts.
- crdPolicy    Skip, Create or CreateReplace (the default). See _crd-upgrade.tpl.
- suspend      "true" suspends the component's Kustomization only; its gen- HelmRelease stays
               live, since it is what delivers and lifts the suspend. See AGENTS.md.

substitution-secrets/ subdirectory, for injecting secret values into plaintext config
- Creating the directory is the entire opt-in. It gets its own Kustomization, the
  component gets a dependsOn on it, and the substituteFrom entries are derived from the
  manifests inside it. See _substitution.tpl.
- It is a separate path because a Kustomization that both creates and consumes a value
  substitutes from the copy that existed before it applied. Listing the file in the
  component's own resources gives you a literal ${VAR} on the first apply and leaves
  every rotation one reconcile behind.
- Put no kustomization.yaml in there. kustomize-controller synthesizes one, so adding a
  value is a matter of dropping in a file.

  BEFORE creating one, check what else in the component looks like a variable:

      kustomize build kube-cluster/apps/<app> | grep -E '\$\{|\$\$'

  Substitution is not scoped to the file you meant. Flux runs envsubst over the whole
  component build, fails the reconcile on anything it cannot resolve and applies $$ as $,
  so every hit has to become a substitution source, be escaped as $${VAR}, or sit in an
  object annotated kustomize.toolkit.fluxcd.io/substitute: disabled. Shell scripts and
  regex replacements are the usual casualties. Bare $var is left alone.

  A substituted config cannot come from a secretGenerator, which base64-encodes into
  data: and buries the ${VAR} where envsubst cannot see it. Use a configMapGenerator
  marked flux-component-generator/as-secret and it is patched into a Secret with the content
  still plaintext: see _secret-from-files.tpl.

  Where an app can read the credential itself, from a file or an env var, prefer that.
  The config then holds no secret at all and needs none of this; apps/arr/autopulse
  reads its own AUTOPULSE__* env vars.

artifacts/ subdirectory, for oci-composer ImageComposition and ImageBuild objects
- Each object sets push.writeRefTo, so oci-composer writes its digest-pinned ref into a
  ConfigMap in the component's Kustomization namespace. The component substitutes from
  those (_substitution.tpl) and names the image ${KEY}. That turns substitution on for the
  whole component: run the check above first.
- It gets its own Kustomization, which the component depends on: the ConfigMap exists
  only once the object is applied and published, so one Kustomization holding both
  deadlocks a fresh cluster. wait: true makes Ready mean published; a failing build holds
  the component back.
- Objects go in the component's namespace, declared in namespaces/; a Namespace the
  component itself creates would deadlock the same way. oci-composer is legacy, still
  accepted. The Kustomization inherits the component's dependsOn, which must name
  infra-oci-composer.
- Put no kustomization.yaml in there, as for substitution-secrets/.

namespaces/ subdirectory, for the component's Namespace and namespace-scoped prerequisites
- The Namespace, plus what has to exist in it before anything else, such as a LimitRange.
  artifacts/ and the component both depend on it, so both can target the namespace on a
  fresh cluster. It inherits the component's dependsOn. No decryption: nothing secret.
- Its Kustomization prunes, and pruning a Namespace deletes everything in it, PVCs
  included, which infra/pv-reaper then reclaims (AGENTS.md). Deleting this directory, or
  moving an existing Namespace in from the component without first annotating it
  kustomize.toolkit.fluxcd.io/prune: disabled on both sides, deletes the namespace. Use
  the adopt-in-place steps in README.md, "Moving a component between groups".
- Put no kustomization.yaml in there, as for substitution-secrets/.

Control namespace
- The component's Kustomizations live in Namespace gen-<name>, which this release creates.
  Flux reads substituteFrom and sops-age only from the Kustomization's own namespace, so its
  substitution-secrets/ objects and writeRefTo ConfigMaps go there too (_substitution.tpl),
  and the namespace needs a sops-age copy (infra/reflector).
- values.pruneDisabled, set per release by generate.yaml: prune: false on all of the
  component's Kustomizations.

Sources
- Each Kustomization reads its own ExternalArtifact, named like it, packed by the root
  release's ArtifactGenerator (generate.yaml). A commit then wakes only what it changed.
*/ -}}
{{- /* The root release sets .Values.generate and emits per-component generators instead
    (generate.yaml); the generated releases do not, so they land here. Both rendering would
    mean two releases owning the same objects, and uninstalling either prunes the
    component. */}}
{{- if not (hasKey .Values "generate") }}
{{- $pruneOff := .Values.pruneDisabled | default list }}
{{- range $group := .Values.groups }}
{{- range $kustPath, $_ := $.Files.Glob (printf "%s/*/kustomization.yaml" $group.base) }}
{{- $dir := dir $kustPath }}
{{- $component := base $dir }}
{{- $fluxName := $component }}
{{- if $group.prefix }}{{- $fluxName = printf "%s-%s" $group.prefix $component }}{{- end }}
{{- $kust := $.Files.Get $kustPath | fromYaml }}
{{- $instance := dig "metadata" "annotations" "flux-component-generator/appInstance" $component $kust }}
{{- $crdPolicy := dig "metadata" "annotations" "flux-component-generator/crdPolicy" "CreateReplace" $kust }}
{{- $interval := $group.interval | default "10m0s" }}
{{- $ns := include "generators.controlNamespace" $fluxName }}
{{- $prune := not (or (has $fluxName $pruneOff) (has "*" $pruneOff)) }}
{{- $substFrom := concat
      (include "generators.substituteFrom" (dict "root" $ "dir" $dir "namespace" $ns) | fromYamlArray)
      (include "generators.refExports" (dict "root" $ "dir" $dir "namespace" $ns) | fromYamlArray) }}
{{- /* Each entry is {name, namespace}; namespace is rendered only where it differs. */}}
{{- $dependsOn := list }}
{{- with dig "metadata" "annotations" "flux-component-generator/dependsOn" "" $kust }}
{{- range splitList "," . }}
{{- $dependsOn = append $dependsOn (dict "name" (trim .) "namespace" (include "generators.controlNamespace" (trim .))) }}
{{- end }}
{{- end }}
{{- if gt (len $ns) 63 }}{{- fail (printf "control namespace %s is longer than 63 characters" $ns) }}{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- /* Reflector copies sops-age into every namespace with this label. */}}
    flux-component-generator/control-namespace: "true"
{{- $namespacesName := printf "%s-namespaces" $fluxName }}
{{- with $.Files.Glob (printf "%s/namespaces/*.yaml" $dir) }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ $namespacesName }}
  namespace: {{ $ns }}
spec:
  interval: {{ $interval }}
  {{- /* Siblings do not wait for one commit: a new Namespace and its workload can race. */}}
  retryInterval: 1m
  path: ./{{ $dir }}/namespaces
  prune: {{ $prune }}
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/instance: {{ $instance | quote }}
    {{- /* Flux never deletes these: a pruned Namespace takes its PVCs, and pv-reaper their
        volumes. Removing a component leaves its Namespace; docs/operations.md lists them. */}}
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
  {{- with $dependsOn }}
  dependsOn:
    {{- range . }}
    - name: {{ .name }}
      {{- if ne .namespace $ns }}
      namespace: {{ .namespace }}
      {{- end }}
    {{- end }}
  {{- end }}
  sourceRef:
    kind: ExternalArtifact
    name: {{ $namespacesName }}
    namespace: flux-system
{{- /* Appended before artifacts/ inherits $dependsOn, so artifacts/ waits for it too. */}}
{{- $dependsOn = append $dependsOn (dict "name" $namespacesName "namespace" $ns) }}
{{- end }}
{{- $artifactsName := printf "%s-artifacts" $fluxName }}
{{- with $.Files.Glob (printf "%s/artifacts/*.yaml" $dir) }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ $artifactsName }}
  namespace: {{ $ns }}
spec:
  interval: {{ $interval }}
  retryInterval: 1m
  path: ./{{ $dir }}/artifacts
  prune: {{ $prune }}
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/instance: {{ $instance | quote }}
  {{- with $dependsOn }}
  dependsOn:
    {{- range . }}
    - name: {{ .name }}
      {{- if ne .namespace $ns }}
      namespace: {{ .namespace }}
      {{- end }}
    {{- end }}
  {{- end }}
  sourceRef:
    kind: ExternalArtifact
    name: {{ $artifactsName }}
    namespace: flux-system
{{- $dependsOn = append $dependsOn (dict "name" $artifactsName "namespace" $ns) }}
{{- end }}
{{- $secretsName := printf "%s-substitution-secrets" $fluxName }}
{{- $hasSecrets := $.Files.Glob (printf "%s/substitution-secrets/*.yaml" $dir) }}
{{- $depNames := list }}
{{- range $dependsOn }}{{- $depNames = append $depNames .name }}{{- end }}
{{- if and $hasSecrets (not (has $secretsName $depNames)) }}
{{- $dependsOn = append $dependsOn (dict "name" $secretsName "namespace" $ns) }}
{{- end }}
{{- with $hasSecrets }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ $secretsName }}
  namespace: {{ $ns }}
spec:
  interval: {{ $interval }}
  retryInterval: 1m
  path: ./{{ $dir }}/substitution-secrets
  prune: {{ $prune }}
  {{- /* The component waits on this, so Ready has to mean the Secrets are applied. */}}
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/instance: {{ $instance | quote }}
      {{- /* kustomize-controller reconciles a substituteFrom consumer when a Secret or
          ConfigMap with this label changes, instead of on its next interval. */}}
      reconcile.fluxcd.io/watch: Enabled
  sourceRef:
    kind: ExternalArtifact
    name: {{ $secretsName }}
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
{{- end }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ $fluxName }}
  namespace: {{ $ns }}
spec:
  interval: {{ $interval }}
  retryInterval: 1m
  {{- if eq (dig "metadata" "annotations" "flux-component-generator/suspend" "" $kust | toString) "true" }}
  suspend: true
  {{- end }}
  path: ./{{ $dir }}
  prune: {{ $prune }}
  wait: {{ if hasKey $group "wait" }}{{ $group.wait }}{{ else }}true{{ end }}
  {{- /* CNPG sets Ready only when its whole reconcile finishes, so a stuck loop (a replica
        that missed a config reload) held every dependent while the database served.
        Healthy here = all instances ready and no switchover pending. */}}
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.readyInstances) && status.readyInstances == spec.instances && has(status.currentPrimary) && status.currentPrimary == status.targetPrimary
  commonMetadata:
    labels:
      app.kubernetes.io/instance: {{ $instance | quote }}
  patches:
    {{- include "generators.crdPatch" $crdPolicy | nindent 4 }}
    {{- include "generators.secretFromFiles" . | nindent 4 }}
  {{- with $dependsOn }}
  dependsOn:
    {{- range . }}
    - name: {{ .name }}
      {{- if ne .namespace $ns }}
      namespace: {{ .namespace }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with $substFrom }}
  postBuild:
    substituteFrom:
      {{- range . }}
      - kind: {{ .kind }}
        name: {{ .name }}
        optional: false
      {{- end }}
  {{- end }}
  sourceRef:
    kind: ExternalArtifact
    name: {{ $fluxName }}
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
{{- end }}
{{- end }}
{{- end }}
