---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gen-app-annotated
  namespace: flux-system
spec:
  interval: 30m
  maxHistory: 3
  install:
    disableWait: true
  upgrade:
    disableWait: true
    chartNameChangeStrategy: InPlaceUpdate
  chartRef:
    kind: ExternalArtifact
    name: gen-app-annotated
    namespace: flux-system
  values:
    groups:
      - base: tests/fixtures/apps
        prefix: app
---
