---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: gen-app-annotated
  namespace: flux-system
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
      namespace: flux-system
  artifacts:
    - name: gen-app-annotated
      originRevision: "@repo"
      copy:
        - from: "@repo/Chart.yaml"
          to: "@artifact/generators/"
        - from: "@repo/templates"
          to: "@artifact/generators/"
        - from: "@repo/tests/fixtures/apps/annotated/kustomization.yaml"
          to: "@artifact/generators/tests/fixtures/apps/annotated/"
    - name: app-annotated
      originRevision: "@repo"
      copy:
        - from: "@repo/tests/fixtures/apps/annotated"
          to: "@artifact/tests/fixtures/apps/"
---
