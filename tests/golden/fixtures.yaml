apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-annotated
  namespace: gen-app-annotated
spec:
  interval: 10m0s
  retryInterval: 1m
  path: ./tests/fixtures/apps/annotated
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.readyInstances) && status.readyInstances == spec.instances && has(status.currentPrimary) && status.currentPrimary == status.targetPrimary
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'GrafanaReady' && c.status == 'True' && c.observedGeneration == metadata.generation)
  commonMetadata:
    labels:
      app.kubernetes.io/instance: "renamed-instance"
  patches:
    - target:
        kind: HelmRelease
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: unused   # the target selector above chooses; this name is not matched against
        spec:
          upgrade:
            crds: Skip
    - target:
        kind: ConfigMap
        annotationSelector: flux-component-generator/as-secret=true
      patch: |
        - op: replace
          path: /kind
          value: Secret
        - op: move
          from: /data
          path: /stringData
  dependsOn:
    - name: infra-first
      namespace: gen-infra-first
    - name: infra-second
      namespace: gen-infra-second
  sourceRef:
    kind: ExternalArtifact
    name: app-annotated
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
