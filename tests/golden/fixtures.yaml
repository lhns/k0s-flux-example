---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-annotated
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./tests/fixtures/apps/annotated
  prune: true
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/instance: "renamed-instance"
  patches:
    - target:
        kind: HelmRelease
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: unused   # the target selector above chooses; this name is not matched against
        spec:
          upgrade:
            crds: Skip
    - target:
        kind: ConfigMap
        annotationSelector: generators.example.com/as-secret=true
      patch: |
        - op: replace
          path: /kind
          value: Secret
        - op: move
          from: /data
          path: /stringData
  dependsOn:
    - name: infra-first
    - name: infra-second
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
