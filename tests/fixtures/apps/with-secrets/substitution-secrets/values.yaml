# Two documents in one file: only the gen-app-with-secrets one may become a
# substituteFrom source. The other is applied but not substituted from --
# Flux resolves refs in the Kustomization's namespace and would never find it.
---
apiVersion: v1
kind: Secret
metadata:
  name: fixture-values
  namespace: gen-app-with-secrets
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: wrong-namespace
  namespace: with-secrets
data: {}
