# Every annotation the generator reads except suspend (../suspended), all non-default.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    flux-component-generator/dependsOn: infra-first, infra-second
    flux-component-generator/appInstance: renamed-instance
    flux-component-generator/crdPolicy: Skip
resources:
  - resources.yaml
