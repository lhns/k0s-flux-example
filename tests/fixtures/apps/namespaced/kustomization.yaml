# namespaces/ with artifacts/ in the component's own namespace: both Kustomizations
# inherit this dependsOn, artifacts/ also waits for namespaces/, the component for both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    flux-component-generator/dependsOn: infra-oci-composer
resources:
  - resources.yaml
