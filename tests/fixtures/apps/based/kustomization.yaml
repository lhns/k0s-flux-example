# Golden only, so the bases need not exist: two entries, padded and with a trailing slash, to
# pin the split and the trim. Each becomes a copy into app-based's artifact, nothing else.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    flux-component-generator/bases: "shared/infra/example, shared/components/example/"
resources:
  - resources.yaml
