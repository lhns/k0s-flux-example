---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h0m0s
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m0s
  # releaseName/storageNamespace default to name/namespace; renaming either orphans kube-cluster's
  # adopted release.
  chart:
    spec:
      chart: metallb
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: metallb
  # Chart defaults, except: the frr-k8s probes have a 1s timeout the chart does not expose, which
  # momentary control-plane slowness exceeds, restarting the pods.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: metallb-frr-k8s
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: metallb-frr-k8s
                namespace: metallb-system
              spec:
                template:
                  spec:
                    containers:
                      - name: frr
                        livenessProbe:
                          timeoutSeconds: 5
                        startupProbe:
                          timeoutSeconds: 5
                      - name: controller
                        livenessProbe:
                          timeoutSeconds: 5
