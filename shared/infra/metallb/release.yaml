---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h0m0s
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m0s
  # releaseName/storageNamespace default to name/namespace; renaming either orphans kube-cluster's
  # adopted release.
  chart:
    spec:
      chart: metallb
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: metallb
  # Pure L2: the chart's default frr-k8s BGP backend (a privileged host-network DaemonSet,
  # statuscleaner and webhook) would run unused.
  values:
    frrk8s:
      enabled: false
