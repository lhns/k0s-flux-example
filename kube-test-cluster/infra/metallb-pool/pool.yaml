---
# The traefik LoadBalancer VIP. PLACEHOLDER address (TEST-NET-1): a free address on the test
# nodes' L2 segment, the same one infra/traefik/release.yaml requests.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: traefik-vip
  namespace: metallb-system
spec:
  addresses:
    - 192.0.2.100/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: traefik-vip-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - traefik-vip
