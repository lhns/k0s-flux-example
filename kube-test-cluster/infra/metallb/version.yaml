# Patch onto shared/infra/metallb: this cluster's chart version. A whole HelmRelease shape so
# Renovate's flux manager reads it; an inline patch in kustomization.yaml it would not.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
