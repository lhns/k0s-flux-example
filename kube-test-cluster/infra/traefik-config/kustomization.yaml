apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # Traefik's and kube-vnet's CRDs come with their HelmReleases, and the cert with test-ca.
    flux-component-generator/dependsOn: infra-traefik,infra-kube-vnet,infra-cert-manager-issuers
    flux-component-generator/appInstance: traefik-traefik
resources:
- tls.yaml
- vnet.yaml
