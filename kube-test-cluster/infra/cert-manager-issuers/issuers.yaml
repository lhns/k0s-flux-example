---
# A self-signed CA, so the test cluster needs no DNS provider and no ACME reachability, and
# never touches prod's IONOS credentials. Clients trust the test-ca Secret's ca.crt or nothing.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: kube-test-cluster CA
  secretName: test-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: test-ca
spec:
  ca:
    secretName: test-ca
