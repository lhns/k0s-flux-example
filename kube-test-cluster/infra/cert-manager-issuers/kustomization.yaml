apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    # The issuers need cert-manager's CRDs, which its HelmRelease installs: one Kustomization
    # holding both fails its dry-run on a fresh cluster.
    flux-component-generator/dependsOn: infra-cert-manager
resources:
- issuers.yaml
