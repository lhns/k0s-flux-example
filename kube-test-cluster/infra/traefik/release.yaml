---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h0m0s
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m0s
  chart:
    spec:
      chart: traefik
      version: "42.1.2"
      interval: 1h0m0s
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    deployment:
      kind: DaemonSet
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.0.2.100   # PLACEHOLDER, as in infra/metallb-pool
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        port: 8000
        exposedPort: 80
        asDefault: false
      websecure:
        port: 8443
        exposedPort: 443
        expose:
          default: true
        asDefault: true
